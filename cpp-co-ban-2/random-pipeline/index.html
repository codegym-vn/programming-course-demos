<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="560">
<title>Mô phỏng Ống dẫn &lt;random&gt; và So sánh Phân phối với rand() % N</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc; --accent-fill:#2563eb;
    --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
    --warn:#b45309; --warn-soft:#fef3c7;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44; --accent-fill:#2563eb;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --warn:#fcd34d; --warn-soft:#3a2e10;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:13.5px/1.42 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;background:var(--code-bg);padding:1px 4px;border-radius:4px}
  .wrap{max-width:960px;margin:0 auto;padding:7px 10px 8px}
  .lead{color:var(--muted);margin:0 0 6px;font-size:12.8px;line-height:1.35}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 9px}

  .controls{display:flex;flex-wrap:wrap;gap:5px 8px;align-items:center;justify-content:space-between;margin-bottom:6px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:3.5px 9px;
    border-radius:6px;cursor:pointer;font:inherit;font-size:12px;font-weight:500;transition:all .15s}
  .tab:hover{border-color:var(--accent)}
  .tab[aria-selected="true"]{background:var(--accent-fill);border-color:var(--accent-fill);color:#fff;font-weight:600}

  .btns{display:flex;gap:4px;flex-wrap:wrap}
  .btn{border:1px solid var(--accent-fill);background:var(--accent-fill);color:#fff;padding:4px 9px;border-radius:6px;
    cursor:pointer;font:inherit;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
  .btn.ghost{background:transparent;border-color:var(--accent);color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .subbar{display:flex;flex-wrap:wrap;gap:5px 12px;align-items:center;margin-bottom:6px;
    background:var(--card);border:1px solid var(--line);border-radius:8px;padding:5px 9px}
  .grp{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
  .grp-lbl{font-size:11.5px;font-weight:700;color:var(--muted)}
  .chip{border:1px solid var(--line);background:var(--code-bg);color:var(--text);padding:2.5px 7px;
    border-radius:5px;cursor:pointer;font:600 11.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .chip.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}

  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:6px;
    padding:6px 10px;margin-bottom:7px;min-height:44px;font-size:12.5px;line-height:1.38}
  .status>b:first-child{display:block;font-size:11.8px;color:var(--accent);margin-bottom:1px}
  .status.ok{border-left-color:var(--true);background:var(--true-soft)}
  .status.ok>b:first-child{color:var(--true)}
  .status.warn{border-left-color:var(--warn);background:var(--warn-soft)}
  .status.warn>b:first-child{color:var(--warn)}

  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:5px}
  .panel-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0}

  /* Pipeline 3 blocks */
  .pipe-row{display:grid;grid-template-columns:1fr 20px 1.25fr 20px 1.25fr;gap:4px;align-items:stretch;margin-bottom:7px}
  @media (max-width:640px){.pipe-row{grid-template-columns:1fr;gap:4px}.pipe-arrow{transform:rotate(90deg);margin:0 auto}}
  .pipe-arrow{display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:var(--accent)}
  .p-card{background:var(--card);border:1.5px solid var(--line);border-radius:9px;padding:7px 9px;display:flex;flex-direction:column;justify-content:space-between}
  .p-card.lit{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .p-head{display:flex;justify-content:space-between;align-items:center;gap:4px;margin-bottom:4px}
  .p-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .badge{font:700 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:1px 6px;border-radius:4px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
  .badge.ok{background:var(--true-soft);color:var(--true)}
  .badge.bad{background:var(--false-soft);color:var(--false)}
  .badge.warn{background:var(--warn-soft);color:var(--warn)}

  .seed-val{font:700 16px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--text);text-align:center;
    background:var(--code-bg);border-radius:6px;padding:5px 6px;margin:2px 0}
  .p-sub{font-size:11px;color:var(--muted);line-height:1.3;text-align:center}

  .bits-box{font:700 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--accent);
    background:var(--code-bg);border-radius:5px;padding:3px 5px;text-align:center;letter-spacing:.02em;word-spacing:3px}

  /* Die buckets & real slider */
  .die-row{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:3px 0}
  .die-cell{border:1.5px solid var(--line);background:var(--code-bg);border-radius:6px;padding:4px 0;text-align:center;
    font:700 14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);transition:all .15s}
  .die-cell.hit{border-color:var(--true);background:var(--true-soft);color:var(--true);transform:scale(1.06)}

  .real-track{position:relative;height:26px;background:var(--code-bg);border:1px solid var(--line);border-radius:6px;margin:4px 0;display:flex;align-items:center;padding:0 8px}
  .real-line{height:3px;width:100%;background:var(--line);border-radius:2px;position:relative}
  .real-pin{position:absolute;top:-6px;width:12px;height:15px;margin-left:-6px;background:var(--true);border-radius:3px;transition:left .2s}
  .real-ends{display:flex;justify-content:space-between;font:600 10.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted)}

  /* Bottom split for Tab 1 */
  .bot-grid{display:grid;grid-template-columns:1.05fr 1fr;gap:8px;align-items:stretch}
  @media (max-width:640px){.bot-grid{grid-template-columns:1fr}}
  .code{background:var(--code-bg);border-radius:6px;padding:5px 0;overflow-x:auto;
    font:11.3px/1.48 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 8px 0 0;border-left:3px solid transparent}
  .ln .no{width:22px;flex:none;text-align:right;padding-right:7px;color:var(--muted);opacity:.7;user-select:none}
  .ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}

  .console{background:var(--con-bg);color:var(--con-text);border-radius:6px;padding:7px 9px;
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;display:flex;flex-direction:column;justify-content:space-between;min-height:112px}
  .con-head{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:#9ca3af;margin-bottom:3px;display:flex;justify-content:space-between}
  .out-chips{display:flex;flex-wrap:wrap;gap:4px;margin:2px 0}
  .out-chip{background:#1f2937;border:1px solid #374151;color:#f3f4f6;padding:2px 6px;border-radius:4px;font-weight:700;font-size:12px}
  .out-chip.latest{background:#065f46;border-color:#34d399;color:#ecfdf5}
  .con-foot{font-size:11px;color:#9ca3af;margin-top:4px}

  /* Tab 2 Compare Histograms */
  .cmp-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  @media (max-width:640px){.cmp-grid{grid-template-columns:1fr}}
  .chart-box{position:relative;height:186px;background:var(--code-bg);border:1px solid var(--line);border-radius:7px;
    padding:26px 8px 22px;display:flex;align-items:flex-end;gap:3px;margin:5px 0}
  .ideal-line{position:absolute;left:6px;right:6px;border-top:1.5px dashed var(--accent);pointer-events:none;z-index:2}
  .ideal-tag{position:absolute;right:6px;top:4px;font:700 10px ui-monospace,monospace;color:var(--accent);background:var(--card);border:1px dashed var(--accent);padding:0 5px;border-radius:4px;z-index:3}
  .bar-col{flex:1;min-width:0;height:100%;position:relative}
  .bar-track{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}
  .bar{width:100%;border-radius:3px 3px 0 0;transition:height .25s;min-height:2px;position:relative;z-index:1}
  .bar.bias-hi{background:#ea580c}
  .bar.bias-lo{background:#94a3b8}
  .bar.unif{background:#16a34a}
  .bar-pct{font:700 9.5px ui-monospace,monospace;color:var(--muted);line-height:1;margin-bottom:2px;white-space:nowrap}
  .bar-lbl{position:absolute;bottom:-18px;left:0;right:0;text-align:center;font:700 10px ui-monospace,monospace;color:var(--muted)}
  .cmp-note{font-size:11.5px;color:var(--muted);line-height:1.36}
</style>

<body>
<div class="wrap">
  <p class="lead">Quan sát đường ống <code>random_device &rarr; mt19937 &rarr; Distribution</code> và so sánh độ phẳng xác suất giữa <code>rand() % N</code> với <code>uniform_int_distribution</code>.</p>

  <div class="controls">
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-pipe" role="tab" aria-selected="true">1. Ống dẫn &lt;random&gt;</button>
      <button class="tab" id="tab-cmp" role="tab" aria-selected="false">2. So sánh rand() % N vs &lt;random&gt;</button>
    </div>
    <div class="btns" id="action-btns"></div>
  </div>

  <div class="subbar" id="subbar"></div>
  <div class="status" id="status" aria-live="polite"></div>
  <div id="stage-body"></div>
</div>

<script>
(function(){
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function qparam(k){ var m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }

/* Standard C++20 32-bit Mersenne Twister (MT19937) */
function MT19937(seed){
  var mt = new Uint32Array(624);
  var idx = 624;
  mt[0] = seed >>> 0;
  for (var i = 1; i < 624; i++) {
    var prev = mt[i - 1] ^ (mt[i - 1] >>> 30);
    mt[i] = (Math.imul(1812433253, prev) + i) >>> 0;
  }
  function twist(){
    for (var i = 0; i < 624; i++) {
      var y = (mt[i] & 2147483648) | (mt[(i + 1) % 624] & 2147483647);
      var x = mt[(i + 397) % 624] ^ (y >>> 1);
      if (y & 1) x ^= 2567483615;
      mt[i] = x >>> 0;
    }
    idx = 0;
  }
  this.next = function(){
    if (idx >= 624) twist();
    var y = mt[idx++];
    y ^= (y >>> 11);
    y ^= (y << 7) & 2636928640;
    y ^= (y << 15) & 4022730752;
    y ^= (y >>> 18);
    return y >>> 0;
  };
}

function toBin32Lines(u){
  var s = (u >>> 0).toString(2);
  while (s.length < 32) s = '0' + s;
  return s.slice(0,8) + ' ' + s.slice(8,16) + '<br>' + s.slice(16,24) + ' ' + s.slice(24,32);
}

/* Rejection sampling uniform integer in [low, high] from 32-bit raw engine */
function drawUniformInt(eng, low, high){
  var span = (high - low + 1) >>> 0;
  var range32 = 4294967296;
  var limit = Math.floor(range32 / span) * span;
  var raw = eng.next();
  var tries = 1;
  while (raw >= limit) {
    raw = eng.next();
    tries++;
  }
  return { raw: raw, val: low + (raw % span), tries: tries };
}

function drawUniformReal01(eng){
  var raw = eng.next();
  var val = raw / 4294967296;
  return { raw: raw, val: val };
}

function hl(src){
  var re = /("(?:[^"\\]|\\.)*")|(\/\/.*$)|\b(random_device|mt19937|uniform_int_distribution|uniform_real_distribution|int|double|return|cout)\b|(\b\d+(?:\.\d+)?\b)/g;
  var out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="cm">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="kw">' + m[3] + '</span>';
    else out += '<span class="num">' + m[4] + '</span>';
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

function renderCode(lines, cur){
  return lines.map(function(l, i){
    return '<div class="ln' + (cur === i ? ' cur' : '') + '"><span class="no">' + (i + 1) + '</span><span>' + hl(l) + '</span></div>';
  }).join('');
}

var state = {
  tab: (qparam('vd') === 'compare' || qparam('tab') === 'compare') ? 'cmp' : 'pipe',
  seedMode: qparam('seed') === 'fixed' ? 'fixed' : 'rd',
  distMode: qparam('dist') === 'real' ? 'real' : 'int',
  rdSeed: 2948175021,
  pipeSteps: [],
  pipeIdx: 0,
  cmpScenario: qparam('sc') === '32767' ? '32767' : '15',
  cmpTotal: 0,
  cmpRandBins: [],
  cmpUnifBins: []
};

function randomSeed32(){
  return (Math.floor(Math.random() * 4294967294) + 1) >>> 0;
}

function initPipe(){
  var seedVal = state.seedMode === 'fixed' ? 2025 : state.rdSeed;
  var eng = new MT19937(seedVal);
  var isInt = state.distMode === 'int';
  var lines = [
    state.seedMode === 'fixed' ? 'mt19937 gen(2025); // Hat giong co dinh' : 'random_device rd; mt19937 gen(rd());',
    isInt ? 'uniform_int_distribution<int> dist(1, 6);' : 'uniform_real_distribution<double> dist(0.0, 1.0);',
    'auto kq = dist(gen); // Goi de sinh 1 so moi',
    'cout << kq << "\\n";'
  ];

  var steps = [];
  steps.push({
    lines: lines, ln: 0, seedVal: seedVal, raw: null, outVal: null, history: [],
    t: 'Khởi tạo bộ máy mt19937 với seed = ' + seedVal,
    desc: state.seedMode === 'fixed'
      ? 'Hạt giống cố định 2025 giúp mỗi lần Làm lại sinh ra đúng cùng một chuỗi bit và dãy kết quả giống hệt nhau.'
      : 'random_device rd() xin một hạt giống 32-bit mới (' + seedVal + ') từ hệ thống để mỗi lần chạy cho một dãy số khác.'
  });

  var hist = [];
  for (var k = 1; k <= 40; k++) {
    var d = isInt ? drawUniformInt(eng, 1, 6) : drawUniformReal01(eng);
    var disp = isInt ? String(d.val) : d.val.toFixed(4);
    hist.push(disp);
    steps.push({
      lines: lines, ln: 2, seedVal: seedVal, raw: d.raw, outVal: d.val, disp: disp, history: hist.slice(), stepNum: k,
      st: 'ok',
      t: 'dist(gen) xuất giá trị ' + disp,
      desc: 'mt19937 gen tạo chuỗi bit thô 32-bit (' + d.raw + '). Bộ phân phối ' + (isInt ? 'uniform_int_distribution(1, 6)' : 'uniform_real_distribution(0.0, 1.0)') + ' ánh xạ đều thành ' + disp + '.'
    });
  }
  state.pipeSteps = steps;
  state.pipeIdx = 0;
}

function resetCompare(){
  var nBins = state.cmpScenario === '15' ? 10 : 20;
  state.cmpTotal = 0;
  state.cmpRandBins = new Array(nBins).fill(0);
  state.cmpUnifBins = new Array(nBins).fill(0);
}

var cmpMt = new MT19937(2025);
function sampleCompare(count){
  var isSmall = state.cmpScenario === '15';
  var rawMod = isSmall ? 16 : 32768;
  var N = isSmall ? 10 : 20000;
  var limit = Math.floor(rawMod / N) * N; // 10 for small, 20000 for 32768

  for (var i = 0; i < count; i++) {
    // 1. rand() % N (uniform raw on 0..rawMod-1)
    var r1 = cmpMt.next() % rawMod;
    var vRand = r1 % N;
    var binRand = isSmall ? vRand : Math.floor(vRand / 1000);
    state.cmpRandBins[binRand]++;

    // 2. uniform_int_distribution(0, N - 1) using rejection sampling
    var r2 = cmpMt.next() % rawMod;
    while (r2 >= limit) {
      r2 = cmpMt.next() % rawMod;
    }
    var binUnif = isSmall ? r2 : Math.floor(r2 / 1000);
    state.cmpUnifBins[binUnif]++;
  }
  state.cmpTotal += count;
}

/* ==================== RENDERING ==================== */

function renderPipe(){
  var s = state.pipeSteps[state.pipeIdx];
  var isInt = state.distMode === 'int';

  $('action-btns').innerHTML =
    '<button class="btn" id="btn-gen1"' + (state.pipeIdx >= state.pipeSteps.length - 1 ? ' disabled' : '') + '>Sinh 1 số</button>' +
    '<button class="btn ghost" id="btn-prev"' + (state.pipeIdx <= 0 ? ' disabled' : '') + '>Lùi lại</button>' +
    '<button class="btn ghost" id="btn-gen5"' + (state.pipeIdx >= state.pipeSteps.length - 1 ? ' disabled' : '') + '>Sinh 5 số</button>' +
    '<button class="btn ghost" id="btn-reset">Làm lại</button>';

  $('subbar').innerHTML =
    '<div class="grp"><span class="grp-lbl">Hạt giống:</span>' +
      '<button class="chip' + (state.seedMode === 'rd' ? ' active' : '') + '" data-seed="rd">random_device rd</button>' +
      '<button class="chip' + (state.seedMode === 'fixed' ? ' active' : '') + '" data-seed="fixed">Seed cố định (2025)</button>' +
    '</div>' +
    '<div class="grp"><span class="grp-lbl">Phân phối:</span>' +
      '<button class="chip' + (isInt ? ' active' : '') + '" data-dist="int">uniform_int(1, 6)</button>' +
      '<button class="chip' + (!isInt ? ' active' : '') + '" data-dist="real">uniform_real(0.0, 1.0)</button>' +
    '</div>';

  $('status').className = 'status' + (s.st ? ' ' + s.st : '');
  $('status').innerHTML = '<b>' + (state.pipeIdx === 0 ? 'Khởi tạo' : 'Lượt sinh #' + state.pipeIdx) + ' · ' + esc(s.t) + '</b>' + esc(s.desc);

  var distVisual = '';
  if (isInt) {
    distVisual = '<div class="die-row">' + [1,2,3,4,5,6].map(function(f){
      return '<div class="die-cell' + (s.outVal === f ? ' hit' : '') + '">' + f + '</div>';
    }).join('') + '</div><div class="p-sub">Ánh xạ đều vào 6 ô [1..6], không gập phần dư</div>';
  } else {
    var pct = s.outVal !== null ? (s.outVal * 100).toFixed(2) : 0;
    distVisual = '<div class="real-track"><div class="real-line">' +
      (s.outVal !== null ? '<div class="real-pin" style="left:' + pct + '%"></div>' : '') +
      '</div></div>' +
      '<div class="real-ends"><span>0.0</span><span>' + (s.disp ? ('kq = ' + s.disp) : 'chờ gọi dist(gen)') + '</span><span>1.0)</span></div>' +
      '<div class="p-sub">Chia dải 32-bit đều trên nửa khoảng [0.0, 1.0)</div>';
  }

  var chipsHtml = s.history.length
    ? s.history.map(function(v, idx){
        return '<span class="out-chip' + (idx === s.history.length - 1 ? ' latest' : '') + '">' + esc(v) + '</span>';
      }).join('')
    : '<span style="color:#6b7280;font-style:italic">Bấm "Sinh 1 số" hoặc "Sinh 5 số" để gọi dist(gen)...</span>';

  $('stage-body').innerHTML =
    '<div class="pipe-row">' +
      '<div class="p-card' + (state.pipeIdx === 0 ? ' lit' : '') + '">' +
        '<div class="p-head"><span class="p-title">1. Hạt giống (Seed)</span><span class="badge">' + (state.seedMode === 'fixed' ? 'Cố định' : 'Ngẫu nhiên') + '</span></div>' +
        '<div class="seed-val">' + s.seedVal + '</div>' +
        '<div class="p-sub">' + (state.seedMode === 'fixed' ? 'Cùng seed → cùng dãy số' : 'Mỗi lần Làm lại đổi seed mới') + '</div>' +
      '</div>' +
      '<div class="pipe-arrow">&rarr;</div>' +
      '<div class="p-card' + (state.pipeIdx > 0 ? ' lit' : '') + '">' +
        '<div class="p-head"><span class="p-title">2. Bộ máy mt19937 gen</span><span class="badge">32-bit thô</span></div>' +
        '<div class="seed-val">' + (s.raw !== null ? s.raw : 'Chờ gọi gen()') + '</div>' +
        '<div class="bits-box">' + (s.raw !== null ? toBin32Lines(s.raw) : '00000000 00000000<br>00000000 00000000') + '</div>' +
      '</div>' +
      '<div class="pipe-arrow">&rarr;</div>' +
      '<div class="p-card' + (state.pipeIdx > 0 ? ' lit' : '') + '">' +
        '<div class="p-head"><span class="p-title">3. Bộ phân phối dist(gen)</span><span class="badge ok">' + (s.disp || 'Sẵn sàng') + '</span></div>' +
        distVisual +
      '</div>' +
    '</div>' +
    '<div class="bot-grid">' +
      '<div class="card">' +
        '<div class="panel-head"><p class="panel-title">Mã nguồn C++ minh hoạ</p><span class="badge">&lt;random&gt;</span></div>' +
        '<div class="code">' + renderCode(s.lines, s.ln) + '</div>' +
      '</div>' +
      '<div class="console">' +
        '<div>' +
          '<div class="con-head"><span>Dãy kết quả xuất ra (' + s.history.length + ' số)</span><span>cout</span></div>' +
          '<div class="out-chips">' + chipsHtml + '</div>' +
        '</div>' +
        '<div class="con-foot">' + (state.seedMode === 'fixed'
          ? 'Mẹo: Bấm "Làm lại" để kiểm chứng seed 2025 lặp lại y hệt dãy số trên.'
          : 'Mẹo: Bấm "Làm lại" để random_device tạo một hạt giống và dãy số hoàn toàn mới.') + '</div>' +
      '</div>' +
    '</div>';

  $('btn-gen1').onclick = function(){ if (state.pipeIdx < state.pipeSteps.length - 1) { state.pipeIdx++; render(); } };
  $('btn-prev').onclick = function(){ if (state.pipeIdx > 0) { state.pipeIdx--; render(); } };
  $('btn-gen5').onclick = function(){ state.pipeIdx = Math.min(state.pipeSteps.length - 1, state.pipeIdx + 5); render(); };
  $('btn-reset').onclick = function(){
    if (state.seedMode === 'rd') state.rdSeed = randomSeed32();
    initPipe();
    render();
  };

  $('subbar').querySelectorAll('.chip[data-seed]').forEach(function(b){
    b.onclick = function(){
      state.seedMode = b.getAttribute('data-seed');
      if (state.seedMode === 'rd') state.rdSeed = randomSeed32();
      initPipe();
      render();
    };
  });
  $('subbar').querySelectorAll('.chip[data-dist]').forEach(function(b){
    b.onclick = function(){
      state.distMode = b.getAttribute('data-dist');
      initPipe();
      render();
    };
  });
}

function renderCompare(){
  var isSmall = state.cmpScenario === '15';
  $('action-btns').innerHTML =
    '<button class="btn" id="btn-s1k">Lấy 1.000 mẫu</button>' +
    '<button class="btn ghost" id="btn-s10k">Lấy 10.000 mẫu</button>' +
    '<button class="btn ghost" id="btn-cmp-reset">Làm lại</button>';

  $('subbar').innerHTML =
    '<div class="grp"><span class="grp-lbl">Kịch bản dải thô:</span>' +
      '<button class="chip' + (isSmall ? ' active' : '') + '" data-sc="15">RAND_MAX_DEMO = 15 &rarr; [0, 9] (N = 10)</button>' +
      '<button class="chip' + (!isSmall ? ' active' : '') + '" data-sc="32767">RAND_MAX = 32767 &rarr; [0, 19999] (20 nhóm)</button>' +
    '</div>';

  var nBins = state.cmpRandBins.length;
  var idealPct = 100 / nBins; // 10% or 5%
  var tot = state.cmpTotal;

  function ratioOf(arr){
    if (!tot) return '—';
    var mn = Math.min.apply(null, arr), mx = Math.max.apply(null, arr);
    return mn > 0 ? (mx / mn).toFixed(2) + '×' : '∞';
  }

  var maxPct = idealPct * 1.4;
  if (tot > 0) {
    state.cmpRandBins.concat(state.cmpUnifBins).forEach(function(c){
      var p = (c / tot) * 100;
      if (p > maxPct) maxPct = p;
    });
  }
  maxPct = Math.max(maxPct * 1.15, idealPct * 2.2);
  var idealRatio = idealPct / maxPct;
  var idealPx = (22 + idealRatio * 138).toFixed(1);

  $('status').className = 'status' + (tot > 0 ? ' warn' : '');
  $('status').innerHTML = tot > 0
    ? '<b>Đã lấy ' + tot.toLocaleString('vi-VN') + ' mẫu · So sánh độ lệch cao nhất / thấp nhất</b>' +
      'rand() % N: <b>' + ratioOf(state.cmpRandBins) + '</b> (' + (isSmall ? 'nhóm 0..5 cao gần gấp đôi 6..9!' : 'vùng 0..12767 cao gần gấp đôi phần còn lại!') + ') · ' +
      'uniform_int_distribution: <b>' + ratioOf(state.cmpUnifBins) + '</b> (phẳng đều quanh mức chuẩn ' + idealPct.toFixed(1) + '%).'
    : '<b>Chưa có mẫu thử</b>Bấm "Lấy 1.000 mẫu" hoặc "Lấy 10.000 mẫu" để quan sát phép chia dư gập phần dư gây lệch xác suất.';

  function buildBars(arr, isRand){
    return arr.map(function(cnt, idx){
      var pct = tot > 0 ? (cnt / tot) * 100 : 0;
      var h = tot > 0 ? Math.max(2, (pct / maxPct) * 100) : 2;
      var biasedHi = isRand && (isSmall ? idx <= 5 : idx <= 12);
      var cls = isRand ? (biasedHi ? 'bias-hi' : 'bias-lo') : 'unif';
      var lbl = isSmall ? String(idx) : (idx % 4 === 0 ? String(idx) : '');
      var pctTxt = (tot > 0 && (isSmall || idx % 3 === 0)) ? (pct.toFixed(1)) : '';
      return '<div class="bar-col">' +
        '<div class="bar-track">' +
          (pctTxt ? '<span class="bar-pct">' + pctTxt + '</span>' : '') +
          '<div class="bar ' + cls + '" style="height:' + h.toFixed(1) + '%" title="Ô ' + idx + ': ' + pct.toFixed(2) + '%"></div>' +
        '</div>' +
        '<span class="bar-lbl">' + lbl + '</span>' +
      '</div>';
    }).join('');
  }

  $('stage-body').innerHTML =
    '<div class="cmp-grid">' +
      '<div class="card">' +
        '<div class="panel-head"><p class="panel-title">rand() % N (Lệch chia dư)</p><span class="badge bad">Chênh lệch: ' + ratioOf(state.cmpRandBins) + '</span></div>' +
        '<div class="chart-box">' +
          '<span class="ideal-tag">- - Kỳ vọng ' + idealPct.toFixed(1) + '%</span>' +
          '<div class="ideal-line" style="bottom:' + idealPx + 'px"></div>' +
          buildBars(state.cmpRandBins, true) +
        '</div>' +
        '<div class="cmp-note">' + (isSmall
          ? 'Dải thô 0..15 (16 số) chia 10 dư 6: các giá trị <b>10..15 gập đè lên 0..5</b> khiến [0..5] có xác suất 12.5%, gấp đôi [6..9] (6.25%).'
          : '32768 % 20000 = 12768: phần dư gập đè lên các nhóm đầu <b>0..12767</b> làm chúng xuất hiện gần gấp đôi nhóm 12768..19999.') + '</div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="panel-head"><p class="panel-title">uniform_int_distribution (Phẳng đều)</p><span class="badge ok">Chênh lệch: ' + ratioOf(state.cmpUnifBins) + '</span></div>' +
        '<div class="chart-box">' +
          '<span class="ideal-tag">- - Kỳ vọng ' + idealPct.toFixed(1) + '%</span>' +
          '<div class="ideal-line" style="bottom:' + idealPx + 'px"></div>' +
          buildBars(state.cmpUnifBins, false) +
        '</div>' +
        '<div class="cmp-note">Bộ phân phối <b>loại bỏ vùng dư</b> (' + (isSmall ? 'bỏ 10..15, rút lại số thô' : 'bỏ 20000..32767, rút lại số thô') + ') để mọi kết quả đều chia hết công bằng với xác suất đúng ' + idealPct.toFixed(1) + '%.</div>' +
      '</div>' +
    '</div>';

  $('btn-s1k').onclick = function(){ sampleCompare(1000); render(); };
  $('btn-s10k').onclick = function(){ sampleCompare(10000); render(); };
  $('btn-cmp-reset').onclick = function(){ resetCompare(); render(); };
  $('subbar').querySelectorAll('.chip[data-sc]').forEach(function(b){
    b.onclick = function(){
      state.cmpScenario = b.getAttribute('data-sc');
      resetCompare();
      sampleCompare(10000);
      render();
    };
  });
}

function render(){
  $('tab-pipe').setAttribute('aria-selected', state.tab === 'pipe');
  $('tab-cmp').setAttribute('aria-selected', state.tab === 'cmp');
  if (state.tab === 'pipe') renderPipe();
  else renderCompare();
}

$('tab-pipe').onclick = function(){ state.tab = 'pipe'; render(); };
$('tab-cmp').onclick = function(){
  state.tab = 'cmp';
  if (state.cmpTotal === 0) sampleCompare(10000);
  render();
};

document.addEventListener('keydown', function(e){
  var t = e.target && e.target.tagName;
  if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return;
  if (state.tab === 'pipe') {
    if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); if (state.pipeIdx < state.pipeSteps.length - 1) { state.pipeIdx++; render(); } }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); if (state.pipeIdx > 0) { state.pipeIdx--; render(); } }
  }
});

initPipe();
resetCompare();
var buoc = Number(qparam('buoc'));
if (state.tab === 'pipe' && buoc > 0) {
  state.pipeIdx = Math.min(state.pipeSteps.length - 1, buoc - 1);
} else if (state.tab === 'cmp') {
  sampleCompare(10000);
}
render();
})();
</script>
</body>
</html>
