  #fullnote{position:absolute;right:20px;top:56px;max-width:320px;background:#7f1d1d;color:#fecaca;font-size:13px;padding:8px 10px;border-radius:8px;z-index:20}
  #full:hover{filter:brightness(1.1)}

  @media (max-width:640px){#full{position:static;display:inline-block;margin-top:8px}}

  @media (max-width:480px){.wrap{padding:16px 12px 28px}.code{font-size:12px}.ln .no{width:22px;padding-right:8px}.ln{padding-right:8px}}

  .msub:first-child{margin-top:0}
  .var.hi{background:var(--cur);box-shadow:inset 0 0 0 2px var(--cur-bar)}
  .heap{display:flex;flex-wrap:wrap;gap:10px}
  .obj{border:2px solid var(--node-line);border-radius:10px;background:var(--node);min-width:140px;transition:all .25s}
  .obj .oh{font:700 13px ui-monospace,Menlo,Consolas,monospace;padding:4px 10px;border-bottom:1px solid var(--line);background:var(--accent-soft);color:var(--accent);border-radius:8px 8px 0 0}

  svg.uml{max-width:none;width:100%;height:auto;margin:6px auto 0}

  svg.uml .nm{font-weight:700;font-size:12px}svg.uml .nm.ab{font-style:italic}svg.uml .st{font-size:10px;fill:var(--muted)}svg.uml .lb{font:600 10.5px system-ui,sans-serif;fill:var(--muted)}
  svg.uml .ub rect{fill:var(--node);stroke:var(--node-line);stroke-width:1.5}

</style>

  <h1>Tập hợp hay Hợp thành?</h1>
  <button id="full" type="button">⛶ Phóng to</button>

  <p class="lead">Hai cột chạy cùng nhịp: bên trái bộ phận được tạo ở ngoài, bên phải bộ phận do toàn thể tự tạo. Bấm <b>Bước tiếp</b> để chạy.</p>

  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function hl(src){
    var re = /(\$?"(?:[^"\\]|\\.)*")|(\/\/.*$)|\b(int|long|char|bool|double|decimal|string|void|const|new|for|foreach|in|if|else|switch|case|break|default|while|do|return|var|true|false|null|class|public|private|protected|internal|static|this|base|virtual|override|abstract|interface|readonly|get|set|value|is|as|throw|try|catch)\b|(\b\d+\b)/g, out = '', last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
      else if (m[2]) out += '<span class="cm">' + esc(m[2]) + '</span>';
      else if (m[3]) out += '<span class="kw">' + m[3] + '</span>';
      else out += '<span class="num">' + m[4] + '</span>';
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }
  function mk(){
    var snaps = [], outs = [], n = 0;
    return {out:function(t){ outs.push(t); }, err:function(t){ outs.push('\u0001' + t); }, snaps:snaps,
      snap:function(o){ o.outs = outs.slice(); o.title = 'Bước ' + (++n) + ' · ' + o.title; snaps.push(o); }};

  function CC(a,hi,dn,dm){hi=hi||[];dn=dn||[];dm=dm||[];return a.map(function(v,i){return {v:v,hi:hi.indexOf(i)>=0,done:dn.indexOf(i)>=0,dim:dm.indexOf(i)>=0};});}

  function O(id, fields, o){ o = o || {}; return {id:id, fields:fields || [], hi:!!o.hi, dim:!!o.dim, tag:o.tag || ''}; }

 {title:'Hợp thành',sub:'Car - Engine',
  lines:['class Car','{','  Engine engine = new Engine();','}','var car = new Car();','car = null;'],

/*END DATA*/
  var ex, P = {}, step = 0, snaps = [], snapsC = [], timer = null, valid = true;
  function multi(){ return !!ex.cols; }
  function build(){
    if (multi()) snapsC = ex.cols.map(function(col){ var c = mk(); col.run(c); return c.snaps; });
    else { var c = mk(); ex.run(c, P); snaps = c.snaps; }
  }
  function total(){ return multi() ? Math.max.apply(null, snapsC.map(function(s){ return s.length; })) : snaps.length; }
  function arrHtml(a){
    var h = '<div class="arow"><div class="aname">' + esc(a.name) + '</div><div class="cells">';
    a.cells.forEach(function(c, i){
      var cls = 'cell2' + (c.v === undefined || c.v === null ? ' empty' : '') + (c.hi ? ' hi' : '') + (c.done ? ' donec' : '') + (c.dim ? ' dimc' : '');
      h += '<div class="cw"><div class="' + cls + '">' + (c.v === undefined || c.v === null ? '' : esc(c.v)) + '</div>' + (a.noIdx ? '' : '<div class="ix">' + i + '</div>') + '</div>';
    });
    return h + '</div></div>';
  }
  function objHtml(o){
    return '<div class="obj' + (o.hi ? ' hi' : '') + (o.dim ? ' dim' : '') + '"><div class="oh">' + esc(o.id) + (o.tag ? '<span class="otag">' + esc(o.tag) + '</span>' : '') + '</div>' +
      (o.fields.length ? o.fields.map(function(f){ return '<div class="of' + (f[2] ? ' ' + f[2] : '') + '"><span>' + esc(f[0]) + '</span><b>' + esc(f[1]) + '</b></div>'; }).join('') : '<div class="empty">(không có trường)</div>') + '</div>';
  }
  /* umlHtml(u): u = {boxes:[{id,name,stereo,attrs:[],methods:[],c,r,hi,dim,bad}], links:[{a,b,type,la,lb,label,hi}]}
     c, r = cột, hàng (đếm từ 0). attrs/methods: chuỗi hoặc {t,hi}.
     type: inherit (tam giác rỗng ở b) | real (nét đứt + tam giác rỗng ở b) | assoc (đường thẳng) | dassoc (mũi tên ở b)
           | aggr (thoi rỗng ở a) | comp (thoi đặc ở a) | dep (nét đứt + mũi tên ở b) */
  function umlHtml(u){
    var GX = 64, GY = 42, LH = 15, CH = 6.6, MG = 8, TOP = 14, boxes = u.boxes, links = u.links || [], by = {}, colW = [], rowH = [], colX = [], rowY = [], i, acc;
    function it(x){ return typeof x === 'string' ? {t:x} : x; }
    boxes.forEach(function(b){
      b.A = (b.attrs || []).map(it); b.M = (b.methods || []).map(it);
      var mx = b.name.length + 2;
      if (b.stereo) mx = Math.max(mx, b.stereo.length + 4);
      b.A.concat(b.M).forEach(function(x){ mx = Math.max(mx, x.t.length); });
      b.w = Math.max(92, Math.round(mx * CH + 16));
      b.hh = b.stereo ? 34 : 22; b.ha = b.A.length ? b.A.length * LH + 8 : 10; b.hm = b.M.length ? b.M.length * LH + 8 : 10;
      b.h = b.hh + b.ha + b.hm;
      colW[b.c] = Math.max(colW[b.c] || 0, b.w); rowH[b.r] = Math.max(rowH[b.r] || 0, b.h); by[b.id] = b;
    });
    for (i = 0, acc = MG; i < colW.length; i++) { colX[i] = acc; acc += (colW[i] || 0) + (colW[i] ? GX : 0); }
    var W = acc - GX + MG;
    for (i = 0, acc = TOP; i < rowH.length; i++) { rowY[i] = acc; acc += (rowH[i] || 0) + (rowH[i] ? GY : 0); }
    var H = acc - GY + MG;
    boxes.forEach(function(b){ b.x = colX[b.c] + (colW[b.c] - b.w) / 2; b.y = rowY[b.r] + (rowH[b.r] - b.h) / 2; });
    function edge(b, tx, ty){
      var cx = b.x + b.w / 2, cy = b.y + b.h / 2, dx = tx - cx, dy = ty - cy;
      if (!dx && !dy) return [cx, cy];
      var s = Math.min(dx ? (b.w / 2) / Math.abs(dx) : 1e9, dy ? (b.h / 2) / Math.abs(dy) : 1e9);
      return [cx + dx * s, cy + dy * s];
    }
    function f(n){ return Math.round(n * 10) / 10; }
    var s = '<svg class="uml" viewBox="0 0 ' + f(W) + ' ' + f(H) + '" style="max-width:' + f(W) + 'px" role="img" aria-label="Sơ đồ lớp UML">';
    links.forEach(function(l){
      var A = by[l.a], B = by[l.b], P = edge(A, B.x + B.w / 2, B.y + B.h / 2), Q = edge(B, A.x + A.w / 2, A.y + A.h / 2);
      var dx = Q[0] - P[0], dy = Q[1] - P[1], len = Math.sqrt(dx * dx + dy * dy) || 1, d = [dx / len, dy / len], n = [-d[1], d[0]], t = l.type || 'assoc';
      var p0 = P, q0 = Q, mark = '';
      function pt(base, a, b2){ return f(base[0] + d[0] * a + n[0] * b2) + ',' + f(base[1] + d[1] * a + n[1] * b2); }
      if (t === 'aggr' || t === 'comp') { mark = '<polygon class="um ' + (t === 'comp' ? 'fill' : 'hol') + '" points="' + pt(P, 0, 0) + ' ' + pt(P, 8, 4.5) + ' ' + pt(P, 16, 0) + ' ' + pt(P, 8, -4.5) + '"/>'; p0 = [P[0] + d[0] * 16, P[1] + d[1] * 16]; }
      if (t === 'inherit' || t === 'real') { mark = '<polygon class="um hol" points="' + pt(Q, 0, 0) + ' ' + pt(Q, -13, 6.5) + ' ' + pt(Q, -13, -6.5) + '"/>'; q0 = [Q[0] - d[0] * 13, Q[1] - d[1] * 13]; }
      if (t === 'dassoc' || t === 'dep') { mark = '<polyline class="um op" points="' + pt(Q, -10, 5.5) + ' ' + pt(Q, 0, 0) + ' ' + pt(Q, -10, -5.5) + '"/>'; }
      s += '<g class="ul' + (l.hi ? ' hi' : '') + '"><line x1="' + f(p0[0]) + '" y1="' + f(p0[1]) + '" x2="' + f(q0[0]) + '" y2="' + f(q0[1]) + '"' + (t === 'dep' || t === 'real' ? ' stroke-dasharray="5 4"' : '') + '/>' + mark;
      if (l.la) s += '<text x="' + f(P[0] + d[0] * 20 + n[0] * 11) + '" y="' + f(P[1] + d[1] * 20 + n[1] * 11 + 4) + '" text-anchor="middle">' + esc(l.la) + '</text>';
      if (l.lb) s += '<text x="' + f(Q[0] - d[0] * 18 + n[0] * 11) + '" y="' + f(Q[1] - d[1] * 18 + n[1] * 11 + 4) + '" text-anchor="middle">' + esc(l.lb) + '</text>';
      if (l.label) s += '<text class="lb" x="' + f((P[0] + Q[0]) / 2 + n[0] * 10) + '" y="' + f((P[1] + Q[1]) / 2 + n[1] * 10 + 4) + '" text-anchor="middle">' + esc(l.label) + '</text>';
      s += '</g>';
    });
    boxes.forEach(function(b){
      var y1 = b.y + b.hh, y2 = y1 + b.ha, cx = b.x + b.w / 2;
      s += '<g class="ub' + (b.hi ? ' hi' : '') + (b.dim ? ' dim' : '') + (b.bad ? ' bad' : '') + '"><rect x="' + f(b.x) + '" y="' + f(b.y) + '" width="' + b.w + '" height="' + b.h + '" rx="4"/>';
      b.A.forEach(function(m, k){ if (m.hi) s += '<rect class="mh" x="' + f(b.x + 2) + '" y="' + f(y1 + 3 + k * LH) + '" width="' + (b.w - 4) + '" height="' + LH + '"/>'; });
      b.M.forEach(function(m, k){ if (m.hi) s += '<rect class="mh" x="' + f(b.x + 2) + '" y="' + f(y2 + 3 + k * LH) + '" width="' + (b.w - 4) + '" height="' + LH + '"/>'; });
      s += '<line x1="' + f(b.x) + '" y1="' + f(y1) + '" x2="' + f(b.x + b.w) + '" y2="' + f(y1) + '"/><line x1="' + f(b.x) + '" y1="' + f(y2) + '" x2="' + f(b.x + b.w) + '" y2="' + f(y2) + '"/>';
      if (b.stereo) s += '<text x="' + f(cx) + '" y="' + f(b.y + 13) + '" text-anchor="middle" class="st">«' + esc(b.stereo) + '»</text>';
      s += '<text x="' + f(cx) + '" y="' + f(b.y + (b.stereo ? 27 : 15)) + '" text-anchor="middle" class="nm' + (b.abs ? ' ab' : '') + '">' + esc(b.name) + '</text>';
      b.A.forEach(function(m, k){ s += '<text x="' + f(b.x + 7) + '" y="' + f(y1 + 3 + k * LH + 11) + '"' + (m.u ? ' text-decoration="underline"' : '') + '>' + esc(m.t) + '</text>'; });
      b.M.forEach(function(m, k){ s += '<text x="' + f(b.x + 7) + '" y="' + f(y2 + 3 + k * LH + 11) + '"' + (m.u ? ' text-decoration="underline"' : '') + '>' + esc(m.t) + '</text>'; });
      s += '</g>';
    });
    return s + '</svg>';
  }
  function memHtml(sn){
    var arrs = sn && sn.arrs ? sn.arrs : [], vs = sn && sn.vars ? sn.vars : [], os = sn && sn.objs ? sn.objs : [], h = '';
    if (arrs.length) h += arrs.map(arrHtml).join('');
    if (vs.length) h += (os.length ? '<p class="msub">Biến</p>' : '') + '<div class="vars">' + vs.map(function(v){ return '<div class="var' + (v[2] ? ' hi' : '') + '"><small>' + esc(v[0]) + '</small><strong>' + esc(v[1]) + '</strong></div>'; }).join('') + '</div>';
    if (sn && sn.uml) h += umlHtml(sn.uml);
    if (os.length) h += '<p class="msub">Đối tượng trong bộ nhớ (heap)</p><div class="heap">' + os.map(objHtml).join('') + '</div>';
    return h || '<p class="cm" style="margin:0">Chưa có gì trong bộ nhớ.</p>';
  }
  function conHtml(sn){
    return sn && sn.outs.length ? sn.outs.map(function(t){ return t.charAt(0) === '\u0001' ? '<span class="er">' + esc(t.slice(1)) + '</span>' : esc(t); }).join('\n') : '<span class="ph">Chưa có kết quả.</span>';
  }
  function codeHtml(lines, sn){
    return lines.map(function(l, i){ return '<div class="ln' + (sn && sn.ln === i ? ' cur' : '') + '"><span class="no">' + (i + 1) + '</span><span>' + hl(l) + '</span></div>'; }).join('');
  }
  function render(){
    var M = multi(), T = total(), running = timer !== null;
    $('single').hidden = M; $('multi').hidden = !M;
    if (M) {
      ex.cols.forEach(function(col, k){
        var L = snapsC[k], j = Math.min(step, L.length), sn = j > 0 ? L[j - 1] : null;
        $('t' + k).textContent = col.title; $('s' + k).textContent = col.sub;
        $('code' + k).innerHTML = codeHtml(col.lines, sn);
        $('msg' + k).innerHTML = sn ? '<b>' + esc(sn.title) + '</b>' + esc(sn.body) : '<b>Chưa chạy</b>Bấm "Bước tiếp" để bắt đầu.';
        var hasMem = L.some(function(x){ return (x.arrs && x.arrs.length) || (x.vars && x.vars.length) || (x.objs && x.objs.length) || x.uml; }), hasCon = L.some(function(x){ return x.outs.length; });
        $('mem' + k).hidden = !hasMem; $('con' + k).hidden = !hasCon;
        $('mem' + k).innerHTML = sn && hasMem ? memHtml(sn) : '';
        $('con' + k).innerHTML = conHtml(sn);
      });
      var fin = step >= T;
      $('status').innerHTML = step === 0 ? '<b>Sẵn sàng</b>' + esc(ex.intro) : (fin ? '<b>Hoàn tất</b>' + esc(ex.done) : '<b>Đang chạy</b>' + esc(ex.running || 'Quan sát hai cột.'));
      if (fin && ex.note) $('status').innerHTML += '<span class="note">' + esc(ex.note) + '</span>';
    } else {
      var sn = step > 0 ? snaps[step - 1] : null;
      $('code').innerHTML = codeHtml(ex.lines(P), sn);
      var t = sn ? sn.title : 'Sẵn sàng', b = sn ? sn.body : ex.intro, note = sn ? sn.note : '';
      $('status').innerHTML = '<b>' + esc(t) + '</b>' + esc(b) + (note ? '<span class="note">' + esc(note) + '</span>' : '');
      $('mem').innerHTML = memHtml(sn);
      $('console').innerHTML = conHtml(sn);
    }
    $('next').disabled = !valid || step >= T || running;
    $('all').disabled = !valid || running;
    $('reset').disabled = running;
  }
  function stop(){ if (timer) { clearInterval(timer); timer = null; } }
  function reset(){ stop(); step = 0; if (valid) build(); render(); }
  function onInput(){
    var ok = true, ins = ex.inputs || [];
    ins.forEach(function(i){
      var el = $('in_' + i.id), s = el.value.trim(), good = i.text ? new RegExp(i.text).test(s) : (/^-?\d{1,3}$/.test(s) && Number(s) >= i.min && Number(s) <= i.max);
      if (good) P[i.id] = i.text ? s : Number(s);
      el.classList.toggle('bad', !good); if (!good) ok = false;
    });
    valid = ok;
    $('err').textContent = ok ? '' : ins.map(function(i){ return i.text ? i.msg : 'Hãy nhập số nguyên ' + i.label + ' từ ' + i.min + ' đến ' + i.max; }).join('; ') + '.';
    reset();
  }
  function loadExample(k){
    ex = EX[k];
    document.querySelectorAll('.tab').forEach(function(b){ b.setAttribute('aria-selected', b.dataset.ex === k ? 'true' : 'false'); });
    var ins = ex.inputs || [];
    $('fields').innerHTML = ins.map(function(i){
      return '<div class="field"><label for="in_' + i.id + '">' + i.label + ' =</label><input id="in_' + i.id + '" type="text" inputmode="' + (i.text ? 'text' : 'numeric') + '" autocomplete="off" style="width:' + (i.w || 70) + 'px" value="' + i.def + '"></div>';
    }).join('');
    ins.forEach(function(i){ $('in_' + i.id).addEventListener('input', onInput); });
    $('chips').innerHTML = (ex.chips || []).map(function(c){ return '<button class="chip" type="button" data-v="' + c + '">' + c + '</button>'; }).join(' ');
    onInput();
  }
  $('chips').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if (!b) return;
    $('in_' + ex.inputs[0].id).value = b.dataset.v; onInput();
  });
  $('next').addEventListener('click', function(){ if (valid && step < total()) { step++; render(); } });
  $('reset').addEventListener('click', reset);
  $('all').addEventListener('click', function(){
    if (!valid) return;
    if (step >= total()) step = 0;
    step++; render();
    timer = setInterval(function(){ step++; if (step >= total()) { step = total(); stop(); } render(); }, 400);
    render();
  });
  document.querySelectorAll('.tab').forEach(function(b){ b.addEventListener('click', function(){ loadExample(b.dataset.ex); }); });
  loadExample(document.querySelector('.tab').dataset.ex);
})();

<script>
  try{ if(window.self!==window.top) document.getElementById('full').hidden=false; }catch(e){ document.getElementById('full').hidden=false; }
  document.getElementById('full').onclick = ()=>{
    const el = document.documentElement, fn = el.requestFullscreen || el.webkitRequestFullscreen;
    const fail = ()=>{ const n=document.getElementById('fullnote'); n.hidden=false; setTimeout(()=>n.hidden=true,6000); };
    if(document.fullscreenElement || document.webkitFullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); return; }
    if(!fn){ fail(); return; }
    try{ const r = fn.call(el); if(r && r.catch) r.catch(fail); }catch(e){ fail(); }
  };
