<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
<rect width="1200" height="470" fill="#fff"/>
<text x="600" y="56" text-anchor="middle" font-size="30" font-weight="700" fill="#1d2330">Phép toán trên giấy và trong Python</text>
<text x="600" y="90" text-anchor="middle" font-size="17" fill="#5d6676">Bàn phím không có dấu × và ÷, nên Python dùng dấu sao và dấu gạch chéo</text>
<text x="70" y="170" font-size="15" font-weight="700" fill="#5d6676">Trên giấy</text>
<text x="70" y="290" font-size="15" font-weight="700" fill="#5d6676">Trong Python</text>
<text x="70" y="400" font-size="15" font-weight="700" fill="#5d6676">Ví dụ</text>
<rect x="200" y="118" width="230" height="320" rx="16" fill="#eef3ff" stroke="#2563eb" stroke-opacity=".35" stroke-width="2"/>
<text x="315.0" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">Cộng</text>
<text x="315.0" y="198" text-anchor="middle" font-size="46" fill="#1d2330">+</text>
<path d="M315.0 214v26" stroke="#2563eb" stroke-width="3"/><path d="M308.0 234l7 9l7-9" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
<rect x="277.0" y="252" width="76" height="66" rx="10" fill="#fff" stroke="#9aa3b2" stroke-width="2"/><rect x="277.0" y="312" width="76" height="8" rx="4" fill="#c9ced8"/>
<text x="315.0" y="302" text-anchor="middle" font-size="40" font-weight="700" fill="#2563eb" font-family="Menlo, Consolas, monospace">+</text>
<text x="315.0" y="346" text-anchor="middle" font-size="14.5" fill="#5d6676">giống trên giấy</text>
<rect x="245.0" y="374" width="140" height="40" rx="8" fill="#111827"/><text x="315.0" y="400" text-anchor="middle" font-size="18" font-weight="700" fill="#e5e7eb" font-family="Menlo, Consolas, monospace">5 + 3</text>
<rect x="450" y="118" width="230" height="320" rx="16" fill="#eef3ff" stroke="#2563eb" stroke-opacity=".35" stroke-width="2"/>
<text x="565.0" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#2563eb">Trừ</text>
<text x="565.0" y="198" text-anchor="middle" font-size="46" fill="#1d2330">−</text>
<path d="M565.0 214v26" stroke="#2563eb" stroke-width="3"/><path d="M558.0 234l7 9l7-9" fill="none" stroke="#2563eb" stroke-width="3" stroke-linejoin="round"/>
<rect x="527.0" y="252" width="76" height="66" rx="10" fill="#fff" stroke="#9aa3b2" stroke-width="2"/><rect x="527.0" y="312" width="76" height="8" rx="4" fill="#c9ced8"/>
<text x="565.0" y="302" text-anchor="middle" font-size="40" font-weight="700" fill="#2563eb" font-family="Menlo, Consolas, monospace">-</text>
<text x="565.0" y="346" text-anchor="middle" font-size="14.5" fill="#5d6676">giống trên giấy</text>
<rect x="495.0" y="374" width="140" height="40" rx="8" fill="#111827"/><text x="565.0" y="400" text-anchor="middle" font-size="18" font-weight="700" fill="#e5e7eb" font-family="Menlo, Consolas, monospace">5 - 3</text>
<rect x="700" y="118" width="230" height="320" rx="16" fill="#fff4ec" stroke="#c2410c" stroke-opacity=".35" stroke-width="2"/>
<text x="815.0" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#c2410c">Nhân</text>
<text x="815.0" y="198" text-anchor="middle" font-size="46" fill="#1d2330">×</text>
<path d="M815.0 214v26" stroke="#c2410c" stroke-width="3"/><path d="M808.0 234l7 9l7-9" fill="none" stroke="#c2410c" stroke-width="3" stroke-linejoin="round"/>
<rect x="777.0" y="252" width="76" height="66" rx="10" fill="#fff" stroke="#9aa3b2" stroke-width="2"/><rect x="777.0" y="312" width="76" height="8" rx="4" fill="#c9ced8"/>
<text x="839.0" y="270" text-anchor="end" font-size="13" fill="#9aa3b2" font-family="Menlo, Consolas, monospace">8</text>
<text x="815.0" y="302" text-anchor="middle" font-size="40" font-weight="700" fill="#c2410c" font-family="Menlo, Consolas, monospace">*</text>
<text x="815.0" y="346" text-anchor="middle" font-size="14.5" fill="#5d6676">dấu sao · Shift + 8</text>
<rect x="745.0" y="374" width="140" height="40" rx="8" fill="#111827"/><text x="815.0" y="400" text-anchor="middle" font-size="18" font-weight="700" fill="#e5e7eb" font-family="Menlo, Consolas, monospace">5 * 3</text>
<rect x="950" y="118" width="230" height="320" rx="16" fill="#fff4ec" stroke="#c2410c" stroke-opacity=".35" stroke-width="2"/>
<text x="1065.0" y="146" text-anchor="middle" font-size="17" font-weight="700" fill="#c2410c">Chia</text>
<text x="1065.0" y="198" text-anchor="middle" font-size="46" fill="#1d2330">÷</text>
<path d="M1065.0 214v26" stroke="#c2410c" stroke-width="3"/><path d="M1058.0 234l7 9l7-9" fill="none" stroke="#c2410c" stroke-width="3" stroke-linejoin="round"/>
<rect x="1027.0" y="252" width="76" height="66" rx="10" fill="#fff" stroke="#9aa3b2" stroke-width="2"/><rect x="1027.0" y="312" width="76" height="8" rx="4" fill="#c9ced8"/>
<text x="1065.0" y="302" text-anchor="middle" font-size="40" font-weight="700" fill="#c2410c" font-family="Menlo, Consolas, monospace">/</text>
<text x="1065.0" y="346" text-anchor="middle" font-size="14.5" fill="#5d6676">dấu gạch chéo</text>
<rect x="995.0" y="374" width="140" height="40" rx="8" fill="#111827"/><text x="1065.0" y="400" text-anchor="middle" font-size="18" font-weight="700" fill="#e5e7eb" font-family="Menlo, Consolas, monospace">6 / 3</text>
</svg>