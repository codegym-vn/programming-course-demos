<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mô phỏng break và default</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800; --err-line:#fde2df;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c; --sw-off:#c9ced8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400; --err-line:#3a1a1a;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74; --sw-off:#3a4250;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 32px}
  h1{font-size:22px;margin:0 0 4px}
  .lead{color:var(--muted);margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 12px;
    border-radius:8px;cursor:pointer;font:inherit}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .controls{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center;margin-bottom:6px}
  .field{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .field label{font:600 15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .field input{width:90px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--text);font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .field input.bad{border-color:var(--false)}
  .chip{border:1px dashed var(--sw-off);background:transparent;color:var(--text);padding:4px 10px;
    border-radius:999px;cursor:pointer;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .toggles{display:flex;gap:8px;flex-wrap:wrap}
  .sw{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--card);color:var(--text);
    border-radius:10px;padding:6px 12px;cursor:pointer;font:inherit;font-size:14px}
  .sw .track{width:36px;height:20px;border-radius:999px;background:var(--sw-off);position:relative;transition:background .2s;flex:none}
  .sw .track::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .2s}
  .sw[aria-pressed="true"] .track{background:var(--true)}
  .sw[aria-pressed="true"] .track::after{left:19px}
  .sw code{font:13.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .err{color:var(--false);font-size:13px;min-height:18px;margin:0 0 6px}
  .explain{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
    padding:10px 14px;margin-bottom:14px}
  .explain b{display:block;font-size:13px;color:var(--accent);margin-bottom:2px}
  .explain .note{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
  .explain code{font:13.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .grid{display:grid;grid-template-columns:1.15fr 1fr;gap:14px}
  .grid>*{min-width:0}
  .col{display:flex;flex-direction:column;gap:14px;min-width:0}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  .panel-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 8px}
  .code{background:var(--code-bg);border-radius:8px;padding:8px 0;overflow-x:auto;
    font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 12px 0 0;border-left:3px solid transparent}
  .ln .no{width:34px;flex:none;text-align:right;padding-right:10px;color:var(--muted);opacity:.7;user-select:none}
  .ln .mark{width:18px;flex:none;font-size:12px;font-weight:700;color:var(--true)}
  .ln.ran{background:var(--cur);border-left-color:var(--cur-bar)}
  .ln.skip{opacity:.3}
  .ln.bad{background:var(--err-line);border-left-color:var(--false)}
  .ln.bad .mark{color:var(--false)}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}
  .build{border-radius:8px;padding:10px 12px;font-size:14px}
  .build.ok{background:var(--true-soft);color:var(--true);font-weight:600}
  .build.fail{background:var(--false-soft);color:var(--false)}
  .build .msg{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:6px 0 2px;word-break:break-word}
  .build .vi{color:var(--text);font-size:13.5px;margin:0 0 8px}
  .console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:10px 12px;min-height:56px;
    font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .console .ph{color:#7b8494;font-family:system-ui,sans-serif;font-size:13px}

  #full{position:absolute;right:20px;top:18px;background:#f59e0b;color:#1c1300;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:0;cursor:pointer;font-family:inherit}
  #fullnote{position:absolute;right:20px;top:56px;max-width:320px;background:#7f1d1d;color:#fecaca;font-size:13px;padding:8px 10px;border-radius:8px;z-index:20}
  #full:hover{filter:brightness(1.1)}
  header{position:relative}
  @media (max-width:640px){#full{position:static;display:inline-block;margin-top:8px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Quy tắc break và default trong switch-case</h1>
  <button id="full" type="button">⛶ Phóng to</button>
  <div id="fullnote" hidden>Khung bài học này không cho phóng to. Hãy dùng liên kết &quot;Mở bài tương tác toàn màn hình&quot; đặt ngay trong bài.</div>

  <p class="lead">Chọn một tình huống, bật/tắt các thành phần và đổi giá trị để xem C# xử lý đoạn code thế nào.</p>

  <div class="tabs" role="tablist" id="tabs">
    <button class="tab" role="tab" data-t="brk" aria-selected="true">Thiếu break</button>
    <button class="tab" role="tab" data-t="group" aria-selected="false">Gộp nhiều case</button>
    <button class="tab" role="tab" data-t="def" aria-selected="false">Có / không có default</button>
  </div>

  <div class="controls">
    <div class="field">
      <label for="val" id="valLabel">luaChon =</label>
      <input id="val" type="text" inputmode="numeric" autocomplete="off">
      <span id="chips"></span>
    </div>
    <div class="toggles" id="toggles"></div>
  </div>
  <div class="err" id="err"></div>

  <div class="explain" id="explain" aria-live="polite"></div>

  <div class="grid">
    <div class="card">
      <p class="panel-title">Mã nguồn C#</p>
      <div class="code" id="code"></div>
    </div>
    <div class="col">
      <div class="card">
        <p class="panel-title">Biên dịch</p>
        <div id="build"></div>
      </div>
      <div class="card">
        <p class="panel-title">Console</p>
        <div class="console" id="console"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var MENU = [
    { labels: ['1'], out: 'Xem số dư' },
    { labels: ['2'], out: 'Nạp tiền' },
    { labels: ['3'], out: 'Rút tiền' }
  ];
  var TABS = {
    brk: {
      varName: 'luaChon', def: 2, chips: [1, 2, 3, 5],
      breaks: { 0: true, 1: true, 2: true, d: true }, hasDefault: true,
      sections: MENU, defOut: 'Lựa chọn không hợp lệ'
    },
    group: {
      varName: 'thu', def: 4, chips: [2, 4, 6, 7, 8, 9],
      hasDefault: true,
      sections: [
        { labels: ['2', '3', '4', '5', '6'], out: 'Ngày đi học' },
        { labels: ['7', '8'], out: 'Cuối tuần' }
      ],
      defOut: 'Không hợp lệ'
    },
    def: {
      varName: 'luaChon', def: 5, chips: [1, 2, 5, 0],
      hasDefault: true, defToggle: true,
      sections: MENU, defOut: 'Lựa chọn không hợp lệ'
    }
  };

  var tabKey = 'brk', T = TABS.brk, v = 2, valid = true;
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function hl(src){
    var re = /("(?:[^"\\]|\\.)*")|\b(int|switch|case|default|break)\b|(-?\b\d+\b)/g, out = '', last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
      else if (m[2]) out += '<span class="kw">' + m[2] + '</span>';
      else out += '<span class="num">' + esc(m[3]) + '</span>';
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }

  function hasBreak(key){ return T.breaks ? T.breaks[key] : true; }

  // ---------- dung ma nguon + phan tich ----------
  function build(){
    var lines = [], secs = [];
    lines.push({ t: 'int ' + T.varName + ' = ' + v + ';' });
    lines.push({ t: 'switch (' + T.varName + ')' });
    lines.push({ t: '{' });
    var all = T.sections.map(function(s, i){ return { key: i, labels: s.labels, out: s.out }; });
    if (T.hasDefault) all.push({ key: 'd', labels: null, out: T.defOut });
    all.forEach(function(s){
      var sec = { key: s.key, labelLines: [], out: s.out, isDefault: s.labels === null };
      if (s.labels) s.labels.forEach(function(lb){ sec.labelLines.push({ i: lines.length, value: Number(lb) }); lines.push({ t: '    case ' + lb + ':' }); });
      else { sec.labelLines.push({ i: lines.length, value: null }); lines.push({ t: '    default:' }); }
      sec.bodyLine = lines.length; lines.push({ t: '        Console.WriteLine("' + s.out + '");' });
      sec.brk = hasBreak(s.key);
      if (sec.brk) { sec.breakLine = lines.length; lines.push({ t: '        break;' }); }
      secs.push(sec);
    });
    lines.push({ t: '}' });
    var endLine = lines.length;
    lines.push({ t: 'Console.WriteLine("Chương trình kết thúc.");' });

    var errors = [];
    secs.forEach(function(s, idx){
      if (s.brk) return;
      var first = s.labelLines[0];
      var labelText = s.isDefault ? 'default:' : 'case ' + T.sections[s.key].labels[0] + ':';
      if (idx === secs.length - 1) {
        errors.push({ line: first.i, code: 'CS8070', msg: "Control cannot fall out of switch from final case label ('" + labelText + "')",
          vi: 'Nhánh cuối cùng của switch (' + labelText.replace(':', '') + ') cũng phải kết thúc bằng break.' });
      } else {
        errors.push({ line: first.i, code: 'CS0163', msg: "Control cannot fall through from one case label ('" + labelText + "') to another",
          vi: 'C# không cho chương trình chạy tiếp từ ' + labelText.replace(':', '') + ' xuống nhánh bên dưới. Nhánh này phải kết thúc bằng break.' });
      }
    });
    return { lines: lines, secs: secs, endLine: endLine, errors: errors };
  }

  function run(b){
    var hit = null, hitLabel = null;
    b.secs.forEach(function(s){
      s.labelLines.forEach(function(l){ if (!s.isDefault && l.value === v && !hit) { hit = s; hitLabel = l.i; } });
    });
    var usedDefault = false;
    if (!hit) {
      b.secs.forEach(function(s){ if (s.isDefault) { hit = s; hitLabel = s.labelLines[0].i; usedDefault = true; } });
    }
    return { sec: hit, labelLine: hitLabel, usedDefault: usedDefault };
  }

  // ---------- ve ----------
  function render(){
    if (!valid) {
      $('code').innerHTML = ''; $('build').innerHTML = ''; $('console').innerHTML = ''; $('explain').innerHTML = '';
      return;
    }
    var b = build(), r = b.errors.length ? null : run(b);
    var ran = {}, skip = {}, bad = {};
    b.errors.forEach(function(e){ bad[e.line] = 1; });
    if (r) {
      [0, 1, b.endLine].forEach(function(x){ ran[x] = 1; });
      if (r.sec) {
        ran[r.labelLine] = 1; ran[r.sec.bodyLine] = 1;
        if (r.sec.breakLine !== undefined) ran[r.sec.breakLine] = 1;
      }
      b.secs.forEach(function(s){
        if (s === r.sec) return;
        s.labelLines.forEach(function(l){ skip[l.i] = 1; });
        skip[s.bodyLine] = 1;
        if (s.breakLine !== undefined) skip[s.breakLine] = 1;
      });
    }
    $('code').innerHTML = b.lines.map(function(l, i){
      var c = 'ln' + (bad[i] ? ' bad' : ran[i] ? ' ran' : skip[i] ? ' skip' : '');
      var mark = bad[i] ? '✗' : (ran[i] ? '✓' : '');
      return '<div class="' + c + '"><span class="no">' + (i + 1) + '</span><span class="mark">' + mark + '</span><span>' + hl(l.t) + '</span></div>';
    }).join('');

    if (b.errors.length) {
      $('build').innerHTML = '<div class="build fail"><b>Lỗi biên dịch, chương trình không chạy được</b>' +
        b.errors.map(function(e){
          return '<div class="msg">dòng ' + (e.line + 1) + ': error ' + e.code + ': ' + esc(e.msg) + '</div><p class="vi">' + esc(e.vi) + '</p>';
        }).join('') + '</div>';
      $('console').innerHTML = '<span class="ph">Không có kết quả vì chương trình chưa biên dịch được.</span>';
    } else {
      $('build').innerHTML = '<div class="build ok">Biên dịch thành công</div>';
      var out = [];
      if (r.sec) out.push(r.sec.out);
      out.push('Chương trình kết thúc.');
      $('console').innerHTML = out.map(esc).join('<br>');
    }
    $('explain').innerHTML = explain(b, r);
  }

  function explain(b, r){
    var title, body, note = '';
    if (tabKey === 'brk') {
      if (b.errors.length) {
        title = 'Thiếu break';
        body = 'Trong C#, mỗi nhánh case có lệnh đều phải kết thúc bằng <code>break</code>, kể cả nhánh cuối cùng. Nếu thiếu, trình biên dịch báo lỗi ngay chứ không để chương trình chạy tiếp xuống case bên dưới.';
        note = 'Đây là điểm khác với C, C++ và Java: ở các ngôn ngữ đó, thiếu break thì chương trình sẽ "rơi" xuống chạy luôn case tiếp theo.';
      } else {
        title = 'Đủ break ở mọi nhánh';
        body = 'Chương trình nhảy vào ' + (r.usedDefault ? '<code>default</code>' : '<code>case ' + v + '</code>') + ', chạy lệnh in, gặp <code>break</code> thì thoát khỏi switch.';
        note = 'Thử tắt break ở một nhánh để xem C# báo lỗi thế nào.';
      }
    } else if (tabKey === 'group') {
      title = 'Gộp nhiều case dùng chung một khối lệnh';
      if (r.usedDefault) body = 'Giá trị ' + v + ' không khớp nhãn nào, nên chạy <code>default</code>.';
      else body = 'Giá trị ' + v + ' khớp <code>case ' + v + '</code>. Vì các nhãn của nhóm này viết liền nhau, cả nhóm dùng chung khối lệnh bên dưới: in ra “' + r.sec.out + '”.';
      note = 'Nhiều nhãn case viết liền nhau, không có lệnh ở giữa, là cách hợp lệ để nhiều giá trị chạy cùng một khối lệnh trong C#. Đây là trường hợp duy nhất C# cho phép đi từ nhãn case này sang nhãn case khác.';
    } else {
      if (!r.sec) {
        title = 'Không khớp case nào và không có default';
        body = 'switch không chạy lệnh nào cả. Chương trình đi thẳng xuống dòng sau switch và chỉ in ra “Chương trình kết thúc.”';
      } else if (r.usedDefault) {
        title = 'Không khớp case nào, chạy default';
        body = 'Giá trị ' + v + ' không khớp case nào, nên chương trình chạy <code>default</code> và in ra “' + T.defOut + '”.';
      } else {
        title = 'Có case khớp';
        body = 'Giá trị ' + v + ' khớp <code>case ' + v + '</code>, nên <code>default</code> không được dùng đến.';
      }
      note = 'default không bắt buộc, nhưng nên có để xử lý các giá trị không mong muốn, ví dụ người dùng nhập sai lựa chọn trong menu.';
    }
    return '<b>' + esc(title) + '</b>' + body + (note ? '<span class="note">' + note + '</span>' : '');
  }

  // ---------- dieu khien ----------
  function buildToggles(){
    var html = '';
    if (tabKey === 'brk') {
      var items = T.sections.map(function(s, i){ return { key: String(i), label: 'case ' + s.labels[0] }; });
      items.push({ key: 'd', label: 'default' });
      html = items.map(function(it){
        var on = T.breaks[it.key];
        return '<button class="sw" data-k="' + it.key + '" aria-pressed="' + on + '"><span class="track"></span><span><code>break</code> ở <code>' + it.label + '</code></span></button>';
      }).join('');
    } else if (tabKey === 'def') {
      html = '<button class="sw" data-k="hasDefault" aria-pressed="' + T.hasDefault + '"><span class="track"></span><span>Có <code>default</code></span></button>';
    }
    $('toggles').innerHTML = html;
  }
  $('toggles').addEventListener('click', function(e){
    var b = e.target.closest('.sw'); if (!b) return;
    var k = b.dataset.k;
    if (k === 'hasDefault') T.hasDefault = !T.hasDefault;
    else T.breaks[k] = !T.breaks[k];
    buildToggles(); render();
  });

  function onInput(){
    var s = $('val').value.trim();
    var ok = /^-?\d{1,10}$/.test(s) && Number(s) >= -2147483648 && Number(s) <= 2147483647;
    valid = ok;
    $('val').classList.toggle('bad', !ok);
    $('err').textContent = ok ? '' : 'Hãy nhập một số nguyên (kiểu int).';
    if (ok) v = Number(s);
    render();
  }
  function setValue(x){ $('val').value = String(x); onInput(); }
  $('val').addEventListener('input', onInput);
  $('chips').addEventListener('click', function(e){
    var b = e.target.closest('.chip'); if (b) setValue(b.dataset.v);
  });

  function load(key){
    tabKey = key; T = TABS[key];
    document.querySelectorAll('.tab').forEach(function(b){ b.setAttribute('aria-selected', b.dataset.t === key ? 'true' : 'false'); });
    $('valLabel').textContent = T.varName + ' =';
    $('chips').innerHTML = T.chips.map(function(c){ return '<button class="chip" type="button" data-v="' + c + '">' + c + '</button>'; }).join(' ');
    buildToggles();
    setValue(T.def);
  }
  $('tabs').addEventListener('click', function(e){
    var b = e.target.closest('.tab'); if (b) load(b.dataset.t);
  });
  load('brk');
})();
</script>
<script>
  try{ if(window.self!==window.top) document.getElementById('full').hidden=false; }catch(e){ document.getElementById('full').hidden=false; }
  document.getElementById('full').onclick = ()=>{
    const el = document.documentElement, fn = el.requestFullscreen || el.webkitRequestFullscreen;
    const fail = ()=>{ const n=document.getElementById('fullnote'); n.hidden=false; setTimeout(()=>n.hidden=true,6000); };
    if(document.fullscreenElement || document.webkitFullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); return; }
    if(!fn){ fail(); return; }
    try{ const r = fn.call(el); if(r && r.catch) r.catch(fail); }catch(e){ fail(); }
  };
</script>
</body>
</html>
