<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mô phỏng vòng lặp while</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c;
    --node:#ffffff; --node-line:#c9ced8; --node-text:#3b4352;
    --p1:#2563eb; --p1s:#dbe7ff; --p2:#9333ea; --p2s:#efdcff; --p3:#c2410c; --p3s:#ffe3d1;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74;
      --node:#1d222c; --node-line:#3a4250; --node-text:#c8cfdb;
      --p1:#6ea0ff; --p1s:#1f3358; --p2:#c9a0ff; --p2s:#35244f; --p3:#fdba74; --p3s:#4a2c16;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 32px}
  h1{font-size:22px;margin:0 0 4px}
  .lead{color:var(--muted);margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:12px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 12px;
    border-radius:8px;cursor:pointer;font:inherit}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .field{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .field label{font-weight:600}
  .field input{width:80px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--text);font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .field input.bad{border-color:var(--false)}
  .chip{border:1px dashed var(--node-line);background:transparent;color:var(--text);padding:4px 10px;
    border-radius:999px;cursor:pointer;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .seg{display:flex;align-items:center;gap:6px}
  .seg b{font-weight:600}
  .seg button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:5px 12px;border-radius:8px;
    cursor:pointer;font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
  .btns{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:8px 14px;border-radius:8px;
    cursor:pointer;font:inherit;font-weight:600}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .err{color:var(--false);font-size:13px;min-height:18px;margin:-4px 0 8px}
  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
    padding:10px 14px;margin-bottom:14px;min-height:64px}
  .status b{display:block;font-size:13px;color:var(--accent);margin-bottom:2px}
  .status .note{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:1.15fr 1fr;gap:14px}
  .grid>*{min-width:0}
  .col{display:flex;flex-direction:column;gap:14px;min-width:0}
  @media (max-width:820px){.grid{grid-template-columns:1fr}.btns{margin-left:0}}
  .panel-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;margin:0 0 8px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0 0 8px;font-size:12.5px}
  .legend span{padding:1px 8px;border-radius:999px;border:1px solid}
  .l1{color:var(--p1);border-color:var(--p1);background:var(--p1s)}
  .l2{color:var(--p2);border-color:var(--p2);background:var(--p2s)}
  .l3{color:var(--p3);border-color:var(--p3);background:var(--p3s)}
  .code{background:var(--code-bg);border-radius:8px;padding:8px 0;overflow-x:auto;
    font:14px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 12px 0 0;border-left:3px solid transparent}
  .ln .no{width:34px;flex:none;text-align:right;padding-right:12px;color:var(--muted);opacity:.7;user-select:none}
  .ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}
  .p{border-bottom:2px solid;border-radius:3px;padding:0 2px;transition:background .2s}
  .p1{border-color:var(--p1)}.p2{border-color:var(--p2)}.p3{border-color:var(--p3)}
  .p1.act{background:var(--p1s)}.p2.act{background:var(--p2s)}.p3.act{background:var(--p3s)}
  .p.act{font-weight:700}
  .side{display:flex;flex-direction:column;gap:14px;min-width:0}
  svg{width:100%;height:auto;display:block;max-width:360px;margin:0 auto}
  .nd rect,.nd polygon{fill:var(--node);stroke:var(--node-line);stroke-width:1.5;transition:all .25s}
  .nd text{fill:var(--node-text);font:12px system-ui,sans-serif}
  .nd text.mono{font:11.5px ui-monospace,Menlo,Consolas,monospace}
  .nd.on rect,.nd.on polygon{fill:var(--cur);stroke:var(--cur-bar);stroke-width:2.5}
  .nd.done rect,.nd.done polygon{stroke:var(--accent);stroke-width:2}
  .ed{fill:none;stroke:var(--node-line);stroke-width:1.8;transition:all .25s}
  .ed.done{stroke:var(--accent);stroke-width:2.6}
  .elabel{font:600 11px system-ui,sans-serif}
  .elabel.t{fill:var(--true)}.elabel.f{fill:var(--false)}
  .vars{display:flex;gap:10px;flex-wrap:wrap}
  .var{background:var(--code-bg);border-radius:8px;padding:6px 14px;min-width:84px;text-align:center}
  .var small{display:block;color:var(--muted);font:12px ui-monospace,Menlo,Consolas,monospace}
  .var strong{font:700 20px ui-monospace,Menlo,Consolas,monospace}
  .var.na strong{color:var(--muted);font-size:13px;font-family:system-ui,sans-serif;font-weight:500;line-height:30px;display:block}
  .tbl{width:100%;border-collapse:collapse;font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .tbl th{font:600 12px system-ui,sans-serif;color:var(--muted);text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
  .tbl td{padding:4px 8px;border-bottom:1px solid var(--line)}
  .tbl tr.cur td{background:var(--cur)}
  .tbl .ph td{color:var(--muted);font-family:system-ui,sans-serif;font-size:13px}
  .tag{display:inline-block;padding:0 7px;border-radius:6px;font-weight:700;font-size:12.5px}
  .tag.t{background:var(--true-soft);color:var(--true)}.tag.f{background:var(--false-soft);color:var(--false)}
  .tblwrap{overflow-x:auto;max-height:340px;overflow-y:auto}
  .console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:10px 12px;min-height:72px;
    font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .console .ph{color:#7b8494;font-family:system-ui,sans-serif;font-size:13px}

  .cm{color:var(--muted);}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pair>*{min-width:0}
  @media (max-width:820px){.pair{grid-template-columns:1fr}}
  .mini{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin:10px 0;min-height:60px;font-size:14px}
  .mini b{display:block;font-size:12px;color:var(--accent)}
  .cnt{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .cnt div{background:var(--code-bg);border-radius:8px;padding:4px 12px;font-size:13px}
  .cnt strong{font:700 17px ui-monospace,Menlo,Consolas,monospace;margin-left:4px}
  .sub{margin:0 0 8px;color:var(--muted);font-size:13.5px}
  .done-flag{color:var(--true);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>Vòng lặp while chạy như thế nào?</h1>
  <p class="lead">Nhập giá trị <b>n</b> rồi bấm <b>Bước tiếp</b>. Với <code>while</code>, điều kiện luôn được kiểm tra <b>trước</b> khi chạy thân vòng lặp.</p>

  <div class="controls">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-ex="dem" aria-selected="true">Đếm 1 đến n</button>
      <button class="tab" role="tab" data-ex="nguoc" aria-selected="false">Đếm ngược</button>
      <button class="tab" role="tab" data-ex="vohan" aria-selected="false">Quên cập nhật biến</button>
    </div>
    <div class="field">
      <label for="val">n =</label>
      <input id="val" type="text" inputmode="numeric" autocomplete="off" value="3">
      <span id="chips"></span>
    </div>
    <div class="btns">
      <button class="btn" id="next">Bước tiếp</button>
      <button class="btn ghost" id="iter">Sang lượt sau</button>
      <button class="btn ghost" id="all">Chạy hết</button>
      <button class="btn ghost" id="reset">Làm lại</button>
    </div>
  </div>
  <div class="err" id="err"></div>
  <div class="status" id="status" aria-live="polite"></div>

  <div class="grid">
    <div class="col">
      <div class="card">
        <p class="panel-title">Mã nguồn C#</p>
        <div class="code" id="code"></div>
      </div>
      <div class="card">
        <p class="panel-title">Bảng theo dõi từng lượt</p>
        <div class="tblwrap"><table class="tbl" id="tbl"></table></div>
      </div>
      <div class="card">
        <p class="panel-title">Console</p>
        <div class="console" id="console"></div>
      </div>
    </div>
    <div class="side">
      <div class="card">
        <p class="panel-title">Sơ đồ luồng</p>
        <svg viewBox="0 0 320 262" aria-label="Sơ đồ luồng while">
          <defs>
            <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--node-line)"/></marker>
            <marker id="arOn" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/></marker>
          </defs>
          <path class="ed" id="e1" d="M160 42 V62"/>
          <path class="ed" id="eT" d="M160 130 V160"/>
          <path class="ed" id="eBack" d="M75 179 H28 V97 H72"/>
          <path class="ed" id="eF" d="M248 97 H286 V218"/>
          <text class="elabel t" x="168" y="150">true</text>
          <text class="elabel f" x="252" y="90">false</text>
          <text class="elabel" x="33" y="150" style="fill:var(--muted)">lặp lại</text>
          <g class="nd" id="nPre"><rect x="75" y="8" width="170" height="34" rx="8"/><text x="160" y="29" text-anchor="middle">Khai báo biến</text></g>
          <g class="nd" id="nCond"><polygon points="160,64 248,97 160,130 72,97"/><text class="mono" id="tCond" x="160" y="101" text-anchor="middle">i &lt;= 3</text></g>
          <g class="nd" id="nBody"><rect x="75" y="162" width="170" height="34" rx="8"/><text x="160" y="183" text-anchor="middle">Chạy thân vòng lặp { }</text></g>
          <g class="nd" id="nExit"><rect x="212" y="220" width="106" height="34" rx="8"/><text x="265" y="241" text-anchor="middle">Thoát vòng lặp</text></g>
        </svg>
      </div>
      <div class="card">
        <p class="panel-title">Giá trị các biến</p>
        <div class="vars" id="vars"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var MAXIT = 12;

  var EX = {
    dem: {
      chips:[3,5,1,0], cv:'i', col:'In ra', vars:['n','i'], guard:false,
      lines:['int n = @N;','int i = 1;','while (i <= n)','{','    Console.WriteLine(i);','    i++;','}','Console.WriteLine("Xong.");'],
      condLn:2, afterLn:7, condCode:'i <= n',
      pre:[
        {ln:0, title:'Khai báo biến n', body:function(s){ return 'Gán giá trị ' + s.n + ' cho biến n.'; }, apply:function(s){ s.nSet = true; }},
        {ln:1, title:'Khai báo biến i', body:function(){ return 'Tạo biến đếm i = 1. Biến này được khai báo trước vòng lặp.'; }, apply:function(s){ s.i = 1; }}
      ],
      cond:function(s){ return {ok:s.i <= s.n, text:s.i + ' <= ' + s.n}; },
      body:[
        {ln:4, title:'Chạy thân vòng lặp', txt:function(s){ return 'In ra ' + s.i + '.'; }, apply:function(s){ s.outs.push(String(s.i)); return String(s.i); }},
        {ln:5, title:'Tăng biến đếm', txt:function(s){ return 'i++ tăng i từ ' + s.i + ' lên ' + (s.i + 1) + '. Nhờ đó điều kiện sẽ có lúc trở thành false.'; }, apply:function(s){ s.i++; return null; }}
      ],
      after:function(s){ s.outs.push('Xong.'); return 'In ra “Xong.” vì đây là dòng nằm sau vòng lặp.'; }
    },
    nguoc: {
      chips:[3,5,1,0], cv:'dem', col:'In ra', vars:['n','dem'], guard:false,
      lines:['int n = @N;','int dem = n;','while (dem > 0)','{','    Console.WriteLine(dem);','    dem--;','}','Console.WriteLine("Hết giờ!");'],
      condLn:2, afterLn:7, condCode:'dem > 0',
      pre:[
        {ln:0, title:'Khai báo biến n', body:function(s){ return 'Gán giá trị ' + s.n + ' cho biến n.'; }, apply:function(s){ s.nSet = true; }},
        {ln:1, title:'Khai báo biến dem', body:function(s){ return 'Tạo biến dem và gán bằng n, tức là ' + s.n + '.'; }, apply:function(s){ s.dem = s.n; }}
      ],
      cond:function(s){ return {ok:s.dem > 0, text:s.dem + ' > 0'}; },
      body:[
        {ln:4, title:'Chạy thân vòng lặp', txt:function(s){ return 'In ra ' + s.dem + '.'; }, apply:function(s){ s.outs.push(String(s.dem)); return String(s.dem); }},
        {ln:5, title:'Giảm biến đếm', txt:function(s){ return 'dem-- giảm dem từ ' + s.dem + ' xuống ' + (s.dem - 1) + '.'; }, apply:function(s){ s.dem--; return null; }}
      ],
      after:function(s){ s.outs.push('Hết giờ!'); return 'In ra “Hết giờ!” vì đây là dòng nằm sau vòng lặp.'; }
    },
    vohan: {
      chips:[3,5,2], cv:'i', col:'In ra', vars:['n','i'], guard:true,
      lines:['int n = @N;','int i = 1;','while (i <= n)','{','    Console.WriteLine(i);','    // thiếu dòng i++ ở đây','}','Console.WriteLine("Xong.");'],
      condLn:2, afterLn:7, condCode:'i <= n',
      pre:[
        {ln:0, title:'Khai báo biến n', body:function(s){ return 'Gán giá trị ' + s.n + ' cho biến n.'; }, apply:function(s){ s.nSet = true; }},
        {ln:1, title:'Khai báo biến i', body:function(){ return 'Tạo biến đếm i = 1.'; }, apply:function(s){ s.i = 1; }}
      ],
      cond:function(s){ return {ok:s.i <= s.n, text:s.i + ' <= ' + s.n}; },
      body:[
        {ln:4, title:'Chạy thân vòng lặp', txt:function(s){ return 'In ra ' + s.i + '. Không có dòng nào thay đổi i, nên i vẫn là ' + s.i + '.'; }, apply:function(s){ s.outs.push(String(s.i)); return String(s.i); }}
      ],
      after:function(s){ s.outs.push('Xong.'); return 'In ra “Xong.”'; }
    }
  };

  var ex = EX.dem, n = 3, step = 0, snaps = [], timer = null, valid = true;

  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function hl(src){
    var re = /(\/\/.*)|(\$?"(?:[^"\\]|\\.)*")|\b(int|while)\b|(\b\d+\b)/g, out = '', last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      if (m[1]) out += '<span class="cm">' + esc(m[1]) + '</span>';
      else if (m[2]) out += '<span class="str">' + esc(m[2]) + '</span>';
      else if (m[3]) out += '<span class="kw">' + m[3] + '</span>';
      else out += '<span class="num">' + m[4] + '</span>';
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }

  function build(){
    var s = {n:n, nSet:false, i:null, dem:null, outs:[], rows:[]};
    snaps = [];
    function snap(kind, ln, title, body, note){
      snaps.push({kind:kind, ln:ln, vals:{n:s.nSet ? s.n : null, i:s.i, dem:s.dem},
        outs:s.outs.slice(), rows:s.rows.map(function(r){ return {iter:r.iter, v:r.v, ct:r.ct, res:r.res, cell:r.cell}; }),
        title:title, body:body, note:note || ''});
    }
    ex.pre.forEach(function(p){ p.apply(s); snap('pre', p.ln, p.title, p.body(s)); });
    var iter = 0, guarded = false;
    while (true) {
      iter++;
      var c = ex.cond(s);
      s.rows.push({iter:iter, v:s[ex.cv], ct:c.text, res:c.ok, cell:''});
      if (!c.ok) {
        snap('condF', ex.condLn, 'Kiểm tra điều kiện lần ' + iter + ' · false',
          c.text + ' là false, vòng lặp dừng. ' + (iter === 1 ? 'Điều kiện sai ngay từ lần kiểm tra đầu tiên nên thân vòng lặp không chạy lần nào.' : 'Chương trình thoát khỏi vòng lặp và chạy tiếp dòng sau dấu }.'));
        break;
      }
      snap('cond', ex.condLn, 'Lượt ' + iter + ' · Kiểm tra điều kiện',
        c.text + ' là true, nên thân vòng lặp được chạy. (while luôn kiểm tra điều kiện trước.)');
      ex.body.forEach(function(b){
        var txt = b.txt(s), cell = b.apply(s);
        if (cell) s.rows[s.rows.length - 1].cell = cell;
        snap('body', b.ln, 'Lượt ' + iter + ' · ' + b.title, txt);
      });
      if (ex.guard && iter >= MAXIT) {
        snap('guard', ex.condLn, 'Mô phỏng tự dừng sau ' + MAXIT + ' lượt',
          'i vẫn bằng ' + s.i + ' nên điều kiện ' + s.i + ' <= ' + s.n + ' luôn là true và vòng lặp sẽ không bao giờ dừng. Ở chương trình thật, console sẽ in mãi cho đến khi bị tắt.',
          'Cách sửa: thêm i++ vào thân vòng lặp để i tăng dần.');
        guarded = true; break;
      }
    }
    if (!guarded) {
      var cnt = s.rows.length - 1;
      snap('after', ex.afterLn, 'Chạy dòng sau vòng lặp', ex.after(s));
      snap('done', null, 'Hoàn tất',
        'Thân vòng lặp chạy ' + cnt + ' lượt, điều kiện được kiểm tra ' + (cnt + 1) + ' lần (lần cuối là false nên dừng).',
        cnt === 0 ? 'Đây là đặc điểm của while: nếu điều kiện sai ngay từ đầu thì thân vòng lặp có thể không chạy lần nào.' : '');
    }
  }

  function renderCode(sn){
    var cur = sn ? sn.ln : null;
    $('code').innerHTML = ex.lines.map(function(l, i){
      return '<div class="ln' + (i === cur ? ' cur' : '') + '"><span class="no">' + (i + 1) + '</span><span>' + hl(l.replace('@N', String(n))) + '</span></div>';
    }).join('');
  }
  function setNode(id, st){ $(id).setAttribute('class', 'nd' + (st ? ' ' + st : '')); }
  function setEdge(id, done){
    var el = $(id);
    el.setAttribute('class', 'ed' + (done ? ' done' : ''));
    el.setAttribute('marker-end', done ? 'url(#arOn)' : 'url(#ar)');
  }
  function renderFlow(){
    $('tCond').textContent = ex.condCode.replace(/\b(n)\b/, n);
    var seen = {}, conds = 0, kind = step > 0 ? snaps[step - 1].kind : null;
    for (var k = 0; k < step; k++) { seen[snaps[k].kind] = true; if (snaps[k].kind === 'cond' || snaps[k].kind === 'condF') conds++; }
    ['nPre','nCond','nBody','nExit'].forEach(function(id){ setNode(id, ''); });
    if (seen.pre) setNode('nPre', 'done');
    if (seen.cond || seen.condF) setNode('nCond', 'done');
    if (seen.body) setNode('nBody', 'done');
    if (seen.after) setNode('nExit', 'done');
    var map = {pre:'nPre', cond:'nCond', condF:'nCond', guard:'nCond', body:'nBody', after:'nExit', done:'nExit'};
    if (map[kind]) setNode(map[kind], 'on');
    setEdge('e1', seen.cond || seen.condF);
    setEdge('eT', seen.body);
    setEdge('eBack', conds >= 2 || seen.guard);
    setEdge('eF', seen.condF);
  }
  function renderTable(sn){
    var h = '<tr><th>Lượt</th><th>' + ex.cv + '</th><th>Điều kiện</th><th>' + esc(ex.col) + '</th></tr>';
    var rows = sn ? sn.rows : [];
    if (!rows.length) h += '<tr class="ph"><td colspan="4">Chưa có lượt nào.</td></tr>';
    rows.forEach(function(r, idx){
      var isCur = idx === rows.length - 1 && (sn.kind === 'cond' || sn.kind === 'condF' || sn.kind === 'body');
      var res = '<span class="tag ' + (r.res ? 't' : 'f') + '">' + (r.res ? 'true' : 'false') + '</span>';
      var cell = r.cell || (r.res ? '' : '<span style="color:var(--muted)">(không chạy)</span>');
      h += '<tr' + (isCur ? ' class="cur"' : '') + '><td>' + r.iter + '</td><td>' + r.v + '</td><td>' + esc(r.ct) + ' ' + res + '</td><td>' + cell + '</td></tr>';
    });
    $('tbl').innerHTML = h;
    var w = document.querySelector('.tblwrap'); w.scrollTop = w.scrollHeight;
  }
  function renderVars(sn){
    $('vars').innerHTML = ex.vars.map(function(name){
      var v = sn ? sn.vals[name] : null, has = v !== null && v !== undefined;
      return '<div class="var' + (has ? '' : ' na') + '"><small>' + name + '</small><strong>' + (has ? v : 'chưa có') + '</strong></div>';
    }).join('');
  }
  function renderConsole(sn){
    $('console').innerHTML = sn && sn.outs.length ? sn.outs.map(esc).join('<br>') : '<span class="ph">Chưa có kết quả.</span>';
  }
  function renderStatus(sn){
    var t, b, note = '';
    if (!sn) { t = 'Sẵn sàng'; b = 'Bấm "Bước tiếp" để chạy từng bước. Bấm "Sang lượt sau" để chạy nhanh hết một lượt lặp.'; }
    else { t = sn.title; b = sn.body; note = sn.note; }
    $('status').innerHTML = '<b>' + esc(t) + '</b>' + esc(b) + (note ? '<span class="note">' + esc(note) + '</span>' : '');
  }
  function render(){
    var sn = step > 0 ? snaps[step - 1] : null;
    renderCode(sn); renderFlow(); renderTable(sn); renderVars(sn); renderConsole(sn); renderStatus(sn);
    var running = timer !== null, LAST = snaps.length;
    $('next').disabled = !valid || step >= LAST || running;
    $('iter').disabled = !valid || step >= LAST || running;
    $('all').disabled = !valid || running;
    $('reset').disabled = running;
  }
  function stop(){ if (timer) { clearInterval(timer); timer = null; } }
  function reset(){ stop(); step = 0; if (valid) build(); render(); }
  function onInput(){
    var s = $('val').value.trim();
    var ok = /^\d{1,2}$/.test(s) && Number(s) <= 15;
    valid = ok;
    $('val').classList.toggle('bad', !ok);
    $('err').textContent = ok ? '' : 'Hãy nhập số nguyên từ 0 đến 15 để dễ quan sát từng lượt.';
    if (ok) n = Number(s);
    reset();
  }
  function setValue(v){ $('val').value = String(v); onInput(); }
  function loadExample(key){
    ex = EX[key];
    document.querySelectorAll('.tab').forEach(function(b){ b.setAttribute('aria-selected', b.dataset.ex === key ? 'true' : 'false'); });
    $('chips').innerHTML = ex.chips.map(function(c){ return '<button class="chip" type="button" data-v="' + c + '">' + c + '</button>'; }).join(' ');
    setValue(ex.chips[0]);
  }
  $('next').addEventListener('click', function(){ if (valid && step < snaps.length) { step++; render(); } });
  $('iter').addEventListener('click', function(){
    if (!valid || step >= snaps.length) return;
    step++;
    while (step < snaps.length && ['cond','condF','after','done','guard'].indexOf(snaps[step - 1].kind) < 0) step++;
    render();
  });
  $('reset').addEventListener('click', reset);
  $('all').addEventListener('click', function(){
    if (!valid) return;
    if (step >= snaps.length) step = 0;
    step++; render();
    timer = setInterval(function(){
      step++;
      if (step >= snaps.length) { step = snaps.length; stop(); }
      render();
    }, 650);
    render();
  });
  $('val').addEventListener('input', onInput);
  $('val').addEventListener('keydown', function(e){ if (e.key === 'Enter' && valid && step < snaps.length) { step++; render(); } });
  $('chips').addEventListener('click', function(e){ var b = e.target.closest('.chip'); if (b) setValue(b.dataset.v); });
  document.querySelectorAll('.tab').forEach(function(b){ b.addEventListener('click', function(){ loadExample(b.dataset.ex); }); });
  loadExample('dem');
})();
</script>
</body>
</html>
