<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="540">
<title>Mô phỏng Động lực học Kế thừa & Bố cục Đối tượng trong C++</title>
<style>
  :root{
    --bg:#f8fafc; --card:#ffffff; --text:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --accent:#2563eb; --accent-soft:#eff6ff; --accent-dark:#1d4ed8;
    --ok:#16a34a; --ok-soft:#f0fdf4;
    --warn:#d97706; --warn-soft:#fefce8;
    --err:#dc2626; --err-soft:#fef2f2;
    --code-bg:#f1f5f9; --cur:#fef08a; --cur-border:#eab308;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f172a; --card:#1e293b; --text:#f1f5f9; --muted:#94a3b8; --line:#334155;
      --accent:#3b82f6; --accent-soft:#1e3a8a; --accent-dark:#60a5fa;
      --ok:#22c55e; --ok-soft:#14532d;
      --warn:#f59e0b; --warn-soft:#451a03;
      --err:#ef4444; --err-soft:#450a0a;
      --code-bg:#090d16; --cur:#422006; --cur-border:#f59e0b;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:13.5px;line-height:1.45}
  .wrap{max-width:880px;margin:0 auto;padding:10px 12px}
  .lead{color:var(--muted);font-size:12.5px;margin:0 0 8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
  
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap}
  .tab{padding:3.5px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:11.5px;font-weight:600;cursor:pointer;transition:all .15s}
  .tab:hover{border-color:var(--accent)}
  .tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}

  .btn-grp{display:flex;gap:4px;align-items:center}
  .btn{padding:4px 9px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:12px;font-weight:600;cursor:pointer;transition:all .15s}
  .btn:hover{background:var(--accent-soft);border-color:var(--accent)}
  .btn:disabled{opacity:0.4;cursor:not-allowed}
  .step-lbl{font-size:11.5px;color:var(--muted);font-weight:600;margin:0 4px}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media (max-width:680px){.grid{grid-template-columns:1fr}}

  .pane-title{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin:0 0 6px}
  
  .code-box{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:12px;overflow-x:auto;padding:6px 0;max-height:260px;overflow-y:auto}
  .code-line{display:flex;align-items:center;padding:2px 8px;line-height:1.4}
  .code-line.active{background:var(--cur);border-left:3px solid var(--cur-border)}
  .ln{width:22px;color:var(--muted);user-select:none;font-size:11px;text-align:right;margin-right:8px}
  .code-txt{flex:1;white-space:pre}

  .mem-box{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:8px}
  .mem-cell{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:7px 10px;display:flex;justify-content:space-between;align-items:center}
  .mem-name{font-family:var(--mono);font-size:12px;font-weight:700}
  .mem-val{font-family:var(--mono);font-size:12px;padding:2px 7px;border-radius:4px;background:var(--bg);border:1px solid var(--line)}
  .mem-val.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent);font-weight:700}
  .mem-val.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok);font-weight:700}
  .mem-val.warn{background:var(--warn-soft);color:var(--warn);border-color:var(--warn);font-weight:700}
  .mem-val.err{background:var(--err-soft);color:var(--err);border-color:var(--err);font-weight:700}
  .mem-state{font-size:11px;color:var(--muted)}

  .status-box{margin-top:8px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);border:1px solid var(--accent);font-size:12px}
  .status-box.err{background:var(--err-soft);border-color:var(--err);color:var(--err)}
  .status-box.ok{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
  .status-box.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
  .kw{color:#8b5cf6;font-weight:600}
  .type{color:#0ea5e9;font-weight:600}
  .fn{color:#2563eb;font-weight:600}
  .num{color:#f97316}
  .com{color:#64748b;font-style:italic}
</style>
</head>
<body>
<div class="wrap">
  <p class="lead" id="lead">Mô phỏng động lực học kế thừa và bố cục đối tượng trong C++20.</p>
  
  <div class="card">
    <div class="controls">
      <div class="tabs">
        <button class="tab active" id="tab-lifecycle" onclick="setMode('lifecycle')">Vòng đời Ctor/Dtor</button>
        <button class="tab" id="tab-object-slicing" onclick="setMode('object-slicing')">Object Slicing</button>
        <button class="tab" id="tab-diamond-problem" onclick="setMode('diamond-problem')">Diamond Problem</button>
      </div>
      <div class="btn-grp">
        <button class="btn" id="btn-prev" onclick="step(-1)">◀ Lùi</button>
        <span class="step-lbl" id="step-lbl">Bước 1/6</span>
        <button class="btn" id="btn-next" onclick="step(1)">Tiếp ▶</button>
        <button class="btn" onclick="reset()">Làm lại</button>
      </div>
    </div>

    <div class="grid">
      <div>
        <div class="pane-title">Mã nguồn C++</div>
        <div class="code-box" id="code-box"></div>
      </div>
      <div>
        <div class="pane-title" id="mem-title">Bố cục Đối tượng & Trình tự Thực thi</div>
        <div class="mem-box" id="mem-box"></div>
      </div>
    </div>

    <div class="status-box" id="status-box"></div>
  </div>
</div>

<script>
const SCENARIOS = {

    code: [
      {ln: 1, text: '<span class="kw">class</span> <span class="type">A</span> { <span class="kw">public</span>: <span class="fn">A</span>() {} ~<span class="fn">A</span>() {} };'},
      {ln: 2, text: '<span class="kw">class</span> <span class="type">B</span> : <span class="kw">public</span> <span class="type">A</span> { <span class="kw">public</span>: <span class="fn">B</span>() {} ~<span class="fn">B</span>() {} };'},
      {ln: 3, text: '<span class="kw">class</span> <span class="type">C</span> : <span class="kw">public</span> <span class="type">B</span> { <span class="kw">public</span>: <span class="fn">C</span>() {} ~<span class="fn">C</span>() {} };'},
      {ln: 4, text: '<span class="type">int</span> <span class="fn">main</span>() {'},
      {ln: 5, text: '    {'},

          {name: 'Bảo toàn đối tượng', val: 'TRỌN VẸN 100%', state: 'extra_val vẫn nguyên vẹn trong d', cls: 'ok'}
        ],
        status: '✓ GIẢI PHÁP: print_ref(const Base& b) truyền theo tham chiếu! Tham chiếu trỏ thẳng vào đối tượng d gốc trong bộ nhớ, không cắt xén, không tạo bản sao.',
        cls: 'ok'
      },

    code: [
      {ln: 1, text: '<span class="kw">class</span> <span class="type">Person</span> { <span class="kw">public</span>: <span class="type">int</span> id; };'},
      {ln: 2, text: '<span class="com">// Cách 1: Đa kế thừa thường -> 2 bản sao Person</span>'},
      {ln: 3, text: '<span class="kw">class</span> <span class="type">Student</span> : <span class="kw">public</span> <span class="type">Person</span> {};'},

let currentMode = 'lifecycle';
let currentStep = 0;

function getUrlParam(name){
  const params = new URLSearchParams(window.location.search);
  return params.get(name);
}

function init(){
  const vd = getUrlParam('vd');
  if(vd && SCENARIOS[vd]) currentMode = vd;
  const buoc = parseInt(getUrlParam('buoc'), 10);
  if(!isNaN(buoc)) currentStep = buoc;
  renderMode();
}

function setMode(mode){
  currentMode = mode;
  currentStep = 0;
  renderMode();
}

function renderMode(){
  ['lifecycle', 'object-slicing', 'diamond-problem'].forEach(m => {
    const el = document.getElementById(`tab-${m}`);
    if(el) el.classList.toggle('active', currentMode === m);
  });
  document.getElementById('lead').textContent = SCENARIOS[currentMode].lead;
  
  const sc = SCENARIOS[currentMode];
  const codeBox = document.getElementById('code-box');
  codeBox.innerHTML = sc.code.map(l => 
    `<div class="code-line" id="line-${l.ln}"><span class="ln">${l.ln}</span><span class="code-txt">${l.text}</span></div>`
  ).join('');

  renderStep();
}

function renderStep(){
  const sc = SCENARIOS[currentMode];
  const st = sc.steps[currentStep];

  document.querySelectorAll('.code-line').forEach(el => el.classList.remove('active'));
  const activeLine = document.getElementById(`line-${st.line}`);
  if(activeLine) activeLine.classList.add('active');

  const memBox = document.getElementById('mem-box');
  memBox.innerHTML = st.mem.map(m => `
    <div class="mem-cell">
      <div>
        <div class="mem-name">${m.name}</div>
        <div class="mem-state">${m.state}</div>
      </div>
      <div class="mem-val ${m.cls}">${m.val}</div>
    </div>
  `).join('');

  const statusBox = document.getElementById('status-box');
  statusBox.className = `status-box ${st.cls}`;
  statusBox.innerHTML = st.status;

  document.getElementById('step-lbl').textContent = `Bước ${currentStep + 1}/${sc.steps.length}`;
  document.getElementById('btn-prev').disabled = (currentStep === 0);
  document.getElementById('btn-next').disabled = (currentStep === sc.steps.length - 1);
}

function step(delta){
  const sc = SCENARIOS[currentMode];
  const next = currentStep + delta;
  if(next >= 0 && next < sc.steps.length){
    currentStep = next;
    renderStep();
  }
}

function reset(){
  currentStep = 0;
  renderStep();
}

window.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') step(1);
