<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="../_style.css"><style>
.code{background:#0f172a;border-radius:16px;padding:30px 20px 24px;text-align:center;font:800 34px ui-monospace,Menlo,Consolas,monospace;color:#e5e7eb}
.t{display:inline-block;padding:2px 8px;border-radius:8px;margin:0 2px}
.a{background:rgba(110,231,183,.25);color:#6ee7b7}.f{background:rgba(96,165,250,.25);color:#93c5fd}.p{background:rgba(253,186,116,.25);color:#fdba74}.l{background:rgba(196,161,255,.28);color:#d8b4fe}
.labels{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:16px}
.lb{border-top:5px solid;border-radius:6px;background:#f6f7f9;padding:10px 12px}.lb b{display:block;font-size:16px}.lb span{font-size:14px;color:#5d6676}
.l1{border-color:#15803d}.l2{border-color:#ea580c}.l3{border-color:#9333ea}
.warn{margin-top:16px;border-left:5px solid #c2410c;background:#fff7ed;border-radius:8px;padding:10px 14px;font-size:16px}
</style></head><body><div id="art">
<h3>Giải phẫu lệnh substr</h3><p class="sub">Đọc: "từ ô số 6, lấy 4 ô"</p>
<div class="code"><span class="t a">ngayStr</span>.<span class="t f">substr</span>(<span class="t p">6</span>, <span class="t l">4</span>)</div>
<div class="labels">
<div class="lb l1"><b>ngayStr</b><span>Chuỗi cần cắt</span></div>
<div class="lb l2"><b>6: vị trí bắt đầu</b><span>Chỉ số của ô đầu tiên được lấy</span></div>
<div class="lb l3"><b>4: số ký tự</b><span>Số ô cần lấy, không phải vị trí kết thúc</span></div></div>
<div class="warn"><b>Chú ý:</b> bỏ số thứ hai (<span class="mono">substr(6)</span>) thì lấy từ ô 6 cho tới hết chuỗi.</div>
</div></body></html>
