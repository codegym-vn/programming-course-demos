<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="600">
<title>Khối 3x3 chứa một ô</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#dcf2e3; --false:#b42318; --false-soft:#fbe4e1;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c; --cm:#6b7280;
    --node:#ffffff; --node-line:#c9ced8; --node-text:#3b4352;
    --p1:#2563eb; --p1s:#dbe7ff; --p2:#9333ea; --p2s:#efdcff; --p3:#c2410c; --p3s:#ffe3d1;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74; --cm:#8b93a1;
      --node:#1d222c; --node-line:#3a4250; --node-text:#c8cfdb;
      --p1:#6ea0ff; --p1s:#1f3358; --p2:#c9a0ff; --p2s:#35244f; --p3:#fdba74; --p3s:#4a2c16;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:10px 12px 12px}
  .lead{color:var(--muted);margin:0 0 8px;font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
  .controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:5px 10px;
    border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .field{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .field label{font-weight:600;font-size:13px}
  .field input,.field select{width:58px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .field select{width:auto}
  .field input.bad{border-color:var(--false);background:var(--false-soft)}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:6px 12px;border-radius:8px;
    cursor:pointer;font:inherit;font-size:13.5px;font-weight:600}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .err{color:var(--false);font-size:12.5px;min-height:0}
  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
    padding:6px 12px;margin-bottom:8px;min-height:52px;font-size:13.5px}
  .status b{display:block;font-size:12.5px;color:var(--accent)}
  .panel-title{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;margin:0 0 6px}
  .code{background:var(--code-bg);border-radius:8px;padding:6px 0;overflow-x:auto;
    font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 10px 0 0;border-left:3px solid transparent}
  .ln .no{width:26px;flex:none;text-align:right;padding-right:10px;color:var(--muted);opacity:.7;user-select:none}
  .ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--cm);font-style:italic}
  .vars{display:flex;gap:6px;flex-wrap:wrap}
  .var{background:var(--code-bg);border-radius:8px;padding:3px 10px;min-width:58px;text-align:center}
  .var small{display:block;color:var(--muted);font:11.5px ui-monospace,Menlo,Consolas,monospace}
  .var strong{font:700 16px ui-monospace,Menlo,Consolas,monospace}
  .var.chg{outline:2px solid var(--cur-bar)}
  .console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:6px 10px;min-height:44px;
    font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;overflow-x:auto}
  .console .ph{color:#7b8494;font-family:system-ui,sans-serif;font-size:12.5px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .stepno{font-size:12px;color:var(--muted);margin-left:auto}

  .layout{display:grid;grid-template-columns:auto 1fr;gap:10px}
  .layout>*{min-width:0}
  @media (max-width:640px){.layout{grid-template-columns:1fr}}
  table.g{border-collapse:collapse;margin:0 auto;font:600 10px ui-monospace,Menlo,Consolas,monospace}
  table.g td.cell{width:28px;height:28px;min-width:28px;text-align:center;border:1px solid var(--node-line);background:var(--node);cursor:pointer;color:var(--muted);padding:0;position:relative}
  table.g td.cell:hover{outline:2px solid var(--accent);outline-offset:-2px}
  table.g td.bl{border-left:2.5px solid var(--text)} table.g td.bt{border-top:2.5px solid var(--text)}
  table.g td.br{border-right:2.5px solid var(--text)} table.g td.bb{border-bottom:2.5px solid var(--text)}
  table.g td.row{background:var(--p1s)} table.g td.col{background:var(--p2s)}
  table.g td.box{background:var(--p3s);color:var(--p3)}
  table.g td.head{box-shadow:inset 0 0 0 2px var(--p3)}
  table.g td.vis{color:var(--text);font-weight:800}
  table.g td.sel{background:var(--cur);color:var(--text);box-shadow:inset 0 0 0 2.5px var(--cur-bar)}
  table.g td.now{box-shadow:inset 0 0 0 3px var(--accent)}
  table.g th{font:600 11px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);padding:0 3px;height:18px}
  table.g th.on{color:var(--text);background:var(--cur);border-radius:4px}
  table.g th.grp{font:500 9.5px ui-monospace,Menlo,Consolas,monospace;line-height:1.25;color:var(--muted);border-bottom:2px solid var(--line);padding:1px 0}
  table.g th.grp.v{border-bottom:0;border-right:2px solid var(--line);padding:0 3px;white-space:nowrap}
  table.g th.grp.on{color:var(--p3);border-color:var(--p3);background:transparent;font-weight:700}
  .legend{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:11.5px;margin-top:6px;justify-content:center}
  .legend span{padding:0 7px;border-radius:999px;border:1px solid}
  .l1{color:var(--p1);border-color:var(--p1);background:var(--p1s)}
  .l2{color:var(--p2);border-color:var(--p2);background:var(--p2s)}
  .l3{color:var(--p3);border-color:var(--p3);background:var(--p3s)}
  .calc{font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;background:var(--code-bg);border-radius:8px;padding:5px 10px;margin:6px 0}
  .calc .hl{color:var(--p3);font-weight:700}
  .side{display:flex;flex-direction:column;gap:0;min-width:0}
  .chk{font-size:12.5px;display:flex;align-items:center;gap:4px}
</style>
</head>
<body>
<div class="wrap">
  <p class="lead">Bấm vào một ô (hoặc gõ <b>i</b>, <b>j</b>) để xem khối 3x3 chứa nó. Bấm <b>Bước tiếp</b> để chạy đoạn code duyệt 9 ô của khối.</p>
  <div class="controls">
    <div class="field"><label for="ii">i</label><input id="ii" inputmode="numeric" value="4" aria-label="Chỉ số hàng i"></div>
    <div class="field"><label for="jj">j</label><input id="jj" inputmode="numeric" value="7" aria-label="Chỉ số cột j"></div>
    <label class="chk"><input type="checkbox" id="rc" checked> Tô hàng, cột</label>
    <div class="btns" style="margin-left:auto">
      <button class="btn ghost" id="prev">Lùi lại</button>
      <button class="btn" id="next">Bước tiếp</button>
      <button class="btn ghost" id="all">Chạy hết</button>
      <button class="btn ghost" id="reset">Làm lại</button>
    </div>
  </div>
  <div class="err" id="err"></div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="layout">
    <div class="card">
      <table class="g" id="g"></table>
      <div class="legend"><span class="l1">hàng i</span><span class="l2">cột j</span><span class="l3">khối 3x3</span></div>
    </div>
    <div class="card side">
      <div class="code" id="code"></div>
      <div class="calc" id="calc"></div>
      <div class="console" id="con"></div>
    </div>
  </div>
</div>
<script>(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function hl(src){
    var re = /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)')|(\/\/.*$)|\b(int|double|char|boolean|new|for|if|else|while|return|public|static|void|true|false|null)\b|(\b\d+(?:\.\d+)?\b)/g, out = '', last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
      else if (m[2]) out += '<span class="cm">' + esc(m[2]) + '</span>';
      else if (m[3]) out += '<span class="kw">' + m[3] + '</span>';
      else out += '<span class="num">' + m[4] + '</span>';
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }
  function codeHtml(lines, cur){
    var curs = Array.isArray(cur) ? cur : [cur];
    return lines.map(function(l, i){ return '<div class="ln' + (curs.indexOf(i) >= 0 ? ' cur' : '') + '"><span class="no">' + (i + 1) + '</span><span>' + hl(l) + '</span></div>'; }).join('');
  }
  function varsHtml(vs){
    return vs.map(function(v){ return '<div class="var' + (v[2] ? ' chg' : '') + '"><small>' + esc(v[0]) + '</small><strong>' + esc(v[1]) + '</strong></div>'; }).join('');
  }
  // Bộ điều khiển bước: snaps[0] là trạng thái ban đầu.
  function Stepper(render){
    var S = {snaps: [], i: 0, timer: null};
    function upd(){
      var n = S.snaps.length;
      $('prev').disabled = S.i <= 0;
      $('next').disabled = S.i >= n - 1;
      $('all').textContent = S.timer ? 'Tạm dừng' : 'Chạy hết';
      $('all').disabled = !S.timer && S.i >= n - 1;
      render(S.snaps[S.i], S.i, n);
    }
    function stop(){ if (S.timer) { clearInterval(S.timer); S.timer = null; } }
    var first = true;
    S.load = function(snaps, at){ stop(); S.snaps = snaps; S.i = at || 0;
      if (first) { first = false; var b = parseInt(qs('buoc'), 10); if (b > 0) S.i = Math.min(b, snaps.length - 1); }
      upd(); };
    S.go = function(k){ stop(); S.i = Math.max(0, Math.min(S.snaps.length - 1, k)); upd(); };
    S.next = function(){ if (S.i < S.snaps.length - 1) { S.i++; upd(); } };
    S.prev = function(){ stop(); if (S.i > 0) { S.i--; upd(); } };
    S.refresh = upd;
    $('next').addEventListener('click', function(){ stop(); S.next(); });
    $('prev').addEventListener('click', S.prev);
    $('reset').addEventListener('click', function(){ S.go(0); });
    $('all').addEventListener('click', function(){
      if (S.timer) { stop(); upd(); return; }
      S.timer = setInterval(function(){ if (S.i >= S.snaps.length - 1) { stop(); upd(); } else S.next(); }, S.speed || 380);
      upd();
    });
    document.addEventListener('keydown', function(e){
      var t = e.target && e.target.tagName;
      if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return;
      if (e.key === 'ArrowRight') { e.preventDefault(); stop(); S.next(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); S.prev(); }
    });
    return S;
  }
  function qs(name){ var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }

  function lines(i, j){ return [
    'int i = ' + i + ', j = ' + j + ';',
    'int r = (i / 3) * 3;',
    'int c = (j / 3) * 3;',
    'System.out.println("O dau khoi: ("',
    '    + r + ", " + c + ")");',
    '',
    'for (int row = r; row < r + 3; row++) {',
    '  for (int col = c; col < c + 3; col++) {',
    '    System.out.print(',
    '        "(" + row + "," + col + ") ");',
    '  }',
    '  System.out.println();',
    '}'
  ]; }
  // Sinh các bước: phép chia nguyên của Java với số không âm = Math.floor.
  function trace(i, j){
    var S = [], out = '', vis = [];
    function snap(o){ o.out = out; o.vis = vis.slice(); S.push(o); }
    var r = Math.floor(i / 3) * 3, c = Math.floor(j / 3) * 3;
    snap({ln:0, title:'Ô đang xét: grid[' + i + '][' + j + ']', body:'Ô nằm ở hàng ' + i + ', cột ' + j + '. Bấm "Bước tiếp" để tính ô đầu của khối.'});
    snap({ln:1, r:r, title:'Tính r', body:'i / 3 = ' + i + ' / 3 = ' + Math.floor(i / 3) + ' (chia nguyên, bỏ phần dư). Nhân lại với 3: r = ' + r + '.'});
    snap({ln:2, r:r, c:c, title:'Tính c', body:'j / 3 = ' + j + ' / 3 = ' + Math.floor(j / 3) + '. Nhân lại với 3: c = ' + c + '. Ô đầu của khối là (' + r + ', ' + c + ').'});
    out += 'O dau khoi: (' + r + ', ' + c + ')\n';
    snap({ln:[3,4], r:r, c:c, box:true, title:'In ô đầu khối', body:'Khối gồm các hàng ' + r + '..' + (r + 2) + ' và các cột ' + c + '..' + (c + 2) + '.'});
    for (var row = r; row < r + 3; row++) {
      for (var col = c; col < c + 3; col++) {
        out += '(' + row + ',' + col + ') '; vis.push(row + ',' + col);
        snap({ln:[8,9], r:r, c:c, box:true, row:row, col:col, title:'row = ' + row + ', col = ' + col, body:'In ô (' + row + ',' + col + ') — ô thứ ' + vis.length + ' trong 9 ô của khối.' + (row === i && col === j ? ' Đây chính là ô đang xét.' : '')});
      }
      out += '\n';
      snap({ln:11, r:r, c:c, box:true, row:row, title:'Xuống dòng', body:row < r + 2 ? 'Xong hàng ' + row + ' của khối, chuyển sang hàng ' + (row + 1) + '.' : 'Xong cả 3 hàng: đã duyệt đủ 9 ô của khối.'});
    }
    return S;
  }
  var I = 4, J = 7;
  function render(s, idx, n){
    $('status').innerHTML = '<b>' + (idx ? 'Bước ' + idx + '/' + (n - 1) + ' · ' : '') + esc(s.title) + '</b>' + esc(s.body);
    $('code').innerHTML = codeHtml(lines(I, J), s.ln);
    var rc = $('rc').checked, R = Math.floor(I / 3) * 3, C = Math.floor(J / 3) * 3;
    var h = '<tr><th></th><th></th>';
    for (var g = 0; g < 3; g++) h += '<th colspan="3" class="grp' + (s.c !== undefined && g * 3 === C ? ' on' : '') + '">j/3=' + g + '<br>(j/3)*3=' + g * 3 + '</th>';
    h += '</tr><tr><th></th><th></th>';
    for (var j = 0; j < 9; j++) h += '<th class="' + (j === J ? 'on' : '') + '">' + j + '</th>';
    h += '</tr>';
    for (var i = 0; i < 9; i++) {
      h += '<tr>';
      if (i % 3 === 0) h += '<th rowspan="3" class="grp v' + (s.r !== undefined && i === R ? ' on' : '') + '">i/3=' + (i / 3) + '<br>→ ' + i + '</th>';
      h += '<th class="' + (i === I ? 'on' : '') + '">' + i + '</th>';
      for (var j2 = 0; j2 < 9; j2++) {
        var inBox = i >= R && i < R + 3 && j2 >= C && j2 < C + 3, cls = 'cell';
        if (j2 % 3 === 0) cls += ' bl'; if (i % 3 === 0) cls += ' bt'; if (j2 === 8) cls += ' br'; if (i === 8) cls += ' bb';
        var label = '';
        if (s.box && inBox) { cls += ' box'; label = i + ',' + j2; }
        else if (rc && i === I) cls += ' row';
        else if (rc && j2 === J) cls += ' col';
        if (i === I && j2 === J) { cls += ' sel'; label = i + ',' + j2; }
        if (s.c !== undefined && s.r !== undefined && i === R && j2 === C) { cls += ' head'; label = i + ',' + j2; }
        if (s.vis.indexOf(i + ',' + j2) >= 0) cls += ' vis';
        if (s.row === i && s.col === j2) cls += ' now';
        h += '<td class="' + cls + '" data-i="' + i + '" data-j="' + j2 + '" title="grid[' + i + '][' + j2 + ']">' + label + '</td>';
      }
      h += '</tr>';
    }
    $('g').innerHTML = h;
    var t = 'r = (' + I + ' / 3) * 3 = ' + Math.floor(I / 3) + ' * 3 = ' + (s.r !== undefined ? '<span class="hl">' + R + '</span>' : '?') + '<br>' +
            'c = (' + J + ' / 3) * 3 = ' + Math.floor(J / 3) + ' * 3 = ' + (s.c !== undefined ? '<span class="hl">' + C + '</span>' : '?');
    if (s.r === undefined) t = 'r = (' + I + ' / 3) * 3 = ?<br>c = (' + J + ' / 3) * 3 = ?';
    else if (s.c === undefined) t = 'r = (' + I + ' / 3) * 3 = ' + Math.floor(I / 3) + ' * 3 = <span class="hl">' + R + '</span><br>c = (' + J + ' / 3) * 3 = ?';
    $('calc').innerHTML = t;
    $('con').innerHTML = s.out ? esc(s.out) : '<span class="ph">Chưa có gì được in.</span>';
  }
  var S = Stepper(render);
  function parse(el){ var v = el.value.trim(); if (!/^\d$/.test(v)) { el.classList.add('bad'); return null; } el.classList.remove('bad'); return +v; }
  function apply(){
    var i = parse($('ii')), j = parse($('jj'));
    if (i === null || j === null) { $('err').textContent = 'i và j phải là số nguyên từ 0 đến 8.'; return; }
    $('err').textContent = ''; I = i; J = j; S.load(trace(I, J));
  }
  $('ii').addEventListener('input', apply); $('jj').addEventListener('input', apply);
  $('rc').addEventListener('change', function(){ S.refresh(); });
  $('g').addEventListener('click', function(e){
    var td = e.target.closest('td.cell'); if (!td) return;
    $('ii').value = td.dataset.i; $('jj').value = td.dataset.j; apply();
  });
  var qi = qs('i'), qj = qs('j');
  if (qi !== null && /^\d$/.test(qi)) $('ii').value = qi;
  if (qj !== null && /^\d$/.test(qj)) $('jj').value = qj;
  window.__trace = trace;
  apply();
})();
</script>
</body>
</html>
