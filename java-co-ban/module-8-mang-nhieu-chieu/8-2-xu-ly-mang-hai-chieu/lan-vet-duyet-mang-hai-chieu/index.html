<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="470">
<title>Lần vết duyệt mảng hai chiều</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#dcf2e3; --false:#b42318; --false-soft:#fbe4e1;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c; --cm:#6b7280;
    --node:#ffffff; --node-line:#c9ced8; --node-text:#3b4352;
    --p1:#2563eb; --p1s:#dbe7ff; --p2:#9333ea; --p2s:#efdcff; --p3:#c2410c; --p3s:#ffe3d1;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74; --cm:#8b93a1;
      --node:#1d222c; --node-line:#3a4250; --node-text:#c8cfdb;
      --p1:#6ea0ff; --p1s:#1f3358; --p2:#c9a0ff; --p2s:#35244f; --p3:#fdba74; --p3s:#4a2c16;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:10px 12px 12px}
  .lead{color:var(--muted);margin:0 0 8px;font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
  .controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:5px 10px;
    border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .field{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .field label{font-weight:600;font-size:13px}
  .field input,.field select{width:58px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .field select{width:auto}
  .field input.bad{border-color:var(--false);background:var(--false-soft)}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:6px 12px;border-radius:8px;
    cursor:pointer;font:inherit;font-size:13.5px;font-weight:600}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .err{color:var(--false);font-size:12.5px;min-height:0}
  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
    padding:6px 12px;margin-bottom:8px;min-height:52px;font-size:13.5px}
  .status b{display:block;font-size:12.5px;color:var(--accent)}
  .panel-title{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;margin:0 0 6px}
  .code{background:var(--code-bg);border-radius:8px;padding:6px 0;overflow-x:auto;
    font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 10px 0 0;border-left:3px solid transparent}
  .ln .no{width:26px;flex:none;text-align:right;padding-right:10px;color:var(--muted);opacity:.7;user-select:none}
  .ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--cm);font-style:italic}
  .vars{display:flex;gap:6px;flex-wrap:wrap}
  .var{background:var(--code-bg);border-radius:8px;padding:3px 10px;min-width:58px;text-align:center}
  .var small{display:block;color:var(--muted);font:11.5px ui-monospace,Menlo,Consolas,monospace}
  .var strong{font:700 16px ui-monospace,Menlo,Consolas,monospace}
  .var.chg{outline:2px solid var(--cur-bar)}
  .console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:6px 10px;min-height:44px;
    font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;overflow-x:auto}
  .console .ph{color:#7b8494;font-family:system-ui,sans-serif;font-size:12.5px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .stepno{font-size:12px;color:var(--muted);margin-left:auto}

  .layout{display:grid;grid-template-columns:1.1fr 1fr;gap:10px}
  .layout>*{min-width:0}
  @media (max-width:620px){.layout{grid-template-columns:1fr}}
  .gridwrap{display:flex;justify-content:center;margin-bottom:8px}
  table.g{border-collapse:separate;border-spacing:3px;font:700 15px ui-monospace,Menlo,Consolas,monospace}
  table.g td.cell{width:46px;height:40px;text-align:center;background:var(--node);border:2px solid var(--node-line);border-radius:6px;position:relative;transition:background .15s}
  table.g td.done{background:var(--accent-soft);border-color:var(--accent)}
  table.g td.hit{background:var(--cur);border-color:var(--cur-bar);box-shadow:0 0 0 2px var(--cur-bar)}
  table.g td.rowon{border-color:var(--p2)}
  table.g td .ord{position:absolute;top:0;left:3px;font:600 9.5px ui-monospace,Menlo,Consolas,monospace;color:var(--accent)}
  table.g th{font:600 12px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);padding:0 4px}
  table.g th.on{color:var(--text);background:var(--cur);border-radius:4px}
  .mt{margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <p class="lead">Bấm <b>Bước tiếp</b> (hoặc phím →) để xem hai vòng lặp đi qua từng ô theo thứ tự nào và lúc nào thì xuống dòng.</p>
  <div class="controls">
    <div class="tabs" role="tablist" id="tabs"></div>
    <div class="btns" style="margin-left:auto">
      <button class="btn ghost" id="prev">Lùi lại</button>
      <button class="btn" id="next">Bước tiếp</button>
      <button class="btn ghost" id="all">Chạy hết</button>
      <button class="btn ghost" id="reset">Làm lại</button>
    </div>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="layout">
    <div class="card">
      <p class="panel-title">Code <span id="decl" class="mono" style="text-transform:none;letter-spacing:0;font-weight:500"></span></p>
      <div class="code" id="code"></div>
      <div class="vars mt" id="vars"></div>
    </div>
    <div class="card">
      <p class="panel-title">Mảng m <span style="text-transform:none;letter-spacing:0;font-weight:500">(số nhỏ: thứ tự được in)</span></p>
      <div class="gridwrap"><table class="g" id="g"></table></div>
      <p class="panel-title">Output</p>
      <div class="console" id="con"></div>
    </div>
  </div>
</div>
<script>(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function hl(src){
    var re = /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)')|(\/\/.*$)|\b(int|double|char|boolean|new|for|if|else|while|return|public|static|void|true|false|null)\b|(\b\d+(?:\.\d+)?\b)/g, out = '', last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
      else if (m[2]) out += '<span class="cm">' + esc(m[2]) + '</span>';
      else if (m[3]) out += '<span class="kw">' + m[3] + '</span>';
      else out += '<span class="num">' + m[4] + '</span>';
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }
  function codeHtml(lines, cur){
    var curs = Array.isArray(cur) ? cur : [cur];
    return lines.map(function(l, i){ return '<div class="ln' + (curs.indexOf(i) >= 0 ? ' cur' : '') + '"><span class="no">' + (i + 1) + '</span><span>' + hl(l) + '</span></div>'; }).join('');
  }
  function varsHtml(vs){
    return vs.map(function(v){ return '<div class="var' + (v[2] ? ' chg' : '') + '"><small>' + esc(v[0]) + '</small><strong>' + esc(v[1]) + '</strong></div>'; }).join('');
  }
  // Bộ điều khiển bước: snaps[0] là trạng thái ban đầu.
  function Stepper(render){
    var S = {snaps: [], i: 0, timer: null};
    function upd(){
      var n = S.snaps.length;
      $('prev').disabled = S.i <= 0;
      $('next').disabled = S.i >= n - 1;
      $('all').textContent = S.timer ? 'Tạm dừng' : 'Chạy hết';
      $('all').disabled = !S.timer && S.i >= n - 1;
      render(S.snaps[S.i], S.i, n);
    }
    function stop(){ if (S.timer) { clearInterval(S.timer); S.timer = null; } }
    var first = true;
    S.load = function(snaps, at){ stop(); S.snaps = snaps; S.i = at || 0;
      if (first) { first = false; var b = parseInt(qs('buoc'), 10); if (b > 0) S.i = Math.min(b, snaps.length - 1); }
      upd(); };
    S.go = function(k){ stop(); S.i = Math.max(0, Math.min(S.snaps.length - 1, k)); upd(); };
    S.next = function(){ if (S.i < S.snaps.length - 1) { S.i++; upd(); } };
    S.prev = function(){ stop(); if (S.i > 0) { S.i--; upd(); } };
    S.refresh = upd;
    $('next').addEventListener('click', function(){ stop(); S.next(); });
    $('prev').addEventListener('click', S.prev);
    $('reset').addEventListener('click', function(){ S.go(0); });
    $('all').addEventListener('click', function(){
      if (S.timer) { stop(); upd(); return; }
      S.timer = setInterval(function(){ if (S.i >= S.snaps.length - 1) { stop(); upd(); } else S.next(); }, S.speed || 380);
      upd();
    });
    document.addEventListener('keydown', function(e){
      var t = e.target && e.target.tagName;
      if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return;
      if (e.key === 'ArrowRight') { e.preventDefault(); stop(); S.next(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); S.prev(); }
    });
    return S;
  }
  function qs(name){ var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }

  var LINES = [
    'for (int i = 0; i < m.length; i++) {',
    '  for (int j = 0; j < m[i].length; j++) {',
    '    System.out.print(m[i][j] + " ");',
    '  }',
    '  System.out.println();',
    '}'
  ];
  var SIZES = {'3x4':[3,4], '2x3':[2,3], '3x2':[3,2]};
  function makeM(r, c){ var m = [], v = 1; for (var i = 0; i < r; i++) { m.push([]); for (var j = 0; j < c; j++) m[i].push(v++); } return m; }
  // Sinh các bước lần vết; mỗi bước lưu dòng đang chạy, i, j, thứ tự đã in và output.
  function trace(m){
    var S = [], out = '', ord = {}, cnt = 0;
    function snap(o){ o.out = out; o.ord = Object.assign({}, ord); S.push(o); }
    snap({ln:-1, title:'Sẵn sàng', body:'Mảng m có ' + m.length + ' hàng, mỗi hàng ' + m[0].length + ' cột. Bấm "Bước tiếp" để bắt đầu.'});
    for (var i = 0; ; i++) {
      if (!(i < m.length)) { snap({ln:0, i:i, title:'Kiểm tra i < m.length', body:'i = ' + i + ', ' + i + ' < ' + m.length + ' là false. Vòng ngoài kết thúc: đã in xong cả ' + m.length + ' hàng.', end:true}); break; }
      snap({ln:0, i:i, title:'Vòng ngoài: hàng ' + i, body:'i = ' + i + ', ' + i + ' < ' + m.length + ' là true. Bắt đầu xử lý hàng ' + i + '.'});
      for (var j = 0; ; j++) {
        if (!(j < m[i].length)) { snap({ln:1, i:i, j:j, title:'Kiểm tra j < m[i].length', body:'j = ' + j + ', ' + j + ' < ' + m[i].length + ' là false. Vòng trong kết thúc, hàng ' + i + ' đã in xong.'}); break; }
        snap({ln:1, i:i, j:j, title:'Vòng trong: cột ' + j, body:'j = ' + j + ', ' + j + ' < ' + m[i].length + ' là true. Sẽ xử lý ô m[' + i + '][' + j + '].'});
        cnt++; ord[i + ',' + j] = cnt; out += m[i][j] + ' ';
        snap({ln:2, i:i, j:j, hit:true, title:'In m[' + i + '][' + j + ']', body:'print in ' + m[i][j] + ' và một dấu cách, vẫn trên cùng dòng (ô thứ ' + cnt + ' được in).'});
      }
      out += '\n';
      snap({ln:4, i:i, title:'Xuống dòng', body:'println() đưa con trỏ xuống dòng mới trước khi sang hàng ' + (i + 1) + '.'});
    }
    return S;
  }
  var key = qs('vd') in SIZES ? qs('vd') : '3x4', m, st;
  $('tabs').innerHTML = Object.keys(SIZES).map(function(k){ return '<button class="tab" role="tab" data-k="' + k + '">' + SIZES[k][0] + ' hàng x ' + SIZES[k][1] + ' cột</button>'; }).join('');
  function render(s, idx, n){
    $('status').innerHTML = '<b>' + (idx ? 'Bước ' + idx + '/' + (n - 1) + ' · ' : '') + esc(s.title) + '</b>' + esc(s.body);
    $('code').innerHTML = codeHtml(LINES, s.ln);
    var vs = [['i', s.i === undefined ? '—' : s.i], ['j', s.j === undefined ? '—' : s.j], ['m.length', m.length], ['m[i].length', m[0].length]];
    $('vars').innerHTML = varsHtml(vs);
    var h = '<tr><th></th>';
    for (var j = 0; j < m[0].length; j++) h += '<th class="' + (s.j === j ? 'on' : '') + '">' + j + '</th>';
    h += '</tr>';
    for (var i = 0; i < m.length; i++) {
      h += '<tr><th class="' + (s.i === i && !s.end ? 'on' : '') + '">' + i + '</th>';
      for (var j2 = 0; j2 < m[i].length; j2++) {
        var o = s.ord[i + ',' + j2], cls = 'cell';
        if (s.hit && s.i === i && s.j === j2) cls += ' hit'; else if (o) cls += ' done';
        else if (s.i === i && !s.end && s.ln >= 0) cls += ' rowon';
        h += '<td class="' + cls + '">' + (o ? '<span class="ord">' + o + '</span>' : '') + m[i][j2] + '</td>';
      }
      h += '</tr>';
    }
    $('g').innerHTML = h;
    $('con').innerHTML = s.out ? esc(s.out.replace(/\n$/, '\n')) + '<span style="opacity:.6">▌</span>' : '<span class="ph">Chưa có gì được in.</span>';
  }
  var S = Stepper(render);
  function load(k){
    key = k; m = makeM(SIZES[k][0], SIZES[k][1]);
    $('decl').textContent = '· m = new int[' + SIZES[k][0] + '][' + SIZES[k][1] + ']';
    document.querySelectorAll('.tab').forEach(function(b){ b.setAttribute('aria-selected', b.dataset.k === k ? 'true' : 'false'); });
    S.load(trace(m));
  }
  document.querySelectorAll('.tab').forEach(function(b){ b.addEventListener('click', function(){ load(b.dataset.k); }); });
  window.__trace = trace;
  load(key);
})();
</script>
</body>
</html>
