<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="540">
<title>Mô phỏng tìm cặp điểm gần nhất</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#dcf2e3; --false:#b42318; --false-soft:#fbe4e1;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c; --cm:#6b7280;
    --node:#ffffff; --node-line:#c9ced8; --node-text:#3b4352;
    --p1:#2563eb; --p1s:#dbe7ff; --p2:#9333ea; --p2s:#efdcff; --p3:#c2410c; --p3s:#ffe3d1;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74; --cm:#8b93a1;
      --node:#1d222c; --node-line:#3a4250; --node-text:#c8cfdb;
      --p1:#6ea0ff; --p1s:#1f3358; --p2:#c9a0ff; --p2s:#35244f; --p3:#fdba74; --p3s:#4a2c16;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:10px 12px 12px}
  .lead{color:var(--muted);margin:0 0 8px;font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px}
  .controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:5px 10px;
    border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .field{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .field label{font-weight:600;font-size:13px}
  .field input,.field select{width:58px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .field select{width:auto}
  .field input.bad{border-color:var(--false);background:var(--false-soft)}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:6px 12px;border-radius:8px;
    cursor:pointer;font:inherit;font-size:13.5px;font-weight:600}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .err{color:var(--false);font-size:12.5px;min-height:0}
  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
    padding:6px 12px;margin-bottom:8px;min-height:52px;font-size:13.5px}
  .status b{display:block;font-size:12.5px;color:var(--accent)}
  .panel-title{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;margin:0 0 6px}
  .code{background:var(--code-bg);border-radius:8px;padding:6px 0;overflow-x:auto;
    font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 10px 0 0;border-left:3px solid transparent}
  .ln .no{width:26px;flex:none;text-align:right;padding-right:10px;color:var(--muted);opacity:.7;user-select:none}
  .ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--cm);font-style:italic}
  .vars{display:flex;gap:6px;flex-wrap:wrap}
  .var{background:var(--code-bg);border-radius:8px;padding:3px 10px;min-width:58px;text-align:center}
  .var small{display:block;color:var(--muted);font:11.5px ui-monospace,Menlo,Consolas,monospace}
  .var strong{font:700 16px ui-monospace,Menlo,Consolas,monospace}
  .var.chg{outline:2px solid var(--cur-bar)}
  .console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:6px 10px;min-height:44px;
    font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre;overflow-x:auto}
  .console .ph{color:#7b8494;font-family:system-ui,sans-serif;font-size:12.5px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .stepno{font-size:12px;color:var(--muted);margin-left:auto}

  .layout{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .layout>*{min-width:0}
  @media (max-width:640px){.layout{grid-template-columns:1fr}}
  .code{font-size:11.8px;line-height:1.5}
  .ln .no{width:22px;padding-right:7px}
  svg{width:100%;height:auto;display:block;touch-action:none;user-select:none}
  .ax{stroke:var(--muted);stroke-width:1.2}
  .gl{stroke:var(--line);stroke-width:1}
  .tk{fill:var(--muted);font:10px ui-monospace,Menlo,Consolas,monospace}
  .seen{stroke:var(--node-line);stroke-width:1;opacity:.7}
  .curl{stroke:var(--cur-bar);stroke-width:2.5;stroke-dasharray:6 4}
  .best{stroke:var(--true);stroke-width:4;stroke-linecap:round}
  .pt circle{fill:var(--node);stroke:var(--text);stroke-width:1.6;cursor:grab}
  .pt.on circle{fill:var(--cur);stroke:var(--cur-bar);stroke-width:2.5}
  .pt.bst circle{fill:var(--true-soft);stroke:var(--true);stroke-width:2.5}
  .pt text{font:700 10px ui-monospace,Menlo,Consolas,monospace;fill:var(--text);pointer-events:none}
  .dl{font:700 11px ui-monospace,Menlo,Consolas,monospace;fill:var(--cur-bar);paint-order:stroke;stroke:var(--card);stroke-width:3}
  .mt{margin-top:6px}
  .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:4px}
  .tools button{font:inherit;font-size:12px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
  .console{min-height:0;font-size:11.5px;padding:4px 8px;white-space:pre-wrap}
  .var{padding:2px 7px;min-width:38px}.var strong{font-size:14px}.var small{font-size:10.5px}
  .vars{flex-wrap:nowrap}
</style>
</head>
<body>
<div class="wrap">
  <p class="lead">Bấm <b>Bước tiếp</b> để xét từng cặp điểm (i, j). Kéo điểm để đổi vị trí, bấm chỗ trống để thêm điểm.</p>
  <div class="controls">
    <div class="tools" style="margin:0"><span id="cnt"></span><span id="np"></span><button id="orig">Dữ liệu gốc</button></div>
    <div class="btns" style="margin-left:auto">
      <button class="btn ghost" id="prev">Lùi lại</button>
      <button class="btn" id="next">Bước tiếp</button>
      <button class="btn ghost" id="all">Chạy hết</button>
      <button class="btn ghost" id="reset">Làm lại</button>
    </div>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="layout">
    <div class="card"><div class="code" id="code"></div></div>
    <div class="card">
      <svg id="sv" viewBox="0 0 330 270" aria-label="Mặt phẳng toạ độ với các điểm"></svg>
      <div class="vars mt" id="vars"></div>
      <div class="console mt" id="con"></div>
    </div>
  </div>
</div>
<script>(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function hl(src){
    var re = /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)')|(\/\/.*$)|\b(int|double|char|boolean|new|for|if|else|while|return|public|static|void|true|false|null)\b|(\b\d+(?:\.\d+)?\b)/g, out = '', last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
      else if (m[2]) out += '<span class="cm">' + esc(m[2]) + '</span>';
      else if (m[3]) out += '<span class="kw">' + m[3] + '</span>';
      else out += '<span class="num">' + m[4] + '</span>';
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }
  function codeHtml(lines, cur){
    var curs = Array.isArray(cur) ? cur : [cur];
    return lines.map(function(l, i){ return '<div class="ln' + (curs.indexOf(i) >= 0 ? ' cur' : '') + '"><span class="no">' + (i + 1) + '</span><span>' + hl(l) + '</span></div>'; }).join('');
  }
  function varsHtml(vs){
    return vs.map(function(v){ return '<div class="var' + (v[2] ? ' chg' : '') + '"><small>' + esc(v[0]) + '</small><strong>' + esc(v[1]) + '</strong></div>'; }).join('');
  }
  // Bộ điều khiển bước: snaps[0] là trạng thái ban đầu.
  function Stepper(render){
    var S = {snaps: [], i: 0, timer: null};
    function upd(){
      var n = S.snaps.length;
      $('prev').disabled = S.i <= 0;
      $('next').disabled = S.i >= n - 1;
      $('all').textContent = S.timer ? 'Tạm dừng' : 'Chạy hết';
      $('all').disabled = !S.timer && S.i >= n - 1;
      render(S.snaps[S.i], S.i, n);
    }
    function stop(){ if (S.timer) { clearInterval(S.timer); S.timer = null; } }
    var first = true;
    S.load = function(snaps, at){ stop(); S.snaps = snaps; S.i = at || 0;
      if (first) { first = false; var b = parseInt(qs('buoc'), 10); if (b > 0) S.i = Math.min(b, snaps.length - 1); }
      upd(); };
    S.go = function(k){ stop(); S.i = Math.max(0, Math.min(S.snaps.length - 1, k)); upd(); };
    S.next = function(){ if (S.i < S.snaps.length - 1) { S.i++; upd(); } };
    S.prev = function(){ stop(); if (S.i > 0) { S.i--; upd(); } };
    S.refresh = upd;
    $('next').addEventListener('click', function(){ stop(); S.next(); });
    $('prev').addEventListener('click', S.prev);
    $('reset').addEventListener('click', function(){ S.go(0); });
    $('all').addEventListener('click', function(){
      if (S.timer) { stop(); upd(); return; }
      S.timer = setInterval(function(){ if (S.i >= S.snaps.length - 1) { stop(); upd(); } else S.next(); }, S.speed || 380);
      upd();
    });
    document.addEventListener('keydown', function(e){
      var t = e.target && e.target.tagName;
      if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return;
      if (e.key === 'ArrowRight') { e.preventDefault(); stop(); S.next(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); S.prev(); }
    });
    return S;
  }
  function qs(name){ var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }

  var LINES = [
    'int p1 = 0, p2 = 1;',
    'double shortestDistance = distance(',
    '    points[p1][0], points[p1][1],',
    '    points[p2][0], points[p2][1]);',
    '',
    'for (int i = 0; i < points.length; i++) {',
    '  for (int j = i + 1;',
    '      j < points.length; j++) {',
    '    double d = distance(',
    '        points[i][0], points[i][1],',
    '        points[j][0], points[j][1]);',
    '    if (shortestDistance > d) {',
    '      p1 = i;',
    '      p2 = j;',
    '      shortestDistance = d;',
    '    }',
    '  }',
    '}'
  ];
  var ORIG = [[-1,3],[-1,-1],[1,1],[2,0.5],[2,-1],[3,3],[4,2],[4,-0.5]];
  var pts = ORIG.map(function(p){ return p.slice(); });
  function distance(x1, y1, x2, y2){ return Math.sqrt((x2 - x1) * (x2 - x1) + (y2 - y1) * (y2 - y1)); }
  function jd(v){ return Number.isInteger(v) ? v.toFixed(1) : String(v); } // giống Double.toString với các số .0/.5
  function f3(v){ return (Math.round(v * 1000) / 1000).toFixed(3); }
  function trace(P){
    var S = [], seen = [], n = P.length;
    function snap(o){ o.seen = seen.slice(); S.push(o); }
    snap({ln:-1, title:'Sẵn sàng', body:'Có ' + n + ' điểm, tức ' + (n * (n - 1) / 2) + ' cặp cần xét. Bấm "Bước tiếp".'});
    var p1 = 0, p2 = 1, sd = distance(P[0][0], P[0][1], P[1][0], P[1][1]);
    snap({ln:[0,1,2,3], p1:p1, p2:p2, sd:sd, title:'Tạm coi cặp (0, 1) là gần nhất', body:'shortestDistance = khoảng cách giữa điểm 0 và điểm 1 = ' + f3(sd) + '.'});
    for (var i = 0; i < n; i++) for (var j = i + 1; j < n; j++) {
      var d = distance(P[i][0], P[i][1], P[j][0], P[j][1]), up = sd > d;
      var msg = 'd = ' + f3(d) + '. shortestDistance > d là ' + (sd > d) + ' (' + f3(sd) + ' > ' + f3(d) + ').';
      if (up) { p1 = i; p2 = j; sd = d; msg += ' Tìm được cặp gần hơn: cập nhật p1 = ' + i + ', p2 = ' + j + '.'; }
      else msg += ' Giữ nguyên cặp (' + p1 + ', ' + p2 + ').';
      seen.push([i, j]);
      snap({ln:up ? [8,9,10,11,12,13,14] : [8,9,10,11], i:i, j:j, d:d, up:up, p1:p1, p2:p2, sd:sd, title:'Xét cặp (' + i + ', ' + j + ')', body:msg});
    }
    var out = 'Hai diem gan nhau nhat la (' + jd(P[p1][0]) + ', ' + jd(P[p1][1]) + ') va (' + jd(P[p2][0]) + ', ' + jd(P[p2][1]) + ')';
    snap({ln:-1, p1:p1, p2:p2, sd:sd, end:true, out:out, title:'Xong', body:'Đã xét đủ ' + seen.length + ' cặp. Cặp gần nhất là điểm ' + p1 + ' và điểm ' + p2 + ', khoảng cách ' + f3(sd) + '.'});
    return S;
  }
  // Toạ độ màn hình
  var X0 = -2, X1 = 5, Y0 = -2, Y1 = 4, L = 22, T = 10, U = 42;
  function sx(x){ return L + (x - X0) * U; } function sy(y){ return T + (Y1 - y) * U; }
  var cur = null;
  function render(s, idx, n){
    cur = s;
    $('status').innerHTML = '<b>' + (idx ? 'Bước ' + idx + '/' + (n - 1) + ' · ' : '') + esc(s.title) + '</b>' + esc(s.body);
    $('code').innerHTML = codeHtml(LINES, s.ln);
    $('cnt').textContent = 'Đã xét ' + s.seen.length + '/' + (pts.length * (pts.length - 1) / 2) + ' cặp';
    var h = '', x, y;
    for (x = X0; x <= X1; x++) h += '<line class="' + (x === 0 ? 'ax' : 'gl') + '" x1="' + sx(x) + '" y1="' + sy(Y0) + '" x2="' + sx(x) + '" y2="' + sy(Y1) + '"/>' + (x !== 0 ? '<text class="tk" x="' + sx(x) + '" y="' + (sy(0) + 12) + '" text-anchor="middle">' + x + '</text>' : '');
    for (y = Y0; y <= Y1; y++) h += '<line class="' + (y === 0 ? 'ax' : 'gl') + '" x1="' + sx(X0) + '" y1="' + sy(y) + '" x2="' + sx(X1) + '" y2="' + sy(y) + '"/>' + (y !== 0 ? '<text class="tk" x="' + (sx(0) - 5) + '" y="' + (sy(y) + 3) + '" text-anchor="end">' + y + '</text>' : '');
    h += '<text class="tk" x="' + (sx(0) - 5) + '" y="' + (sy(0) + 12) + '" text-anchor="end">0</text>';
    s.seen.forEach(function(p){ h += '<line class="seen" x1="' + sx(pts[p[0]][0]) + '" y1="' + sy(pts[p[0]][1]) + '" x2="' + sx(pts[p[1]][0]) + '" y2="' + sy(pts[p[1]][1]) + '"/>'; });
    if (s.p1 !== undefined) h += '<line class="best" x1="' + sx(pts[s.p1][0]) + '" y1="' + sy(pts[s.p1][1]) + '" x2="' + sx(pts[s.p2][0]) + '" y2="' + sy(pts[s.p2][1]) + '"/>';
    if (s.i !== undefined) {
      var a = pts[s.i], b = pts[s.j];
      h += '<line class="curl" x1="' + sx(a[0]) + '" y1="' + sy(a[1]) + '" x2="' + sx(b[0]) + '" y2="' + sy(b[1]) + '"/>';
      h += '<text class="dl" x="' + ((sx(a[0]) + sx(b[0])) / 2 + 4) + '" y="' + ((sy(a[1]) + sy(b[1])) / 2 - 5) + '">d=' + f3(s.d) + '</text>';
    }
    pts.forEach(function(p, k){
      var cls = 'pt' + (k === s.i || k === s.j ? ' on' : (k === s.p1 || k === s.p2 ? ' bst' : ''));
      h += '<g class="' + cls + '" data-k="' + k + '"><circle cx="' + sx(p[0]) + '" cy="' + sy(p[1]) + '" r="9"/><text x="' + sx(p[0]) + '" y="' + (sy(p[1]) + 3.5) + '" text-anchor="middle">' + k + '</text></g>';
    });
    $('sv').innerHTML = h;
    $('np').textContent = '· ' + pts.length + ' điểm';
    var vs = [['i', s.i === undefined ? '—' : s.i], ['j', s.j === undefined ? '—' : s.j], ['p1', s.p1 === undefined ? '—' : s.p1, s.up], ['p2', s.p2 === undefined ? '—' : s.p2, s.up], ['shortestDistance', s.sd === undefined ? '—' : f3(s.sd), s.up]];
    $('vars').innerHTML = varsHtml(vs);
    $('con').innerHTML = s.out ? esc(s.out) : '<span class="ph">Kết quả được in khi duyệt xong.</span>';
  }
  var S = Stepper(render);
  function rebuild(keep){ S.load(trace(pts), keep ? Math.min(S.i, pts.length * (pts.length - 1) / 2 + 2) : 0); }
  // Kéo thả / thêm điểm
  var sv = $('sv'), drag = null, moved = false;
  function toData(e){
    var r = sv.getBoundingClientRect(), k = 330 / r.width;
    var x = ((e.clientX - r.left) * k - L) / U + X0, y = Y1 - ((e.clientY - r.top) * k - T) / U;
    x = Math.round(x * 2) / 2; y = Math.round(y * 2) / 2;
    return [Math.max(X0, Math.min(X1, x)), Math.max(Y0, Math.min(Y1, y))];
  }
  sv.addEventListener('pointerdown', function(e){
    var g = e.target.closest('.pt');
    if (g) { drag = +g.dataset.k; moved = false; sv.setPointerCapture(e.pointerId); e.preventDefault(); }
  });
  sv.addEventListener('pointermove', function(e){
    if (drag === null) return;
    var p = toData(e);
    if (p[0] !== pts[drag][0] || p[1] !== pts[drag][1]) { pts[drag] = p; moved = true; rebuild(true); }
  });
  sv.addEventListener('pointerup', function(e){
    if (drag !== null) { drag = null; return; }
    if (e.target.closest('.pt')) return;
    if (pts.length >= 10) { $('np').textContent = '· tối đa 10 điểm'; return; }
    pts.push(toData(e)); rebuild(false);
  });
  $('orig').addEventListener('click', function(){ pts = ORIG.map(function(p){ return p.slice(); }); rebuild(false); });
  window.__trace = trace;
  rebuild(false);
})();
</script>
</body>
</html>
