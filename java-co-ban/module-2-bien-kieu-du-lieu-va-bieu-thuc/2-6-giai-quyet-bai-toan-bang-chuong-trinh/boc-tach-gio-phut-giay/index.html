<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="560">
<title>Bóc tách giờ, phút, giây</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
  --accent:#2563eb; --accent-soft:#e7eefc;
  --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
  --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
  --con-bg:#111827; --con-text:#e5e7eb;
  --kw:#7c3aed; --str:#047857; --num:#c2410c; --cm:#6b7280;
  --warn:#b45309; --warn-soft:#fdf0d5;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
    --accent:#6ea0ff; --accent-soft:#1e2a44;
    --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
    --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
    --con-bg:#05070b; --con-text:#e5e7eb;
    --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74; --cm:#8b93a1;
    --warn:#fbbf24; --warn-soft:#3a2a0c;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:10px 12px 12px}
.hint{color:var(--muted);margin:0 0 8px;font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:5px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btns{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.field{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.field label{font-weight:600;font-size:13.5px}
input.txt{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input.txt.bad{border-color:var(--false);background:var(--false-soft)}
.chip{border:1px dashed var(--muted);background:transparent;color:var(--text);padding:3px 9px;border-radius:999px;cursor:pointer;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.chip:hover,.chip.on{border-color:var(--accent);color:var(--accent);border-style:solid}
.err{color:var(--false);font-size:13px;min-height:0}
.err:empty{display:none}
.status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:7px 12px;margin-bottom:8px;min-height:58px;font-size:14px}
.status b{display:block;font-size:12.5px;color:var(--accent)}
.status .note{display:block;margin-top:3px;font-size:13px;color:var(--muted)}
.status.ok{border-left-color:var(--true)}
.status.bad{border-left-color:var(--false)}
.panel-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.code{background:var(--code-bg);border-radius:8px;padding:6px 0;overflow-x:auto;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ln{display:flex;white-space:pre;padding:0 10px 0 0;border-left:3px solid transparent}
.ln .no{width:30px;flex:none;text-align:right;padding-right:10px;color:var(--muted);opacity:.7;user-select:none}
.ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
.ln.dim{opacity:.55}
.kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--cm);font-style:italic}
.console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:7px 10px;min-height:44px;white-space:pre-wrap;font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:auto}
.console .ph{color:#7b8494;font-family:system-ui,sans-serif;font-size:13px}
.console .e{color:#fca5a5}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ok-t{color:var(--true);font-weight:700}.bad-t{color:var(--false);font-weight:700}
@keyframes flash{0%{background:var(--cur);box-shadow:0 0 0 3px var(--cur-bar)}100%{}}
.flash{animation:flash 1.1s ease-out}
.status{overflow-wrap:anywhere}
@media (max-width:560px){
  .btns{margin-left:0}
  .btn{padding:6px 10px}
}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 312px;gap:10px}
.grid>*{min-width:0}
@media (max-width:660px){.grid{grid-template-columns:1fr}}
.inrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.inrow input.txt{width:132px}
.tgl{display:flex;align-items:center;gap:5px;font-size:13.5px;cursor:pointer;user-select:none}
.live{display:inline-flex;align-items:center;gap:6px}
.live i{width:9px;height:9px;border-radius:50%;background:var(--muted);display:inline-block}
.live.on i{background:var(--true);box-shadow:0 0 0 3px var(--true-soft)}
.casc{display:grid;grid-template-columns:minmax(0,1.25fr) 30px minmax(0,1fr);row-gap:0;align-items:center}
.bx{background:var(--code-bg);border:2px solid transparent;border-radius:8px;padding:3px 8px;min-width:0}
.bx small{display:block;font:11.5px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bx strong{display:block;font:700 15.5px/1.35 ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bx.na strong{color:var(--muted)}
.bx.cur{border-color:var(--cur-bar);background:var(--cur)}
.bx.res{border-color:var(--accent)}
.bx.res.cur{border-color:var(--cur-bar)}
.arrd{grid-column:1;text-align:center;font:600 11.5px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);height:20px;line-height:20px}
.arrd.on,.arrr.on{color:var(--accent)}
.arrr{text-align:center;color:var(--muted);font:600 11px ui-monospace,Menlo,Consolas,monospace;line-height:1.1}
.gap{height:20px}
.cap{font-size:12px;color:var(--muted);margin-top:6px}
.changed{text-decoration:underline;text-decoration-color:var(--warn);text-underline-offset:3px}
</style>
</head>
<body>
<div class="wrap">
  <p class="hint">Dùng giờ thật của máy bạn (hoặc gõ số mili giây). Bấm <b>Bước tiếp</b> để chạy từng câu lệnh.</p>
  <div class="controls">
    <div class="inrow">
      <button class="btn ghost live" id="bLive" title="Bấm để dừng hoặc cho đồng hồ chạy tiếp"><i></i><span>Đang chạy</span></button>
      <input class="txt" id="ms" aria-label="Số mili giây" maxlength="16" autocomplete="off" title="Gõ số mili giây tuỳ ý rồi nhấn Enter" placeholder="mili giây">
    </div>
    <div class="btns">
      <button class="btn ghost" id="bPrev">Lùi lại</button>
      <button class="btn" id="bNext">Bước tiếp</button>
      <button class="btn ghost" id="bAll">Chạy hết</button>
      <button class="btn ghost" id="bReset">Làm lại</button>
    </div>
  </div>
  <div class="err" id="err"></div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="grid">
    <div class="card"><p class="panel-title">ShowCurrentTime.java (trích main)</p><div class="code" id="code"></div><div class="console" id="con" style="margin-top:8px"></div></div>
    <div class="card"><p class="panel-title" style="display:flex;justify-content:space-between;gap:6px;flex-wrap:wrap"><span>Bóc dần từng đơn vị</span><label class="tgl" style="text-transform:none;letter-spacing:0;font-weight:600;color:var(--text)"><input type="checkbox" id="vn"> Giờ Việt Nam (+7)</label></p><div class="casc" id="casc"></div><div class="cap" id="cap"></div></div>
  </div>
</div>

      else if (sameLater) rule = 'Cùng mức ưu tiên: tính từ trái sang phải.';
      else rule = 'Phép tính cuối cùng.';
      if (inParen && mulFirst && hasAdd) rule = 'Trong ngoặc tính trước; trong ngoặc, nhân chia tính trước cộng trừ.';

/* UI helpers */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hlJava(src){
  var re = /("(?:[^"\\]|\\.)*")|(\/\/.*$)|\b(public|class|static|void|int|double|long|final|new|import|return|if|else|while|for)\b|(\b\d+(?:\.\d+)?\b)/g, out = '', last = 0, m;
  while ((m = re.exec(src))){
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="cm">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="kw">' + m[3] + '</span>';
    else out += '<span class="num">' + m[4] + '</span>';
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function codeHtml(lines, cur, startNo){
  startNo = startNo || 1; cur = cur || [];

    return '<div class="ln' + (cur.indexOf(i) >= 0 ? ' cur' : '') + '"><span class="no">' + (i + startNo) + '</span><span>' + hlJava(l) + '</span></div>';
  }).join('');
}
function qparam(name){
  try { var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; } catch(e){ return null; }
}
/* Stepper: opts {count():n, render(step), onBlockNext?():bool} */
function Stepper(opts){

  self.all = function(){ self.go(opts.count()); };
  self.reset = function(){ self.go(0); };
  function upd(){
    var n = opts.count();
    $('bNext').disabled = self.step >= n; $('bAll').disabled = self.step >= n;
    $('bPrev').disabled = self.step <= 0; $('bReset').disabled = self.step <= 0;
  }
  $('bNext').onclick = function(){ self.next(); }; $('bPrev').onclick = function(){ self.prev(); }; $('bAll').onclick = function(){ self.all(); }; $('bReset').onclick = function(){ self.reset(); };

    if (e.key === 'ArrowRight'){ e.preventDefault(); self.next(); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); self.prev(); }

      case 2: return v.totalMilliseconds + ' / 1000 = ' + v.totalSeconds + ' giây. Hai số nguyên chia nhau nên phần mili giây lẻ bị cắt bỏ.';
      case 3: return v.totalSeconds + ' % 60 = ' + v.currentSecond + '. Phần dư khi chia cho 60 là số giây lẻ, tức giây hiện tại.';
      case 4: return v.totalSeconds + ' / 60 = ' + v.totalMinutes + '. Chuyển lên đơn vị lớn hơn: tổng số phút.';
      case 5: return v.totalMinutes + ' % 60 = ' + v.currentMinute + '. Số phút lẻ trong giờ hiện tại.';
      case 6: return v.totalMinutes + ' / 60 = ' + v.totalHours + '. Tổng số giờ kể từ năm 1970.';
      case 7: return vn ? '(' + v.totalHours + ' + 7) % 24 = ' + v.currentHour + '. Cộng 7 giờ của múi giờ Việt Nam TRƯỚC khi lấy dư cho 24.' : v.totalHours + ' % 24 = ' + v.currentHour + '. Số giờ lẻ trong ngày: giờ hiện tại theo GMT.';
      case 8: return 'Nối các giá trị thành chuỗi và in ra. Số có một chữ số được in không có số 0 đằng trước.';
    }
    return '';
  }
  var BOX = [ // [name, row, col, stepRevealed, arrow label]
    ['totalMilliseconds', 0, 1, 1], ['totalSeconds', 1, 1, 2], ['currentSecond', 1, 3, 3], ['totalMinutes', 2, 1, 4], ['currentMinute', 2, 3, 5], ['totalHours', 3, 1, 6], ['currentHour', 3, 3, 7]];
  function render(k){
    var lines = L(), cur = k > 0 ? STMT[k-1] : [];
    $('code').innerHTML = lines.map(function(l, i){
      var ch = vn && (l[0] === 24 || l[0] === 29);
      return '<div class="ln' + (cur.indexOf(i) >= 0 ? ' cur' : '') + '"><span class="no">' + l[0] + '</span><span' + (ch ? ' class="changed" title="Đã sửa cho giờ Việt Nam"' : '') + '>' + hlJava(l[1]) + '</span></div>';
    }).join('');
    var v = vals(), h = '';
    function box(name, step){
      var shown = k >= step, val = shown ? String(v[name]) : '?';
      var cls = 'bx' + (shown ? '' : ' na') + (name.indexOf('current') === 0 ? ' res' : '') + (k === step ? ' cur' : '');
      var fl = shown && prevVals[name] !== undefined && prevVals[name] !== v[name] ? ' flash' : '';
      return '<div class="' + cls + fl + '"><small>' + name + '</small><strong>' + val + '</strong></div>';
    }
    function arrR(step, lab){ return '<div class="arrr' + (k >= step ? ' on' : '') + '">→<br>' + lab + '</div>'; }
    function arrD(step, lab){ return '<div class="arrd' + (k >= step ? ' on' : '') + '">↓ ' + lab + '</div><div></div><div></div>'; }
    h += box('totalMilliseconds', 1) + '<div></div><div></div>';
    h += arrD(2, '/ 1000');
    h += box('totalSeconds', 2) + arrR(3, '%60') + box('currentSecond', 3);
    h += arrD(4, '/ 60');
    h += box('totalMinutes', 4) + arrR(5, '%60') + box('currentMinute', 5);
    h += arrD(6, '/ 60');
    h += box('totalHours', 6) + arrR(7, vn ? '+7<br>%24' : '%24') + box('currentHour', 7);
    $('casc').innerHTML = h;
    BOX.forEach(function(b){ if (k >= b[3]) prevVals[b[0]] = v[b[0]]; });
    $('cap').textContent = live ? 'Đồng hồ đang chạy: các số được cập nhật mỗi giây.' : 'Đồng hồ đang dừng ở số mili giây trong ô nhập.';
    var tz = vn ? ' GMT+7' : ' GMT';
    $('con').innerHTML = k >= 8 ? esc('Current time is ' + v.currentHour + ':' + v.currentMinute + ':' + v.currentSecond + tz) : '<span class="ph">Chưa in gì.</span>';
    $('status').innerHTML = k === 0 ? '<b>Sẵn sàng</b>Bấm <b style="display:inline;color:inherit">Bước tiếp</b> để chạy câu lệnh đầu tiên. Đồng hồ ' + (live ? 'đang chạy' : 'đang dừng') + ' ở ' + ms + ' mili giây.'
      : '<b>Bước ' + k + ' / 8 · dòng ' + STMT[k-1].map(function(i){ return lines[i][0]; }).join(', ') + '</b>' + esc(msg(k, v)) + (k === 8 ? '<span class="note">Chương trình chạy xong. Bật “Giờ Việt Nam (+7)” để xem cần sửa ở đâu.</span>' : '');
    if (document.activeElement !== $('ms')) $('ms').value = ms;
  }
  var S = Stepper({count:function(){ return 8; }, render:render});
  function setLive(on){
    live = on; $('bLive').classList.toggle('on', on); $('bLive').querySelector('span').textContent = on ? 'Đang chạy' : 'Đang dừng';
    $('bLive').setAttribute('aria-pressed', String(on));
    if (timer){ clearInterval(timer); timer = null; }
    if (on){ ms = Date.now(); timer = setInterval(function(){ ms = Date.now(); render(S.step); }, 1000); }
    render(S.step);
  }
  $('bLive').onclick = function(){ setLive(!live); };
  $('vn').onchange = function(e){ vn = e.target.checked; render(S.step); };
  function useMs(){
    var s = $('ms').value.trim();
    if (!/^\d{1,16}$/.test(s) || Number(s) > 9007199254740991){ $('err').textContent = 'Hãy nhập số mili giây là số nguyên không âm (tối đa 16 chữ số).'; $('ms').classList.add('bad'); return; }
    $('err').textContent = ''; $('ms').classList.remove('bad'); ms = Number(s); setLive(false);
  }
  $('ms').addEventListener('keydown', function(e){ if (e.key === 'Enter') useMs(); });
  $('ms').addEventListener('change', useMs);
  var m0 = qparam('ms'); if (m0 && /^\d{1,16}$/.test(m0)){ ms = Number(m0); live = false; }
  setLive(live);
  var b0 = parseInt(qparam('buoc'), 10); if (b0 > 0) S.go(b0); else S.go(0);
})();
</script>
