<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Lần vết ComputeArea</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
  --accent:#2563eb; --accent-soft:#e7eefc;
  --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
  --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
  --con-bg:#111827; --con-text:#e5e7eb;
  --kw:#7c3aed; --str:#047857; --num:#c2410c; --cm:#6b7280;
  --warn:#b45309; --warn-soft:#fdf0d5;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
    --accent:#6ea0ff; --accent-soft:#1e2a44;
    --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
    --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
    --con-bg:#05070b; --con-text:#e5e7eb;
    --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74; --cm:#8b93a1;
    --warn:#fbbf24; --warn-soft:#3a2a0c;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:10px 12px 12px}
.hint{color:var(--muted);margin:0 0 8px;font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:5px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btns{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.field{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.field label{font-weight:600;font-size:13.5px}
input.txt{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input.txt.bad{border-color:var(--false);background:var(--false-soft)}
.chip{border:1px dashed var(--muted);background:transparent;color:var(--text);padding:3px 9px;border-radius:999px;cursor:pointer;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.chip:hover,.chip.on{border-color:var(--accent);color:var(--accent);border-style:solid}
.err{color:var(--false);font-size:13px;min-height:0}
.err:empty{display:none}
.status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:7px 12px;margin-bottom:8px;min-height:58px;font-size:14px}
.status b{display:block;font-size:12.5px;color:var(--accent)}
.status .note{display:block;margin-top:3px;font-size:13px;color:var(--muted)}
.status.ok{border-left-color:var(--true)}
.status.bad{border-left-color:var(--false)}
.panel-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.code{background:var(--code-bg);border-radius:8px;padding:6px 0;overflow-x:auto;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ln{display:flex;white-space:pre;padding:0 10px 0 0;border-left:3px solid transparent}
.ln .no{width:30px;flex:none;text-align:right;padding-right:10px;color:var(--muted);opacity:.7;user-select:none}
.ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
.ln.dim{opacity:.55}
.kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--cm);font-style:italic}
.console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:7px 10px;min-height:44px;white-space:pre-wrap;font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:auto}
.console .ph{color:#7b8494;font-family:system-ui,sans-serif;font-size:13px}
.console .e{color:#fca5a5}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ok-t{color:var(--true);font-weight:700}.bad-t{color:var(--false);font-weight:700}
@keyframes flash{0%{background:var(--cur);box-shadow:0 0 0 3px var(--cur-bar)}100%{}}
.flash{animation:flash 1.1s ease-out}
.status{overflow-wrap:anywhere}
@media (max-width:560px){
  .btns{margin-left:0}
  .btn{padding:6px 10px}
}

.grid{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:10px}
.grid>*{min-width:0}
.side{display:flex;flex-direction:column;gap:10px;min-width:0}
@media (max-width:620px){.grid{grid-template-columns:1fr}}
.vars{display:flex;gap:8px;flex-wrap:wrap}
.var{background:var(--code-bg);border:2px solid transparent;border-radius:8px;padding:3px 8px;min-width:66px;flex:1;text-align:center}
.var small{display:block;color:var(--muted);font:12px ui-monospace,Menlo,Consolas,monospace}
.var strong{display:block;font:700 19px/1.4 ui-monospace,Menlo,Consolas,monospace}
.var .old{display:block;font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);text-decoration:line-through;min-height:16px}
.var.na strong{color:var(--muted)}
.var.chg{border-color:var(--cur-bar)}
.var.ask{border-color:var(--accent);border-style:dashed}
.var input{width:56px;text-align:center;font:700 16px ui-monospace,Menlo,Consolas,monospace;padding:2px 4px;border:1px solid var(--accent);border-radius:6px;background:var(--card);color:var(--text)}
.gwrap{display:block;font-size:12px;color:var(--accent)}
.novar{color:var(--muted);font-size:13px}
.red{font:13.5px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--code-bg);border-radius:8px;padding:6px 10px;min-height:38px;overflow-x:auto}
.red div{white-space:pre-wrap;overflow-wrap:anywhere}
.grid .code{font-size:12.5px;line-height:1.5}
.red .ar{color:var(--muted)}
.red .fin{font-weight:700;color:var(--true)}
.red .ph{font-family:system-ui,sans-serif;color:var(--muted);font-size:13px}
.inrow{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.inrow input.txt{width:72px}
.tgl{display:flex;align-items:center;gap:5px;font-size:13.5px;cursor:pointer;user-select:none}
.con-in{width:150px;background:#1f2937;color:#e5e7eb;border:1px dashed #6b7280;border-radius:6px;padding:1px 6px;font:inherit}
</style>
</head>

  <p class="hint" id="hint"></p>

    <div class="inrow" id="inputs"></div>

      <div class="card"><p class="panel-title">Màn hình</p><div class="console" id="con"></div></div>
    </div>
  </div>
</div>
<script>
/* JCORE: Java number semantics + expression stepper */
var JC = (function(){
  function jfmt(v){ // v: {v,t}
    if (v.t === 'int') return String(v.v);
    var d = v.v;
    if (isNaN(d)) return 'NaN';
    if (d === Infinity) return 'Infinity';
    if (d === -Infinity) return '-Infinity';
    if (d === 0) return (1/d < 0) ? '-0.0' : '0.0';
    var a = Math.abs(d);
    if (a >= 1e-3 && a < 1e7){ var s = String(d); return s.indexOf('.') < 0 ? s + '.0' : s; }
    var e = d.toExponential(), p = e.split('e'), m = p[0], x = parseInt(p[1], 10);
    if (m.indexOf('.') < 0) m += '.0';
    return m + 'E' + x;
  }
  function I(n){ return {v:n|0, t:'int'}; }
  function D(n){ return {v:n, t:'double'}; }
  // apply binary op with Java semantics; returns {val} or {err}
  function apply(op, a, b){
    if (a.t === 'int' && b.t === 'int'){
      var x = a.v, y = b.v, r, info = '';
      switch(op){
        case '+': r = (x + y) | 0; if (r !== x + y) info = 'overflow'; break;
        case '-': r = (x - y) | 0; if (r !== x - y) info = 'overflow'; break;
        case '*': r = Math.imul(x, y); if (r !== x * y) info = 'overflow'; break;
        case '/': if (y === 0) return {err:'ArithmeticException: / by zero'}; r = (x / y) | 0; if (x % y !== 0) info = 'intdiv'; if (x === -2147483648 && y === -1) r = x; break;
        case '%': if (y === 0) return {err:'ArithmeticException: / by zero'}; r = (x % y) | 0; if (r === 0 && (x % y) !== 0) r = 0; break;
      }
      return {val:I(r), info:info};
    }
    var p = a.v, q = b.v, s;
    switch(op){ case '+': s = p + q; break; case '-': s = p - q; break; case '*': s = p * q; break; case '/': s = p / q; break; case '%': s = p % q; break; }
    return {val:D(s), info:(a.t !== b.t ? 'promote' : '')};
  }
  // literal parse: returns {v,t} or null
  function lit(s){
    s = s.trim();
    if (/^-?\d+$/.test(s)){ var n = Number(s); if (n > 2147483647 || n < -2147483648) return null; return I(n); }
    if (/^-?(\d+\.\d*|\.\d+)$/.test(s)) return D(Number(s));
    return null;
  }
  // tokenize: tokens {k:'n',val,src} | {k:'op',o} | {k:'(' } | {k:')'}
  function tokenize(src){
    var toks = [], i = 0, prev = null;
    while (i < src.length){
      var c = src[i];
      if (c === ' ' || c === '\t'){ i++; continue; }
      var unary = (c === '-') && (prev === null || prev.k === 'op' || prev.k === '(') && /[\d.]/.test(src[i+1] || '');
      if (/[\d.]/.test(c) || unary){
        var j = i + (unary ? 1 : 0);
        while (j < src.length && /[\d.]/.test(src[j])) j++;
        var t = src.slice(i, j), v = lit(t);
        if (!v) return {err: /^-?\d+$/.test(t) ? 'Số nguyên ' + t + ' vượt quá giới hạn của int.' : 'Không hiểu số "' + t + '".'};
        prev = {k:'n', val:v, src:t}; toks.push(prev); i = j; continue;
      }
      if ('+-*/%'.indexOf(c) >= 0){ prev = {k:'op', o:c}; toks.push(prev); i++; continue; }
      if (c === '(' || c === ')'){ prev = {k:c}; toks.push(prev); i++; continue; }
      return {err:'Ký tự "' + c + '" không được dùng. Chỉ dùng số, + - * / % và ( ).'};
    }
    // validate grammar
    var depth = 0, expectN = true;
    for (var k = 0; k < toks.length; k++){
      var tk = toks[k];
      if (expectN){
        if (tk.k === 'n') expectN = false;
        else if (tk.k === '(') depth++;
        else return {err:'Biểu thức chưa đúng: thiếu số trước "' + (tk.o || tk.k) + '".'};
      } else {
        if (tk.k === 'op') expectN = true;
        else if (tk.k === ')'){ depth--; if (depth < 0) return {err:'Thừa dấu ")".'}; }
        else return {err:'Biểu thức chưa đúng: thiếu phép tính giữa hai số.'};
      }
    }
    if (!toks.length) return {err:'Hãy nhập một biểu thức.'};
    if (expectN) return {err:'Biểu thức chưa đúng: kết thúc bằng phép tính.'};
    if (depth > 0) return {err:'Thiếu dấu ")".'};
    return {toks:toks};
  }
  function tokStr(t){ return t.k === 'n' ? (t.src !== undefined ? t.src : jfmt(t.val)) : (t.k === 'op' ? t.o : t.k); }
  function render(toks){ // returns array of strings w/ spacing
    var out = [];
    for (var i = 0; i < toks.length; i++){
      var t = toks[i], s = tokStr(t);
      out.push(s);
    }
    return out;
  }
  function joinToks(toks, from, to){ // display string with spacing
    var s = '';
    for (var i = from; i < to; i++){
      var t = toks[i];
      if (i > from){
        var p = toks[i-1];
        if (!(p.k === '(' || t.k === ')')) s += ' ';
      }
      s += tokStr(t);
    }
    return s;
  }
  // Steps: [{toks (before), at:[i,j] range of the 3 tokens (plus parens removed), res, rule, info}]
  function steps(toks){
    toks = toks.slice();
    var list = [];
    var guard = 0;
    while (toks.length > 1 && guard++ < 500){
      // drop paren around single number
      // find leftmost innermost group
      var lo = 0, hi = toks.length, inParen = false;
      for (var i = 0; i < toks.length; i++){
        if (toks[i].k === ')'){ hi = i; for (var j = i - 1; j >= 0; j--) if (toks[j].k === '('){ lo = j + 1; break; } inParen = true; break; }
      }
      if (inParen && hi - lo === 1){ // (n) -> n
        toks.splice(hi, 1); toks.splice(lo - 1, 1); continue;
      }
      var opi = -1, hasAdd = false, k;
      for (k = lo; k < hi; k++) if (toks[k].k === 'op' && '*/%'.indexOf(toks[k].o) >= 0){ opi = k; break; }
      for (k = lo; k < hi; k++) if (toks[k].k === 'op' && '+-'.indexOf(toks[k].o) >= 0) hasAdd = true;
      var mulFirst = opi >= 0;
      if (opi < 0) for (k = lo; k < hi; k++) if (toks[k].k === 'op'){ opi = k; break; }
      var op = toks[opi].o, a = toks[opi-1], b = toks[opi+1];
      var sameLater = false, sameBefore = false;
      var grp = function(o){ return '*/%'.indexOf(o) >= 0 ? 1 : 0; };
      for (k = opi + 2; k < hi; k++) if (toks[k].k === 'op' && grp(toks[k].o) === grp(op)) sameLater = true;
      var r = apply(op, a.val, b.val);
      var rule;
      if (inParen) rule = 'Trong ngoặc tính trước.';
      else if (mulFirst && hasAdd) rule = 'Nhân, chia, chia dư tính trước cộng trừ.';
      else if (sameLater) rule = 'Cùng mức ưu tiên: tính từ trái sang phải.';
      else rule = 'Phép tính cuối cùng.';
      if (inParen && mulFirst && hasAdd) rule = 'Trong ngoặc tính trước; trong ngoặc, nhân chia tính trước cộng trừ.';
      else if (inParen && sameLater) rule = 'Trong ngoặc tính trước; cùng mức thì từ trái sang phải.';
      var st = {toks:toks.slice(), at:[opi-1, opi+1], a:a.val, b:b.val, op:op, rule:rule, info:r.info || ''};
      if (r.err){ st.err = r.err; list.push(st); return list; }
      st.res = r.val;
      list.push(st);
      var nt = {k:'n', val:r.val};
      toks.splice(opi - 1, 3, nt);
      // unwrap parens if now single
      var idx = opi - 1;
      if (idx > 0 && toks[idx-1].k === '(' && toks[idx+1] && toks[idx+1].k === ')'){ toks.splice(idx+1, 1); toks.splice(idx-1, 1); st.unwrap = true; }
      st.after = toks.slice();
    }
    return list;
  }
  return {jfmt:jfmt, apply:apply, lit:lit, tokenize:tokenize, steps:steps, joinToks:joinToks, tokStr:tokStr, I:I, D:D};
})();

/* UI helpers */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hlJava(src){
  var re = /("(?:[^"\\]|\\.)*")|(\/\/.*$)|\b(public|class|static|void|int|double|long|final|new|import|return|if|else|while|for)\b|(\b\d+(?:\.\d+)?\b)/g, out = '', last = 0, m;
  while ((m = re.exec(src))){
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="cm">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="kw">' + m[3] + '</span>';
    else out += '<span class="num">' + m[4] + '</span>';
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function codeHtml(lines, cur, startNo){
  startNo = startNo || 1; cur = cur || [];
  return lines.map(function(l, i){
    return '<div class="ln' + (cur.indexOf(i) >= 0 ? ' cur' : '') + '"><span class="no">' + (i + startNo) + '</span><span>' + hlJava(l) + '</span></div>';
  }).join('');
}
function qparam(name){
  try { var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; } catch(e){ return null; }
}
/* Stepper: opts {count():n, render(step), onBlockNext?():bool} */
function Stepper(opts){
  var self = {step:0};
  self.go = function(s){ var n = opts.count(); self.step = Math.max(0, Math.min(n, s)); opts.render(self.step); upd(); };
  self.next = function(){ if (opts.beforeNext && opts.beforeNext(self.step) === false) return; self.go(self.step + 1); };
  self.prev = function(){ self.go(self.step - 1); };
  self.all = function(){ self.go(opts.count()); };
  self.reset = function(){ self.go(0); };
  function upd(){
    var n = opts.count();
    $('bNext').disabled = self.step >= n; $('bAll').disabled = self.step >= n;
    $('bPrev').disabled = self.step <= 0; $('bReset').disabled = self.step <= 0;
  }
  $('bNext').onclick = function(){ self.next(); }; $('bPrev').onclick = function(){ self.prev(); }; $('bAll').onclick = function(){ self.all(); }; $('bReset').onclick = function(){ self.reset(); };
  self.upd = upd;
  document.addEventListener('keydown', function(e){
    var t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return;
    if (e.key === 'ArrowRight'){ e.preventDefault(); self.next(); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); self.prev(); }
  });
  return self;
}

(function(){
  var EX = {
    area: {
      file:'ComputeArea.java',
      hint:'Bấm <b>Bước tiếp</b> (hoặc phím →) để chạy từng câu lệnh. Có thể đổi bán kính rồi chạy lại.',
      inputs:[{id:'radius', label:'radius =', def:'20', check:function(s){ var v = JC.lit(s); if (!v || !/^\d+(\.\d{1,4})?$/.test(s.trim())) return 'Nhập bán kính là số không âm, tối đa 4 chữ số thập phân.'; if (v.v > 10000) return 'Hãy chọn bán kính không quá 10000.'; return null; }}],
      lines:function(I){ return [
        'public class ComputeArea {',
        '  public static void main(String[] args) {',
        '    double radius; // Khai bao radius',
        '    double area;   // Khai bao area',
        '',
        '    // Gan gia tri cho ban kinh',
        '    radius = ' + I.radius + ';',
        '',
        '    // Tinh dien tich',
        '    area = radius * radius * 3.14159;',
        '',
        '    // Hien thi ket qua',
        '    System.out.println(',
        '        "The area for the circle of radius "',
        '        + radius + " is " + area);',
        '  }',
        '}']; },
      run:function(T, I){
        var lit = JC.lit(I.radius), r = JC.D(lit.v), pi = JC.D(3.14159);
        T.snap([2], 'Khai báo biến radius kiểu double. Biến đã có tên và kiểu nhưng chưa có giá trị (dấu ?).', {decl:['radius','double']});
        T.snap([3], 'Khai báo biến area kiểu double, cũng chưa có giá trị.', {decl:['area','double']});
        T.snap([6], 'Gán ' + I.radius + ' cho radius.' + (lit.t === 'int' ? ' Vì radius có kiểu double nên giá trị được lưu là ' + JC.jfmt(r) + '.' : ''), {set:['radius', r], red:[I.radius]});
        var rr = JC.apply('*', r, r).val, ar = JC.apply('*', rr, pi).val;
        T.snap([9], 'Lấy giá trị hiện tại của radius thay vào biểu thức, tính từ trái sang phải, rồi gán kết quả cho area.', {set:['area', ar], red:['radius * radius * 3.14159', JC.jfmt(r) + ' * ' + JC.jfmt(r) + ' * 3.14159', JC.jfmt(rr) + ' * 3.14159', JC.jfmt(ar)]});
        var s1 = 'The area for the circle of radius ' + JC.jfmt(r), s2 = s1 + ' is ', s3 = s2 + JC.jfmt(ar);
        T.snap([12,13,14], 'Một bên là chuỗi nên dấu + nối chuỗi: giá trị của radius và area được đổi thành chữ rồi ghép lại, sau đó println in ra một dòng.', {out:s3, red:['radius là ' + JC.jfmt(r), 'area là ' + JC.jfmt(ar)], redPlain:true, redTitle:'Giá trị được ghép vào chuỗi'});
      }
    },
    assign: {
      file:'TraceAssign.java',
      hint:'Bấm <b>Bước tiếp</b> (hoặc phím →) để chạy từng câu lệnh. Khi bật <b>Tự đoán</b>, hãy gõ dự đoán trước khi xem.',
      guess:true,
      inputs:[
        {id:'a', label:'a =', def:'3', check:function(s){ return /^-?\d{1,2}$/.test(s.trim()) ? null : 'Giá trị đầu của a, b là số nguyên từ -99 đến 99.'; }},
        {id:'b', label:'b =', def:'5', check:function(s){ return /^-?\d{1,2}$/.test(s.trim()) ? null : 'Giá trị đầu của a, b là số nguyên từ -99 đến 99.'; }}],
      lines:function(I){ return [
        'public class TraceAssign {',
        '  public static void main(String[] args) {',
        '    int a = ' + I.a + ';',
        '    int b = ' + I.b + ';',
        '    int temp;',
        '',
        '    temp = a;',
        '    a = b;',
        '    b = temp;',
        '    a = a + b;',
        '    b = a - 1;',
        '',
        '    System.out.println(a + " " + b',
        '        + " " + temp);',
        '  }',
        '}']; },
      run:function(T, I){
        var a = JC.I(parseInt(I.a, 10)), b = JC.I(parseInt(I.b, 10)), temp, one = JC.I(1);
        T.snap([2], 'Khai báo biến a kiểu int và gán ngay giá trị ' + I.a + '.', {decl:['a','int'], set:['a', a]});
        T.snap([3], 'Khai báo biến b kiểu int với giá trị ' + I.b + '.', {decl:['b','int'], set:['b', b]});
        T.snap([4], 'Khai báo temp kiểu int nhưng chưa gán, nên temp chưa có giá trị.', {decl:['temp','int']});
        temp = a;
        T.snap([6], 'Sao chép giá trị của a vào temp. a vẫn giữ nguyên giá trị.', {set:['temp', temp], red:['a', JC.jfmt(a)], ask:true});
        a = b;
        T.snap([7], 'Gán giá trị của b cho a. Giá trị cũ của a bị ghi đè (nhưng đã kịp cất vào temp).', {set:['a', a], red:['b', JC.jfmt(b)], ask:true});
        b = temp;
        T.snap([8], 'Gán giá trị của temp cho b. Đến đây a và b đã đổi chỗ cho nhau.', {set:['b', b], red:['temp', JC.jfmt(temp)], ask:true});
        var a0 = a; a = JC.apply('+', a, b).val;
        T.snap([9], 'Vế phải dùng giá trị CŨ của a, tính xong mới gán lại vào a.', {set:['a', a], red:['a + b', JC.jfmt(a0) + ' + ' + JC.jfmt(b), JC.jfmt(a)], ask:true});
        b = JC.apply('-', a, one).val;
        T.snap([10], 'Lấy giá trị mới của a trừ 1 rồi gán cho b.', {set:['b', b], red:['a - 1', JC.jfmt(a) + ' - 1', JC.jfmt(b)], ask:true});
        var o = JC.jfmt(a) + ' ' + JC.jfmt(b) + ' ' + JC.jfmt(temp);
        T.snap([12,13], 'Nối giá trị của a, b, temp với các dấu cách rồi in ra.', {out:o, red:['a là ' + JC.jfmt(a) + ', b là ' + JC.jfmt(b) + ', temp là ' + JC.jfmt(temp)], redPlain:true, redTitle:'Giá trị được ghép vào chuỗi', askOut:true});
      }
    }
  };
  var interacted = false; ['pointerdown','keydown'].forEach(function(t){ document.addEventListener(t, function(){ interacted = true; }, true); });
  var ex = EX['area'], I = {}, snaps = [], guessOn = !!ex.guess, verdict = null;
  $('hint').innerHTML = ex.hint; $('fname').textContent = ex.file;
  // inputs
  var box = $('inputs');
  ex.inputs.forEach(function(inp){
    I[inp.id] = inp.def;
    var l = document.createElement('label'); l.className = 'mono'; l.textContent = inp.label; l.htmlFor = 'in_' + inp.id;
    var f = document.createElement('input'); f.className = 'txt'; f.id = 'in_' + inp.id; f.value = inp.def; f.maxLength = 9; f.autocomplete = 'off';
    f.addEventListener('keydown', function(e){ if (e.key === 'Enter') apply(); });
    box.appendChild(l); box.appendChild(f);
  });
  var ab = document.createElement('button'); ab.className = 'btn ghost'; ab.textContent = 'Đổi'; ab.onclick = apply; box.appendChild(ab);
  if (ex.guess){
    var tg = document.createElement('label'); tg.className = 'tgl'; tg.innerHTML = '<input type="checkbox" id="guess"' + (guessOn ? ' checked' : '') + '> Tự đoán';
    box.appendChild(tg);
    tg.querySelector('input').onchange = function(e){ guessOn = e.target.checked; verdict = null; S.go(S.step); };
  }
  function apply(){
    var msg = null, nI = {};
    ex.inputs.forEach(function(inp){ var f = $('in_' + inp.id), v = f.value.trim(), m = inp.check(v); f.classList.toggle('bad', !!m); if (m && !msg) msg = m; nI[inp.id] = v; });
    $('err').textContent = msg || '';
    if (msg) return;
    I = nI; build(); verdict = null; S.go(0);
  }
  function build(){
    snaps = [];
    var state = [], out = [];
    var T = {snap:function(ln, msg, o){
      state = state.map(function(v){ return {n:v.n, t:v.t, v:v.v}; });
      var chg = null, old;
      if (o.decl) state.push({n:o.decl[0], t:o.decl[1], v:null});
      if (o.set){ state.forEach(function(v){ if (v.n === o.set[0]){ old = v.v; v.v = JC.jfmt(o.set[1]); chg = v.n; if (o.decl) old = undefined; } }); }
      else if (o.decl) chg = o.decl[0];
      state.forEach(function(v){ if (v.n === chg){ v.chg = true; v.old = old; } });
      if (o.out !== undefined) out = out.concat([o.out]);
      snaps.push({ln:ln, msg:msg, vars:state, chg:chg, red:o.red, redTitle:o.redTitle, redPlain:o.redPlain, out:out.slice(), ask:o.ask, askOut:o.askOut, val:o.set ? JC.jfmt(o.set[1]) : null, outLine:o.out});
    }};
    ex.run(T, I);
  }
  function render(k){
    var sn = k > 0 ? snaps[k-1] : null, nx = snaps[k];
    var askNext = guessOn && nx && (nx.ask || nx.askOut);
    $('code').innerHTML = codeHtml(ex.lines(I), sn ? sn.ln : []);
    var vars = sn ? sn.vars : [];
    $('vars').innerHTML = vars.length ? vars.map(function(v){
      var ask = askNext && nx.ask && nx.chg === v.n;
      return '<div class="var' + (v.v === null ? ' na' : '') + (v.chg ? ' chg flash' : '') + (ask ? ' ask' : '') + '"><small>' + esc(v.t + ' ' + v.n) + '</small>' +
        '<strong>' + esc(v.v === null ? '?' : v.v) + '</strong>' +
        (ask ? '<span class="gwrap">→ <input id="gin" aria-label="Dự đoán giá trị mới của ' + v.n + '" placeholder="?" autocomplete="off"></span>' : '<span class="old">' + (v.chg && v.old != null ? esc(v.old) : '') + '</span>') + '</div>';
    }).join('') : '<span class="novar">Chưa có biến nào. Biến chỉ xuất hiện khi câu lệnh khai báo chạy.</span>';
    if (askNext && nx.ask && !vars.some(function(v){ return v.n === nx.chg; })) {}
    var r = sn && sn.red;
    $('redt').textContent = (sn && sn.redTitle) || 'Tính giá trị bên phải dấu =';
    $('red').innerHTML = r ? r.map(function(x, i){ return '<div>' + (i && !sn.redPlain ? '<span class="ar">→ </span>' : '') + '<span' + (i === r.length - 1 && r.length > 1 && !sn.redPlain ? ' class="fin"' : '') + '>' + esc(x) + '</span></div>'; }).join('') : '<span class="ph">' + (sn ? 'Câu lệnh này không tính biểu thức nào.' : 'Chưa chạy.') + '</span>';
    var outs = sn ? sn.out : [];
    var ch = outs.length ? outs.map(esc).join('\n') : '';
    if (askNext && nx.askOut) ch += (ch ? '\n' : '') + '<input class="con-in" id="gin" aria-label="Dự đoán dòng sẽ in ra" placeholder="đoán dòng in ra" autocomplete="off">';
    $('con').innerHTML = ch || '<span class="ph">Chưa in gì.</span>';
    var st = $('status'), cls = '';
    var html;
    if (!sn) html = '<b>Sẵn sàng</b>Bấm <b style="display:inline;color:inherit">Bước tiếp</b> để chạy câu lệnh đầu tiên trong main.';
    else html = '<b>Bước ' + k + ' / ' + snaps.length + ' · dòng ' + sn.ln.map(function(x){ return x + 1; }).join(', ') + '</b>' + esc(sn.msg);
    if (verdict && sn){ html += '<span class="note">' + verdict.html + '</span>'; cls = verdict.ok ? 'ok' : 'bad'; }
    if (askNext) html += '<span class="note">Đoán trước: ' + (nx.ask ? 'sau câu lệnh ở dòng ' + nx.ln.map(function(x){ return x + 1; }).join(', ') + ', <span class="mono">' + esc(nx.chg) + '</span> bằng bao nhiêu?' : 'dòng nào sẽ được in ra?') + ' Gõ vào ô viền xanh rồi bấm Bước tiếp (để trống nếu muốn xem luôn).</span>';
    else if (sn && k === snaps.length) { html += '<span class="note">Chương trình đã chạy xong.</span>'; }
    st.className = 'status' + (cls ? ' ' + cls : ''); st.innerHTML = html;
    var g = $('gin'); if (g){ g.addEventListener('keydown', function(e){ if (e.key === 'Enter'){ e.preventDefault(); S.next(); } }); if (interacted) try { g.focus({preventScroll:true}); } catch(e){} }
  }
  var S = Stepper({count:function(){ return snaps.length; }, render:render});
  S.go = (function(go){ return function(s){ go(s); verdict = null; }; })(S.go);
  S.next = function(){
    var k = S.step; if (k >= snaps.length) return;
    var g = $('gin'), nx = snaps[k], v = null;
    if (g && nx && g.value.trim() !== ''){
      var want = nx.ask ? nx.val : nx.outLine, got = g.value.trim(), gl = JC.lit(got);
      var ok = nx.ask ? (got === want || (!!gl && gl.v === Number(want))) : got.replace(/\s+/g, ' ') === want;
      v = {ok:ok, html: ok ? '<span class="ok-t">Đoán đúng!</span>' : '<span class="bad-t">Chưa đúng.</span> Bạn đoán <span class="mono">' + esc(got) + '</span>, kết quả đúng là <span class="mono">' + esc(want) + '</span>.'};
    }
    verdict = v; S.go(k + 1);
  };
  build(); S.go(0);
  var b0 = parseInt(qparam('buoc'), 10); if (b0 > 0) S.go(b0);
})();
</script>
