/* UI helpers */
function $(id){ return document.getElementById(id); }

  }
  function parse(s, t){
    s = s.trim();
    if (t === 'int'){
      if (/^-?\d+\.\d*$/.test(s)) return {err:'Số ' + s + ' có phần thập phân nên không thể là int. Hãy chọn double.'};
      if (!/^-?\d{1,7}$/.test(s)) return {err:'Hãy nhập số nguyên (tối đa 7 chữ số).'};
      return {v:JC.I(parseInt(s, 10))};
    }
    if (!/^-?\d{1,7}(\.\d{1,6})?$/.test(s)) return {err:'Hãy nhập số, ví dụ 7 hoặc 7.5 (dùng dấu chấm, tối đa 6 chữ số thập phân).'};
    return {v:JC.D(Number(s))};
  }
  function nl(exact, jv){ // number line svg
    var t = jv, lo = Math.min(Math.floor(exact), t) - 1, hi = Math.max(Math.ceil(exact), t) + 1;
    if (hi - lo < 4) hi = lo + 4;
    var W = 340, pad = 22, X = function(v){ return pad + (v - lo) / (hi - lo) * (W - 2 * pad); };
    var s = '<svg viewBox="0 0 ' + W + ' 92" role="img" aria-label="Trục số: giá trị đúng ' + approx(exact) + ', Java cho ' + jv + '">';
    s += '<line class="ax" x1="8" y1="50" x2="' + (W - 8) + '" y2="50"/>';
    for (var v = lo; v <= hi; v++){ s += '<line class="tk" x1="' + X(v) + '" y1="44" x2="' + X(v) + '" y2="56"/><text class="tl" x="' + X(v) + '" y="72">' + v + '</text>'; }
    s += '<circle class="ex" cx="' + X(exact) + '" cy="50" r="5"/><text class="exl" x="' + X(exact) + '" y="20">toán: ' + approx(exact) + '</text>';
    if (exact !== jv){
      var y = 34, x1 = X(exact), x2 = X(jv), dir = x2 < x1 ? 1 : -1;
      s += '<path class="arr" d="M' + x1 + ' 44 Q' + ((x1 + x2) / 2) + ' 26 ' + (x2 + dir * 4) + ' 42"/>';
    }
    s += '<path class="jv" d="M' + X(jv) + ' 56 l-7 12 h14 z" transform="translate(0,-2)"/><text class="jvl" x="' + X(jv) + '" y="88">Java: ' + jv + '</text>';
    return s + '</svg><div class="cap">Phần thập phân bị cắt bỏ: kết quả dịch về phía số 0, không làm tròn.</div>';
  }
  function dots(a, b, q, r){
    var A = Math.abs(a), B = Math.abs(b), Q = Math.abs(q), R = Math.abs(r), h = '<div class="dots">';
    for (var g = 0; g < Q; g++){ h += '<div class="grp">'; for (var i = 0; i < B; i++) h += '<span class="dot"></span>'; h += '</div>'; }
    if (R){ h += '<div class="rest">'; for (var j = 0; j < R; j++) h += '<span class="dot r"></span>'; h += '</div>'; }
    h += '</div><div class="cap">' + A + ' chấm chia thành ' + Q + ' nhóm, mỗi nhóm ' + B + ' chấm; còn dư ' + R + ' chấm (viền vàng).' + (a < 0 ? ' Vì số bị chia âm nên số dư mang dấu âm.' : '') + '</div>';
    return h;
  }
  function upd(){
    var pa = parse(st.a, st.ta), pb = parse(st.b, st.tb);
    $('a').classList.toggle('bad', !!pa.err); $('b').classList.toggle('bad', !!pb.err);
    $('err').textContent = pa.err || pb.err || '';
    [].forEach.call($('chips').querySelectorAll('.chip'), function(c, i){ var e = EXS[i]; c.classList.toggle('on', e[0] === st.a && e[1] === st.ta && e[2] === st.op && e[3] === st.b && e[4] === st.tb); });
    if (pa.err || pb.err){ $('code').innerHTML = ''; $('con').innerHTML = '<span class="ph">Sửa ô nhập để xem kết quả.</span>'; $('vis').innerHTML = ''; $('kind').innerHTML = ''; $('expl').innerHTML = ''; return; }
    var A = pa.v, B = pb.v, sa = show(st.a, st.ta), sb = show(st.b, st.tb), r = JC.apply(st.op, A, B);
    var line = 'System.out.println(' + sa + ' ' + st.op + ' ' + sb + ');';
    $('code').innerHTML = codeHtml([line], [0]);
    var both = A.t === 'int' && B.t === 'int', k = '', ex = '', vis = '';
    if (r.err){
      $('con').innerHTML = '<span class="e">Exception in thread "main"\njava.lang.' + esc(r.err) + '</span>';
      k = '<span class="kind e">Lỗi khi chạy</span>';
      ex = '<p>Hai số nguyên thì không được chia (hay chia lấy dư) cho 0. Chương trình dừng ngay với lỗi <span class="mono">ArithmeticException</span>.</p><p>Thử đổi số chia sang <span class="mono">double</span> để thấy kết quả khác.</p>';
    } else {
      var out = JC.jfmt(r.val);
      $('con').innerHTML = '<span class="bigout">' + esc(out) + '</span>';
      if (st.op === '/'){
        if (both){
          var exact = A.v / B.v;
          k = '<span class="kind i">Chia nguyên: int / int</span>';
          ex = '<p>Cả <span class="mono">' + sa + '</span> và <span class="mono">' + sb + '</span> đều là <span class="mono">int</span> nên Java chia nguyên.</p>' +
            '<p>Trong toán: ' + num(A.v) + ' : ' + num(B.v) + ' = ' + approx(exact) + '.</p>' +
            (exact === r.val.v ? '<p>Chia hết nên không mất gì: kết quả là <b class="mono">' + out + '</b>.</p>' : '<p>Java <b>cắt bỏ</b> phần thập phân (không làm tròn) nên kết quả là <b class="mono">' + out + '</b>.</p>');
          if (exact !== r.val.v) vis = nl(exact, r.val.v);
        } else {
          k = '<span class="kind d">Chia thực: có double</span>';
          ex = '<p>Có ít nhất một số là <span class="mono">double</span> nên Java chia như thường, giữ phần thập phân.</p>' +
            (A.t !== B.t ? '<p>Số <span class="mono">int</span> ' + (A.t === 'int' ? sa : sb) + ' được tự đổi thành ' + JC.jfmt(JC.D((A.t === 'int' ? A : B).v)) + ' trước khi chia.</p>' : '') +
            '<p>Kết quả: <b class="mono">' + out + '</b>' + (r.val.t === 'double' && Math.round(r.val.v) === r.val.v && isFinite(r.val.v) ? ' (vẫn là số thực nên in kèm .0)' : '') + '.</p>' +
            (B.v === 0 ? '<p>Chia số thực cho 0 không gây lỗi mà cho <span class="mono">Infinity</span> hoặc <span class="mono">NaN</span> (không phải số).</p>' : '');
        }
      } else {
        if (both){
          var q = (A.v / B.v) | 0;
          k = '<span class="kind i">Chia lấy dư: int % int</span>';
          ex = '<p><span class="mono">' + sa + ' % ' + sb + '</span> là phần dư khi chia ' + sa + ' cho ' + sb + '.</p>' +
            '<p>' + sa + ' / ' + sb + ' (chia nguyên) được ' + q + ', và ' + sa + ' = ' + q + ' × ' + sb + ' + ' + (r.val.v < 0 ? '(' + out + ')' : out) + '.</p>' +
            '<p>Vậy kết quả là <b class="mono">' + out + '</b>.' + (A.v < 0 && r.val.v !== 0 ? ' Số dư mang dấu của số bị chia.' : '') + '</p>';
          if (Math.abs(A.v) <= 40 && Math.abs(B.v) >= 1 && Math.abs(B.v) <= 12) vis = dots(A.v, B.v, q, r.val.v);
        } else {
          var qd = Math.trunc(A.v / B.v);
          k = '<span class="kind d">Chia lấy dư với số thực</span>';
          ex = '<p><span class="mono">%</span> dùng được cả với số thực: lấy ' + sa + ' trừ đi số lần nguyên của ' + sb + ' nhiều nhất có thể.</p>' +
            (isFinite(qd) && B.v !== 0 ? '<p>' + sa + ' = ' + qd + ' × ' + sb + ' + ' + out + '.</p>' : '<p>Chia lấy dư số thực cho 0 cho <span class="mono">NaN</span>.</p>') +
            '<p>Kết quả: <b class="mono">' + out + '</b>.</p>';
        }
      }
    }
    $('kind').innerHTML = k; $('expl').innerHTML = ex; $('vis').innerHTML = vis;
  }
  $('a').addEventListener('input', function(){ st.a = this.value; upd(); });
  $('b').addEventListener('input', function(){ st.b = this.value; upd(); });
  [['ta','t'],['tb','t'],['op','o']].forEach(function(p){ [].forEach.call($(p[0]).children, function(b){ b.onclick = function(){ st[p[0]] = b.dataset[p[1]]; sync(); upd(); }; }); });
  var q0 = qparam('vd'); if (q0){ var m = /^(-?[\d.]+)(i|d)(chia|du)(-?[\d.]+)(i|d)$/.exec(q0); if (m) st = {a:m[1], ta:m[2] === 'i' ? 'int' : 'double', op:m[3] === 'chia' ? '/' : '%', b:m[4], tb:m[5] === 'i' ? 'int' : 'double'}; }
  sync(); upd();
})();
</script>
