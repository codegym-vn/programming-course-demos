<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="570">
<title>Máy làm tròn số</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c;
    --node:#ffffff; --node-line:#c9ced8; --node-text:#3b4352;
    --p1:#2563eb; --p1s:#dbe7ff; --p2:#9333ea; --p2s:#efdcff; --p3:#c2410c; --p3s:#ffe3d1; --p4:#15803d; --p4s:#dcf3e3;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74;
      --node:#1d222c; --node-line:#3a4250; --node-text:#c8cfdb;
      --p1:#6ea0ff; --p1s:#1f3358; --p2:#c9a0ff; --p2s:#35244f; --p3:#fdba74; --p3s:#4a2c16; --p4:#4ade80; --p4s:#13301f;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:12px 14px 14px}
  .lead{color:var(--muted);margin:0 0 10px;font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .mono,code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 12px;
    border-radius:8px;cursor:pointer;font:inherit}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .field{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .field label{font-weight:600}
  .field input[type=text],.field input[type=number],.field select{padding:5px 9px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--text);font:14.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .field input.bad{border-color:var(--false);background:var(--false-soft)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chips>span{font-size:13px;color:var(--muted)}
  .chip{border:1px dashed var(--node-line);background:transparent;color:var(--text);padding:3px 9px;
    border-radius:999px;cursor:pointer;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-right:1px solid var(--line);background:var(--card);color:var(--text);padding:5px 11px;
    cursor:pointer;font:inherit;font-size:13.5px}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:6px 12px;border-radius:8px;
    cursor:pointer;font:inherit;font-weight:600;font-size:14px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .err{color:var(--false);font-size:13px;min-height:0}
  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
    padding:7px 12px;min-height:52px;font-size:14px}
  .status b{display:block;font-size:12.5px;color:var(--accent)}
  .status.bad{border-left-color:var(--false);background:var(--false-soft)}
  .status.bad b{color:var(--false)}
  .status.ok{border-left-color:var(--true);background:var(--true-soft)}
  .status.ok b{color:var(--true)}
  .panel-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
  .code{background:var(--code-bg);border-radius:8px;padding:6px 0;overflow-x:auto;
    font:13.5px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 10px 0 0;border-left:3px solid transparent}
  .ln .no{width:28px;flex:none;text-align:right;padding-right:10px;color:var(--muted);opacity:.7;user-select:none}
  .ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--muted);font-style:italic}
  .console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:8px 12px;
    font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
  .console .ex{color:#fca5a5}
  .console .ph{color:#7b8494;font-family:system-ui,sans-serif;font-size:13px}
  .vars{display:flex;gap:8px;flex-wrap:wrap}
  .var{background:var(--code-bg);border-radius:8px;padding:4px 12px;min-width:70px;text-align:center}
  .var small{display:block;color:var(--muted);font:12px ui-monospace,Menlo,Consolas,monospace}
  .var strong{font:700 18px ui-monospace,Menlo,Consolas,monospace}
  .var.chg{background:var(--cur);outline:2px solid var(--cur-bar)}
  @media (max-width:560px){.wrap{padding:10px 10px 12px}}

  .row{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
  #xr{flex:1;min-width:180px;accent-color:var(--accent)}
  #xin{width:84px}
  svg{width:100%;height:auto;display:block}
  .axis{stroke:var(--node-text);stroke-width:1.5}
  .tick{stroke:var(--node-line);stroke-width:1}
  .tlab{fill:var(--muted);font:12px ui-monospace,Menlo,Consolas,monospace;text-anchor:middle}
  .xline{stroke:var(--node-text);stroke-dasharray:4 4;stroke-width:1.2}
  .xlab{fill:var(--text);font:700 13px ui-monospace,Menlo,Consolas,monospace;text-anchor:middle}
  .drop{stroke-dasharray:2 3;stroke-width:1.2}
  .alab{font:600 12.5px ui-monospace,Menlo,Consolas,monospace}
  table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}
  th{font:600 12px system-ui,sans-serif;color:var(--muted);text-align:left;padding:3px 8px;border-bottom:1px solid var(--line)}
  td{padding:4px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  td.c{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
  td.r{font:700 15px ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
  .ty{font:12.5px ui-monospace,Menlo,Consolas,monospace;padding:0 6px;border-radius:5px;background:var(--code-bg)}
  .ty.l{background:var(--p4s);color:var(--p4);font-weight:700}
  td.e{color:var(--muted);font-size:13px}
  tr.hl td{background:var(--cur)}
  @media (max-width:560px){td.e{display:none}th.e{display:none}}
</style>
</head>
<body>
<div class="wrap">
  <p class="lead">Kéo thanh trượt (hoặc bấm phím ← →) để đổi <code>x</code>. Xem bốn phương thức làm tròn đưa <code>x</code> tới đâu trên trục số.</p>
  <div class="row">
    <div class="field"><label for="xin">x =</label><input id="xin" type="text" inputmode="decimal" value="2.5"></div>
    <input id="xr" type="range" min="-50" max="50" step="1" value="25" aria-label="Giá trị x">
  </div>
  <div class="row chips"><span>Thử nhanh:</span>
    <button class="chip" data-x="2.1">2.1</button><button class="chip" data-x="-2.1">-2.1</button>
    <button class="chip" data-x="2.5">2.5</button><button class="chip" data-x="-2.5">-2.5</button>
    <button class="chip" data-x="3.5">3.5</button><button class="chip" data-x="-2.6">-2.6</button>
    <button class="chip" data-x="2">2.0</button><button class="chip" data-x="-0.5">-0.5</button>
  </div>
  <div class="err" id="err"></div>
  <div class="card">
    <svg id="svg" viewBox="0 0 700 186" role="img" aria-label="Trục số với bốn mũi tên làm tròn"></svg>
    <table>
      <thead><tr><th>Lời gọi</th><th>Kết quả</th><th>Kiểu</th><th class="e">Vì sao</th></tr></thead>
      <tbody id="tb"></tbody>
    </table>
  </div>
  <div class="status" id="status" style="margin-top:10px" aria-live="polite"></div>
</div>
<script>
/*LOGIC*/
function jd(v){ // in số double như Java (chỉ dùng cho số nguyên hoặc 1 chữ số thập phân)
  if (Object.is(v,-0)) return '-0.0';
  return Number.isInteger(v) ? v.toFixed(1) : String(v);
}
function rint(x){
  var f = Math.floor(x), d = x - f, r;
  if (d < 0.5) r = f; else if (d > 0.5) r = f + 1; else r = (f % 2 === 0) ? f : f + 1;
  if (r === 0 && (x < 0 || Object.is(x,-0))) r = -0;
  return r;
}
function jceil(x){ var r = Math.ceil(x); return r; }   // Math.ceil của JS cũng trả về -0 với -1 < x < 0
function jround(x){ var r = Math.floor(x + 0.5); return r === 0 ? 0 : r; } // long, không có -0
function results(x){
  return {ceil:jceil(x), floor:Math.floor(x), rint:rint(x), round:jround(x)};
}
/*END*/
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var x = 2.5;
  var C = {ceil:'var(--p1)', floor:'var(--p3)', rint:'var(--p2)', round:'var(--p4)'};
  var W = 700;
  function px(v){ return 25 + (v + 5.5) * (W - 50) / 11; }
  function draw(){
    var r = results(x), s = '', i;
    W = $('svg').getBoundingClientRect().width < 480 ? 430 : 700;
    $('svg').setAttribute('viewBox', '0 0 ' + W + ' 186');
    s += '<defs>';
    for (var k in C) s += '<marker id="m'+k+'" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0L10,5L0,10z" style="fill:'+C[k]+'"/></marker>';
    s += '</defs>';
    var AY = 160;
    s += '<line class="axis" x1="12" y1="'+AY+'" x2="'+(W-12)+'" y2="'+AY+'"/>';
    for (i = -5; i <= 5; i++) {
      s += '<line class="tick" x1="'+px(i)+'" y1="'+(AY-5)+'" x2="'+px(i)+'" y2="'+(AY+5)+'"/>';
      s += '<text class="tlab" x="'+px(i)+'" y="'+(AY+20)+'">'+i+'</text>';
    }
    var rows = [['ceil',22],['floor',56],['rint',90],['round',124]];
    s += '<line class="xline" x1="'+px(x)+'" y1="10" x2="'+px(x)+'" y2="'+AY+'"/>';
    rows.forEach(function(rw){
      var k = rw[0], y = rw[1], t = r[k], x1 = px(x), x2 = px(t), col = C[k];
      s += '<line class="drop" x1="'+x2+'" y1="'+y+'" x2="'+x2+'" y2="'+AY+'" style="stroke:'+col+'"/>';
      s += '<circle cx="'+x2+'" cy="'+AY+'" r="4" style="fill:'+col+'"/>';
      if (Math.abs(x2 - x1) > 2) {
        s += '<line x1="'+x1+'" y1="'+y+'" x2="'+(x2 + (x2 > x1 ? -3 : 3))+'" y2="'+y+'" style="stroke:'+col+';stroke-width:3" marker-end="url(#m'+k+')"/>';
      } else {
        s += '<circle cx="'+x1+'" cy="'+y+'" r="5" style="fill:'+col+'"/>';
      }
      var lab = k + ' → ' + (k === 'round' ? String(t) : jd(t));
      var right = (x2 >= x1);
      var tx = right ? Math.max(x1, x2) + 10 : Math.min(x1, x2) - 10;
      var anchor = right ? 'start' : 'end';
      if (tx > W - 100 && right) { tx = Math.min(x1, x2) - 10; anchor = 'end'; }
      if (tx < 100 && !right) { tx = Math.max(x1, x2) + 10; anchor = 'start'; }
      s += '<text class="alab" x="'+tx+'" y="'+(y+4)+'" text-anchor="'+anchor+'" style="fill:'+col+'">'+lab+'</text>';
    });
    s += '<polygon points="'+(px(x)-6)+','+(AY+6)+' '+(px(x)+6)+','+(AY+6)+' '+px(x)+','+(AY-2)+'" style="fill:var(--text)"/>';
    $('svg').innerHTML = s;

    var xs = jd(x), half = Math.abs(x - Math.floor(x) - 0.5) < 1e-9, whole = Number.isInteger(x);
    var sum = Math.round((x + 0.5) * 10) / 10;
    var T = [
      ['ceil', 'Math.ceil('+xs+')', jd(r.ceil), 'double', 'Số nguyên nhỏ nhất không bé hơn x: đi sang phải.'],
      ['floor', 'Math.floor('+xs+')', jd(r.floor), 'double', 'Số nguyên lớn nhất không vượt quá x: đi sang trái.'],
      ['rint', 'Math.rint('+xs+')', jd(r.rint), 'double', half ? 'Chính giữa hai số nguyên nên chọn số chẵn.' : 'Số nguyên gần x nhất.'],
      ['round', 'Math.round('+xs+')', String(r.round), 'long', 'floor('+xs+' + 0.5) = floor('+jd(sum)+') = '+r.round]
    ];
    $('tb').innerHTML = T.map(function(t){
      var hl = half && (t[0] === 'rint' || t[0] === 'round');
      return '<tr'+(hl?' class="hl"':'')+'><td class="c"><span class="dot" style="background:'+C[t[0]]+'"></span>'+t[1]+'</td><td class="r">'+t[2]+'</td><td><span class="ty'+(t[3]==='long'?' l':'')+'">'+t[3]+'</span></td><td class="e">'+t[4]+'</td></tr>';
    }).join('');

    var st = $('status'), msg;
    if (whole) msg = '<b>x đã là số nguyên</b>Cả bốn phương thức giữ nguyên giá trị. Ba phương thức đầu vẫn trả về <code>double</code> ('+jd(r.ceil)+'), còn <code>round</code> trả về số nguyên ('+r.round+').';
    else if (half) msg = '<b>x nằm chính giữa '+Math.floor(x)+' và '+(Math.floor(x)+1)+'</b><code>rint</code> chọn số chẵn ('+jd(r.rint)+'), còn <code>round</code> tính <code>floor(x + 0.5)</code> nên nghiêng về phía lớn hơn ('+r.round+').'+(r.rint !== r.round ? ' Hai kết quả khác nhau!' : ' Lần này hai kết quả trùng nhau.');
    else if (x < 0) msg = '<b>x là số âm</b>Phía lớn hơn là phía gần 0: <code>ceil('+xs+')</code> là '+jd(r.ceil)+', còn <code>floor('+xs+')</code> là '+jd(r.floor)+'.';
    else msg = '<b>x là số dương</b><code>ceil</code> lên '+jd(r.ceil)+', <code>floor</code> xuống '+jd(r.floor)+'; <code>rint</code> và <code>round</code> chọn số gần nhất.';
    if (Object.is(r.ceil,-0) || Object.is(r.rint,-0)) msg += ' Kết quả <code>-0.0</code> là số 0 mang dấu âm, vẫn bằng 0.';
    st.innerHTML = msg;
  }
  function setX(v, from){
    v = Math.round(v * 10) / 10;
    if (v === 0) v = 0;
    x = v;
    if (from !== 'in') $('xin').value = jd(v).replace('-0.0','0.0');
    $('xr').value = Math.round(v * 10);
    $('err').textContent = '';
    $('xin').classList.remove('bad');
    draw();
  }
  $('xr').addEventListener('input', function(){ setX(this.value / 10); });
  $('xin').addEventListener('input', function(){
    var v = parseFloat(this.value);
    if (this.value.trim() === '' || isNaN(v) || v < -5 || v > 5 || Math.abs(v * 10 - Math.round(v * 10)) > 1e-9) {
      this.classList.add('bad'); $('err').textContent = 'Nhập số từ -5 đến 5, tối đa một chữ số thập phân.'; return;
    }
    setX(v, 'in');
  });
  document.querySelectorAll('.chip').forEach(function(b){ b.addEventListener('click', function(){ setX(parseFloat(b.dataset.x)); }); });
  document.addEventListener('keydown', function(e){
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' && x < 5) { setX(x + 0.1); e.preventDefault(); }
    if (e.key === 'ArrowLeft' && x > -5) { setX(x - 0.1); e.preventDefault(); }
  });
  window.addEventListener('resize', draw);
  setX(2.5);
})();
</script>
</body>
</html>
