<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="560">
<title>Gieo số ngẫu nhiên</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c;
    --node:#ffffff; --node-line:#c9ced8; --node-text:#3b4352;
    --p1:#2563eb; --p1s:#dbe7ff; --p2:#9333ea; --p2s:#efdcff; --p3:#c2410c; --p3s:#ffe3d1; --p4:#15803d; --p4s:#dcf3e3;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74;
      --node:#1d222c; --node-line:#3a4250; --node-text:#c8cfdb;
      --p1:#6ea0ff; --p1s:#1f3358; --p2:#c9a0ff; --p2s:#35244f; --p3:#fdba74; --p3s:#4a2c16; --p4:#4ade80; --p4s:#13301f;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:760px;margin:0 auto;padding:12px 14px 14px}
  .lead{color:var(--muted);margin:0 0 10px;font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
  .mono,code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:10px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:6px 12px;
    border-radius:8px;cursor:pointer;font:inherit}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .field{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .field label{font-weight:600}
  .field input[type=text],.field input[type=number],.field select{padding:5px 9px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--text);font:14.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .field input.bad{border-color:var(--false);background:var(--false-soft)}
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chips>span{font-size:13px;color:var(--muted)}
  .chip{border:1px dashed var(--node-line);background:transparent;color:var(--text);padding:3px 9px;
    border-radius:999px;cursor:pointer;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .seg button{border:0;border-right:1px solid var(--line);background:var(--card);color:var(--text);padding:5px 11px;
    cursor:pointer;font:inherit;font-size:13.5px}
  .seg button:last-child{border-right:0}
  .seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:6px 12px;border-radius:8px;
    cursor:pointer;font:inherit;font-weight:600;font-size:14px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .err{color:var(--false);font-size:13px;min-height:0}
  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
    padding:7px 12px;min-height:52px;font-size:14px}
  .status b{display:block;font-size:12.5px;color:var(--accent)}
  .status.bad{border-left-color:var(--false);background:var(--false-soft)}
  .status.bad b{color:var(--false)}
  .status.ok{border-left-color:var(--true);background:var(--true-soft)}
  .status.ok b{color:var(--true)}
  .panel-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
  .code{background:var(--code-bg);border-radius:8px;padding:6px 0;overflow-x:auto;
    font:13.5px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 10px 0 0;border-left:3px solid transparent}
  .ln .no{width:28px;flex:none;text-align:right;padding-right:10px;color:var(--muted);opacity:.7;user-select:none}
  .ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--muted);font-style:italic}
  .console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:8px 12px;
    font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all}
  .console .ex{color:#fca5a5}
  .console .ph{color:#7b8494;font-family:system-ui,sans-serif;font-size:13px}
  .vars{display:flex;gap:8px;flex-wrap:wrap}
  .var{background:var(--code-bg);border-radius:8px;padding:4px 12px;min-width:70px;text-align:center}
  .var small{display:block;color:var(--muted);font:12px ui-monospace,Menlo,Consolas,monospace}
  .var strong{font:700 18px ui-monospace,Menlo,Consolas,monospace}
  .var.chg{background:var(--cur);outline:2px solid var(--cur-bar)}
  @media (max-width:560px){.wrap{padding:10px 10px 12px}}

  .field input[type=text]{width:64px}
  .formula{background:var(--code-bg);border-radius:8px;padding:6px 12px;font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:auto;white-space:nowrap;margin-bottom:8px}
  .formula .sub{color:var(--muted)}
  .formula .w{background:var(--false-soft);color:var(--false);border-radius:4px;padding:0 3px;font-weight:700}
  .formula .g{background:var(--true-soft);color:var(--true);border-radius:4px;padding:0 3px;font-weight:700}
  .steps{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px;min-height:46px}
  .steps .arr{color:var(--muted)}
  .steps .var strong{font-size:15px}
  .steps .ph{color:var(--muted);font-size:13px}
  .chart{display:flex;align-items:flex-end;gap:4px;height:150px;padding:0 2px;border-bottom:1.5px solid var(--node-text)}
  .bar{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%}
  .bar .cnt{font:600 11.5px ui-monospace,Menlo,Consolas,monospace;color:var(--muted)}
  .bar .b{width:100%;max-width:46px;background:var(--p1s);border:1.5px solid var(--p1);border-bottom:0;border-radius:5px 5px 0 0;transition:height .2s}
  .bar.last .b{background:var(--cur);border-color:var(--cur-bar)}
  .bar.zero .cnt{color:var(--false);font-weight:700}
  .labels{display:flex;gap:4px;padding:2px 2px 0}
  .labels div{flex:1;min-width:0;text-align:center;font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--muted)}
  .labels div.end{color:var(--text);font-weight:700}
  .top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px}
  .total{font-size:13px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <p class="lead">Chọn <code>min</code>, <code>max</code> rồi bấm <b>Gieo</b> (phím → gieo một lần). Biểu đồ đếm mỗi giá trị xuất hiện bao nhiêu lần.</p>
  <div class="controls">
    <div class="field"><label for="mn">min</label><input id="mn" type="text" inputmode="numeric" value="1"></div>
    <div class="field"><label for="mx">max</label><input id="mx" type="text" inputmode="numeric" value="6"></div>
    <div class="seg" role="group" aria-label="Công thức"><button id="fOk" aria-pressed="true">Đúng: max - min + 1</button><button id="fBad" aria-pressed="false">Sai: max - min</button></div>
  </div>
  <div class="err" id="err"></div>
  <div class="formula" id="formula"></div>
  <div class="card">
    <div class="top">
      <div class="btns">
        <button class="btn" id="one">Gieo 1 lần</button>
        <button class="btn ghost" id="hundred">Gieo 100 lần</button>
        <button class="btn ghost" id="reset">Làm lại</button>
      </div>
      <span class="total" id="total"></span>
    </div>
    <div class="steps" id="steps"></div>
    <div class="chart" id="chart"></div>
    <div class="labels" id="labels"></div>
  </div>
  <div class="status" id="status" style="margin-top:10px" aria-live="polite"></div>
</div>
<script>
/*LOGIC*/
// Một lần gieo: trả về các giá trị trung gian giống hệt biểu thức Java
function roll(min, n, r){ // r: số trong [0, 1)
  var prod = r * n;
  var cast = Math.trunc(prod); // (int) bỏ phần thập phân
  return {r:r, prod:prod, cast:cast, value:min + cast};
}
function validate(a, b){
  var re = /^-?\d{1,3}$/;
  if (!re.test(a) || !re.test(b)) return 'min và max phải là số nguyên (từ -99 đến 999).';
  var mn = parseInt(a, 10), mx = parseInt(b, 10);
  if (mx < mn) return 'max phải lớn hơn hoặc bằng min.';
  if (mx - mn + 1 > 20) return 'Để biểu đồ dễ nhìn, khoảng chỉ nên có tối đa 20 giá trị (max - min + 1 ≤ 20).';
  return null;
}
/*END*/
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var mn = 1, mx = 6, bad = false, counts = {}, total = 0, last = null;
  function n(){ return bad ? (mx - mn) : (mx - mn + 1); }
  function fmt(v){ var s = v.toFixed(4); return s; }
  function renderFormula(){
    var k = n();
    $('formula').innerHTML = 'min + (int)(Math.random() * ' + (bad ? '<span class="w">(max - min)</span>' : '<span class="g">(max - min + 1)</span>') + ')<br>'
      + '<span class="sub">= </span>' + mn + ' + (int)(Math.random() * ' + (bad ? '(' + mx + ' - ' + mn + ')' : '(' + mx + ' - ' + mn + ' + 1)') + ')'
      + '<span class="sub"> = </span>' + mn + ' + (int)(Math.random() * ' + k + ')';
  }
  function render(){
    var vals = [], v;
    for (v = mn; v <= mx; v++) vals.push(v);
    var maxc = 1; vals.forEach(function(v){ maxc = Math.max(maxc, counts[v] || 0); });
    $('chart').innerHTML = vals.map(function(v){
      var c = counts[v] || 0, h = Math.round(c / maxc * 120);
      var cls = 'bar' + (last && last.value === v ? ' last' : '') + (total > 0 && c === 0 ? ' zero' : '');
      return '<div class="' + cls + '"><span class="cnt">' + c + '</span><div class="b" style="height:' + h + 'px"></div></div>';
    }).join('');
    $('labels').innerHTML = vals.map(function(v){ return '<div' + (v === mn || v === mx ? ' class="end"' : '') + '>' + v + '</div>'; }).join('');
    $('total').textContent = 'Tổng: ' + total + ' lần gieo';
    if (!last) $('steps').innerHTML = '<span class="ph">Bấm Gieo 1 lần để xem biểu thức được tính từng bước.</span>';
    else $('steps').innerHTML =
      '<div class="var"><small>Math.random()</small><strong>' + fmt(last.r) + '…</strong></div><span class="arr">→</span>' +
      '<div class="var"><small>× ' + n() + '</small><strong>' + fmt(last.prod) + '…</strong></div><span class="arr">→</span>' +
      '<div class="var"><small>(int)</small><strong>' + last.cast + '</strong></div><span class="arr">→</span>' +
      '<div class="var chg"><small>' + mn + ' + ' + last.cast + '</small><strong>' + last.value + '</strong></div>';
    var st = $('status'), k = n();
    st.className = 'status';
    if (k === 0) { st.className = 'status bad'; st.innerHTML = '<b>Nhân với 0</b><code>Math.random() * 0</code> luôn bằng 0, nên kết quả lúc nào cũng là ' + mn + '.'; return; }
    var hi = mn + k - 1;
    var msg = '<b>' + (bad ? 'Công thức sai' : 'Công thức đúng') + '</b>'
      + '<code>(int)(Math.random() * ' + k + ')</code> cho số nguyên từ 0 đến ' + (k - 1) + ', cộng ' + mn + ' thành ' + mn + ' đến ' + hi + '. ';
    if (bad) { st.className = 'status bad'; msg += 'Giá trị <b style="display:inline;color:inherit">' + mx + '</b> không bao giờ xuất hiện' + (total ? ' (đã gieo ' + total + ' lần mà vẫn 0 lần).' : '.'); }
    else msg += total >= 100 ? 'Cả hai đầu ' + mn + ' và ' + mx + ' đều có mặt, các cột cao gần bằng nhau.' : 'Gieo thật nhiều lần để thấy cả hai đầu ' + mn + ' và ' + mx + ' đều xuất hiện.';
    st.innerHTML = msg;
  }
  function doRoll(){
    var k = n();
    last = roll(mn, k, Math.random());
    counts[last.value] = (counts[last.value] || 0) + 1; total++;
  }
  function reset(){ counts = {}; total = 0; last = null; renderFormula(); render(); }
  function readInputs(){
    var e = validate($('mn').value.trim(), $('mx').value.trim());
    $('mn').classList.toggle('bad', !!e); $('mx').classList.toggle('bad', !!e);
    $('err').textContent = e || '';
    $('one').disabled = $('hundred').disabled = !!e;
    if (e) return;
    mn = parseInt($('mn').value, 10); mx = parseInt($('mx').value, 10);
    reset();
  }
  $('mn').addEventListener('input', readInputs);
  $('mx').addEventListener('input', readInputs);
  $('fOk').onclick = function(){ bad = false; this.setAttribute('aria-pressed','true'); $('fBad').setAttribute('aria-pressed','false'); reset(); };
  $('fBad').onclick = function(){ bad = true; this.setAttribute('aria-pressed','true'); $('fOk').setAttribute('aria-pressed','false'); reset(); };
  $('one').onclick = function(){ doRoll(); render(); };
  $('hundred').onclick = function(){ for (var i = 0; i < 100; i++) doRoll(); render(); };
  $('reset').onclick = reset;
  document.addEventListener('keydown', function(e){
    if (e.target.tagName === 'INPUT') return;
    if (e.key === 'ArrowRight' && !$('one').disabled) { doRoll(); render(); e.preventDefault(); }
  });
  reset();
  if (location.hash === '#demo') { $('fBad').onclick(); for (var i = 0; i < 101; i++) doRoll(); render(); }
})();
</script>
</body>
</html>
