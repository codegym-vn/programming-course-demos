<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="640">
<title>Tìm kiếm tuyến tính và nhị phân</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c;
    --node:#ffffff; --node-line:#c9ced8; --node-text:#3b4352;
    --p2:#9333ea; --p2s:#efdcff; --p3:#c2410c; --p3s:#ffe3d1;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74;
      --node:#1d222c; --node-line:#3a4250; --node-text:#c8cfdb;
      --p2:#c9a0ff; --p2s:#35244f; --p3:#fdba74; --p3s:#4a2c16;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:10px 12px 12px}
  .lead{color:var(--muted);margin:0 0 8px;font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:5px 10px;
    border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .field{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .field label{font-weight:600;font-size:13.5px}
  .field input,.field select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .field input.bad{border-color:var(--false);background:var(--false-soft)}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:6px 12px;border-radius:8px;
    cursor:pointer;font:inherit;font-weight:600;font-size:13.5px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .err{color:var(--false);font-size:12.5px;min-height:0}
  .err:empty{display:none}
  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
    padding:7px 12px;margin-bottom:8px;min-height:58px;font-size:14px}
  .status b{display:block;font-size:12.5px;color:var(--accent);margin-bottom:1px}
  .status.ok{border-left-color:var(--true);background:var(--true-soft)}
  .status.ok b{color:var(--true)}
  .status.bad{border-left-color:var(--false);background:var(--false-soft)}
  .status.bad b{color:var(--false)}
  .grid{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
  .grid>*{min-width:0}
  @media (max-width:640px){.grid{grid-template-columns:1fr}}
  .panel-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
  .code{background:var(--code-bg);border-radius:8px;padding:6px 0;overflow-x:auto;
    font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 10px 0 0;border-left:3px solid transparent}
  .ln .no{width:28px;flex:none;text-align:right;padding-right:10px;color:var(--muted);opacity:.7;user-select:none}
  .ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--muted);font-style:italic}
  .vars{display:flex;gap:6px;flex-wrap:wrap}
  .var{background:var(--code-bg);border-radius:8px;padding:3px 10px;min-width:62px;text-align:center;border:2px solid transparent;transition:all .25s}
  .var small{display:block;color:var(--muted);font:11.5px ui-monospace,Menlo,Consolas,monospace}
  .var strong{font:700 17px ui-monospace,Menlo,Consolas,monospace}
  .var.chg{border-color:var(--cur-bar);background:var(--cur)}
  .arr{display:flex;flex-wrap:wrap;align-items:flex-end;gap:0}
  .cw{display:flex;flex-direction:column;align-items:center;position:relative}
  .cell{min-width:40px;height:40px;padding:0 4px;border:2px solid var(--node-line);margin-left:-2px;display:flex;align-items:center;justify-content:center;
    font:700 15px ui-monospace,Menlo,Consolas,monospace;background:var(--node);transition:background .25s,border-color .25s,opacity .25s,transform .25s}
  .cw:first-child .cell{margin-left:0}
  .ix{font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);margin-top:2px}
  .tg{font:700 11px ui-monospace,Menlo,Consolas,monospace;height:15px;color:var(--accent);white-space:nowrap}
  .tg.b{color:var(--p3)}
  .cell.hi{background:var(--cur);border-color:var(--cur-bar);position:relative;z-index:2}
  .cell.ok{background:var(--true-soft);border-color:var(--true);position:relative;z-index:1}
  .cell.bad{background:var(--false-soft);border-color:var(--false);position:relative;z-index:1}
  .cell.acc{background:var(--accent-soft);border-color:var(--accent);position:relative;z-index:1}
  .cell.pur{background:var(--p2s);border-color:var(--p2);position:relative;z-index:1}
  .cell.dim{opacity:.3}
  .cell.pop{transform:translateY(-4px)}
  .tbl{width:100%;border-collapse:collapse;font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .tbl th{font:600 11.5px system-ui,sans-serif;color:var(--muted);text-align:left;padding:2px 6px;border-bottom:1px solid var(--line)}
  .tbl td{padding:2px 6px;border-bottom:1px solid var(--line)}
  .tbl tr.cur td{background:var(--cur)}
  .tag{display:inline-block;padding:0 6px;border-radius:6px;font-weight:700;font-size:12px}
  .tag.t{background:var(--true-soft);color:var(--true)}.tag.f{background:var(--false-soft);color:var(--false)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:6px 10px;min-height:34px;
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap}
  .console .ph{color:#7b8494;font-family:system-ui,sans-serif;font-size:12.5px}
  .kbd{font-size:12px;color:var(--muted)}
.top{margin-bottom:8px}
.top .cell{min-width:44px;height:40px}
.grid{grid-template-columns:1.55fr 1fr}.code{font-size:12px}.var{min-width:50px;padding:3px 8px}
@media (max-width:640px){.grid{grid-template-columns:1fr}}
.chips{display:flex;gap:4px;flex-wrap:wrap}
.chip{border:1px dashed var(--node-line);background:transparent;color:var(--text);padding:2px 8px;border-radius:999px;cursor:pointer;font:12.5px ui-monospace,Menlo,Consolas,monospace}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.opt{display:flex;align-items:center;gap:5px;font-size:13px}
.cmp{margin-top:8px;font:13.5px ui-monospace,Menlo,Consolas,monospace;background:var(--code-bg);border-radius:8px;padding:6px 10px;min-height:32px}
.tblwrap{max-height:124px;overflow-y:auto;margin-top:6px}
.tg.b{height:15px}
#cnt{margin-top:8px}
@media (max-width:480px){.top .cell{min-width:23px!important;width:23px;font-size:11px!important;padding:0!important}.top .tg{font-size:9px}}
  @media (max-width:480px){.wrap .cell{min-width:30px;height:34px;font-size:13.5px;padding:0 2px}}
</style>
</head>
<body>
<div class="wrap">
<p class="lead" id="lead"></p>
<div class="controls">
  <div class="tabs" role="tablist"><button class="tab" role="tab" data-t="tuyen-tinh">Tìm kiếm tuyến tính</button><button class="tab" role="tab" data-t="nhi-phan">Tìm kiếm nhị phân</button></div>
  <div class="field"><label for="key">key</label><input id="key" type="number" value="4" style="width:72px"></div>
  <div class="chips" id="chips"></div>
  <label class="opt" id="revWrap"><input type="checkbox" id="rev"> Tìm từ cuối</label>
</div>
<div class="controls"><span data-btns></span><span class="err" id="err"></span></div>
<div class="status" id="status" aria-live="polite"></div>
<div class="card top"><p class="panel-title" id="arrTitle"></p><div id="arr"></div></div>
<div class="grid">
  <div class="card"><p class="panel-title">Code</p><div class="code" id="code"></div></div>
  <div class="card"><div id="vars"></div><div class="cmp" id="cmp"></div><div id="hist"></div></div>
</div>
</div>
<script>
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hl(src){
  var re = /("(?:[^"\\]|\\.)*")|(\/\/.*$)|\b(int|double|boolean|char|String|new|for|if|else|while|return|public|static|void|true|false|null)\b|(\b\d+(?:\.\d+)?\b)/g, out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="cm">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="kw">' + m[3] + '</span>';
    else out += '<span class="num">' + m[4] + '</span>';
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function codeHtml(lines, cur){
  return lines.map(function(l, i){ var on = Array.isArray(cur) ? cur.indexOf(i) >= 0 : cur === i;
    return '<div class="ln' + (on ? ' cur' : '') + '"><span class="no">' + (i + 1) + '</span><span>' + hl(l) + '</span></div>'; }).join('');
}
/* cells: [{v, cls, tg, tb}] ; tg = nhãn trên, tb = nhãn dưới thêm */
function arrHtml(cells, opt){
  opt = opt || {};
  return '<div class="arr">' + cells.map(function(c, i){
    return '<div class="cw">' + (opt.noTop ? '' : '<div class="tg">' + (c.tg ? esc(c.tg) : '') + '</div>') +
      '<div class="cell ' + (c.cls || '') + '"' + (opt.w ? ' style="min-width:' + opt.w + 'px"' : '') + '>' + (c.v === undefined || c.v === null ? '' : esc(c.v)) + '</div>' +
      '<div class="ix">' + (opt.noIx ? '' : i) + '</div>' + (c.tb !== undefined ? '<div class="tg b">' + esc(c.tb) + '</div>' : (opt.bottomRow ? '<div class="tg b"></div>' : '')) + '</div>';
  }).join('') + '</div>';
}
function varsHtml(vs, prev){
  return '<div class="vars">' + vs.map(function(v){
    var chg = v[2] === true;
    return '<div class="var' + (chg ? ' chg' : '') + '"><small>' + esc(v[0]) + '</small><strong>' + esc(v[1]) + '</strong></div>';
  }).join('') + '</div>';
}
function qparam(k){ var m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }
/* Bộ điều khiển chung: build() trả về mảng snapshot, render(snap, idx, total) */
function Sim(o){
  var S = {snaps: [], i: 0, timer: null};
  function upd(){
    o.render(S.snaps[S.i], S.i, S.snaps.length);
    var run = S.timer !== null;
    $('next').disabled = S.i >= S.snaps.length - 1 || run;
    $('prev').disabled = S.i <= 0 || run;
    $('all').textContent = run ? 'Dừng' : 'Chạy hết';
    $('all').disabled = !run && S.i >= S.snaps.length - 1;
    if (o.after) o.after(run);
  }
  function stop(){ if (S.timer) { clearInterval(S.timer); S.timer = null; } }
  var first = true;
  S.rebuild = function(){ stop(); S.snaps = o.build(); S.i = 0; if (first) { first = false; var b = Number(qparam('buoc')); if (b > 0) S.i = Math.min(S.snaps.length - 1, b - 1); } upd(); };
  S.go = function(k){ stop(); S.i = Math.max(0, Math.min(S.snaps.length - 1, k)); upd(); };
  S.upd = upd;
  $('next').onclick = function(){ if (S.i < S.snaps.length - 1) { S.i++; upd(); } };
  $('prev').onclick = function(){ if (S.i > 0) { S.i--; upd(); } };
  $('reset').onclick = function(){ stop(); S.i = 0; upd(); };
  $('all').onclick = function(){
    if (S.timer) { stop(); upd(); return; }
    S.timer = setInterval(function(){
      if (S.i >= S.snaps.length - 1) { stop(); upd(); return; }
      S.i++; upd();
      if (S.i >= S.snaps.length - 1) { stop(); upd(); }
    }, o.speed || 550);
    upd();
  };
  document.addEventListener('keydown', function(e){
    var t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); $('next').click(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); $('prev').click(); }
  });
  return S;
}
var BTNS = '<div class="btns"><button class="btn" id="next">Bước tiếp</button><button class="btn ghost" id="prev">Lùi lại</button><button class="btn ghost" id="all">Chạy hết</button><button class="btn ghost" id="reset">Làm lại</button></div>';
document.querySelectorAll('[data-btns]').forEach(function(el){ el.outerHTML = BTNS; });
</script>
<script>
var LIN = [1, 4, 4, 2, 5, -3, 6, 2], BIN = [2, 4, 7, 10, 11, 45, 50, 59, 60, 66, 69, 70, 79];
var T = 'tuyen-tinh', KEY = 4, REV = false, KEYS = {'tuyen-tinh':4, 'nhi-phan':11};
var CHIPS = {'tuyen-tinh':[4, -4, -3, 2], 'nhi-phan':[11, 12, 2, 1, 3, 79, 100]};
function linLines(){ return ['public static int linearSearch(', '    int[] list, int key) {', REV ? '  for (int i = list.length - 1; i >= 0; i--) {' : '  for (int i = 0; i < list.length; i++) {', '    if (key == list[i])', '      return i;', '  }', '  return -1;', '}']; }
var BLINES = ['int low = 0;', 'int high = list.length - 1;', 'while (high >= low) {', '  int mid = (low + high) / 2;', '  if (key < list[mid])', '    high = mid - 1;', '  else if (key == list[mid])', '    return mid;', '  else', '    low = mid + 1;', '}', 'return -low - 1;'];
function buildLin(){
  var S = [], n = LIN.length, cnt = 0, seen = [];
  var lastC = null;
  function snap(o){ o.cnt = cnt; o.seen = seen.slice(); if (o.cmp) lastC = o.cmp; o.lc = lastC; S.push(o); }
  snap({ln:-1, t:'Bắt đầu', b:'Tìm key = ' + KEY + ' bằng cách so lần lượt với từng phần tử, ' + (REV ? 'từ cuối mảng về đầu.' : 'từ đầu mảng.')});
  var i = REV ? n - 1 : 0;
  while (REV ? i >= 0 : i < n) {
    cnt++;
    var eq = KEY === LIN[i];
    snap({ln:3, t:'So sánh với list[' + i + ']', b:'key == list[' + i + '] → ' + KEY + ' == ' + LIN[i] + ' là ' + eq + '.' + (eq ? '' : ' Xét phần tử tiếp theo.'), i:i, cmp:[KEY, LIN[i], eq]});
    if (eq) {
      snap({ln:4, t:'Tìm thấy', b:'return ' + i + '. Phương thức kết thúc ngay, ' + (REV ? 'các phần tử phía trước' : 'các phần tử phía sau') + ' không được xét. Số phép so sánh: ' + cnt + '.', i:i, found:i, st:'ok', ret:i});
      return S;
    }
    seen.push(i);
    i = REV ? i - 1 : i + 1;
  }
  snap({ln:6, t:'Không tìm thấy', b:'Đã so với cả ' + n + ' phần tử mà không gặp ' + KEY + '. return -1. Số phép so sánh: ' + cnt + '.', st:'bad', ret:-1});
  return S;
}
function linCount(a, key){ for (var i = 0; i < a.length; i++) if (a[i] === key) return i + 1; return a.length; }
function buildBin(){
  var S = [], n = BIN.length, cnt = 0, low = null, high = null, mid = null, hist = [];
  var lastC = null;
  function snap(o){ o.low = low; o.high = high; o.mid = mid; o.cnt = cnt; o.hist = hist.slice(); if (o.cmp) lastC = o.cmp; if (o.ln === 3) lastC = null; o.lc = lastC; S.push(o); }
  snap({ln:-1, t:'Bắt đầu', b:'Mảng đã sắp xếp tăng dần. Tìm key = ' + KEY + '.'});
  low = 0; snap({ln:0, t:'low = 0', b:'low đánh dấu đầu vùng đang tìm.', ch:'low'});
  high = n - 1; snap({ln:1, t:'high = ' + high, b:'high đánh dấu cuối vùng đang tìm. Vùng tìm ban đầu là cả mảng: 0..' + high + '.', ch:'high'});
  while (true) {
    var ok = high >= low;
    if (!ok) break;
    snap({ln:2, t:'Kiểm tra vùng tìm', b:'high >= low → ' + high + ' >= ' + low + ' đúng: vùng ' + low + '..' + high + ' còn ' + (high - low + 1) + ' phần tử.'});
    mid = Math.floor((low + high) / 2); cnt++;
    hist.push([low, high, mid]);
    snap({ln:3, t:'Tính mid', b:'mid = (' + low + ' + ' + high + ') / 2 = ' + (low + high) + ' / 2 = ' + mid + ' (chia nguyên). list[' + mid + '] = ' + BIN[mid] + '.', ch:'mid', hm:true});
    if (KEY < BIN[mid]) {
      snap({ln:4, t:'So sánh', b:KEY + ' < ' + BIN[mid] + ' đúng: key chỉ có thể nằm ở nửa trái.', hm:true, cmp:'<'});
      high = mid - 1;
      snap({ln:5, t:'Bỏ nửa phải', b:'high = mid - 1 = ' + high + '. Vùng tìm còn ' + low + '..' + high + '.', ch:'high'});
    } else if (KEY === BIN[mid]) {
      snap({ln:6, t:'So sánh', b:KEY + ' < ' + BIN[mid] + ' sai; ' + KEY + ' == ' + BIN[mid] + ' đúng.', hm:true, cmp:'=='});
      snap({ln:7, t:'Tìm thấy', b:'return ' + mid + '. Chỉ cần ' + cnt + ' lần so sánh với phần tử giữa. Tìm kiếm tuyến tính trên cùng mảng cần ' + linCount(BIN, KEY) + ' lần.', found:mid, st:'ok', ret:mid});
      return S;
    } else {
      snap({ln:6, t:'So sánh', b:KEY + ' < ' + BIN[mid] + ' sai; ' + KEY + ' == ' + BIN[mid] + ' sai. Vậy ' + KEY + ' > ' + BIN[mid] + ': key chỉ có thể nằm ở nửa phải.', hm:true, cmp:'>'});
      low = mid + 1;
      snap({ln:9, t:'Bỏ nửa trái', b:'low = mid + 1 = ' + low + '. Vùng tìm còn ' + low + '..' + high + '.', ch:'low'});
    }
  }
  snap({ln:2, t:'Vùng tìm rỗng', b:'high >= low → ' + high + ' >= ' + low + ' sai: low đã vượt qua high, key không có trong mảng.', st:'bad'});
  var ins = low;
  snap({ln:11, t:'Không tìm thấy', b:'return -low - 1 = -' + low + ' - 1 = ' + (-low - 1) + '. Vị trí chèn là low = ' + low + (low === 0 ? ' (đầu mảng)' : (low === n ? ' (cuối mảng)' : ', giữa ' + BIN[low - 1] + ' và ' + BIN[low])) + '. Tìm kiếm tuyến tính cần ' + n + ' lần so sánh, nhị phân chỉ ' + cnt + ' lần.', st:'bad', ret:-low - 1, ins:ins});
  return S;
}
function build(){ return T === 'tuyen-tinh' ? buildLin() : buildBin(); }
function render(s, k, n){
  $('status').className = 'status' + (s.st ? ' ' + s.st : '');
  $('status').innerHTML = '<b>Bước ' + (k + 1) + '/' + n + ' · ' + esc(s.t) + '</b>' + esc(s.b);
  if (T === 'tuyen-tinh') {
    $('code').innerHTML = codeHtml(linLines(), s.ln);
    $('arr').innerHTML = arrHtml(LIN.map(function(v, x){
      return {v:v, cls: s.found === x ? 'ok' : (s.i === x ? 'hi' : (s.seen.indexOf(x) >= 0 ? 'dim' : '')), tg: s.i === x ? 'i' : ''};
    }));
    $('vars').innerHTML = varsHtml([['key', KEY], ['i', s.i === undefined ? '–' : s.i, s.i !== undefined], ['so sánh', s.cnt], ['trả về', s.ret === undefined ? '–' : s.ret]]);
    $('cmp').innerHTML = s.lc ? 'key == list[i] → ' + s.lc[0] + ' == ' + s.lc[1] + ' → <span class="tag ' + (s.lc[2] ? 't' : 'f') + '">' + s.lc[2] + '</span>' : '<span class="kbd">Phép so sánh hiện ở đây.</span>';
    $('hist').innerHTML = '';
  } else {
    $('code').innerHTML = codeHtml(BLINES, s.ln);
    $('arr').innerHTML = arrHtml(BIN.map(function(v, x){
      var out = s.low !== null && s.high !== null && (x < s.low || x > s.high);
      var cls = s.found === x ? 'ok' : (s.hm && s.mid === x ? 'hi' : (out ? 'dim' : ''));
      var tb = [];
      if (s.low === x) tb.push('low'); if (s.high === x) tb.push('high');
      return {v:v, cls:cls, tg: s.mid === x ? 'mid' : '', tb: tb.join(',')};
    }), {bottomRow:true}) + (s.ins !== undefined ? '<div class="kbd" style="margin-top:2px">Vị trí chèn ' + KEY + ': chỉ số ' + s.ins + '</div>' : '');
    $('vars').innerHTML = varsHtml([['key', KEY], ['low', s.low === null ? '–' : s.low, s.ch === 'low'], ['high', s.high === null ? '–' : s.high, s.ch === 'high'], ['mid', s.mid === null ? '–' : s.mid, s.ch === 'mid'], ['so sánh', s.cnt], ['trả về', s.ret === undefined ? '–' : s.ret]]);
    var c = s.lc;
    $('cmp').innerHTML = c ? 'key ' + c + ' list[mid] → ' + KEY + ' ' + c + ' ' + BIN[s.mid] : '<span class="kbd">Phép so sánh với list[mid] hiện ở đây.</span>';
    $('hist').innerHTML = '<div class="tblwrap"><table class="tbl"><tr><th>lần</th><th>low</th><th>high</th><th>mid</th><th>list[mid]</th></tr>' + (s.hist.length ? s.hist.map(function(h, x){ return '<tr' + (x === s.hist.length - 1 ? ' class="cur"' : '') + '><td>' + (x + 1) + '</td><td>' + h[0] + '</td><td>' + h[1] + '</td><td>' + h[2] + '</td><td>' + BIN[h[2]] + '</td></tr>'; }).join('') : '<tr><td colspan="5" class="kbd">Chưa có lần so sánh nào.</td></tr>') + '</table></div>';
  }
}
var sim = Sim({build:build, render:render, speed:650});
function setTab(t){
  T = t; KEY = KEYS[t]; $('key').value = KEY; $('key').classList.remove('bad'); $('err').textContent = '';
  document.querySelectorAll('.tab').forEach(function(b){ b.setAttribute('aria-selected', b.dataset.t === t ? 'true' : 'false'); });
  $('revWrap').style.display = t === 'tuyen-tinh' ? '' : 'none';
  $('lead').innerHTML = t === 'tuyen-tinh' ? 'Nhập <code>key</code> (hoặc chọn nhanh) rồi bấm <b>Bước tiếp</b> (phím →). Để ý số phép so sánh.' : 'Nhập <code>key</code>, kể cả số không có trong mảng, rồi bấm <b>Bước tiếp</b> (phím →). Vùng bị loại sẽ mờ đi.';
  $('arrTitle').textContent = t === 'tuyen-tinh' ? 'Mảng list (không cần sắp xếp)' : 'Mảng list (đã sắp xếp tăng dần)';
  $('chips').innerHTML = CHIPS[t].map(function(v){ return '<button class="chip" data-k="' + v + '">' + v + '</button>'; }).join('');
  document.querySelectorAll('.chip').forEach(function(b){ b.onclick = function(){ $('key').value = b.dataset.k; setKey(); }; });
  sim.rebuild();
}
function setKey(){
  var el = $('key'), v = Number(el.value);
  if (el.value.trim() === '' || !Number.isInteger(v) || Math.abs(v) > 999) { el.classList.add('bad'); $('err').textContent = 'Nhập số nguyên từ -999 đến 999.'; return; }
  el.classList.remove('bad'); $('err').textContent = ''; KEY = v; KEYS[T] = v; sim.rebuild();
}
$('key').addEventListener('input', setKey);
$('rev').addEventListener('change', function(){ REV = this.checked; sim.rebuild(); });
document.querySelectorAll('.tab').forEach(function(b){ b.onclick = function(){ setTab(b.dataset.t); }; });
setTab(qparam('vd') === 'nhi-phan' ? 'nhi-phan' : 'tuyen-tinh');
</script>
</body>
</html>
