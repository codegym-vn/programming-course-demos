<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="420">
<title>Lần vết duyệt mảng bằng for</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c;
    --node:#ffffff; --node-line:#c9ced8; --node-text:#3b4352;
    --p2:#9333ea; --p2s:#efdcff; --p3:#c2410c; --p3s:#ffe3d1;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74;
      --node:#1d222c; --node-line:#3a4250; --node-text:#c8cfdb;
      --p2:#c9a0ff; --p2s:#35244f; --p3:#fdba74; --p3s:#4a2c16;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:10px 12px 12px}
  .lead{color:var(--muted);margin:0 0 8px;font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
  .controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:5px 10px;
    border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .field{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .field label{font-weight:600;font-size:13.5px}
  .field input,.field select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .field input.bad{border-color:var(--false);background:var(--false-soft)}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:6px 12px;border-radius:8px;
    cursor:pointer;font:inherit;font-weight:600;font-size:13.5px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .err{color:var(--false);font-size:12.5px;min-height:0}
  .err:empty{display:none}
  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
    padding:7px 12px;margin-bottom:8px;min-height:58px;font-size:14px}
  .status b{display:block;font-size:12.5px;color:var(--accent);margin-bottom:1px}
  .status.ok{border-left-color:var(--true);background:var(--true-soft)}
  .status.ok b{color:var(--true)}
  .status.bad{border-left-color:var(--false);background:var(--false-soft)}
  .status.bad b{color:var(--false)}
  .grid{display:grid;grid-template-columns:1.3fr 1fr;gap:10px}
  .grid>*{min-width:0}
  @media (max-width:640px){.grid{grid-template-columns:1fr}}
  .panel-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
  .code{background:var(--code-bg);border-radius:8px;padding:6px 0;overflow-x:auto;
    font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 10px 0 0;border-left:3px solid transparent}
  .ln .no{width:28px;flex:none;text-align:right;padding-right:10px;color:var(--muted);opacity:.7;user-select:none}
  .ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--muted);font-style:italic}
  .vars{display:flex;gap:6px;flex-wrap:wrap}
  .var{background:var(--code-bg);border-radius:8px;padding:3px 10px;min-width:62px;text-align:center;border:2px solid transparent;transition:all .25s}
  .var small{display:block;color:var(--muted);font:11.5px ui-monospace,Menlo,Consolas,monospace}
  .var strong{font:700 17px ui-monospace,Menlo,Consolas,monospace}
  .var.chg{border-color:var(--cur-bar);background:var(--cur)}
  .arr{display:flex;flex-wrap:wrap;align-items:flex-end;gap:0}
  .cw{display:flex;flex-direction:column;align-items:center;position:relative}
  .cell{min-width:40px;height:40px;padding:0 4px;border:2px solid var(--node-line);margin-left:-2px;display:flex;align-items:center;justify-content:center;
    font:700 15px ui-monospace,Menlo,Consolas,monospace;background:var(--node);transition:background .25s,border-color .25s,opacity .25s,transform .25s}
  .cw:first-child .cell{margin-left:0}
  .ix{font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);margin-top:2px}
  .tg{font:700 11px ui-monospace,Menlo,Consolas,monospace;height:15px;color:var(--accent);white-space:nowrap}
  .tg.b{color:var(--p3)}
  .cell.hi{background:var(--cur);border-color:var(--cur-bar);position:relative;z-index:2}
  .cell.ok{background:var(--true-soft);border-color:var(--true);position:relative;z-index:1}
  .cell.bad{background:var(--false-soft);border-color:var(--false);position:relative;z-index:1}
  .cell.acc{background:var(--accent-soft);border-color:var(--accent);position:relative;z-index:1}
  .cell.pur{background:var(--p2s);border-color:var(--p2);position:relative;z-index:1}
  .cell.dim{opacity:.3}
  .cell.pop{transform:translateY(-4px)}
  .tbl{width:100%;border-collapse:collapse;font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .tbl th{font:600 11.5px system-ui,sans-serif;color:var(--muted);text-align:left;padding:2px 6px;border-bottom:1px solid var(--line)}
  .tbl td{padding:2px 6px;border-bottom:1px solid var(--line)}
  .tbl tr.cur td{background:var(--cur)}
  .tag{display:inline-block;padding:0 6px;border-radius:6px;font-weight:700;font-size:12px}
  .tag.t{background:var(--true-soft);color:var(--true)}.tag.f{background:var(--false-soft);color:var(--false)}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:6px 10px;min-height:34px;
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap}
  .console .ph{color:#7b8494;font-family:system-ui,sans-serif;font-size:12.5px}
  .kbd{font-size:12px;color:var(--muted)}
.cond{margin-top:8px;font:14px ui-monospace,Menlo,Consolas,monospace;background:var(--code-bg);border-radius:8px;padding:6px 10px;min-height:34px}
.right .arr{margin:4px 0 10px}
  @media (max-width:480px){.wrap .cell{min-width:30px;height:34px;font-size:13.5px;padding:0 2px}}
</style>
</head>
<body>
<div class="wrap">
<p class="lead">Bấm <b>Bước tiếp</b> (hoặc phím →) để xem biến đếm <code>i</code> đi qua từng chỉ số của mảng.</p>
<div class="controls">
  <div class="field"><label for="n">Kích thước mảng</label><input id="n" type="number" min="1" max="10" value="5" style="width:64px"></div>
  <span data-btns></span>
  <span class="err" id="err"></span>
</div>
<div class="status" id="status" aria-live="polite"></div>
<div class="grid">
  <div class="card"><p class="panel-title">Code</p><div class="code" id="code"></div>
    <p class="panel-title" style="margin-top:10px">Điều kiện lặp</p><div class="cond" id="cond"></div></div>
  <div class="card right"><p class="panel-title">Mảng myList</p><div id="arr"></div>
    <p class="panel-title">Biến</p><div id="vars"></div></div>
</div>
</div>
<script>
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hl(src){
  var re = /("(?:[^"\\]|\\.)*")|(\/\/.*$)|\b(int|double|boolean|char|String|new|for|if|else|while|return|public|static|void|true|false|null)\b|(\b\d+(?:\.\d+)?\b)/g, out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="cm">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="kw">' + m[3] + '</span>';
    else out += '<span class="num">' + m[4] + '</span>';
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function codeHtml(lines, cur){
  return lines.map(function(l, i){ var on = Array.isArray(cur) ? cur.indexOf(i) >= 0 : cur === i;
    return '<div class="ln' + (on ? ' cur' : '') + '"><span class="no">' + (i + 1) + '</span><span>' + hl(l) + '</span></div>'; }).join('');
}
/* cells: [{v, cls, tg, tb}] ; tg = nhãn trên, tb = nhãn dưới thêm */
function arrHtml(cells, opt){
  opt = opt || {};
  return '<div class="arr">' + cells.map(function(c, i){
    return '<div class="cw">' + (opt.noTop ? '' : '<div class="tg">' + (c.tg ? esc(c.tg) : '') + '</div>') +
      '<div class="cell ' + (c.cls || '') + '"' + (opt.w ? ' style="min-width:' + opt.w + 'px"' : '') + '>' + (c.v === undefined || c.v === null ? '' : esc(c.v)) + '</div>' +
      '<div class="ix">' + (opt.noIx ? '' : i) + '</div>' + (c.tb !== undefined ? '<div class="tg b">' + esc(c.tb) + '</div>' : (opt.bottomRow ? '<div class="tg b"></div>' : '')) + '</div>';
  }).join('') + '</div>';
}
function varsHtml(vs, prev){
  return '<div class="vars">' + vs.map(function(v){
    var chg = v[2] === true;
    return '<div class="var' + (chg ? ' chg' : '') + '"><small>' + esc(v[0]) + '</small><strong>' + esc(v[1]) + '</strong></div>';
  }).join('') + '</div>';
}
function qparam(k){ var m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }
/* Bộ điều khiển chung: build() trả về mảng snapshot, render(snap, idx, total) */
function Sim(o){
  var S = {snaps: [], i: 0, timer: null};
  function upd(){
    o.render(S.snaps[S.i], S.i, S.snaps.length);
    var run = S.timer !== null;
    $('next').disabled = S.i >= S.snaps.length - 1 || run;
    $('prev').disabled = S.i <= 0 || run;
    $('all').textContent = run ? 'Dừng' : 'Chạy hết';
    $('all').disabled = !run && S.i >= S.snaps.length - 1;
    if (o.after) o.after(run);
  }
  function stop(){ if (S.timer) { clearInterval(S.timer); S.timer = null; } }
  var first = true;
  S.rebuild = function(){ stop(); S.snaps = o.build(); S.i = 0; if (first) { first = false; var b = Number(qparam('buoc')); if (b > 0) S.i = Math.min(S.snaps.length - 1, b - 1); } upd(); };
  S.go = function(k){ stop(); S.i = Math.max(0, Math.min(S.snaps.length - 1, k)); upd(); };
  S.upd = upd;
  $('next').onclick = function(){ if (S.i < S.snaps.length - 1) { S.i++; upd(); } };
  $('prev').onclick = function(){ if (S.i > 0) { S.i--; upd(); } };
  $('reset').onclick = function(){ stop(); S.i = 0; upd(); };
  $('all').onclick = function(){
    if (S.timer) { stop(); upd(); return; }
    S.timer = setInterval(function(){
      if (S.i >= S.snaps.length - 1) { stop(); upd(); return; }
      S.i++; upd();
      if (S.i >= S.snaps.length - 1) { stop(); upd(); }
    }, o.speed || 550);
    upd();
  };
  document.addEventListener('keydown', function(e){
    var t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return;
    if (e.key === 'ArrowRight') { e.preventDefault(); $('next').click(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); $('prev').click(); }
  });
  return S;
}
var BTNS = '<div class="btns"><button class="btn" id="next">Bước tiếp</button><button class="btn ghost" id="prev">Lùi lại</button><button class="btn ghost" id="all">Chạy hết</button><button class="btn ghost" id="reset">Làm lại</button></div>';
document.querySelectorAll('[data-btns]').forEach(function(el){ el.outerHTML = BTNS; });
</script>
<script>
var N = 5;
function lines(){ return ['int[] myList = new int[' + N + '];', 'for (int i = 0; i < myList.length; i++) {', '  myList[i] = i * 10;', '}', '// tiếp tục sau vòng lặp']; }
function build(){
  var a = [], S = [], i;
  for (var k = 0; k < N; k++) a.push(0);
  function snap(o){ o.a = a.slice(); S.push(o); }
  snap({ln:0, t:'Tạo mảng', b:'Tạo mảng ' + N + ' phần tử kiểu int. Mọi phần tử nhận giá trị mặc định 0. myList.length = ' + N + '.', i:null});
  i = 0;
  snap({ln:1, t:'Khởi tạo i', b:'Phần khởi tạo int i = 0 chỉ chạy một lần, trước lượt lặp đầu tiên.', i:i, ch:'i'});
  while (true) {
    var ok = i < N;
    snap({ln:1, t:'Kiểm tra điều kiện', b: ok ? i + ' < ' + N + ' đúng, nên vào thân vòng lặp.' : i + ' < ' + N + ' sai. Điều kiện sai, thoát vòng lặp.', i:i, cond:[i, ok], st: ok ? '' : 'ok'});
    if (!ok) break;
    a[i] = i * 10;
    snap({ln:2, t:'Gán myList[' + i + ']', b:'myList[' + i + '] = ' + i + ' * 10 = ' + (i * 10) + '. Biến i đang được dùng làm chỉ số.', i:i, hi:i});
    i++;
    snap({ln:1, t:'Tăng i', b:'i++ làm i thành ' + i + '. Tiếp theo là kiểm tra điều kiện.', i:i, ch:'i'});
  }
  snap({ln:4, t:'Xong', b:'Vòng lặp đã đi qua đủ ' + N + ' chỉ số, từ 0 đến ' + (N - 1) + ' (tức length - 1). Không có lượt nào dùng chỉ số ' + N + '.', i:i, st:'ok', end:true});
  return S;
}
function render(s, k, n){
  $('code').innerHTML = codeHtml(lines(), s.ln);
  $('status').className = 'status' + (s.st ? ' ' + s.st : '');
  $('status').innerHTML = '<b>Bước ' + (k + 1) + '/' + n + ' · ' + esc(s.t) + '</b>' + esc(s.b);
  $('arr').innerHTML = arrHtml(s.a.map(function(v, j){
    return {v:v, cls: s.hi === j ? 'hi' : (s.i !== null && j < s.i && !s.cond ? '' : ''), tg: (s.i === j && !s.end) ? 'i' : ''};
  }));
  var c = s.cond;
  $('cond').innerHTML = c ? 'i &lt; myList.length → ' + c[0] + ' &lt; ' + N + ' → <span class="tag ' + (c[1] ? 't' : 'f') + '">' + c[1] + '</span>' : '<span class="kbd">Chưa kiểm tra ở bước này.</span>';
  $('vars').innerHTML = varsHtml([['i', s.i === null ? '–' : s.i, s.ch === 'i'], ['myList.length', N]]);
}
var sim = Sim({build:build, render:render});
$('n').addEventListener('input', function(){
  var v = Number(this.value);
  if (!Number.isInteger(v) || v < 1 || v > 10) { this.classList.add('bad'); $('err').textContent = 'Nhập số nguyên từ 1 đến 10.'; return; }
  this.classList.remove('bad'); $('err').textContent = ''; N = v; sim.rebuild();
});
sim.rebuild();
</script>
</body>
</html>
