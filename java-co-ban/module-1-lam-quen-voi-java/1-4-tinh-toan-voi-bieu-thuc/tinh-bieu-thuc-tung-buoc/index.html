<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="560">
<title>Tính biểu thức từng bước</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
  --accent:#2563eb; --accent-soft:#e7eefc;
  --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
  --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
  --con-bg:#111827; --con-text:#e5e7eb;
  --kw:#7c3aed; --str:#047857; --num:#c2410c; --cm:#6b7280;
  --warn:#b45309; --warn-soft:#fdf0d5;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
    --accent:#6ea0ff; --accent-soft:#1e2a44;
    --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
    --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
    --con-bg:#05070b; --con-text:#e5e7eb;
    --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74; --cm:#8b93a1;
    --warn:#fbbf24; --warn-soft:#3a2a0c;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:10px 12px 12px}
.hint{color:var(--muted);margin:0 0 8px;font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:5px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btns{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.field{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.field label{font-weight:600;font-size:13.5px}
input.txt{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input.txt.bad{border-color:var(--false);background:var(--false-soft)}
.chip{border:1px dashed var(--muted);background:transparent;color:var(--text);padding:3px 9px;border-radius:999px;cursor:pointer;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.chip:hover,.chip.on{border-color:var(--accent);color:var(--accent);border-style:solid}
.err{color:var(--false);font-size:13px;min-height:0}
.err:empty{display:none}
.status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:7px 12px;margin-bottom:8px;min-height:58px;font-size:14px}
.status b{display:block;font-size:12.5px;color:var(--accent)}
.status .note{display:block;margin-top:3px;font-size:13px;color:var(--muted)}
.status.ok{border-left-color:var(--true)}
.status.bad{border-left-color:var(--false)}
.panel-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.code{background:var(--code-bg);border-radius:8px;padding:6px 0;overflow-x:auto;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ln{display:flex;white-space:pre;padding:0 10px 0 0;border-left:3px solid transparent}
.ln .no{width:30px;flex:none;text-align:right;padding-right:10px;color:var(--muted);opacity:.7;user-select:none}
.ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
.ln.dim{opacity:.55}
.kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--cm);font-style:italic}
.console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:7px 10px;min-height:44px;white-space:pre-wrap;font:13.5px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-x:auto}
.console .ph{color:#7b8494;font-family:system-ui,sans-serif;font-size:13px}
.console .e{color:#fca5a5}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ok-t{color:var(--true);font-weight:700}.bad-t{color:var(--false);font-weight:700}
@keyframes flash{0%{background:var(--cur);box-shadow:0 0 0 3px var(--cur-bar)}100%{}}
.flash{animation:flash 1.1s ease-out}
.status{overflow-wrap:anywhere}
@media (max-width:560px){
  .btns{margin-left:0}
  .btn{padding:6px 10px}
}

.exin{display:flex;gap:6px;flex:1 1 100%;min-width:0}
.exin input{flex:1;min-width:0}
.big{font:600 19px/1.9 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:8px 10px;background:var(--code-bg);border-radius:8px;min-height:54px;overflow-x:auto;white-space:nowrap}
.big .tk{padding:1px 0;border-radius:4px}
.big .nx{background:var(--cur);box-shadow:0 0 0 2px var(--cur-bar);border-radius:4px}
.big .nw{background:var(--true-soft);color:var(--true);box-shadow:0 0 0 2px var(--true);border-radius:4px}
.big .er{background:var(--false-soft);color:var(--false);box-shadow:0 0 0 2px var(--false);border-radius:4px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:6px 0 2px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.hist{margin-top:8px;max-height:196px;overflow-y:auto}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px}
.tbl th{font:600 12px system-ui,sans-serif;color:var(--muted);text-align:left;padding:3px 6px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
.tbl td{padding:3px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl td.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:nowrap}
.tbl tr.last td{background:var(--true-soft)}
.tbl .rule{color:var(--muted);font-size:12.5px}
.tag{display:inline-block;padding:0 6px;border-radius:6px;font-size:11.5px;font-weight:700;margin-left:4px}
.tag.w{background:var(--warn-soft);color:var(--warn)}
.tag.f{background:var(--false-soft);color:var(--false)}
@media (max-width:560px){.exin{flex-basis:100%}.tbl th:nth-child(4),.tbl td:nth-child(4){display:none}.tbl td.m{white-space:normal;word-break:break-all}.big{font-size:17px}}
.outrow{margin-top:8px;display:flex;gap:8px;align-items:stretch}
.outrow .console{flex:1}
</style>
</head>
<body>
<div class="wrap">
  <p class="hint">Java tính biểu thức theo thứ tự nào? Bấm <b>Bước tiếp</b> để xem từng phép tính. Đổi giữa hai biểu thức để so sánh, hoặc tự gõ biểu thức khác.</p>
  <div class="controls">
    <div class="tabs" id="presets" role="tablist"></div>
    <div class="btns">
      <button class="btn ghost" id="bPrev">Lùi lại</button>
      <button class="btn" id="bNext">Bước tiếp</button>
      <button class="btn ghost" id="bAll">Chạy hết</button>
      <button class="btn ghost" id="bReset">Làm lại</button>
    </div>
  </div>
  <div class="controls">
    <div class="exin"><input class="txt" id="exp" aria-label="Biểu thức" maxlength="60" spellcheck="false" autocomplete="off"><button class="btn ghost" id="bUse">Tính</button></div>
  </div>
  <div class="err" id="err"></div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="card">
    <div class="big" id="big"></div>
    <div class="legend"><span><i style="background:var(--cur);box-shadow:0 0 0 1px var(--cur-bar)"></i>sẽ tính ở bước tiếp</span><span><i style="background:var(--true-soft);box-shadow:0 0 0 1px var(--true)"></i>giá trị vừa tính</span></div>
    <div class="hist"><table class="tbl"><thead><tr><th>#</th><th>Phép tính</th><th>Kết quả</th><th>Lý do</th></tr></thead><tbody id="hist"></tbody></table></div>
    <div class="outrow"><div class="console" id="con"></div></div>
  </div>
</div>
<script>
/* JCORE: Java number semantics + expression stepper */
var JC = (function(){
  function jfmt(v){ // v: {v,t}
    if (v.t === 'int') return String(v.v);
    var d = v.v;
    if (isNaN(d)) return 'NaN';
    if (d === Infinity) return 'Infinity';
    if (d === -Infinity) return '-Infinity';
    if (d === 0) return (1/d < 0) ? '-0.0' : '0.0';
    var a = Math.abs(d);
    if (a >= 1e-3 && a < 1e7){ var s = String(d); return s.indexOf('.') < 0 ? s + '.0' : s; }
    var e = d.toExponential(), p = e.split('e'), m = p[0], x = parseInt(p[1], 10);
    if (m.indexOf('.') < 0) m += '.0';
    return m + 'E' + x;
  }
  function I(n){ return {v:n|0, t:'int'}; }
  function D(n){ return {v:n, t:'double'}; }
  // apply binary op with Java semantics; returns {val} or {err}
  function apply(op, a, b){
    if (a.t === 'int' && b.t === 'int'){
      var x = a.v, y = b.v, r, info = '';
      switch(op){
        case '+': r = (x + y) | 0; if (r !== x + y) info = 'overflow'; break;
        case '-': r = (x - y) | 0; if (r !== x - y) info = 'overflow'; break;
        case '*': r = Math.imul(x, y); if (r !== x * y) info = 'overflow'; break;
        case '/': if (y === 0) return {err:'ArithmeticException: / by zero'}; r = (x / y) | 0; if (x % y !== 0) info = 'intdiv'; if (x === -2147483648 && y === -1) r = x; break;
        case '%': if (y === 0) return {err:'ArithmeticException: / by zero'}; r = (x % y) | 0; if (r === 0 && (x % y) !== 0) r = 0; break;
      }
      return {val:I(r), info:info};
    }
    var p = a.v, q = b.v, s;
    switch(op){ case '+': s = p + q; break; case '-': s = p - q; break; case '*': s = p * q; break; case '/': s = p / q; break; case '%': s = p % q; break; }
    return {val:D(s), info:(a.t !== b.t ? 'promote' : '')};
  }
  // literal parse: returns {v,t} or null
  function lit(s){
    s = s.trim();
    if (/^-?\d+$/.test(s)){ var n = Number(s); if (n > 2147483647 || n < -2147483648) return null; return I(n); }
    if (/^-?(\d+\.\d*|\.\d+)$/.test(s)) return D(Number(s));
    return null;
  }
  // tokenize: tokens {k:'n',val,src} | {k:'op',o} | {k:'(' } | {k:')'}
  function tokenize(src){
    var toks = [], i = 0, prev = null;
    while (i < src.length){
      var c = src[i];
      if (c === ' ' || c === '\t'){ i++; continue; }
      var unary = (c === '-') && (prev === null || prev.k === 'op' || prev.k === '(') && /[\d.]/.test(src[i+1] || '');
      if (/[\d.]/.test(c) || unary){
        var j = i + (unary ? 1 : 0);
        while (j < src.length && /[\d.]/.test(src[j])) j++;
        var t = src.slice(i, j), v = lit(t);
        if (!v) return {err: /^-?\d+$/.test(t) ? 'Số nguyên ' + t + ' vượt quá giới hạn của int.' : 'Không hiểu số "' + t + '".'};
        prev = {k:'n', val:v, src:t}; toks.push(prev); i = j; continue;
      }
      if ('+-*/%'.indexOf(c) >= 0){ prev = {k:'op', o:c}; toks.push(prev); i++; continue; }
      if (c === '(' || c === ')'){ prev = {k:c}; toks.push(prev); i++; continue; }
      return {err:'Ký tự "' + c + '" không được dùng. Chỉ dùng số, + - * / % và ( ).'};
    }
    // validate grammar
    var depth = 0, expectN = true;
    for (var k = 0; k < toks.length; k++){
      var tk = toks[k];
      if (expectN){
        if (tk.k === 'n') expectN = false;
        else if (tk.k === '(') depth++;
        else return {err:'Biểu thức chưa đúng: thiếu số trước "' + (tk.o || tk.k) + '".'};
      } else {
        if (tk.k === 'op') expectN = true;
        else if (tk.k === ')'){ depth--; if (depth < 0) return {err:'Thừa dấu ")".'}; }
        else return {err:'Biểu thức chưa đúng: thiếu phép tính giữa hai số.'};
      }
    }
    if (!toks.length) return {err:'Hãy nhập một biểu thức.'};
    if (expectN) return {err:'Biểu thức chưa đúng: kết thúc bằng phép tính.'};
    if (depth > 0) return {err:'Thiếu dấu ")".'};
    return {toks:toks};
  }
  function tokStr(t){ return t.k === 'n' ? (t.src !== undefined ? t.src : jfmt(t.val)) : (t.k === 'op' ? t.o : t.k); }
  function render(toks){ // returns array of strings w/ spacing
    var out = [];
    for (var i = 0; i < toks.length; i++){
      var t = toks[i], s = tokStr(t);
      out.push(s);
    }
    return out;
  }
  function joinToks(toks, from, to){ // display string with spacing
    var s = '';
    for (var i = from; i < to; i++){
      var t = toks[i];
      if (i > from){
        var p = toks[i-1];
        if (!(p.k === '(' || t.k === ')')) s += ' ';
      }
      s += tokStr(t);
    }
    return s;
  }
  // Steps: [{toks (before), at:[i,j] range of the 3 tokens (plus parens removed), res, rule, info}]
  function steps(toks){
    toks = toks.slice();
    var list = [];
    var guard = 0;
    while (toks.length > 1 && guard++ < 500){
      // drop paren around single number
      // find leftmost innermost group
      var lo = 0, hi = toks.length, inParen = false;
      for (var i = 0; i < toks.length; i++){
        if (toks[i].k === ')'){ hi = i; for (var j = i - 1; j >= 0; j--) if (toks[j].k === '('){ lo = j + 1; break; } inParen = true; break; }
      }
      if (inParen && hi - lo === 1){ // (n) -> n
        toks.splice(hi, 1); toks.splice(lo - 1, 1); continue;
      }
      var opi = -1, hasAdd = false, k;
      for (k = lo; k < hi; k++) if (toks[k].k === 'op' && '*/%'.indexOf(toks[k].o) >= 0){ opi = k; break; }
      for (k = lo; k < hi; k++) if (toks[k].k === 'op' && '+-'.indexOf(toks[k].o) >= 0) hasAdd = true;
      var mulFirst = opi >= 0;
      if (opi < 0) for (k = lo; k < hi; k++) if (toks[k].k === 'op'){ opi = k; break; }
      var op = toks[opi].o, a = toks[opi-1], b = toks[opi+1];
      var sameLater = false, sameBefore = false;
      var grp = function(o){ return '*/%'.indexOf(o) >= 0 ? 1 : 0; };
      for (k = opi + 2; k < hi; k++) if (toks[k].k === 'op' && grp(toks[k].o) === grp(op)) sameLater = true;
      var r = apply(op, a.val, b.val);
      var rule;
      if (inParen) rule = 'Trong ngoặc tính trước.';
      else if (mulFirst && hasAdd) rule = 'Nhân, chia, chia dư tính trước cộng trừ.';
      else if (sameLater) rule = 'Cùng mức ưu tiên: tính từ trái sang phải.';
      else rule = 'Phép tính cuối cùng.';
      if (inParen && mulFirst && hasAdd) rule = 'Trong ngoặc tính trước; trong ngoặc, nhân chia tính trước cộng trừ.';
      else if (inParen && sameLater) rule = 'Trong ngoặc tính trước; cùng mức thì từ trái sang phải.';
      var st = {toks:toks.slice(), at:[opi-1, opi+1], a:a.val, b:b.val, op:op, rule:rule, info:r.info || ''};
      if (r.err){ st.err = r.err; list.push(st); return list; }
      st.res = r.val;
      list.push(st);
      var nt = {k:'n', val:r.val};
      toks.splice(opi - 1, 3, nt);
      // unwrap parens if now single
      var idx = opi - 1;
      if (idx > 0 && toks[idx-1].k === '(' && toks[idx+1] && toks[idx+1].k === ')'){ toks.splice(idx+1, 1); toks.splice(idx-1, 1); st.unwrap = true; }
      st.after = toks.slice();
    }
    return list;
  }
  return {jfmt:jfmt, apply:apply, lit:lit, tokenize:tokenize, steps:steps, joinToks:joinToks, tokStr:tokStr, I:I, D:D};
})();

/* UI helpers */
function $(id){ return document.getElementById(id); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hlJava(src){
  var re = /("(?:[^"\\]|\\.)*")|(\/\/.*$)|\b(public|class|static|void|int|double|long|final|new|import|return|if|else|while|for)\b|(\b\d+(?:\.\d+)?\b)/g, out = '', last = 0, m;
  while ((m = re.exec(src))){
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="cm">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="kw">' + m[3] + '</span>';
    else out += '<span class="num">' + m[4] + '</span>';
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function codeHtml(lines, cur, startNo){
  startNo = startNo || 1; cur = cur || [];
  return lines.map(function(l, i){
    return '<div class="ln' + (cur.indexOf(i) >= 0 ? ' cur' : '') + '"><span class="no">' + (i + startNo) + '</span><span>' + hlJava(l) + '</span></div>';
  }).join('');
}
function qparam(name){
  try { var m = new RegExp('[?&]' + name + '=([^&#]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; } catch(e){ return null; }
}
/* Stepper: opts {count():n, render(step), onBlockNext?():bool} */
function Stepper(opts){
  var self = {step:0};
  self.go = function(s){ var n = opts.count(); self.step = Math.max(0, Math.min(n, s)); opts.render(self.step); upd(); };
  self.next = function(){ if (opts.beforeNext && opts.beforeNext(self.step) === false) return; self.go(self.step + 1); };
  self.prev = function(){ self.go(self.step - 1); };
  self.all = function(){ self.go(opts.count()); };
  self.reset = function(){ self.go(0); };
  function upd(){
    var n = opts.count();
    $('bNext').disabled = self.step >= n; $('bAll').disabled = self.step >= n;
    $('bPrev').disabled = self.step <= 0; $('bReset').disabled = self.step <= 0;
  }
  $('bNext').onclick = function(){ self.next(); }; $('bPrev').onclick = function(){ self.prev(); }; $('bAll').onclick = function(){ self.all(); }; $('bReset').onclick = function(){ self.reset(); };
  self.upd = upd;
  document.addEventListener('keydown', function(e){
    var t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return;
    if (e.key === 'ArrowRight'){ e.preventDefault(); self.next(); }
    else if (e.key === 'ArrowLeft'){ e.preventDefault(); self.prev(); }
  });
  return self;
}

(function(){
  var PRESETS = [{"id":"co-ngoac","label":"Có ngoặc","expr":"(10.5 + 2 * 3) / (45 - 3.5)"},{"id":"bo-ngoac","label":"Bỏ ngoặc","expr":"10.5 + 2 * 3 / 45 - 3.5"}];
  var DEF = "co-ngoac";
  var cur = null, steps = [], src = '';
  function tokHtml(toks, mark){ // mark: {from,to,cls}
    var s = '';
    for (var i = 0; i < toks.length; i++){
      var t = toks[i];
      var sp = (i > 0 && !(toks[i-1].k === '(' || t.k === ')')) ? ' ' : '';
      if (mark && i === mark.from) s += sp + '<span class="' + mark.cls + '">'; else s += sp;
      s += '<span class="tk">' + esc(JC.tokStr(t)) + '</span>';
      if (mark && i === mark.to) s += '</span>';
    }
    return s;
  }
  function approx(x){ var r = Math.round(x * 10000) / 10000; return (r === x ? String(r) : String(r) + '...').replace('.', ','); }
  function note(st){
    var a = JC.jfmt(st.a), b = JC.jfmt(st.b);
    if (st.err) return 'Chia một số nguyên cho 0 là lỗi khi chạy: chương trình dừng với ' + st.err + '.';
    if (st.info === 'intdiv') return 'Cả ' + a + ' và ' + b + ' đều là số nguyên nên đây là phép chia nguyên: ' + a + ' : ' + b + ' = ' + approx(st.a.v / st.b.v) + ', phần thập phân bị cắt bỏ, còn ' + JC.jfmt(st.res) + '.';
    if (st.info === 'overflow') return 'Kết quả đúng phải là ' + (st.op === '*' ? st.a.v * st.b.v : st.op === '+' ? st.a.v + st.b.v : st.a.v - st.b.v) + ', vượt giới hạn của int (khoảng 2,1 tỉ) nên bị tràn số thành ' + JC.jfmt(st.res) + '.';
    if (st.info === 'promote') return 'Một bên là số thực nên kết quả là số thực: ' + JC.jfmt(st.res) + '.';
    if (st.op === '%') return a + ' % ' + b + ' là số dư của phép chia ' + a + ' cho ' + b + '.';
    if (st.op === '/' && st.res.t === 'double') return 'Có số thực nên đây là phép chia thường.';
    return '';
  }
  function tags(st){
    if (st.err) return '<span class="tag f">lỗi</span>';
    if (st.info === 'intdiv') return '<span class="tag w">chia nguyên</span>';
    if (st.info === 'overflow') return '<span class="tag f">tràn số</span>';
    return '';
  }
  function load(expr){
    var r = JC.tokenize(expr);
    var ops = r.toks ? r.toks.filter(function(t){ return t.k === 'op'; }).length : 0;
    if (!r.err && ops > 12) r = {err:'Biểu thức dài quá, hãy dùng tối đa 12 phép tính.'};
    if (r.err){ $('err').textContent = r.err; $('exp').classList.add('bad'); return false; }
    $('err').textContent = ''; $('exp').classList.remove('bad');
    src = expr; cur = r.toks; steps = JC.steps(r.toks); $('exp').value = JC.joinToks(r.toks, 0, r.toks.length);
    [].forEach.call($('presets').children, function(b){ b.setAttribute('aria-selected', String(b.dataset.e === $('exp').value)); });
    S.go(0); return true;
  }
  function render(k){
    var n = steps.length, st = steps[k], prev = steps[k-1], big = '', stat = '', cls = '';
    var last = steps[n-1], failed = last && last.err;
    if (k < n){
      var mark = {from:st.at[0], to:st.at[1], cls:(st.err ? 'nx' : 'nx')};
      big = tokHtml(st.toks, mark);
      if (k === 0) stat = '<b>Sẵn sàng</b>Phần tô vàng là phép tính Java làm đầu tiên: <span class="mono">' + esc(JC.jfmt(st.a) + ' ' + st.op + ' ' + JC.jfmt(st.b)) + '</span>. ' + esc(st.rule) + ' Bấm <b style="display:inline;color:inherit">Bước tiếp</b>.';
    } else if (failed){
      big = tokHtml(last.toks, {from:last.at[0], to:last.at[1], cls:'er'});
    } else if (n > 0){
      big = tokHtml(last.after, {from:0, to:0, cls:'nw'});
    } else {
      big = tokHtml(cur, {from:0, to:cur.length - 1, cls:'nw'}); k = 0;
      stat = '<b>Chỉ có một số</b>Biểu thức không có phép tính nào. Hãy thử thêm + - * / %.';
    }
    if (k > 0){
      var s = prev, nt = note(s);
      if (s.err){ stat = '<b>Bước ' + k + ' · Lỗi khi chạy</b>' + esc(nt); cls = 'bad'; }
      else {
        stat = '<b>Bước ' + k + ' / ' + n + '</b><span class="mono">' + esc(JC.jfmt(s.a) + ' ' + s.op + ' ' + JC.jfmt(s.b)) + '</span> được <span class="mono">' + esc(JC.jfmt(s.res)) + '</span>. ' + esc(s.rule) + (nt ? '<span class="note">' + esc(nt) + '</span>' : '');
        if (k < n) stat += '<span class="note">Phần tô vàng sẽ tính ở bước tiếp.</span>';
        else { stat += '<span class="note">Hết phép tính. Giá trị của biểu thức là ' + esc(JC.jfmt(s.res)) + '.</span>'; cls = 'ok'; }
        if (k < n && nt) {} 
        // recolor just computed value when same token list
        if (k < n && s.after && s.after.length === st.toks.length){
          var idx = s.at[0] - (s.unwrap ? 1 : 0);
          big = tokHtml2(st.toks, st.at, idx);
        }
      }
    }
    $('big').innerHTML = big;
    $('status').className = 'status' + (cls ? ' ' + cls : '');
    $('status').innerHTML = stat;
    var h = '';
    for (var i = 0; i < k; i++){
      var x = steps[i];
      h += '<tr' + (i === k - 1 ? ' class="last"' : '') + '><td>' + (i + 1) + '</td><td class="m">' + esc(JC.jfmt(x.a) + ' ' + x.op + ' ' + JC.jfmt(x.b)) + '</td><td class="m">' + (x.err ? '<span class="bad-t">lỗi</span>' : esc(JC.jfmt(x.res))) + tags(x) + '</td><td class="rule">' + esc(x.rule) + '</td></tr>';
    }
    $('hist').innerHTML = h || '<tr><td colspan="4" class="rule">Chưa tính bước nào.</td></tr>';
    var c = $('con');
    if (k >= n){
      if (failed) c.innerHTML = '<span class="e">Exception in thread "main" java.lang.' + esc(last.err) + '</span>';
      else c.textContent = JC.jfmt(n ? last.res : cur.filter(function(t){ return t.k === 'n'; })[0].val);
      c.innerHTML = '<span class="ph">Màn hình in ra (System.out.println):</span>\n' + c.innerHTML;
    } else c.innerHTML = '<span class="ph">Màn hình in ra (System.out.println): chưa có, vì biểu thức chưa tính xong.</span>';
    var hw = document.querySelector('.hist'); hw.scrollTop = hw.scrollHeight;
  }
  function tokHtml2(toks, at, newIdx){
    var s = '';
    for (var i = 0; i < toks.length; i++){
      var t = toks[i], sp = (i > 0 && !(toks[i-1].k === '(' || t.k === ')')) ? ' ' : '';
      s += sp;
      if (i === at[0]) s += '<span class="nx">';
      var inner = '<span class="tk">' + esc(JC.tokStr(t)) + '</span>';
      s += (i === newIdx) ? '<span class="nw">' + inner + '</span>' : inner;
      if (i === at[1]) s += '</span>';
    }
    return s;
  }
  var S = Stepper({count:function(){ return steps.length; }, render:render});
  PRESETS.forEach(function(p){
    var b = document.createElement('button'); b.className = 'tab'; b.setAttribute('role', 'tab'); b.textContent = p.label; b.dataset.e = p.expr; b.dataset.id = p.id;
    b.onclick = function(){ load(p.expr); }; $('presets').appendChild(b);
  });
  $('bUse').onclick = function(){ load($('exp').value); };
  $('exp').addEventListener('keydown', function(e){ if (e.key === 'Enter') load($('exp').value); });
  var want = qparam('vd'), start = PRESETS[0];
  PRESETS.forEach(function(p){ if (p.id === (want || DEF)) start = p; });
  load(start.expr);
  var b0 = parseInt(qparam('buoc'), 10); if (b0 > 0) S.go(b0);
})();
</script>
</body>
