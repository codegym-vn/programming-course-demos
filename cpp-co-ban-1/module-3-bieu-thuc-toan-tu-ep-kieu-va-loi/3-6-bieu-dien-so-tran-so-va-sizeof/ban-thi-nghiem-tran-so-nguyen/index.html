<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="580">
<title>Bàn thí nghiệm: Biểu diễn nhị phân & Tràn số nguyên trong C++</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
    --warn:#b45309; --warn-soft:#fef3c7;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c;
    --bit-on:#2563eb; --bit-on-bg:#eff6ff; --bit-off:#cbd5e1;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --warn:#fcd34d; --warn-soft:#3a2e10;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74;
      --bit-on:#6ea0ff; --bit-on-bg:#1e2a44; --bit-off:#334155;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:8px 10px 10px}
  .lead{color:var(--muted);margin:0 0 8px;font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  
  .controls{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:8px}
  .tabs{display:flex;gap:4px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:4px 9px;
    border-radius:6px;cursor:pointer;font:inherit;font-size:12.5px;transition:all .15s}
  .tab:hover{border-color:var(--accent)}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}

  .btns{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:4px 9px;border-radius:6px;
    cursor:pointer;font:inherit;font-weight:600;font-size:12.5px;display:inline-flex;align-items:center;gap:4px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.warn{border-color:var(--warn);background:var(--warn)}
  .btn.danger{border-color:var(--false);background:var(--false)}

  /* Status Box */
  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:6px;
    padding:5px 8px;margin-bottom:8px;min-height:46px;font-size:13px;transition:all .2s}
  .status b{display:block;font-size:11.5px;color:var(--accent);margin-bottom:1px}
  .status.overflow{border-left-color:var(--false);background:var(--false-soft);animation:pulse .3s ease-in-out}
  .status.overflow b{color:var(--false)}
  @keyframes pulse{0%{transform:scale(0.99)} 50%{transform:scale(1.01)} 100%{transform:scale(1)}}

  /* 2-Column Grid */
  .grid{display:grid;grid-template-columns:1.35fr 1.05fr;gap:8px}
  .grid>*{min-width:0}
  @media (max-width:640px){
    .grid{grid-template-columns:1fr}
    .right-card{height:auto}
  }

  .panel-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .panel-title{font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0}
  .badge{font:700 10.5px ui-monospace,monospace;padding:1px 5px;border-radius:4px;background:var(--accent-soft);color:var(--accent)}

  /* Bit Register Display */
  .reg-card{background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:8px 6px;margin-bottom:8px;text-align:center}
  .bits-row{display:flex;justify-content:center;gap:4px;margin:4px 0}
  .bit-cell{display:flex;flex-direction:column;align-items:center;min-width:32px;cursor:pointer;user-select:none}
  .bit-btn{width:32px;height:38px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font:700 20px ui-monospace,monospace;border:2px solid var(--line);background:var(--card);color:var(--muted);transition:all .15s}
  .bit-btn:hover{border-color:var(--accent)}
  .bit-cell.on .bit-btn{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 0 6px rgba(37,99,235,0.3)}
  .bit-cell.sign.on .bit-btn{background:var(--false);border-color:var(--false);box-shadow:0 0 6px rgba(180,35,24,0.3)}
  
  .bit-idx{font:10px ui-monospace,monospace;color:var(--muted);margin-top:2px}
  .bit-w{font:700 9.5px ui-monospace,monospace;color:var(--muted);margin-bottom:2px}
  .bit-cell.sign .bit-w{color:var(--false)}

  /* Value readout */
  .readout-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:8px}
  .readout-card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px;text-align:center}
  .readout-lbl{font-size:10.5px;color:var(--muted);font-weight:600}
  .readout-val{font:700 24px ui-monospace,monospace;color:var(--text);margin-top:2px}
  .readout-val.warn{color:var(--false)}

  /* Math equation */
  .math-card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font:11.5px/1.4 ui-monospace,monospace;margin-bottom:8px}

  /* Right Card (Wheel / Clock) */
  .right-card{display:flex;flex-direction:column;justify-content:space-between;height:265px}
  .wheel-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;position:relative}
  .wheel-svg{width:160px;height:160px}

  .code-snip{background:var(--code-bg);border-radius:6px;padding:6px 8px;font:11.5px/1.45 ui-monospace,monospace}
  .kw{color:var(--kw);font-weight:600}.num{color:var(--num)}.cm{color:var(--muted);font-style:italic}
</style>
</head>
<body>
<div class="wrap">
  <p class="lead">Nhấp chuột trực tiếp vào từng ô bit (0/1) hoặc bấm nút <b>+1 / -1</b> để quan sát hiện tượng <b>tràn số</b> (overflow quay vòng).</p>

  <div class="controls">
    <div class="tabs" role="tablist">
      <button class="tab" id="tab-u8" role="tab" aria-selected="true" onclick="setType('u8')">1. uint8_t (0 .. 255)</button>
      <button class="tab" id="tab-i8" role="tab" aria-selected="false" onclick="setType('i8')">2. int8_t (-128 .. 127)</button>
      <button class="tab" id="tab-32" role="tab" aria-selected="false" onclick="setType('32')">3. Tràn số 32-bit (INT_MAX)</button>
    </div>

    <div class="btns" id="action-btns">
      <button class="btn" onclick="stepVal(1)">+1</button>
      <button class="btn" onclick="stepVal(10)">+10</button>
      <button class="btn ghost" onclick="stepVal(-1)">-1</button>
      <button class="btn ghost" onclick="stepVal(-10)">-10</button>
      <button class="btn warn" onclick="jumpToMax()">Tới MAX</button>
      <button class="btn ghost" onclick="resetZero()">Reset 0</button>
    </div>
  </div>

  <div class="status" id="status" aria-live="polite"></div>

  <div class="grid">
    <!-- Cột 1: Bàn phím Bit & Giá trị -->
    <div class="card">
      <div class="panel-head">
        <p class="panel-title" id="reg-title">Dãy 8 bit nhị phân</p>
        <span class="badge" id="type-badge">uint8_t</span>
      </div>

      <div class="reg-card">
        <div class="bits-row" id="bits-row"></div>
      </div>

      <div class="readout-grid">
        <div class="readout-card">
          <div class="readout-lbl">HỆ THẬP PHÂN (DEC)</div>
          <div class="readout-val" id="dec-val">0</div>
        </div>
        <div class="readout-card">
          <div class="readout-lbl">HỆ THẬP LỤC PHÂN (HEX)</div>
          <div class="readout-val" id="hex-val">0x00</div>
        </div>
      </div>

      <div class="math-card" id="math-view"></div>
    </div>

    <!-- Cột 2: Vòng tròn tràn số (Clock Wheel) -->
    <div class="card right-card">
      <div class="panel-head">
        <p class="panel-title">Vòng tròn tràn số (Clock Wheel)</p>
        <span class="badge" style="background:#f1f5f9;color:#475569">Modulo 2ⁿ</span>
      </div>

      <div class="wheel-wrap">
        <svg class="wheel-svg" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="40" fill="none" stroke="var(--line)" stroke-width="6"/>
          <!-- Vạch phân chia tràn số -->
          <line x1="50" y1="4" x2="50" y2="16" stroke="var(--false)" stroke-width="2.5"/>
          <text x="50" y="24" font-size="6" font-family="ui-monospace,monospace" font-weight="700" fill="var(--false)" text-anchor="middle">OVERFLOW</text>
          
          <!-- Kim chỉ giá trị -->
          <line id="wheel-needle" x1="50" y1="50" x2="50" y2="20" stroke="var(--accent)" stroke-width="3" stroke-linecap="round"/>
          <circle cx="50" cy="50" r="4" fill="var(--accent)"/>
        </svg>
      </div>

      <div class="code-snip" id="code-snip"></div>
    </div>
  </div>
</div>

<script>
var curType = 'u8'; // 'u8', 'i8', '32'
var rawValue = 0;   // 0 .. 255 for 8-bit

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function qparam(k){ var m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }

function getSignedValue(u8){
  return (u8 & 128) ? (u8 - 256) : u8;
}

function updateUI(overflowMsg){
  var st = document.getElementById('status');
  var dVal = document.getElementById('dec-val');
  var hVal = document.getElementById('hex-val');
  var mathV = document.getElementById('math-view');
  var cSnip = document.getElementById('code-snip');
  var needle = document.getElementById('wheel-needle');

  if(curType === '32'){
    document.getElementById('type-badge').textContent = 'int 32-bit';
    document.getElementById('reg-title').textContent = 'Mô phỏng INT_MAX và UINT_MAX 32-bit';
    document.getElementById('bits-row').innerHTML = '<div style="padding:12px;font:13px ui-monospace,monospace;color:var(--muted)">32 bit: <code>01111111 11111111 11111111 11111111</code></div>';
    dVal.textContent = '2,147,483,647';
    hVal.textContent = '0x7FFFFFFF';
    mathV.innerHTML = '<b>INT_MAX</b> = 2³¹ - 1 = 2,147,483,647.<br>Cộng thêm 1 làm lật bit dấu cao nhất thành 1 ➜ <b style="color:var(--false)">-2,147,483,648</b> (INT_MIN)!';
    cSnip.innerHTML = '<span class="kw">int</span> x = <span class="num">2147483647</span>;<br>cout &lt;&lt; x + <span class="num">1</span>; <span class="cm">// in ra -2147483648!</span>';
    st.className = 'status overflow';
    st.innerHTML = '<b>⚠️ Tràn số int 32-bit:</b> <code>2147483647 + 1</code> quay vòng tức khắc sang cực âm <code>-2147483648</code> do quy tắc mã bù hai!';
    needle.setAttribute('transform', 'rotate(180 50 50)');
    return;
  }

  // 8-bit modes
  var isSigned = (curType === 'i8');
  document.getElementById('type-badge').textContent = isSigned ? 'int8_t (-128..127)' : 'uint8_t (0..255)';
  document.getElementById('reg-title').textContent = 'Dãy 8 bit nhị phân (bấm để bật/tắt)';

  // Render 8 bits
  var bHtml = '';
  for(var i=7; i>=0; i--){
    var bit = (rawValue >> i) & 1;
    var isSignBit = (isSigned && i === 7);
    var weight = (isSignBit ? '-128' : Math.pow(2, i));
    bHtml += '<div class="bit-cell' + (bit ? ' on' : '') + (isSignBit ? ' sign' : '') + '" onclick="toggleBit(' + i + ')">' +
      '<span class="bit-w">' + weight + '</span>' +
      '<div class="bit-btn">' + bit + '</div>' +
      '<span class="bit-idx">b' + i + '</span>' +
    '</div>';
  }
  document.getElementById('bits-row').innerHTML = bHtml;

  var currentDisplayVal = isSigned ? getSignedValue(rawValue) : rawValue;
  dVal.textContent = currentDisplayVal;
  hVal.textContent = '0x' + (rawValue < 16 ? '0' : '') + rawValue.toString(16).toUpperCase();

  // Math view
  var parts = [];
  for(var j=7; j>=0; j--){
    if((rawValue >> j) & 1){
      if(isSigned && j === 7) parts.push('-128');
      else parts.push(Math.pow(2, j));
    }
  }
  var mathStr = parts.length > 0 ? parts.join(' + ') + ' = <b>' + currentDisplayVal + '</b>' : '0 (tất cả các bit đều bằng 0)';
  mathV.innerHTML = '<b>Trọng số nhị phân:</b> ' + mathStr;

  // Code snippet
  if(isSigned){
    cSnip.innerHTML = '<span class="kw">int8_t</span> x = <span class="num">' + currentDisplayVal + '</span>;<br>' +
      'cout &lt;&lt; (<span class="kw">int</span>)(x + <span class="num">1</span>); <span class="cm">// kết quả nếu +1: ' + getSignedValue((rawValue + 1) & 255) + '</span>';
  } else {
    cSnip.innerHTML = '<span class="kw">uint8_t</span> x = <span class="num">' + currentDisplayVal + '</span>;<br>' +
      'cout &lt;&lt; (<span class="kw">int</span>)(x + <span class="num">1</span>); <span class="cm">// kết quả nếu +1: ' + ((rawValue + 1) & 255) + '</span>';
  }

  // Wheel needle angle:
  // For uint8: 0 is top (0 deg), 255 is almost 360 deg.
  // For int8: 0 is right (90 deg), 127 is top (0 deg), -128 is top, -1 is left.
  var angle = (rawValue / 256) * 360;
  needle.setAttribute('transform', 'rotate(' + angle + ' 50 50)');

  // Status
  if(overflowMsg){
    st.className = 'status overflow';
    st.innerHTML = '<b>⚠️ ' + esc(overflowMsg.title) + ':</b> ' + overflowMsg.desc;
  } else {
    st.className = 'status';
    st.innerHTML = '<b>Đang xem giá trị ' + currentDisplayVal + ':</b> Nhấp vào bit để đảo 0/1 hoặc bấm <code>+1</code> để tiến tới ngưỡng biên tràn số.';
  }
}

function setType(t){
  curType = t;
  document.getElementById('tab-u8').setAttribute('aria-selected', t === 'u8' ? 'true' : 'false');
  document.getElementById('tab-i8').setAttribute('aria-selected', t === 'i8' ? 'true' : 'false');
  document.getElementById('tab-32').setAttribute('aria-selected', t === '32' ? 'true' : 'false');

  var btns = document.getElementById('action-btns');
  if(t === '32'){
    btns.style.display = 'none';
  } else {
    btns.style.display = 'flex';
  }
  updateUI();
}

function toggleBit(k){
  if(curType === '32') return;
  rawValue ^= (1 << k);
  updateUI();
}

function stepVal(delta){
  if(curType === '32') return;
  var oldRaw = rawValue;
  var newRaw = (oldRaw + delta) & 255;
  var overflowInfo = null;

  if(curType === 'u8'){
    if(oldRaw + delta > 255){
      overflowInfo = {
        title: 'TRÀN TRÊN (OVERFLOW)',
        desc: oldRaw + ' + ' + delta + ' = ' + (oldRaw + delta) + ' vượt quá 8 bit (255). Bit thứ 9 rơi mất, giá trị quay về <b>' + newRaw + '</b>!'
      };
    } else if(oldRaw + delta < 0){
      overflowInfo = {
        title: 'TRÀN DƯỚI (UNDERFLOW)',
        desc: oldRaw + ' - ' + Math.abs(delta) + ' nhỏ hơn 0. Do quay vòng không dấu, giá trị nhảy lên cực đại <b>' + newRaw + '</b>!'
      };
    }
  } else { // i8
    var sOld = getSignedValue(oldRaw);
    var sExpected = sOld + delta;
    if(sExpected > 127){
      overflowInfo = {
        title: 'TRÀN TRÊN (OVERFLOW SỐ CÓ DẤU)',
        desc: sOld + ' + ' + delta + ' = ' + sExpected + ' vượt quá 127. Bit dấu lật sang 1, biến thành số âm <b>' + getSignedValue(newRaw) + '</b>!'
      };
    } else if(sExpected < -128){
      overflowInfo = {
        title: 'TRÀN DƯỚI (UNDERFLOW SỐ CÓ DẤU)',
        desc: sOld + ' - ' + Math.abs(delta) + ' nhỏ hơn -128. Giá trị lật sang số dương <b>' + getSignedValue(newRaw) + '</b>!'
      };
    }
  }

  rawValue = newRaw;
  updateUI(overflowInfo);
}

function jumpToMax(){
  if(curType === 'u8') rawValue = 255;
  else if(curType === 'i8') rawValue = 127;
  updateUI({
    title: 'ĐÃ ĐẾN GIÁ TRỊ CỰC ĐẠI (MAX)',
    desc: 'Hãy bấm <b>+1</b> để chứng kiến hiện tượng tràn số ngay lập tức!'
  });
}

function resetZero(){
  rawValue = 0;
  updateUI();
}

document.addEventListener('keydown', function(e){
  var tag = e.target && e.target.tagName;
  if(tag === 'INPUT' || tag === 'SELECT' || tag === 'TEXTAREA') return;
  if(e.key === 'ArrowRight' || e.key === 'ArrowUp'){ e.preventDefault(); stepVal(1); }
  else if(e.key === 'ArrowLeft' || e.key === 'ArrowDown'){ e.preventDefault(); stepVal(-1); }
});

// Query params support
var qt = qparam('kieu');
if(qt === 'i8') setType('i8');
else if(qt === '32') setType('32');
else setType('u8');

var qv = parseInt(qparam('val'), 10);
if(!isNaN(qv) && qv >= 0 && qv <= 255){
  rawValue = qv;
  updateUI();
}
</script>
</body>
</html>
