<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="600">
<title>Mô phỏng thuật toán Euclid (Tìm GCD & LCM)</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
    --warn:#b45309; --warn-soft:#fef3c7;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --warn:#fcd34d; --warn-soft:#3a2e10;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  code{font-family:ui-monospace,monospace;font-size:12.5px;background:var(--code-bg);padding:1px 4px;border-radius:4px}
  .wrap{max-width:960px;margin:0 auto;padding:10px 12px 12px}
  .lead{color:var(--muted);margin:0 0 8px;font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  
  .controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
  .field{display:flex;align-items:center;gap:6px}
  .field label{font-weight:600;font-size:12.5px;color:var(--muted)}
  .field input{padding:4px 8px;border:1px solid var(--line);border-radius:6px;
    background:var(--card);color:var(--text);font:13px ui-monospace,monospace}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:5px 11px;border-radius:6px;
    cursor:pointer;font:inherit;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
    padding:8px 12px;margin-bottom:8px;min-height:52px;font-size:13.5px;line-height:1.5}
  .status .st-title{display:block;font-size:12px;color:var(--accent);margin-bottom:2px;font-weight:700}
  .status.ok{border-left-color:var(--true);background:var(--true-soft)}
  .status.ok .st-title{color:var(--true)}
  .status.warn{border-left-color:var(--warn);background:var(--warn-soft)}
  .status.warn .st-title{color:var(--warn)}

  .grid{display:grid;grid-template-columns:1.05fr 1.25fr;gap:10px}
  .grid>*{min-width:0}
  @media (max-width:640px){.grid{grid-template-columns:1fr}}
  .panel-title{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
  .code{background:var(--code-bg);border-radius:8px;padding:6px 0;overflow-x:auto;
    font:12.5px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 8px 0 0;border-left:3px solid transparent}
  .ln .no{width:26px;flex:none;text-align:right;padding-right:8px;color:var(--muted);opacity:.7;user-select:none}
  .ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--muted);font-style:italic}
  .right-col{display:flex;flex-direction:column;gap:10px}

  /* Segment visualizer */
  .segment-box{background:var(--code-bg);border-radius:8px;padding:8px 10px;margin-bottom:8px}
  .seg-row{display:flex;align-items:center;gap:8px;margin-bottom:6px;font-size:12.5px;font-family:ui-monospace,monospace}
  .seg-label{width:24px;color:var(--muted);font-weight:700}
  .seg-bar{height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11.5px;transition:all .3s}
  .seg-a{background:#3b82f6}
  .seg-b-wrap{display:flex;gap:2px;flex:1}
  .seg-b{background:#10b981;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px}
  .seg-r{background:#f59e0b;height:22px;border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px}

  /* Trace Table */
  .tbl{width:100%;border-collapse:collapse;font:12.5px ui-monospace,monospace;margin-top:4px}
  .tbl th{background:var(--code-bg);padding:4px 6px;text-align:left;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted)}
  .tbl td{padding:4px 6px;border-bottom:1px solid var(--line)}
  .tbl tr.cur td{background:var(--cur)}

  /* Result Badge */
  .res-card{background:var(--true-soft);border:1.5px solid var(--true);border-radius:8px;padding:8px 12px;margin-top:6px;display:none}
  .res-title{font-size:13px;font-weight:700;color:var(--true);margin-bottom:2px}
  .res-math{font:13.5px ui-monospace,monospace;color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <p class="lead">Theo dõi quá trình phân rã đoạn thẳng và biến đổi biến số dư <code>r = a % b</code> để tìm ước chung lớn nhất và bội chung nhỏ nhất.</p>
  
  <div class="controls">
    <div class="field">
      <label for="inp_a">Số a =</label>
      <input type="number" id="inp_a" value="48" min="1" max="9999" style="width:68px">
    </div>
    <div class="field">
      <label for="inp_b">Số b =</label>
      <input type="number" id="inp_b" value="18" min="1" max="9999" style="width:68px">
    </div>
    <div class="btns">
      <button class="btn" id="next">Bước tiếp</button>
      <button class="btn ghost" id="prev">Lùi lại</button>
      <button class="btn ghost" id="all">Chạy hết</button>
      <button class="btn ghost" id="reset">Làm lại</button>
    </div>
  </div>

  <div class="status" id="status" aria-live="polite"></div>

  <div class="grid">
    <div class="card">
      <p class="panel-title">Mã nguồn C++ Thuật toán Euclid</p>
      <div class="code" id="code"></div>
    </div>
    <div class="right-col">
      <div class="card">
        <p class="panel-title">Phân rã đoạn thẳng hình học</p>
        <div class="segment-box" id="seg_box"></div>

        <p class="panel-title" style="margin-top:8px">Bảng lần vết biến đổi trạng thái</p>
        <table class="tbl">
          <thead>
            <tr>
              <th>Lượt</th>
              <th>a</th>
              <th>b</th>
              <th>r = a % b</th>
              <th>Cập nhật (a=b; b=r)</th>
            </tr>
          </thead>
          <tbody id="tbl_body"></tbody>
        </table>

        <div class="res-card" id="res_card">
          <div class="res-title" id="res_title">KẾT QUẢ TÍNH TOÁN</div>
          <div class="res-math" id="res_math"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hl(src){
  var re = /("(?:[^"\\]|\\.)*")|(\/\/.*$)|\b(int|double|bool|while|return|cout|endl)\b|(\b\d+(?:\.\d+)?\b)/g, out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="cm">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="kw">' + m[3] + '</span>';
    else out += '<span class="num">' + m[4] + '</span>';
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

var origA = 48;
var origB = 18;

function getLines(){
  return [
    'int a = ' + origA + ', b = ' + origB + ';',
    'while (b != 0) {',
    '  int r = a % b; // Tinh so du',
    '  a = b;         // Gan b sang a',
    '  b = r;         // Gan r sang b',
    '}',
    'int gcd = a;',
    'int lcm = (orig_a / gcd) * orig_b;'
  ];
}

function buildSnaps(){
  var snaps = [];
  var a = origA;
  var b = origB;
  var rows = [];

  // Bước 0: Sẵn sàng
  snaps.push({
    ln: 0,
    a: a, b: b, r: '?',
    rows: [],
    showResult: false,
    statusTag: 'Khởi tạo thuật toán Euclid',
    statusCls: '',
    statusMsg: 'Bắt đầu với <code>a = ' + a + '</code> và <code>b = ' + b + '</code>. Chuẩn bị vòng lặp chia lấy dư.'
  });

  var round = 1;
  while (b !== 0) {
    // Kiểm tra b != 0: dòng 1
    snaps.push({
      ln: 1,
      a: a, b: b, r: '?',
      rows: rows.slice(),
      showResult: false,
      statusTag: 'Lượt ' + round + ': Kiểm tra b != 0',
      statusCls: 'ok',
      statusMsg: 'Đánh giá <code>b != 0</code> (' + b + ' != 0) → <b>true</b>. Tiến vào thân vòng lặp tính số dư.'
    });

    // Tính r = a % b: dòng 2
    var r = a % b;
    var q = Math.floor(a / b);
    snaps.push({
      ln: 2,
      a: a, b: b, r: r,
      q: q,
      rows: rows.slice(),
      showResult: false,
      statusTag: 'Lượt ' + round + ': Tính số dư r = a % b',
      statusCls: '',
      statusMsg: 'Thực thi <code>r = ' + a + ' % ' + b + ' = <b>' + r + '</b></code> (' + a + ' = ' + q + ' × ' + b + ' + ' + r + ').'
    });

    // Cập nhật gán chéo a = b; b = r;: dòng 3, 4
    var nextA = b;
    var nextB = r;
    rows.push({
      round: round,
      a: a, b: b, r: r,
      action: 'a = ' + nextA + '; b = ' + nextB + ';'
    });

    snaps.push({
      ln: 3,
      a: nextA, b: nextB, r: r,
      q: q,
      rows: rows.slice(),
      showResult: false,
      statusTag: 'Lượt ' + round + ': Gán chéo biến',
      statusCls: '',
      statusMsg: 'Gán chéo: <code>a = b;</code> (' + nextA + ') và <code>b = r;</code> (' + nextB + '). Vòng quay lại kiểm tra điều kiện.'
    });

    a = nextA;
    b = nextB;
    round++;
  }

  // Kết thúc vòng lặp: dòng 1 (b == 0 -> false)
  var gcd = a;
  var lcm = Math.floor(origA / gcd) * origB;
  snaps.push({
    ln: 1,
    a: a, b: 0, r: 0,
    rows: rows.slice(),
    showResult: false,
    statusTag: 'Điều kiện dừng: b == 0',
    statusCls: 'ok',
    statusMsg: 'Đánh giá <code>b != 0</code> (0 != 0) → <b>false</b>! Dừng vòng lặp. Giá trị ƯCLN nằm tại biến <code>a = ' + gcd + '</code>.'
  });

  // Tính LCM và kết thúc: dòng 6, 7
  snaps.push({
    ln: 6,
    a: a, b: 0, r: 0,
    rows: rows.slice(),
    showResult: true,
    gcd: gcd,
    lcm: lcm,
    statusTag: 'Hoàn thành tính toán',
    statusCls: 'ok',
    statusMsg: 'ƯCLN <code>GCD(' + origA + ', ' + origB + ') = <b>' + gcd + '</b></code>. BCNN <code>LCM = (' + origA + ' / ' + gcd + ') × ' + origB + ' = <b>' + lcm + '</b></code>.'
  });

  return snaps;
}

function qparam(k){ var m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }

var snaps = [];
var curIdx = 0;
var timer = null;

function renderCode(curLine){
  var lines = getLines();
  $('code').innerHTML = lines.map(function(l, i){
    var on = (i === curLine);
    return '<div class="ln' + (on ? ' cur' : '') + '"><span class="no">' + (i + 1) + '</span><span>' + hl(l) + '</span></div>';
  }).join('');
}

function renderVisuals(s){
  // Bảng phân rã đoạn thẳng
  var segHtml = '';
  if (s.b > 0 && s.r !== '?') {
    var q = s.q || Math.floor(s.a / s.b);
    var bBars = '';
    for (var i = 0; i < q; i++) {
      bBars += '<div class="seg-b" style="flex:1">b=' + s.b + '</div>';
    }
    var rBar = (s.r > 0) ? '<div class="seg-r" style="flex:' + (s.r / s.b) + '">dư r=' + s.r + '</div>' : '';
    segHtml = 
      '<div class="seg-row"><span class="seg-label">a:</span><div class="seg-bar seg-a" style="flex:1">a = ' + (q * s.b + s.r) + '</div></div>' +
      '<div class="seg-row"><span class="seg-label">b:</span><div class="seg-b-wrap">' + bBars + rBar + '</div></div>';
  } else {
    segHtml = '<div style="color:var(--muted);font-size:12px;padding:4px 0">Chuẩn bị so khớp kích thước đoạn thẳng a và b...</div>';
  }
  $('seg_box').innerHTML = segHtml;

  // Bảng trace
  var tbody = $('tbl_body');
  if (s.rows.length === 0) {
    tbody.innerHTML = '<tr><td colspan="5" style="color:var(--muted);text-align:center">(chưa thực hiện lượt nào)</td></tr>';
  } else {
    tbody.innerHTML = s.rows.map(function(rw, idx){
      var isCur = (idx === s.rows.length - 1);
      return '<tr' + (isCur ? ' class="cur"' : '') + '>' +
        '<td><b>Lượt ' + rw.round + '</b></td>' +
        '<td>' + rw.a + '</td>' +
        '<td>' + rw.b + '</td>' +
        '<td><b>' + rw.r + '</b></td>' +
        '<td><code>' + esc(rw.action) + '</code></td>' +
        '</tr>';
    }).join('');
  }

  // Kết quả thẻ
  var rc = $('res_card');
  if (s.showResult) {
    rc.style.display = 'block';
    $('res_math').innerHTML = 
      '• <b>Ước chung lớn nhất (GCD):</b> <code>' + s.gcd + '</code><br>' +
      '• <b>Bội chung nhỏ nhất (LCM):</b> <code>(' + origA + ' / ' + s.gcd + ') × ' + origB + ' = ' + s.lcm + '</code>';
  } else {
    rc.style.display = 'none';
  }
}

function render(s){
  renderCode(s.ln);
  renderVisuals(s);

  var st = $('status');
  st.className = 'status' + (s.statusCls ? ' ' + s.statusCls : '');
  st.innerHTML = '<span class="st-title">' + esc(s.statusTag) + '</span>' + s.statusMsg;

  var isRunning = timer !== null;
  $('next').disabled = (curIdx >= snaps.length - 1) || isRunning;
  $('prev').disabled = (curIdx <= 0) || isRunning;
  $('all').textContent = isRunning ? 'Dừng' : 'Chạy hết';
  $('all').disabled = !isRunning && (curIdx >= snaps.length - 1);
}

function stopTimer(){
  if (timer) { clearInterval(timer); timer = null; }
}

function setStep(idx){
  stopTimer();
  curIdx = Math.max(0, Math.min(snaps.length - 1, idx));
  render(snaps[curIdx]);
}

function parseInputs(){
  origA = parseInt($('inp_a').value, 10);
  origB = parseInt($('inp_b').value, 10);
  if (isNaN(origA) || origA <= 0) origA = 48;
  if (isNaN(origB) || origB <= 0) origB = 18;
}

function initSim(){
  stopTimer();
  parseInputs();
  snaps = buildSnaps();
  curIdx = 0;
  var b = Number(qparam('buoc'));
  if (b > 0) curIdx = Math.min(snaps.length - 1, b - 1);
  render(snaps[curIdx]);
}

$('next').onclick = function(){ if (curIdx < snaps.length - 1) { curIdx++; render(snaps[curIdx]); } };
$('prev').onclick = function(){ if (curIdx > 0) { curIdx--; render(snaps[curIdx]); } };
$('reset').onclick = function(){ setStep(0); };
$('all').onclick = function(){
  if (timer) { stopTimer(); render(snaps[curIdx]); return; }
  timer = setInterval(function(){
    if (curIdx >= snaps.length - 1) { stopTimer(); render(snaps[curIdx]); return; }
    curIdx++;
    render(snaps[curIdx]);
    if (curIdx >= snaps.length - 1) { stopTimer(); render(snaps[curIdx]); }
  }, 600);
  render(snaps[curIdx]);
};

$('inp_a').onchange = initSim;
$('inp_b').onchange = initSim;

document.addEventListener('keydown', function(e){
  var t = e.target && e.target.tagName;
  if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); $('next').click(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); $('prev').click(); }
});

initSim();
</script>
</body>
</html>
