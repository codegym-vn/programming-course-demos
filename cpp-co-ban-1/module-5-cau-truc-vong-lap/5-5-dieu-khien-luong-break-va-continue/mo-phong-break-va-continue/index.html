<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="600">
<title>Bộ mô phỏng break vs continue trong for và while</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
    --warn:#b45309; --warn-soft:#fef3c7;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --warn:#fcd34d; --warn-soft:#3a2e10;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  code{font-family:ui-monospace,monospace;font-size:12.5px;background:var(--code-bg);padding:1px 4px;border-radius:4px}
  .wrap{max-width:960px;margin:0 auto;padding:10px 12px 12px}
  .lead{color:var(--muted);margin:0 0 8px;font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
  
  .controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
  .field{display:flex;align-items:center;gap:6px}
  .field label{font-weight:600;font-size:12.5px;color:var(--muted)}
  .field select{padding:4px 8px;border:1px solid var(--line);border-radius:6px;
    background:var(--card);color:var(--text);font:13px ui-monospace,monospace}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:5px 11px;border-radius:6px;
    cursor:pointer;font:inherit;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
    padding:8px 12px;margin-bottom:8px;min-height:52px;font-size:13.5px;line-height:1.5}
  .status .st-title{display:block;font-size:12px;color:var(--accent);margin-bottom:2px;font-weight:700}
  .status.ok{border-left-color:var(--true);background:var(--true-soft)}
  .status.ok .st-title{color:var(--true)}
  .status.bad{border-left-color:var(--false);background:var(--false-soft)}
  .status.bad .st-title{color:var(--false)}
  .status.warn{border-left-color:var(--warn);background:var(--warn-soft)}
  .status.warn .st-title{color:var(--warn)}

  .grid{display:grid;grid-template-columns:1.15fr 1.15fr;gap:10px}
  .grid>*{min-width:0}
  @media (max-width:640px){.grid{grid-template-columns:1fr}}
  .panel-title{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
  .code{background:var(--code-bg);border-radius:8px;padding:6px 0;overflow-x:auto;min-height:160px;
    font:12.5px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 8px 0 0;border-left:3px solid transparent}
  .ln .no{width:26px;flex:none;text-align:right;padding-right:8px;color:var(--muted);opacity:.7;user-select:none}
  .ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--muted);font-style:italic}
  .right-col{display:flex;flex-direction:column;gap:10px}

  .vars{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .var-box{background:var(--code-bg);border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center;transition:all .2s}
  .var-box small{display:block;color:var(--muted);font:11px ui-monospace,monospace}
  .var-box strong{font:700 18px ui-monospace,monospace;color:var(--text)}
  .var-box.chg{border-color:var(--cur-bar);background:var(--cur)}
  .var-box.alert{border-color:var(--false);background:var(--false-soft);color:var(--false)}

  .console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:8px 10px;min-height:46px;
    font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap}
  .console .ph{color:#64748b;font-family:system-ui,sans-serif;font-size:12px}

  .flow-alert{padding:8px 12px;border-radius:6px;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px}
  .flow-alert.normal{background:var(--accent-soft);color:var(--accent)}
  .flow-alert.trap{background:var(--false-soft);color:var(--false);border:1px solid var(--false)}
</style>
</head>
<body>
<div class="wrap">
  <p class="lead">Thử nghiệm thay đổi lệnh tại <code>i == 3</code> để khám phá cơ chế ngắt ngang của <code>break</code> và bẫy lặp vô hạn của <code>continue</code> trong <code>while</code>.</p>
  
  <div class="controls">
    <div class="field">
      <label for="loop_sel">Loại vòng lặp:</label>
      <select id="loop_sel">
        <option value="for" selected>for (int i = 1; i &lt;= 5; ++i)</option>
        <option value="while">while (i &lt;= 5) (có i++ ở đáy)</option>
      </select>
    </div>
    <div class="field">
      <label for="action_sel">Khi i == 3:</label>
      <select id="action_sel">
        <option value="none">Không can thiệp (chạy bình thường)</option>
        <option value="break">break; (ngắt vòng lặp)</option>
        <option value="continue" selected>continue; (bỏ qua lượt này)</option>
      </select>
    </div>
    <div class="btns">
      <button class="btn" id="next">Bước tiếp</button>
      <button class="btn ghost" id="prev">Lùi lại</button>
      <button class="btn ghost" id="all">Chạy hết</button>
      <button class="btn ghost" id="reset">Làm lại</button>
    </div>
  </div>

  <div class="status" id="status" aria-live="polite"></div>

  <div class="grid">
    <div class="card">
      <p class="panel-title">Mã nguồn C++ thực thi</p>
      <div class="code" id="code"></div>
    </div>
    <div class="right-col">
      <div class="card">
        <p class="panel-title">Theo dõi biến điều khiển</p>
        <div class="vars" id="vars"></div>
        <p class="panel-title" style="margin-top:10px">Màn hình Console Output</p>
        <div class="console" id="console"></div>
        <div style="margin-top:8px" id="flow_box"></div>
      </div>
    </div>
  </div>
</div>

<script>
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hl(src){
  var re = /("(?:[^"\\]|\\.)*")|(\/\/.*$)|\b(int|double|bool|while|for|if|break|continue|return|cout|endl)\b|(\b\d+(?:\.\d+)?\b)/g, out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="cm">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="kw">' + m[3] + '</span>';
    else out += '<span class="num">' + m[4] + '</span>';
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

var loopType = 'for';
var actionType = 'continue';

function getLines(){
  if (loopType === 'for') {
    var actLine = (actionType === 'break') ? '    break;' : (actionType === 'continue' ? '    continue;' : '    // khong can thiep');
    return [
      'for (int i = 1; i <= 5; ++i) {',
      '  if (i == 3) {',
      actLine,
      '  }',
      '  cout << i << " ";',
      '}',
      'cout << "| Xong\\n";'
    ];
  } else {
    var actLineW = (actionType === 'break') ? '    break;' : (actionType === 'continue' ? '    continue; // NGUY HIEM!' : '    // khong can thiep');
    return [
      'int i = 1;',
      'while (i <= 5) {',
      '  if (i == 3) {',
      actLineW,
      '  }',
      '  cout << i << " ";',
      '  i++; // Dat o day!',
      '}',
      'cout << "| Xong\\n";'
    ];
  }
}

function buildSnaps(){
  var snaps = [];
  var con = '';

  if (loopType === 'for') {
    snaps.push({
      ln: 0, i: 1, con: '', chg: 'i',
      statusTag: 'Khởi tạo for', statusCls: '',
      statusMsg: 'Bắt đầu vòng lặp <code>for (int i = 1; i <= 5; ++i)</code>.'
    });

    for (var i = 1; i <= 5; i++) {
      // Dòng 0: điều kiện i <= 5
      snaps.push({
        ln: 0, i: i, con: con, chg: '',
        statusTag: 'Lượt i = ' + i + ': Kiểm tra i <= 5', statusCls: 'ok',
        statusMsg: '<code>' + i + ' <= 5</code> → <b>true</b>. Tiến vào thân <code>for</code>.'
      });

      // Dòng 1: if (i == 3)
      var hit3 = (i === 3);
      snaps.push({
        ln: 1, i: i, con: con, chg: '',
        statusTag: 'Kiểm tra if (i == 3)', statusCls: hit3 ? 'warn' : '',
        statusMsg: 'Đánh giá <code>i == 3</code> (' + i + ' == 3) → <b>' + (hit3 ? 'true' : 'false') + '</b>.'
      });

      if (hit3) {
        if (actionType === 'break') {
          snaps.push({
            ln: 2, i: i, con: con, chg: '',
            statusTag: 'Gặp break;', statusCls: 'bad',
            statusMsg: 'Thực thi <code>break;</code>! Luồng điều khiển lập tức <b>đâm xuyên qua ngoặc nhọn }</b>, thoát khỏi vòng lặp ngay tại <code>i = 3</code>.'
          });
          break;
        } else if (actionType === 'continue') {
          snaps.push({
            ln: 2, i: i, con: con, chg: '',
            statusTag: 'Gặp continue; trong for', statusCls: 'warn',
            statusMsg: 'Thực thi <code>continue;</code>! Bỏ qua các câu lệnh còn lại trong thân. Luồng nhảy vọt lên phần cập nhật <b>++i</b>!'
          });
          continue;
        }
      }

      // Dòng 4: cout << i << " ";
      con += i + ' ';
      snaps.push({
        ln: 4, i: i, con: con, chg: '',
        statusTag: 'In kết quả', statusCls: '',
        statusMsg: 'Thực thi <code>cout << i</code> → In số <b>' + i + '</b> ra Console.'
      });
    }

    snaps.push({
      ln: 6, i: (actionType === 'break' ? 3 : 6), con: con + '| Xong', chg: '',
      statusTag: 'Hoàn thành chương trình', statusCls: 'ok',
      statusMsg: 'Vòng lặp kết thúc. Đầu ra Console: <code>' + (con + '| Xong') + '</code>.'
    });

  } else {
    // WHILE LOOP
    snaps.push({
      ln: 0, i: 1, con: '', chg: 'i',
      statusTag: 'Khởi tạo while', statusCls: '',
      statusMsg: 'Khởi tạo <code>int i = 1;</code> trước <code>while</code>.'
    });

    var w_i = 1;
    var trapCount = 0;
    while (w_i <= 5) {
      // Dòng 1: while (i <= 5)
      snaps.push({
        ln: 1, i: w_i, con: con, chg: '',
        statusTag: 'Kiểm tra while (i <= 5)', statusCls: 'ok',
        statusMsg: '<code>' + w_i + ' <= 5</code> → <b>true</b>. Tiến vào thân <code>while</code>.'
      });

      // Dòng 2: if (i == 3)
      var hit3_w = (w_i === 3);
      snaps.push({
        ln: 2, i: w_i, con: con, chg: '',
        statusTag: 'Kiểm tra if (i == 3)', statusCls: hit3_w ? 'warn' : '',
        statusMsg: 'Đánh giá <code>i == 3</code> (' + w_i + ' == 3) → <b>' + (hit3_w ? 'true' : 'false') + '</b>.'
      });

      if (hit3_w) {
        if (actionType === 'break') {
          snaps.push({
            ln: 3, i: w_i, con: con, chg: '',
            statusTag: 'Gặp break; trong while', statusCls: 'bad',
            statusMsg: 'Thực thi <code>break;</code>! Luồng thoát khỏi <code>while</code> ngay lập tức tại <code>i = 3</code>.'
          });
          break;
        } else if (actionType === 'continue') {
          trapCount++;
          snaps.push({
            ln: 3, i: w_i, con: con, chg: '', isTrap: true,
            statusTag: 'CẠM BẪY LẶP VÔ HẠN!', statusCls: 'bad',
            statusMsg: 'Thực thi <code>continue;</code> trong <code>while</code>! Luồng nhảy thẳng lên đầu <code>while (i <= 5)</code>, <b>bỏ qua dòng i++; ở cuối!</b>'
          });

          // Mô phỏng kẹt 2 lượt rồi cảnh báo dừng an toàn
          if (trapCount >= 2) {
            snaps.push({
              ln: 1, i: w_i, con: con, chg: '', isTrap: true,
              statusTag: 'CHƯƠNG TRÌNH BỊ TREO!', statusCls: 'bad',
              statusMsg: 'Biến <code>i</code> kẹt cứng ở giá trị <b>3</b> mãi mãi! Điều kiện <code>3 <= 5</code> luôn là <code>true</code>. Đã tự động ngắt để bảo vệ trình duyệt.'
            });
            return snaps;
          }
          continue; // Lặp lại với w_i = 3
        }
      }

      // Dòng 5: cout << i << " ";
      con += w_i + ' ';
      snaps.push({
        ln: 5, i: w_i, con: con, chg: '',
        statusTag: 'In kết quả', statusCls: '',
        statusMsg: 'In số <b>' + w_i + '</b> ra Console.'
      });

      // Dòng 6: i++;
      w_i++;
      snaps.push({
        ln: 6, i: w_i, con: con, chg: 'i',
        statusTag: 'Tăng biến đếm i++', statusCls: '',
        statusMsg: 'Thực thi <code>i++;</code> (chuyển sang <b>' + w_i + '</b>).'
      });
    }

    snaps.push({
      ln: 8, i: (actionType === 'break' ? 3 : 6), con: con + '| Xong', chg: '',
      statusTag: 'Hoàn thành chương trình', statusCls: 'ok',
      statusMsg: 'Vòng lặp kết thúc bình thường. Đầu ra Console: <code>' + (con + '| Xong') + '</code>.'
    });
  }

  return snaps;
}

function qparam(k){ var m = new RegExp('[?&]' + k + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }

var snaps = [];
var curIdx = 0;
var timer = null;

function renderCode(curLine){
  var lines = getLines();
  $('code').innerHTML = lines.map(function(l, i){
    var on = (i === curLine);
    return '<div class="ln' + (on ? ' cur' : '') + '"><span class="no">' + (i + 1) + '</span><span>' + hl(l) + '</span></div>';
  }).join('');
}

function render(s){
  renderCode(s.ln);

  $('vars').innerHTML = 
    '<div class="var-box' + (s.chg === 'i' ? ' chg' : '') + (s.isTrap ? ' alert' : '') + '"><small>biến i</small><strong>' + esc(s.i) + '</strong></div>' +
    '<div class="var-box"><small>cấu trúc</small><strong style="font-size:14px">' + esc(loopType) + '</strong></div>';

  $('console').innerHTML = s.con ? esc(s.con) : '<span class="ph">(chưa có đầu ra console)</span>';

  var fb = $('flow_box');
  if (s.isTrap) {
    fb.className = 'flow-alert trap';
    fb.innerHTML = '⚠️ <b>CẢNH BÁO:</b> Dòng <code>i++;</code> bị bỏ qua vĩnh viễn vì continue!';
  } else if (actionType === 'break' && s.ln === 2) {
    fb.className = 'flow-alert normal';
    fb.innerHTML = '⚡ <b>BREAK:</b> Văng ra khỏi vòng lặp ngay tức khắc!';
  } else if (actionType === 'continue' && s.ln === 2) {
    fb.className = 'flow-alert normal';
    fb.innerHTML = '↷ <b>CONTINUE TRONG FOR:</b> Vẫn nhảy lên ++i an toàn!';
  } else {
    fb.className = '';
    fb.innerHTML = '';
  }

  var st = $('status');
  st.className = 'status' + (s.statusCls ? ' ' + s.statusCls : '');
  st.innerHTML = '<span class="st-title">' + esc(s.statusTag) + '</span>' + s.statusMsg;

  var isRunning = timer !== null;
  $('next').disabled = (curIdx >= snaps.length - 1) || isRunning;
  $('prev').disabled = (curIdx <= 0) || isRunning;
  $('all').textContent = isRunning ? 'Dừng' : 'Chạy hết';
  $('all').disabled = !isRunning && (curIdx >= snaps.length - 1);
}

function stopTimer(){
  if (timer) { clearInterval(timer); timer = null; }
}

function setStep(idx){
  stopTimer();
  curIdx = Math.max(0, Math.min(snaps.length - 1, idx));
  render(snaps[curIdx]);
}

function initSim(){
  stopTimer();
  loopType = $('loop_sel').value;
  actionType = $('action_sel').value;
  snaps = buildSnaps();
  curIdx = 0;
  var b = Number(qparam('buoc'));
  if (b > 0) curIdx = Math.min(snaps.length - 1, b - 1);
  render(snaps[curIdx]);
}

$('next').onclick = function(){ if (curIdx < snaps.length - 1) { curIdx++; render(snaps[curIdx]); } };
$('prev').onclick = function(){ if (curIdx > 0) { curIdx--; render(snaps[curIdx]); } };
$('reset').onclick = function(){ setStep(0); };
$('all').onclick = function(){
  if (timer) { stopTimer(); render(snaps[curIdx]); return; }
  timer = setInterval(function(){
    if (curIdx >= snaps.length - 1) { stopTimer(); render(snaps[curIdx]); return; }
    curIdx++;
    render(snaps[curIdx]);
    if (curIdx >= snaps.length - 1) { stopTimer(); render(snaps[curIdx]); }
  }, 500);
  render(snaps[curIdx]);
};

$('loop_sel').onchange = initSim;
$('action_sel').onchange = initSim;

document.addEventListener('keydown', function(e){
  var t = e.target && e.target.tagName;
  if (t === 'INPUT' || t === 'SELECT' || t === 'TEXTAREA') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); $('next').click(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); $('prev').click(); }
});

var qLoop = qparam('loop');
if (qLoop) { $('loop_sel').value = qLoop; loopType = qLoop; }
var qAct = qparam('action');
if (qAct) { $('action_sel').value = qAct; actionType = qAct; }

initSim();
</script>
</body>
</html>
