<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="420">
<title>Chế độ chọn của ListView</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
  --accent:#2563eb; --accent-soft:#e7eefc;
  --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
  --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
  --con-bg:#111827; --con-text:#e5e7eb;
  --kw:#7c3aed; --str:#047857; --num:#c2410c; --cmt:#6b7280;
  --node:#ffffff; --node-line:#c9ced8;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
    --accent:#6ea0ff; --accent-soft:#1e2a44;
    --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
    --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
    --con-bg:#05070b; --con-text:#e5e7eb;
    --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74; --cmt:#8b93a1;
    --node:#1d222c; --node-line:#3a4250;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
code{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.wrap{max-width:1000px;margin:0 auto;padding:8px 12px 10px}
.lead{color:var(--muted);margin:0 0 6px;font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.controls{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin:6px 0}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:5px 12px;border-radius:8px;
  cursor:pointer;font:inherit;font-weight:600;font-size:13.5px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:2px 9px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.err{color:var(--false);font-size:12.5px}
.err:empty{display:none}
.status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
  padding:5px 12px;margin-bottom:6px;min-height:62px;font-size:13.5px}
.status>b{display:block;font-size:12.5px;color:var(--accent)}
.panel-title{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
.code{position:relative;background:var(--code-bg);border-radius:8px;padding:5px 0;overflow:auto;
  font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ln{display:flex;white-space:pre;padding:0 4px 0 0;border-left:3px solid transparent;width:max-content;min-width:100%}
.ln .no{width:22px;flex:none;text-align:right;padding-right:6px;color:var(--muted);opacity:.6;user-select:none}
.ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
.ln.dim{opacity:.45}
.kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--cmt);font-style:italic}
.console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:6px 10px;min-height:40px;white-space:pre-wrap;word-break:break-word;overflow:auto;
  font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.console .ph{color:#7b8494;font-family:system-ui,sans-serif;font-size:12.5px}
kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:3px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
.tab.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tag{display:inline-block;padding:0 6px;border-radius:5px;font:700 12px ui-monospace,Menlo,Consolas,monospace}
.tag.t{background:var(--true-soft);color:var(--true)}.tag.f{background:var(--false-soft);color:var(--false)}
.vars{width:100%;border-collapse:collapse;font:12px ui-monospace,Menlo,Consolas,monospace}
.vars td,.vars th{border-bottom:1px solid var(--line);padding:2px 6px;text-align:left}
.vars th{font:700 11.5px system-ui,sans-serif;color:var(--muted)}
.vars tr.chg td{background:var(--cur)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.note{color:var(--muted);font-size:12px}

/* ===== Cửa sổ JavaFX mô phỏng (giao diện Modena; luôn sáng như ảnh chụp thật) ===== */
.fxwin{border:1px solid #a9a9a9;border-radius:8px;overflow:hidden;background:#f4f4f4;box-shadow:0 2px 8px rgba(0,0,0,.18);
  color:#333;font:13px/1.25 -apple-system,"Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;width:max-content;max-width:100%}
.fxbar{height:24px;background:linear-gradient(#ececec,#d9d9d9);border-bottom:1px solid #b9b9b9;display:flex;align-items:center;
  position:relative;font-size:12.5px;color:#4a4a4a;user-select:none}
.fxbar i{width:11px;height:11px;border-radius:50%;margin-left:7px;display:inline-block;flex:none}
.fxbar i:nth-child(1){background:#ff5f57;margin-left:9px}.fxbar i:nth-child(2){background:#febc2e}.fxbar i:nth-child(3){background:#28c840}
.fxbar span{position:absolute;left:0;right:0;text-align:center;pointer-events:none}
.fxbody{position:relative;background:#f4f4f4;overflow:hidden}
.fx-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border:1px solid #b2b2b2;border-radius:4px;
  background:linear-gradient(#fefefe,#e3e3e3);box-shadow:inset 0 1px 0 #fff;color:#333;font:inherit;cursor:pointer;line-height:1.3}
.fx-btn:hover{background:linear-gradient(#ffffff,#ebebeb)}
.fx-btn:active,.fx-btn.armed{background:linear-gradient(#d6d6d6,#e2e2e2)}
.fx-btn:focus-visible{outline:none;border-color:#039ed3;box-shadow:0 0 0 2px #91d4ee}
.fx-check,.fx-radio{display:inline-flex;align-items:center;gap:6px;cursor:pointer;user-select:none;background:none;border:0;padding:0;color:#333;font:inherit}
.fx-check .box{width:15px;height:15px;border:1px solid #a8a8a8;border-radius:3px;background:linear-gradient(#fdfdfd,#e8e8e8);position:relative;flex:none}
.fx-check.on .box::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #333;border-width:0 2px 2px 0;transform:rotate(45deg)}
.fx-radio .box{width:15px;height:15px;border:1px solid #a8a8a8;border-radius:50%;background:linear-gradient(#fdfdfd,#e8e8e8);position:relative;flex:none}
.fx-radio.on .box::after{content:"";position:absolute;left:3.5px;top:3.5px;width:6px;height:6px;border-radius:50%;background:#333}
.fx-check:focus-visible .box,.fx-radio:focus-visible .box{border-color:#039ed3;box-shadow:0 0 0 2px #91d4ee}
.fx-check:focus-visible,.fx-radio:focus-visible{outline:none}
.fx-tf{border:1px solid #b5b5b5;border-radius:3px;background:#fff;box-shadow:inset 0 1px 1px #ddd;padding:3px 6px;color:#333;
  font:inherit;min-width:0}
.fx-tf:focus{outline:none;border-color:#039ed3;box-shadow:0 0 0 2px #91d4ee}
.fx-combo{display:inline-flex;align-items:center;gap:10px;padding:3px 8px;border:1px solid #b2b2b2;border-radius:4px;
  background:linear-gradient(#fefefe,#e3e3e3);color:#333;font:inherit;cursor:pointer}
.fx-combo::after{content:"";border:4px solid transparent;border-top:5px solid #333;margin-top:4px}
.fx-list{background:#fff;border:1px solid #b5b5b5;overflow:hidden}
.fx-cell{padding:3px 6px;height:24px;cursor:pointer;user-select:none;white-space:nowrap}
.fx-cell:nth-child(even){background:#f9f9f9}
.fx-cell.sel{background:#0096c9;color:#fff}
.fx-cell.foc{box-shadow:inset 0 0 0 1px #039ed3}
.fx-cell.sel.foc{box-shadow:inset 0 0 0 1px #fff}
/* BorderPane mô phỏng của chuỗi ButtonDemo (450x200) */
.bp{width:450px;height:200px;display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto 1fr auto;
  grid-template-areas:"t t t" "l c r" "b b b";background:#f4f4f4}
.bp.empty{background:repeating-linear-gradient(45deg,#f4f4f4 0 8px,#ececec 8px 16px)}
.bp>.t{grid-area:t;border:1px solid green;padding:5px;display:flex;align-items:center;gap:0}
.bp>.t .fx-tf{flex:1;text-align:right}
.bp>.l{grid-area:l;border:2px solid green;padding:5px;display:flex;flex-direction:column;gap:20px}
.bp>.r{grid-area:r;border:1px solid green;padding:5px;display:flex;flex-direction:column;gap:20px}
.bp>.b{grid-area:b;border:1px solid green;display:flex;justify-content:center;gap:20px;padding:0}
.bp>.c{grid-area:c;position:relative}
.bp>.c span{position:absolute;left:50px;white-space:nowrap;color:#000}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
<script>
/* Phần dùng chung cho các trang minh hoạ Module 4 (khoá Lập trình giao diện với JavaFX). */
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function qs(name){ var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }
function hl(src){
  var re = /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\/\/.*$)|(@\w+)|\b(import|public|private|protected|class|static|final|void|int|double|long|char|boolean|if|else|return|for|while|new|true|false|null|extends|this|super)\b|(\b\d+(?:\.\d+)?\b)/g, out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="cm">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="kw">' + m[3] + '</span>';
    else if (m[4]) out += '<span class="kw">' + m[4] + '</span>';
    else out += '<span class="num">' + m[5] + '</span>';
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
/* lines: mảng chuỗi; o.cur: chỉ số | [từ, đến] | o.curList: mảng chỉ số; o.dim: mảng chỉ số làm mờ */
function codeHtml(lines, o){
  o = o || {}; var set = {}, dim = {}, cur = o.cur;
  if (Array.isArray(o.curList)) o.curList.forEach(function(i){ set[i] = 1; });
  else if (Array.isArray(cur)) { for (var k = cur[0]; k <= cur[1]; k++) set[k] = 1; }
  else if (cur !== undefined && cur !== null && cur >= 0) set[cur] = 1;
  (o.dim || []).forEach(function(i){ dim[i] = 1; });
  return lines.map(function(l, i){
    return '<div class="ln' + (set[i] ? ' cur' : '') + (dim[i] ? ' dim' : '') + '"><span class="no">' + (i + 1) + '</span><span>' + hl(l) + '</span></div>';
  }).join('');
}
function scrollToCur(box){
  var el = box.querySelector('.ln.cur'); if (!el) return;
  if (box.scrollHeight <= box.clientHeight + 2) return;
  box.scrollTop = Math.max(0, el.offsetTop - box.clientHeight / 2 + el.offsetHeight / 2);
}
function tag(v){ return '<span class="tag ' + (v ? 't' : 'f') + '">' + v + '</span>'; }
/* Nhóm nút .tab trong phần tử id; onChange(value) */
function tabs(id, onChange){
  var box = $(id);
  box.addEventListener('click', function(e){
    var b = e.target.closest('.tab'); if (!b) return;
    setTab(id, b.getAttribute('data-v')); onChange(b.getAttribute('data-v'));
  });
}
function setTab(id, v){
  $(id).querySelectorAll('.tab').forEach(function(b){ b.setAttribute('aria-selected', b.getAttribute('data-v') === v ? 'true' : 'false'); });
}
/* Cờ minh hoạ tự vẽ (giống các tệp image/*.png 150x100 của bài) */
var FLAG_CODES = ['vn', 'jp', 'fr', 'de', 'it', 'th'];
function flagSvg(code, w, h){
  var star = function(cx, cy, R){
    var p = [];
    for (var k = 0; k < 10; k++) { var r = k % 2 ? R * 0.382 : R, a = -Math.PI / 2 + k * Math.PI / 5; p.push((cx + r * Math.cos(a)).toFixed(2) + ',' + (cy + r * Math.sin(a)).toFixed(2)); }
    return '<polygon points="' + p.join(' ') + '" fill="#ffcd00"/>';
  };
  var v3 = function(c){ return c.map(function(x, i){ return '<rect x="' + (i * 50) + '" y="0" width="50" height="100" fill="' + x + '"/>'; }).join(''); };
  var h3 = function(c){ return c.map(function(x, i){ return '<rect x="0" y="' + (i * 100 / 3) + '" width="150" height="' + (100 / 3 + 0.2) + '" fill="' + x + '"/>'; }).join(''); };
  var body = {
    vn: '<rect width="150" height="100" fill="#da251d"/>' + star(75, 50, 30),
    jp: '<rect width="150" height="100" fill="#fff"/><circle cx="75" cy="50" r="30" fill="#bc002d"/>',
    fr: v3(['#0055a4', '#ffffff', '#ef4135']),
    it: v3(['#009246', '#ffffff', '#ce2b37']),
    de: h3(['#000000', '#dd0000', '#ffce00']),
    th: ['#a51931', '#f4f5f8', '#2d2a4a', '#2d2a4a', '#f4f5f8', '#a51931'].map(function(c, i){ return '<rect x="0" y="' + (i * 100 / 6) + '" width="150" height="' + (100 / 6 + 0.2) + '" fill="' + c + '"/>'; }).join('')
  }[code];
  return '<svg viewBox="0 0 150 100" width="' + w + '" height="' + (h || w * 2 / 3) + '" aria-hidden="true" style="display:block">' + body +
    '<rect x="0.5" y="0.5" width="149" height="99" fill="none" stroke="#787878"/></svg>';
}
/* Âm thanh mô phỏng bằng Web Audio: chỉ tạo AudioContext khi người học bấm nút. */
var Snd = {
  ctx: null,
  get: function(){
    if (!this.ctx) { var A = window.AudioContext || window.webkitAudioContext; if (!A) return null; this.ctx = new A(); }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    return this.ctx;
  },
  /* Phát dãy nốt (Hz, 0 = lặng), mỗi nốt dur giây, bỏ qua `from` giây đầu; trả về {stop()} */
  notes: function(freqs, dur, from, vol){
    var ctx = this.get(); if (!ctx) return {stop: function(){}};
    var t0 = ctx.currentTime + 0.02, oscs = [], master = ctx.createGain();
    master.gain.value = (vol === undefined ? 1 : vol) * 0.18; master.connect(ctx.destination);
    freqs.forEach(function(f, i){
      var s = i * dur - (from || 0), e = s + dur;
      if (!f || e <= 0) return;
      var st = Math.max(0, s), o = ctx.createOscillator(), g = ctx.createGain(), ramp = 0.018;
      o.type = 'sine'; o.frequency.value = f; o.connect(g); g.connect(master);
      g.gain.setValueAtTime(0, t0 + st);
      g.gain.linearRampToValueAtTime(1, t0 + Math.min(st + ramp, e));
      g.gain.setValueAtTime(1, t0 + Math.max(st + ramp, e - ramp));
      g.gain.linearRampToValueAtTime(0, t0 + e);
      o.start(t0 + st); o.stop(t0 + e + 0.01); oscs.push(o);
    });
    return {stop: function(){ oscs.forEach(function(o){ try { o.stop(); } catch (x) {} }); try { master.disconnect(); } catch (x) {} }};
  }
};
var NOTE = {C: 262, D: 294, E: 330, F: 349, G: 392, A: 440, B: 494, C5: 523};
/* Mô hình MediaPlayer (đã đối chiếu JavaFX 21): stop() đưa về 0; play() khi đang PLAYING không làm gì;
   phát hết bài thì trạng thái vẫn là PLAYING, đứng ở cuối, và play() không phát lại (phải stop() hoặc seek()). */
function mpNew(dur){ return {status: 'READY', pos: 0, t0: 0, dur: dur}; }
function mpPos(m, now){ return m.status === 'PLAYING' ? Math.min(m.dur, m.pos + (now - m.t0)) : m.pos; }
function mpPlay(m, now){
  var p = mpPos(m, now);
  if (m.status === 'PLAYING') return {m: m, act: p >= m.dur ? 'end' : 'noop'};
  if (m.status === 'PAUSED') return {m: {status: 'PLAYING', pos: p, t0: now, dur: m.dur}, act: p >= m.dur ? 'end' : 'resume'};
  return {m: {status: 'PLAYING', pos: 0, t0: now, dur: m.dur}, act: 'start'};
}
function mpPause(m, now){ return {status: 'PAUSED', pos: mpPos(m, now), t0: now, dur: m.dur}; }
function mpStop(m){ return {status: 'STOPPED', pos: 0, t0: 0, dur: m.dur}; }
if (typeof module !== 'undefined') module.exports = {mpNew: mpNew, mpPos: mpPos, mpPlay: mpPlay, mpPause: mpPause, mpStop: mpStop, flagSvg: flagSvg, hl: hl};

/* Cú bấm chuột vào ô thứ i của ListView, theo hành vi chọn của JavaFX (CellBehaviorBase):
   SINGLE: bấm thường chọn đúng ô đó; Ctrl+bấm vào ô đang chọn thì bỏ chọn.
   MULTIPLE: bấm thường chọn đúng ô đó; Ctrl+bấm thêm/bớt ô; Shift+bấm chọn dải từ ô neo (anchor) tới ô bấm.
   getSelectedIndices() luôn tăng dần. */
function lvClick(st, i, mod, mode){
  var sel = st.sel.slice(), anchor = st.anchor, what;
  var has = sel.indexOf(i) >= 0;
  if (mode === 'SINGLE' || (!mod.ctrl && !mod.shift)) {
    if (has && mod.ctrl) { sel = []; what = 'bo'; }
    else { sel = [i]; what = 'chon1'; }
    anchor = i;
  } else if (mod.ctrl) {
    if (has) { sel.splice(sel.indexOf(i), 1); what = 'bot'; } else { sel.push(i); what = 'them'; }
    anchor = i;
  } else {
    var a = anchor === null || anchor === undefined ? i : anchor;
    sel = []; for (var k = Math.min(a, i); k <= Math.max(a, i); k++) sel.push(k);
    what = 'dai';
  }
  sel.sort(function(x, y){ return x - y; });
  return {sel: sel, anchor: anchor, focus: i, last: sel.indexOf(i) >= 0 ? i : (st.last !== undefined && sel.indexOf(st.last) >= 0 ? st.last : -1), what: what};
}
/* Đổi chế độ: sang SINGLE chỉ giữ lại ô được chọn sau cùng */
function lvMode(st, mode){
  if (mode === 'MULTIPLE' || st.sel.length <= 1) return {sel: st.sel.slice(), anchor: st.anchor, focus: st.focus, last: st.last};
  var keep = st.sel.indexOf(st.last) >= 0 ? st.last : st.sel[st.sel.length - 1];
  return {sel: [keep], anchor: st.anchor, focus: st.focus, last: keep};
}
if (typeof module !== 'undefined') module.exports = {lvClick: lvClick, lvMode: lvMode};
</script>

<body>
<style>
.grid{display:grid;grid-template-columns:minmax(0,0.8fr) minmax(0,1.2fr);gap:8px;align-items:start}
.lvwin .fx-list{width:170px;margin:10px}
.mods{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12.5px}
.mod{border:1px solid var(--node-line);background:var(--node);color:var(--text);border-radius:6px;padding:2px 10px;cursor:pointer;font:600 12.5px ui-monospace,Menlo,Consolas,monospace}
.mod[aria-pressed="true"]{background:var(--cur);border-color:var(--cur-bar)}
.res{font:12.5px ui-monospace,Menlo,Consolas,monospace;margin-top:6px}
.res div{padding:2px 6px;border-radius:5px}
.res div.chg{background:var(--cur)}
@media (max-width:600px){.grid{grid-template-columns:1fr}}
</style>
<div class="wrap">
  <p class="lead">Chọn chế độ rồi bấm các mục; giữ <kbd>Ctrl</kbd> (<kbd>⌘</kbd> trên Mac) hoặc <kbd>Shift</kbd> khi bấm, hoặc bật các nút Ctrl, Shift bên dưới.</p>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="grid">
    <div class="card">
      <div class="fxwin lvwin" style="margin:0 auto"><div class="fxbar"><i></i><i></i><i></i><span>ListView</span></div>
        <div class="fxbody"><div class="fx-list" id="lv" role="listbox" aria-label="Danh sách sáu mục"></div></div></div>
      <div class="mods"><span class="note">Giữ phím:</span><button class="mod" id="mCtrl" aria-pressed="false">Ctrl</button><button class="mod" id="mShift" aria-pressed="false">Shift</button></div>
    </div>
    <div class="card">
      <p class="panel-title">setSelectionMode</p>
      <div class="tabs" id="mode"><button class="tab mono" data-v="SINGLE">SINGLE</button><button class="tab mono" data-v="MULTIPLE">MULTIPLE</button></div>
      <div class="code" id="code" style="margin-top:6px;font-size:11.5px"></div>
      <div class="res" id="res"></div>
      <div class="controls"><div class="btns"><button class="btn ghost" id="prev">Lùi lại</button><button class="btn ghost" id="reset">Làm lại</button></div></div>
    </div>
  </div>
</div>
<script>
(function(){
  var ITEMS = ['Item 1', 'Item 2', 'Item 3', 'Item 4', 'Item 5', 'Item 6'];
  var st, mode, hist, last, mods = {ctrl: false, shift: false};
  function init(){ st = {sel: [], anchor: null, focus: -1, last: -1}; mode = 'MULTIPLE'; hist = []; last = null; }
  $('lv').innerHTML = ITEMS.map(function(t, i){ return '<div class="fx-cell" role="option" data-i="' + i + '">' + t + '</div>'; }).join('');
  function arr(a){ return '[' + a.join(', ') + ']'; }
  function draw(){
    document.querySelectorAll('.fx-cell').forEach(function(c, i){
      var on = st.sel.indexOf(i) >= 0; c.classList.toggle('sel', on); c.classList.toggle('foc', i === st.focus); c.setAttribute('aria-selected', on ? 'true' : 'false');
    });
    setTab('mode', mode);
    $('code').innerHTML = codeHtml([
      'ListView<String> lv = new ListView<>(items);',
      'lv.getSelectionModel().setSelectionMode(SelectionMode.' + mode + ');'], {cur: last && last.what === 'mode' ? 1 : -1});
    var c = last && last.what !== 'mode' ? ' class="chg"' : '';
    $('res').innerHTML = '<div' + c + '>getSelectedIndices() → ' + arr(st.sel) + '</div><div' + c + '>getSelectedItems() → ' + arr(st.sel.map(function(i){ return ITEMS[i]; })) + '</div>';
    $('prev').disabled = hist.length === 0;
    $('mCtrl').setAttribute('aria-pressed', mods.ctrl); $('mShift').setAttribute('aria-pressed', mods.shift);
    var h, b;
    if (!last) { h = 'Danh sách 6 mục, chế độ ' + mode; b = 'Chưa mục nào được chọn. Bấm một mục, rồi thử bấm mục khác có giữ Ctrl hoặc Shift.'; }
    else if (last.what === 'mode') { h = 'setSelectionMode(SelectionMode.' + mode + ')'; b = mode === 'SINGLE' ? 'Chỉ chọn được một mục' + (last.dropped ? '; các mục đã chọn khác bị bỏ, chỉ giữ mục chọn sau cùng.' : '.') + ' Ctrl, Shift không còn thêm được mục.' : 'Giữ Ctrl để thêm hoặc bớt từng mục, giữ Shift để chọn cả một dải.'; }
    else {
      var n = ITEMS[last.i], key = (last.mod.ctrl ? 'Ctrl+' : '') + (last.mod.shift && !last.mod.ctrl ? 'Shift+' : '') + 'bấm ' + n;
      h = key + ' (' + mode + ')';
      b = {chon1: (mode === 'SINGLE' && (last.mod.ctrl || last.mod.shift) ? 'Ở chế độ SINGLE, phím giữ không thêm được mục: ' : '') + 'chỉ <b>' + n + '</b> được chọn, các mục khác bị bỏ.',
        bo: 'Ctrl+bấm vào mục đang chọn thì bỏ chọn mục đó; danh sách không còn mục nào được chọn.',
        them: 'Thêm <b>' + n + '</b>, giữ nguyên các mục đã chọn.',
        bot: 'Bỏ <b>' + n + '</b> ra khỏi lựa chọn, các mục khác giữ nguyên.',
        dai: 'Chọn cả dải từ mục neo (' + ITEMS[last.anchor] + ', mục bấm gần nhất không giữ Shift) tới ' + n + '.'}[last.what] +
        (st.sel.length > 1 ? ' Chỉ số luôn được liệt kê tăng dần, không theo thứ tự bấm.' : '');
    }
    $('status').innerHTML = '<b>' + h + '</b><span>' + b + '</span>';
  }
  function push(){ hist.push({st: JSON.parse(JSON.stringify(st)), mode: mode, last: last}); }
  function click(i, m){
    push(); var r = lvClick(st, i, m, mode);
    last = {i: i, mod: m, what: r.what, anchor: r.anchor}; st = {sel: r.sel, anchor: r.anchor, focus: r.focus, last: r.last};
    draw();
  }
  $('lv').addEventListener('click', function(e){
    var c = e.target.closest('.fx-cell'); if (!c) return;
    var m = {ctrl: mods.ctrl || e.ctrlKey || e.metaKey, shift: mods.shift || e.shiftKey};
    if (m.shift) { var s = window.getSelection && window.getSelection(); if (s) s.removeAllRanges(); }
    click(+c.getAttribute('data-i'), m);
  });
  tabs('mode', function(v){ if (v === mode) return; push(); var before = st.sel.length; mode = v; var r = lvMode(st, v); st = r; last = {what: 'mode', dropped: st.sel.length < before}; draw(); });
  $('mCtrl').onclick = function(){ mods.ctrl = !mods.ctrl; if (mods.ctrl) mods.shift = false; draw(); };
  $('mShift').onclick = function(){ mods.shift = !mods.shift; if (mods.shift) mods.ctrl = false; draw(); };
  $('prev').onclick = function(){ var h = hist.pop(); if (!h) return; st = h.st; mode = h.mode; last = h.last; draw(); };
  $('reset').onclick = function(){ init(); mods = {ctrl: false, shift: false}; draw(); };
  document.addEventListener('keydown', function(e){ if (e.key === 'ArrowLeft') { $('prev').click(); e.preventDefault(); } });
  init();
  // ?bam=0,c2,c4,s5 (c: Ctrl+bấm, s: Shift+bấm) và ?che_do=SINGLE mở sẵn
  if (qs('che_do') === 'SINGLE') mode = 'SINGLE';
  qs('bam').split(',').forEach(function(x){ var m = /^([cs]?)([0-5])$/.exec(x); if (m) click(+m[2], {ctrl: m[1] === 'c', shift: m[1] === 's'}); });
  draw();
})();
</script>
</body>
</html>
