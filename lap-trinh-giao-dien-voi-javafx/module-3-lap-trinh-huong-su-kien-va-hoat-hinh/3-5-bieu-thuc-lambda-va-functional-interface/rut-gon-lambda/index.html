<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="560">
<title>Rút gọn lớp vô danh thành lambda</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c; --cmt:#6b7280;
    --node:#ffffff; --node-line:#c9ced8; --arrow:#5d6676;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74; --cmt:#8b93a1;
      --node:#1d222c; --node-line:#3a4250; --arrow:#9aa3b2;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:10px 12px 12px}
  .lead{color:var(--muted);margin:0 0 8px;font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
  .controls{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:8px}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:5px 10px;border-radius:8px;
    cursor:pointer;font:inherit;font-weight:600;font-size:13px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.op{background:var(--accent-soft);color:var(--accent);padding:4px 7px;font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .btn.op.on{background:var(--accent);color:#fff}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .switch{display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer}
  .switch input{width:15px;height:15px;margin:0;accent-color:var(--accent)}
  .hint{color:var(--muted);font-size:12.5px}
  .hint:empty{display:none}
  .hint.bad{color:var(--false);font-weight:600}
  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
    padding:5px 12px;margin-bottom:8px;min-height:56px;font-size:13.5px}
  .status>b{display:block;font-size:12.5px;color:var(--accent)}
  .status code{font-size:12.5px}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
  .grid>*{min-width:0}
  .col{display:flex;flex-direction:column;gap:8px;min-width:0}
  @media (max-width:600px){.grid{grid-template-columns:minmax(0,1fr) !important}}
  .panel-title{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
  .code{background:var(--code-bg);border-radius:8px;padding:5px 0;overflow:auto;position:relative;
    font:11.5px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 10px 0 0;border-left:3px solid transparent;transition:background .2s,opacity .2s;width:max-content;min-width:100%}
  .ln .no{width:24px;flex:none;text-align:right;padding-right:8px;color:var(--muted);opacity:.6;user-select:none}
  .ln.dim{opacity:.4}
  .ln.cur{background:var(--cur);border-left-color:var(--cur-bar);opacity:1}
  .ln.curf{background:var(--false-soft);border-left-color:var(--false);opacity:1}
  .ln.curt{background:var(--true-soft);border-left-color:var(--true);opacity:1}
  .ln .tagln{margin-left:10px;font:600 11px system-ui,sans-serif;color:var(--muted);align-self:center}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--cmt);font-style:italic}.an{color:var(--num)}
  .vars{display:flex;gap:6px;flex-wrap:wrap}
  .var{background:var(--code-bg);border:2px solid transparent;border-radius:8px;padding:1px 8px;min-width:54px;text-align:center;transition:all .25s}
  .var small{display:block;color:var(--muted);font:11.5px ui-monospace,Menlo,Consolas,monospace}
  .var strong{font:700 14px ui-monospace,Menlo,Consolas,monospace;display:block;min-height:20px}
  .var.chg{border-color:var(--cur-bar);background:var(--cur)}
  .console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:6px 10px;min-height:48px;white-space:pre-wrap;word-break:break-word;
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .console .ph{color:#9aa3b2;font-family:system-ui,sans-serif;font-size:12.5px}
  .console .new{color:#fde68a}
  .console .dimc{color:#9aa3b2}
  kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .inp{font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;padding:4px 7px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);width:70px}
  .inp:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
  select.inp{width:auto;font-size:12.5px}
  .tag{display:inline-block;padding:0 7px;border-radius:6px;font-weight:700;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .tag.t{background:var(--true-soft);color:var(--true)}.tag.f{background:var(--false-soft);color:var(--false)}
  .tag.n{background:var(--code-bg);color:var(--muted)}
  .tag.a{background:var(--accent-soft);color:var(--accent)}

  /* Cửa sổ JavaFX mô phỏng (luôn sáng như cửa sổ thật) */
  .fxwin{border:1px solid #9aa0a6;border-radius:7px;overflow:hidden;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.14);margin:0 auto;width:max-content;max-width:100%}
  .fxbar{height:22px;background:linear-gradient(#ececec,#d9d9d9);display:flex;align-items:center;gap:5px;padding:0 8px;font:600 11.5px system-ui,sans-serif;color:#333;border-bottom:1px solid #bdbdbd;user-select:none}
  .fxbar i{width:9px;height:9px;border-radius:50%;display:inline-block;background:#ff5f57}
  .fxbar i+i{background:#febc2e}.fxbar i+i+i{background:#28c840}
  .fxbar .t{flex:1;text-align:center;margin-right:34px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .fxbox{position:relative;overflow:hidden}
  .fxscene{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;color:#000;overflow:hidden;
    font:13px "Segoe UI",system-ui,-apple-system,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  .fxscene.modena{background:#f4f4f4}
  .fxscene svg{position:absolute;left:0;top:0;overflow:visible}
  .fxscene:focus{outline:none}
  /* Nút kiểu Modena */
  .mbtn{position:absolute;height:25px;padding:0 8px;border-radius:3px;border:1px solid #b5b5b5;
    background:linear-gradient(#fdfdfd,#e2e2e2);color:#333;font:12px "Segoe UI",system-ui,-apple-system,sans-serif;
    box-shadow:inset 0 1px 0 #fff;cursor:pointer;white-space:nowrap;display:flex;align-items:center;justify-content:center}
  .mbtn:hover{background:linear-gradient(#ffffff,#ececec)}
  .mbtn.armed{background:linear-gradient(#d4d4d4,#e6e6e6);box-shadow:inset 0 1px 2px rgba(0,0,0,.18)}
  .mbtn.focus{border-color:#039ed3;box-shadow:0 0 0 2px rgba(3,158,211,.35),inset 0 0 0 1px #fff}
  .fxnote{font:600 10.5px system-ui,sans-serif;color:var(--muted);text-align:center;margin-top:3px}
  .pad{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
  .pad .btn.op{min-width:30px}

  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:4px 10px;border-radius:8px;cursor:pointer;font:12.5px ui-monospace,Menlo,Consolas,monospace}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .big{font-size:13.5px;line-height:1.6;padding:8px 0;min-height:150px}
  .big .ln .no{width:28px}
  .seg-del{background:var(--false-soft);color:var(--false);text-decoration:line-through;text-decoration-thickness:2px;border-radius:3px}
  .seg-del *{color:var(--false) !important}
  .seg-add{background:var(--true-soft);border-radius:3px;box-shadow:0 0 0 1px var(--true)}
  .head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:4px}
  .facts{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:5px 8px}
  @media (max-width:600px){.facts{grid-template-columns:1fr}}
  .facts li{border:1.5px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12.5px;color:var(--muted);transition:all .25s}
  .facts li b{color:var(--text)}
  .facts li.on{border-color:var(--cur-bar);background:var(--cur);color:var(--text)}
  .facts li.done{border-color:var(--true);color:var(--text)}
  .facts li.done::before{content:"✓ ";color:var(--true);font-weight:700}
</style>
</head>
<body>
<div class="wrap">
  <p class="lead">Bấm <b>Bước tiếp</b> (<kbd>→</kbd>) để rút gọn lớp vô danh thành lambda từng bước; phần đỏ sắp bị bỏ, phần xanh vừa thêm.</p>
  <div class="controls"><div class="tabs" role="tablist"><button class="tab" role="tab" data-v="1">btEnlarge</button><button class="tab" role="tab" data-v="2">btPrint</button></div>
    <div class="btns"><button class="btn" id="next">Bước tiếp</button><button class="btn ghost" id="prev">Lùi lại</button><button class="btn ghost" id="all">Chạy hết</button><button class="btn ghost" id="reset">Làm lại</button></div><span class="hint" id="hint"></span></div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="card" style="margin-bottom:8px"><div class="head"><p class="panel-title" style="margin:0">Đăng ký handler</p><span id="badge"></span></div><div class="code big" id="code"></div></div>
  <div class="card"><p class="panel-title">Trình biên dịch dựa vào đâu</p><ul class="facts" id="facts"></ul></div>
</div>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function hl(src){
    var re = /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\/\/.*$)|(@\w+)|\b(import|public|private|protected|class|interface|extends|implements|static|final|void|int|double|char|boolean|String|if|else|return|for|while|new|true|false|null|this|super|switch|case|default|break)\b|(\b\d+(?:\.\d+)?\b)/g, out = '', last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
      else if (m[2]) out += '<span class="cm">' + esc(m[2]) + '</span>';
      else if (m[3]) out += '<span class="an">' + esc(m[3]) + '</span>';
      else if (m[4]) out += '<span class="kw">' + m[4] + '</span>';
      else out += '<span class="num">' + m[5] + '</span>';
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }
  // o: {cur: số dòng (đếm từ 0) | [a, b] | {list: [..]}, kind: 'cur'|'curf'|'curt', dim: {i: true}, tags: {i: nhãn}}
  function codeHtml(lines, o){
    o = o || {}; var dim = o.dim || {}, tags = o.tags || {}, set = {};
    var c = o.cur;
    if (c !== undefined && c !== null) {
      if (Array.isArray(c)) { for (var k = c[0]; k <= c[1]; k++) set[k] = 1; }
      else if (typeof c === 'object') c.list.forEach(function(k){ set[k] = 1; });
      else set[c] = 1;
    }
    var kind = o.kind || 'cur';
    return lines.map(function(l, i){
      var cl = 'ln' + (dim[i] ? ' dim' : '') + (set[i] ? ' ' + kind : '');
      return '<div class="' + cl + '"><span class="no">' + (i + 1) + '</span><span>' + hl(l) + '</span>' +
        (tags[i] ? '<span class="tagln">' + esc(tags[i]) + '</span>' : '') + '</div>';
    }).join('');
  }
  function scrollToCur(box){
    var el = box.querySelector('.ln.cur,.ln.curf,.ln.curt'); if (!el) return;
    if (box.scrollHeight <= box.clientHeight + 2) return;
    box.scrollTop = Math.max(0, el.offsetTop - box.clientHeight / 2 + el.offsetHeight / 2);
  }
  function qs(name){ var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }
  // out: chuỗi hoặc [chuỗi, lớp]
  function conHtml(out, ph){ return out.length ? out.map(function(x){ return Array.isArray(x) ? '<span class="' + x[1] + '">' + esc(x[0]) + '</span>' : esc(x); }).join('\n') : '<span class="ph">' + (ph || 'Chưa có dòng nào.') + '</span>'; }
  // Double.toString của Java
  function jd(x){
    if (x === 0) return (1 / x < 0) ? '-0.0' : '0.0';
    var a = Math.abs(x);
    if (a >= 1e-3 && a < 1e7) { var s = String(x); return s.indexOf('.') < 0 ? s + '.0' : s; }
    var e = x.toExponential(), p = e.split('e'), mant = p[0], ex = parseInt(p[1], 10);
    if (mant.indexOf('.') < 0) mant += '.0';
    return mant + 'E' + ex;
  }
  function hint(msg){ var h = $('hint'); if (!h) return; h.textContent = msg || ''; h.className = msg ? 'hint bad' : 'hint'; }

  // Lịch sử trạng thái: mỗi thao tác sinh một hoặc nhiều ảnh chụp; Bước tiếp chạy kịch bản mặc định,
  // thao tác của người dùng cắt nhánh và nối tiếp. cfg: init(), apply(snap, op) -> snap | [snap...], script, render(snap, i), delay
  function History(cfg){
    var H = [], pos = 0, off = false, timer = null, base = 0, MAX = 500;
    var script = cfg.script || [];
    function last(){ return H[H.length - 1]; }
    function canNext(){ return pos < H.length - 1 || (!off && base === 0 && last().n < script.length); }
    function draw(){
      var sn = H[pos], run = timer !== null;
      $('status').innerHTML = '<b>Bước ' + (base + pos + 1) + ' · ' + esc(sn.title) + '</b><span>' + sn.body + '</span>';
      cfg.render(sn, pos);
      $('next').disabled = !canNext() || run;
      $('prev').disabled = pos <= 0 || run;
      $('all').disabled = run || !canNext();
    }
    function add(prev, op){
      var r = cfg.apply(prev, op); if (!Array.isArray(r)) r = [r];
      r.forEach(function(x){ x.n = prev.n + 1; H.push(x); });
      while (H.length > MAX) { H.shift(); base++; }
      return r.length;
    }
    function advance(){
      if (pos < H.length - 1) { pos++; return true; }
      if (canNext()) { var k = add(last(), script[last().n]); pos = H.length - k; return true; }
      return false;
    }
    function stop(){ if (timer) { clearInterval(timer); timer = null; } }
    function reset(){ stop(); var s0 = cfg.init(); s0.n = 0; H = [s0]; pos = 0; off = false; base = 0; hint(''); draw(); }
    function doOp(op){
      stop(); hint('');
      if (pos < H.length - 1) H = H.slice(0, pos + 1);
      var cur = H[pos];
      if (!off && (cur.n >= script.length || JSON.stringify(script[cur.n]) !== JSON.stringify(op))) off = true;
      add(cur, op); pos = H.length - 1; draw();
    }
    $('next').addEventListener('click', function(){ stop(); if (advance()) draw(); });
    $('prev').addEventListener('click', function(){ stop(); if (pos > 0) { pos--; draw(); } });
    $('reset').addEventListener('click', function(){ if (cfg.onReset) cfg.onReset(); reset(); });
    $('all').addEventListener('click', function(){
      if (timer) return;
      timer = setInterval(function(){ if (!advance()) stop(); if (!canNext()) stop(); draw(); }, cfg.delay || 700);
      draw();
    });
    document.addEventListener('keydown', function(e){
      var t = e.target, tn = t && t.tagName;
      if (tn === 'INPUT' || tn === 'SELECT' || tn === 'TEXTAREA' || (t && t.closest && t.closest('[data-keys]')) || timer) return;
      if (e.key === 'ArrowRight') { $('next').click(); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { $('prev').click(); e.preventDefault(); }
    });
    window.addEventListener('resize', function(){ if (H.length) cfg.render(H[pos], pos); });
    return {reset: function(){
              reset();
              var j = parseInt(qs('buoc'), 10);
              if (j > 1) { while (pos < j - 1 && advance()); draw(); }
            },
            doOp: doOp, cur: function(){ return H[pos]; }, stop: stop, running: function(){ return timer !== null; }};
  }

  // Cảnh JavaFX kích thước W x H (px của JavaFX), tự co giãn theo bề rộng khung chứa.
  function FxScene(boxId, W, H, maxScale){
    var box = $(boxId), sc = box.querySelector('.fxscene'), s = 1;
    sc.style.width = W + 'px'; sc.style.height = H + 'px';
    function fit(){
      var card = box.closest(".card") || box.parentElement.parentElement; var avail = card.clientWidth - 24;
      s = Math.min(maxScale || 1.4, avail / W);
      sc.style.transform = 'scale(' + s + ')';
      box.style.width = (W * s) + 'px'; box.style.height = (H * s) + 'px';
    }
    fit(); window.addEventListener('resize', fit);
    return {el: sc, fit: fit,
      toLocal: function(ev){ var r = sc.getBoundingClientRect(); return {x: (ev.clientX - r.left) * W / r.width, y: (ev.clientY - r.top) * H / r.height}; }};
  }
  function rd(x, n){ var p = Math.pow(10, n || 0); return Math.round(x * p) / p; }

  // Điều khiển trang hoạt hình: Bước tiếp = cho thời gian trôi stepMs; Lùi lại = hoàn tác thao tác trước;
  // Chạy hết = cho thời gian trôi liên tục (bấm lại để dừng); Làm lại = trạng thái đầu.
  // cfg: init() -> state, clone(state), tick(state, ms) -> thông báo|undefined, render(state, msg), stepMs, stepMsg(state)
  function AnimCtl(cfg){
    var S, hist = [], raf = null, lastT = 0, msg = '', cnt = 0;
    function draw(){ cfg.render(S, msg); $('prev').disabled = !hist.length; $('next').disabled = raf !== null;
      $('all').textContent = raf !== null ? 'Dừng' : 'Chạy hết'; }
    function save(){ hist.push({s: cfg.clone(S), m: msg}); if (hist.length > 300) hist.shift(); }
    function stopRT(){ if (raf !== null) { cancelAnimationFrame(raf); raf = null; } }
    function act(fn){ save(); var m = fn(S); if (m !== undefined) msg = m; draw(); }
    function frame(t){
      var dt = Math.min(100, t - lastT); lastT = t;
      var m = cfg.tick(S, dt); if (m) msg = m;
      draw();
      if (cfg.done && cfg.done(S)) { stopRT(); draw(); return; }
      raf = requestAnimationFrame(frame);
    }
    $('next').addEventListener('click', function(){ save(); var m = cfg.step ? cfg.step(S) : cfg.tick(S, cfg.stepMs); msg = m || (cfg.stepMsg ? cfg.stepMsg(S) : msg); draw(); });
    $('prev').addEventListener('click', function(){ stopRT(); var h = hist.pop(); if (h) { S = h.s; msg = h.m; } draw(); });
    $('all').addEventListener('click', function(){
      if (raf !== null) { stopRT(); draw(); return; }
      save(); if (cfg.onRun) { var m = cfg.onRun(S); if (m) msg = m; }
      lastT = performance.now(); raf = requestAnimationFrame(frame); draw();
    });
    $('reset').addEventListener('click', function(){ stopRT(); hist = []; S = cfg.init(); msg = cfg.initMsg; draw(); });
    document.addEventListener('keydown', function(e){
      var t = e.target, tn = t && t.tagName;
      if (tn === 'INPUT' || tn === 'SELECT' || tn === 'TEXTAREA' || (t && t.closest && t.closest('[data-keys]'))) return;
      if (e.key === 'ArrowRight' && raf === null) { $('next').click(); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { $('prev').click(); e.preventDefault(); }
    });
    window.addEventListener('resize', draw);
    S = cfg.init(); msg = cfg.initMsg;
    var j = parseInt(qs('buoc'), 10);
    if (j > 1) for (var i = 1; i < j; i++) { save(); var m = cfg.step ? cfg.step(S) : cfg.tick(S, cfg.stepMs); msg = m || (cfg.stepMsg ? cfg.stepMsg(S) : msg); }
    draw();
    return {act: act, state: function(){ return S; }, draw: draw, running: function(){ return raf !== null; }, stop: function(){ stopRT(); draw(); }};
  }
  function easeBoth(t){ return Math.min(1, Math.max(0, t < 0.2 ? 3.125 * t * t : t > 0.8 ? -3.125 * t * t + 6.25 * t - 2.125 : 1.25 * t - 0.125)); }
  function fmtS(ms){ return (ms / 1000).toFixed(2).replace('.', ',') + ' s'; }

var FACTS = [

var v = qs('vd') === '2' ? 2 : 1, ST;
