<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="480">
<title>Text và đường chân chữ</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
  --accent:#2563eb; --accent-soft:#e7eefc;
  --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
  --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
  --con-bg:#111827; --con-text:#e5e7eb;
  --kw:#7c3aed; --str:#047857; --num:#c2410c; --cmt:#6b7280;
  --hi:#f59e0b; --hi-soft:rgba(245,158,11,.18);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
    --accent:#6ea0ff; --accent-soft:#1e2a44;
    --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
    --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
    --con-bg:#05070b; --con-text:#e5e7eb;
    --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74; --cmt:#8b93a1;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
code{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.wrap{max-width:1000px;margin:0 auto;padding:8px 12px 10px}
.lead{color:var(--muted);margin:0 0 6px;font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0}
.controls{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:6px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:4px 12px;border-radius:8px;
  cursor:pointer;font:inherit;font-weight:600;font-size:13.5px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:1px 8px;font-size:12.5px;font-weight:600}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible,.tnode:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.stepno{font-size:12.5px;color:var(--muted)}
.status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
  padding:4px 12px;margin-bottom:6px;min-height:52px;font-size:13.5px}
.status>.sh{display:block;font-size:12.5px;color:var(--accent)}
.status.free{border-left-color:var(--cur-bar)}
.status.free>.sh{color:var(--muted)}
.status.bad{border-left-color:var(--false);background:var(--false-soft)}
.status.bad>.sh{color:var(--false)}
.panel-title{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
.main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px;align-items:start}
.side{display:flex;flex-direction:column;gap:6px;min-width:0}
.stagebox{display:flex;justify-content:center;align-items:flex-start;background:var(--code-bg);border-radius:10px;padding:8px;min-width:0}
/* ---- khung code ---- */
.code{background:var(--code-bg);border-radius:8px;padding:5px 0;overflow:auto;
  font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ln{display:flex;white-space:pre;padding:0 6px 0 0;border-left:3px solid transparent;width:max-content;min-width:100%}
.ln .no{width:22px;flex:none;text-align:right;padding-right:6px;color:var(--muted);opacity:.6;user-select:none}
.ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
.ln.off{opacity:.45;text-decoration:line-through}
.ln .val{border-radius:3px;padding:0 1px;box-shadow:inset 0 -2px 0 var(--cur-bar)}
.ln .val.chg{background:var(--cur-bar);color:#1d2330}
.ln .val.chg span{color:inherit}
.kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--cmt);font-style:italic}
.console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:5px 10px;min-height:34px;white-space:pre-wrap;word-break:break-word;overflow:auto;
  font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.console .echo{color:#8b93a1}
.console .warn{color:#fbbf24}
.console .errl{color:#f87171}
.console .ph{color:#7b8494;font-family:system-ui,sans-serif;font-size:12.5px}
kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px}
/* ---- thanh trượt và ô nhập ---- */
.props{display:grid;grid-template-columns:auto minmax(60px,1fr) 58px;gap:2px 8px;align-items:center;font-size:13px}
.props label{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:nowrap}
.props .err{grid-column:1/-1;color:var(--false);font-size:12px;margin-top:-2px}
.props .err:empty{display:none}
.props .full{grid-column:1/-1}
input[type=text],input[type=number]{padding:2px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--text);
  font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;width:100%}
input.bad{border-color:var(--false);background:var(--false-soft)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:18px;background:transparent;margin:0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(#c6c6c6,#d9d9d9);border:1px solid #a8a8a8}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;margin-top:-6px;
  background:linear-gradient(#fdfdfd,#e2e2e2);border:1px solid #9a9a9a;box-shadow:0 1px 1px rgba(0,0,0,.15)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:#d0d0d0;border:1px solid #a8a8a8}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:linear-gradient(#fdfdfd,#e2e2e2);border:1px solid #9a9a9a}
input[type=range]:focus-visible{outline:2px solid #039ed3;outline-offset:1px;border-radius:4px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:1px 9px;cursor:pointer;
  font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.chip.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.chip.bad{border-color:var(--false);color:var(--false)}
.tog{display:inline-flex;align-items:center;gap:5px;font-size:13px;cursor:pointer;user-select:none}
.tog input{margin:0;accent-color:var(--accent)}
.row{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.small{font-size:12.5px;color:var(--muted)}
table.vals{border-collapse:collapse;font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;width:100%}
table.vals td,table.vals th{border-bottom:1px solid var(--line);padding:1px 6px;text-align:left;white-space:nowrap}
table.vals th{font:700 11.5px system-ui,sans-serif;color:var(--muted)}
table.vals td.v{text-align:right}
table.vals tr.chg td{background:var(--cur)}
/* ---- cửa sổ JavaFX mô phỏng (luôn sáng như ứng dụng thật) ---- */
.fxwin{display:inline-block;border:1px solid #aaa;border-radius:9px;overflow:hidden;background:#ececec;
  box-shadow:0 6px 18px rgba(0,0,0,.18);max-width:100%;vertical-align:top;color:#333}
.fxbar{position:relative;height:26px;background:linear-gradient(#f0f0f0,#e0e0e0);border-bottom:1px solid #c8c8c8;
  font:13px/26px system-ui,-apple-system,"Segoe UI",sans-serif;color:#3c3c3c;text-align:center;white-space:nowrap;overflow:hidden;padding:0 8px 0 62px;text-overflow:ellipsis}
.fxbar i{position:absolute;top:7px;width:12px;height:12px;border-radius:50%}
.fxbar i:nth-child(1){left:10px;background:#ff5f57}.fxbar i:nth-child(2){left:28px;background:#febc2e}.fxbar i:nth-child(3){left:46px;background:#28c840}
.fxbar.narrow{padding-left:30px}.fxbar.narrow i{width:7px;height:7px;top:9.5px}.fxbar.narrow i:nth-child(2){left:19px}.fxbar.narrow i:nth-child(3){display:none}
.fxbar.narrow i:nth-child(1){left:9px}
.fxbar.hot{box-shadow:inset 0 0 0 3px var(--hi)}
.fxscene{display:block;max-width:100%;height:auto;overflow:hidden}
.fxscene text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.fxscene .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.fxwin.hot{box-shadow:0 0 0 3px var(--hi),0 6px 18px rgba(0,0,0,.18)}
.ov-hi{fill:var(--hi-soft);stroke:var(--hi);stroke-width:2;stroke-dasharray:5 3;pointer-events:none}
@media (max-width:600px){
  .main{grid-template-columns:1fr}
  .stagebox{padding:6px}
}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

.main{grid-template-columns:auto minmax(0,1fr)}
.fxscene{cursor:crosshair}
.read{font:12.5px/1.6 ui-monospace,Menlo,monospace}
.read b{color:var(--accent)}
.read .m{color:var(--kw)}
#code .code{font-size:11.5px}
</style>
</head>
<body>
<div class="wrap">
  <p class="lead">Kéo x, y của <code>Text</code> (hoặc bấm vào pane để đặt điểm). Chấm cam là điểm (x, y); đường đứt là đường chân chữ.</p>
  <div class="controls" id="ctl"></div>
  <div class="status" id="st" aria-live="polite"></div>
  <div class="main">
    <div class="side">
      <div class="stagebox" id="stage"></div>
      <div class="card read" id="read"></div>
    </div>
    <div class="side">
      <div class="card"><div id="sl"></div>
        <div class="row" style="margin-top:3px"><span class="small">Cỡ chữ:</span><span id="fs"></span></div>
        <div class="row" style="margin-top:3px" id="tg"></div></div>
      <div class="card"><div id="code"></div></div>
    </div>
  </div>
</div>
<script>
// Engine dùng chung cho các trang mô phỏng JavaFX (khoá 115, module 1-2).
// Phần lõi (fmtD, layout, màu) không đụng DOM để kiểm bằng node: node test-engine.js
var FX = (function(){
'use strict';
var NS = 'http://www.w3.org/2000/svg';
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function qs(name){
  if (typeof location === 'undefined') return '';
  var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : '';
}
// Double.toString của Java
function fmtD(x){
  if (Object.is(x, -0)) return '-0.0';
  if (!isFinite(x)) return isNaN(x) ? 'NaN' : (x > 0 ? 'Infinity' : '-Infinity');
  var a = Math.abs(x);
  if (a === 0) return '0.0';
  if (a >= 1e-3 && a < 1e7) { var s = String(x); return /[.e]/.test(s) ? s : s + '.0'; }
  var e = x.toExponential().split('e'), m = e[0];
  if (m.indexOf('.') < 0) m += '.0';
  return m + 'E' + parseInt(e[1], 10);
}
// printf("%.1f") của Java (làm tròn HALF_UP trên giá trị thập phân của double)
// (toFixed cũng làm tròn trên giá trị chính xác, hoà thì lấy xa 0; -0.04 → "-0.0" giống Java)
function fmtF(x, d){ return x.toFixed(d === undefined ? 1 : d); }
// số gọn cho code: 100 → "100", 12.5 → "12.5"
function num(x){ var r = Math.round(x * 1000) / 1000; return String(Object.is(r, -0) ? 0 : r); }
function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

/* ------------------------------------------------------------------ */
/* Bố cục pane: trả về hộp {x, y, w, h} cho từng node con.            */
/* node: {w, h, fill?:bool (tự giãn theo vùng), col, row, hpos, vpos}  */
/* opt: {pad:[t,r,b,l], hgap, vgap, spacing, vertical}                 */
function padOf(opt){ var p = opt.pad || [0,0,0,0]; return {t:p[0], r:p[1], b:p[2], l:p[3]}; }
function snapHalf(v){ return Math.round(v * 2) / 2; }
var Layout = {
  Pane: function(nodes){ return nodes.map(function(n){ return {x: 0, y: 0, w: n.w, h: n.h}; }); },
  StackPane: function(nodes, W, H, opt){
    var p = padOf(opt), aw = W - p.l - p.r, ah = H - p.t - p.b;
    return nodes.map(function(n){
      var w = n.fill ? aw : n.w, h = n.fill ? ah : n.h;
      return {x: snapHalf(p.l + (aw - w) / 2), y: snapHalf(p.t + (ah - h) / 2), w: w, h: h};
    });
  },
  // FlowPane: xuống hàng khi x + w vượt bề rộng còn lại (x đã cộng hgap sau mỗi node)
  FlowPane: function(nodes, W, H, opt){
    var p = padOf(opt), hg = opt.hgap || 0, vg = opt.vgap || 0, out = [], runs = [], run = null, pos = 0;
    var vert = !!opt.vertical, max = vert ? H - p.t - p.b : W - p.l - p.r;
    nodes.forEach(function(n, i){
      var len = vert ? n.h : n.w;
      if (run && pos + len > max) run = null;
      if (!run) { run = {items: [], cross: 0}; runs.push(run); pos = 0; }
      run.items.push({i: i, at: pos}); run.cross = Math.max(run.cross, vert ? n.w : n.h);
      pos += len + (vert ? vg : hg);
    });
    var c = vert ? p.l : p.t;
    runs.forEach(function(r, ri){
      r.items.forEach(function(it){
        var n = nodes[it.i];
        if (vert) out[it.i] = {x: c, y: p.t + it.at, w: n.w, h: n.h, run: ri};
        else out[it.i] = {x: p.l + it.at, y: c + Math.round((r.cross - n.h) / 2), w: n.w, h: n.h, run: ri};
      });
      r.start = c; c += r.cross + (vert ? hg : vg);
    });
    out.runs = runs;
    return out;
  },
  GridPane: function(nodes, W, H, opt){
    var p = padOf(opt), hg = opt.hgap || 0, vg = opt.vgap || 0, cw = [], rh = [];
    var nc = 0, nr = 0;
    nodes.forEach(function(n){ nc = Math.max(nc, n.col + 1); nr = Math.max(nr, n.row + 1); });
    for (var i = 0; i < nc; i++) cw[i] = 0;
    for (var j = 0; j < nr; j++) rh[j] = 0;
    nodes.forEach(function(n){ cw[n.col] = Math.max(cw[n.col], n.w); rh[n.row] = Math.max(rh[n.row], n.h); });
    var cx = [], ry = [], x = p.l, y = p.t;
    cw.forEach(function(w, i){ cx[i] = x; x += w + hg; });
    rh.forEach(function(h, j){ ry[j] = y; y += h + vg; });
    var out = nodes.map(function(n){
      var hp = n.hpos || 'LEFT', vp = n.vpos || 'CENTER', W0 = cw[n.col], H0 = rh[n.row];
      var dx = hp === 'LEFT' ? 0 : hp === 'RIGHT' ? W0 - n.w : (W0 - n.w) / 2;
      var dy = vp === 'TOP' ? 0 : vp === 'BOTTOM' ? H0 - n.h : (H0 - n.h) / 2;
      return {x: cx[n.col] + dx, y: ry[n.row] + dy, w: n.w, h: n.h};
    });
    out.cols = cw.map(function(w, i){ return {x: cx[i], w: w}; });
    out.rows = rh.map(function(h, j){ return {y: ry[j], h: h}; });
    return out;
  },
  // nodes: {top, bottom, left, right, center} (mỗi cái null hoặc node)
  BorderPane: function(R, W, H, opt){
    var p = padOf(opt), x0 = p.l, y0 = p.t, x1 = W - p.r, y1 = H - p.b, out = {}, reg = {};
    var th = R.top ? R.top.h : 0, bh = R.bottom ? R.bottom.h : 0;
    var lw = R.left ? R.left.w : 0, rw = R.right ? R.right.w : 0;
    reg.top = {x: x0, y: y0, w: x1 - x0, h: th};
    reg.bottom = {x: x0, y: y1 - bh, w: x1 - x0, h: bh};
    var my = y0 + th, mh = (y1 - bh) - my;
    reg.left = {x: x0, y: my, w: lw, h: mh};
    reg.right = {x: x1 - rw, y: my, w: rw, h: mh};
    reg.center = {x: x0 + lw, y: my, w: (x1 - rw) - (x0 + lw), h: mh};
    var al = {top: ['L','T'], bottom: ['L','B'], left: ['L','T'], right: ['R','T'], center: ['C','C']};
    Object.keys(reg).forEach(function(k){
      var n = R[k], g = reg[k]; if (!n) return;
      if (n.fill) { out[k] = {x: g.x, y: g.y, w: g.w, h: g.h}; return; }
      var a = al[k];
      var x = a[0] === 'L' ? g.x : a[0] === 'R' ? g.x + g.w - n.w : snapHalf(g.x + (g.w - n.w) / 2);
      var y = a[1] === 'T' ? g.y : a[1] === 'B' ? g.y + g.h - n.h : snapHalf(g.y + (g.h - n.h) / 2);
      out[k] = {x: x, y: y, w: n.w, h: n.h};
    });
    out.regions = reg;
    return out;
  },
  HBox: function(nodes, W, H, opt){
    var p = padOf(opt), x = p.l, s = opt.spacing || 0;
    return nodes.map(function(n){ var b = {x: x, y: p.t, w: n.w, h: n.h}; x += n.w + s; return b; });
  },
  VBox: function(nodes, W, H, opt){
    var p = padOf(opt), y = p.t, s = opt.spacing || 0;
    return nodes.map(function(n){ var b = {x: p.l, y: y, w: n.w, h: n.h}; y += n.h + s; return b; });
  }
};

/* ------------------------------------------------------------------ */
/* Màu: Color của JavaFX (brighter/darker qua HSB, hệ số 0.7)         */
function rgb2hsb(r, g, b){
  var mx = Math.max(r, g, b), mn = Math.min(r, g, b), h = 0, s = mx === 0 ? 0 : (mx - mn) / mx;
  if (s !== 0) {
    var rc = (mx - r) / (mx - mn), gc = (mx - g) / (mx - mn), bc = (mx - b) / (mx - mn);
    if (r === mx) h = bc - gc; else if (g === mx) h = 2 + rc - bc; else h = 4 + gc - rc;
    h /= 6; if (h < 0) h += 1;
  }
  return [h * 360, s, mx];
}
function hsb2rgb(h, s, v){
  var n = ((h % 360) + 360) % 360 / 360, r = 0, g = 0, b = 0;
  if (s === 0) { r = g = b = v; }
  else {
    var hh = (n - Math.floor(n)) * 6, f = hh - Math.floor(hh), p = v * (1 - s), q = v * (1 - s * f), t = v * (1 - s * (1 - f));
    switch (Math.floor(hh)) {
      case 0: r = v; g = t; b = p; break; case 1: r = q; g = v; b = p; break; case 2: r = p; g = v; b = t; break;
      case 3: r = p; g = q; b = v; break; case 4: r = t; g = p; b = v; break; default: r = v; g = p; b = q;
    }
  }
  return [r, g, b];
}
function deriveB(c, f){
  var hsb = rgb2hsb(c[0], c[1], c[2]), b = hsb[2];
  if (b === 0 && f > 1) b = 0.05;
  b = clamp(b * f, 0, 1);
  var o = hsb2rgb(hsb[0], clamp(hsb[1], 0, 1), b);
  return [o[0], o[1], o[2], c[3]];
}
var Color = {
  brighter: function(c){ return deriveB(c, 1 / 0.7); },
  darker: function(c){ return deriveB(c, 0.7); },
  // Color.toString(): 0xrrggbbaa
  str: function(c){ return '0x' + c.map(function(v){ var h = Math.round(v * 255).toString(16); return h.length < 2 ? '0' + h : h; }).join(''); },
  css: function(c){ return 'rgba(' + Math.round(c[0] * 255) + ',' + Math.round(c[1] * 255) + ',' + Math.round(c[2] * 255) + ',' + c[3] + ')'; }
};

/* ------------------------------------------------------------------ */
/* DOM                                                                 */
function $(id){ return document.getElementById(id); }
function el(tag, attrs, parent, html){
  var e = document.createElement(tag);
  if (attrs) for (var k in attrs) { if (k === 'class') e.className = attrs[k]; else if (k === 'text') e.textContent = attrs[k]; else e.setAttribute(k, attrs[k]); }
  if (html !== undefined) e.innerHTML = html;
  if (parent) parent.appendChild(e);
  return e;
}
function svg(tag, attrs, parent){
  var e = document.createElementNS(NS, tag);
  if (attrs) for (var k in attrs) { if (attrs[k] !== null && attrs[k] !== undefined) e.setAttribute(k, attrs[k]); }
  if (parent) parent.appendChild(e);
  return e;
}
function clear(e){ while (e.firstChild) e.removeChild(e.firstChild); return e; }
