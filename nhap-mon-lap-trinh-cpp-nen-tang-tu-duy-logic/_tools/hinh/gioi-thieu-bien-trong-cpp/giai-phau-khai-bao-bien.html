<!doctype html><html lang="vi"><head><meta charset="utf-8"><link rel="stylesheet" href="../cau-truc-co-ban-cua-mot-chuong-trinh-cpp/_style.css"><style>
.code{background:#0f172a;border-radius:14px;padding:26px 30px;font:34px ui-monospace,Menlo,Consolas,monospace;color:#e5e7eb;text-align:center;letter-spacing:1px}
.kw{color:#c4a1ff}.nm{color:#7dd3fc}.nu{color:#fdba74}
.arrows{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:-4px}
.a{border-top:6px solid;border-radius:0 0 12px 12px;background:#f6f7f9;padding:12px 14px;text-align:center}
.a b{display:block;font-size:19px}.a span{font-size:15px;color:#5d6676}
.box{margin-top:20px;display:flex;justify-content:center}
.bx{width:150px;border:3px solid #2563eb;border-radius:12px;overflow:hidden;text-align:center;background:#fff}
.bx i{display:block;background:#e8f0ff;font:700 17px ui-monospace,Menlo,monospace;font-style:normal;padding:4px;color:#2563eb}
.bx strong{display:block;font:800 36px ui-monospace,Menlo,monospace;padding:6px}.bx em{display:block;font:13px ui-monospace,Menlo,monospace;font-style:normal;color:#5d6676;padding-bottom:6px}
.cap{text-align:center;font-size:15px;color:#5d6676;margin-top:8px}
</style></head><body><div id="art"><h3>Ba yếu tố của một biến</h3><p class="sub">Tên, kiểu và giá trị khi khai báo <span class="mono">int tuoi = 18;</span></p>
<div class="code"><span class="kw">int</span> <span class="nm">tuoi</span> = <span class="nu">18</span>;</div>
<div class="arrows"><div class="a" style="border-color:#c4a1ff"><b style="color:#7c3aed">Kiểu</b><span>int: chứa số nguyên</span></div><div class="a" style="border-color:#38bdf8"><b style="color:#0284c7">Tên</b><span>tuoi: nhãn để gọi lại biến</span></div><div class="a" style="border-color:#fb923c"><b style="color:#c2410c">Giá trị</b><span>18: nội dung trong hộp</span></div></div>
<div class="box"><div class="bx"><i>tuoi</i><strong>18</strong><em>int</em></div></div><p class="cap">Trong bộ nhớ: một chiếc hộp có nhãn tên, loại hộp (kiểu) và đồ bên trong (giá trị)</p></div></body></html>
