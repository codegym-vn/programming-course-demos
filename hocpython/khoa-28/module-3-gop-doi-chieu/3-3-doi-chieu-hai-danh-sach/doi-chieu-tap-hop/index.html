<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="690">
<title>Đối chiếu hai danh sách bằng set, từng bước</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
  --accent:#2563eb; --accent-soft:#e7eefc;
  --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
  --con-bg:#111827; --con-text:#e5e7eb;
  --kw:#7c3aed; --str:#047857; --num:#c2410c;
  --a:#c2410c; --a-soft:#fdeee3; --b:#15803d; --b-soft:#e3f4e8; --c:#7c3aed; --c-soft:#efe8fd;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
    --accent:#6ea0ff; --accent-soft:#1e2a44;
    --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
    --con-bg:#05070b; --con-text:#e5e7eb;
    --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74;
    --a:#fdba74; --a-soft:#3a2416; --b:#4ade80; --b-soft:#13301f; --c:#c4a1ff; --c-soft:#2a1f44;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:10px 12px 12px}
.hint{color:var(--muted);margin:0 0 8px;font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px 10px;min-width:0}
.controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:5px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btns{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:7px 12px;margin-bottom:8px;min-height:58px;font-size:14px;overflow-wrap:anywhere}
.status b.h{display:block;font-size:12.5px;color:var(--accent)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.stack{min-width:0}
.stack>*+*{margin-top:8px}
.panel-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.code{background:var(--code-bg);border-radius:8px;padding:5px 0;overflow-x:auto;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ln{display:flex;white-space:pre;padding:0 10px 0 0;border-left:3px solid transparent}
.ln .no{width:24px;flex:none;text-align:right;padding-right:8px;color:var(--muted);opacity:.7;user-select:none}
.ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
.kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
table{border-collapse:collapse;width:100%;font-size:12px}
td,th{border:1px solid var(--line);padding:1px 4px;text-align:left;white-space:nowrap}
th{background:var(--code-bg);font-weight:600;font-size:11.5px;color:var(--muted)}
td.r,th.r{text-align:right}
td.ma{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-weight:600}
tr.cur td{background:var(--cur)}
tr.found td{box-shadow:inset 0 0 0 1px var(--cur-bar)}
tr.found td.ma{background:var(--cur)}
tr.A td.ma{background:var(--a-soft);color:var(--a)}
tr.B td.ma{background:var(--b-soft);color:var(--b)}
tr.C td.ma{background:var(--c-soft);color:var(--c)}
.tname{font:600 12px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin:0 0 3px;color:var(--muted)}
.sets{font:12.5px/1.9 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.chip{display:inline-block;padding:0 6px;border-radius:5px;border:1px solid var(--line);background:var(--code-bg);margin:0 2px;line-height:1.55}
.chip.new{animation:flash 1.1s ease-out;background:var(--cur)}
.chip.chk{background:var(--cur);border-color:var(--cur-bar);font-weight:700}
.chip.A{background:var(--a-soft);color:var(--a);border-color:var(--a)}
.chip.B{background:var(--b-soft);color:var(--b);border-color:var(--b)}
.chip.C{background:var(--c-soft);color:var(--c);border-color:var(--c)}
.chip.x{opacity:.35;text-decoration:line-through}
.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.zone{border-radius:8px;padding:5px 7px;min-height:66px;border:1.5px dashed var(--line)}
.zone .zt{font-size:11.5px;font-weight:700;margin-bottom:3px}
.zone .ze{font-size:11px;color:var(--muted);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.zone.A .zt{color:var(--a)}.zone.B .zt{color:var(--b)}.zone.C .zt{color:var(--c)}
.zone.on{border-style:solid}
.zone.A.on{border-color:var(--a);background:var(--a-soft)}.zone.B.on{border-color:var(--b);background:var(--b-soft)}.zone.C.on{border-color:var(--c);background:var(--c-soft)}
.zone .chip{margin:2px 2px 0 0;font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:6px 10px;min-height:32px;white-space:pre-wrap;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.console .ph{color:#7b8494;font-family:system-ui,sans-serif}
.console .new{background:rgba(251,191,36,.18);border-radius:3px}
.vars{font:12.5px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);margin-top:4px;min-height:20px}
@keyframes flash{0%{box-shadow:0 0 0 2px var(--cur-bar)}100%{}}
.st-in{display:inline;font-weight:700;color:inherit}
@media (max-width:620px){.grid{grid-template-columns:1fr}.btns{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
<p class="hint">Bấm <b>Bước tiếp</b> (hoặc phím →): mã giao dịch đi từ hai tệp vào hai set, rồi được xếp vào ba nhóm.</p>
<div class="controls">
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="btns">
    <button class="btn ghost" id="back">◀ Lùi lại</button>
    <button class="btn" id="next">Bước tiếp ▶</button>
    <button class="btn ghost" id="all">Chạy hết</button>
    <button class="btn ghost" id="reset">Làm lại</button>
  </div>
</div>
<div class="status" id="status"></div>
<div class="grid">
  <div class="stack">
    <div class="card"><p class="panel-title">Chương trình</p><div class="code" id="code"></div></div>
    <div class="card"><p class="panel-title">Output</p><div class="console" id="out"></div></div>
  </div>
  <div class="stack">
    <div class="card" id="filecard"><p class="panel-title">Hai tệp cần đối chiếu</p><div class="two">
      <div><p class="tname">so_ban_hang.csv</p><table id="t1"></table></div>
      <div><p class="tname">sao_ke.csv</p><table id="t2"></table></div></div></div>
    <div class="card"><p class="panel-title">Hai tập hợp</p><div class="sets" id="sets"></div><div class="vars" id="vars"></div></div>
    <div class="card"><p class="panel-title">Ba nhóm sau khi đối chiếu</p><div class="zones" id="zones"></div></div>
  </div>
</div>
</div>
<script>
const B = s => `<b class="st-in">${s}</b>`, M = s => `<span class="mono">${s}</span>`;
// Đúng hai tệp của bài
const SO = [["02/11/2026","GD01",1500000],["02/11/2026","GD02",820000],["03/11/2026","GD03",2300000],["03/11/2026","GD04",640000]];
const SK = [["02/11/2026","GD01",1500000],["03/11/2026","GD02",820000],["04/11/2026","GD04",640000],["05/11/2026","GD07",300000]];
const pyList = a => "[" + a.map(x => `'${x}'`).join(", ") + "]";
const pySet = a => a.length ? "{" + a.map(x => `'${x}'`).join(", ") + "}" : "set()";

const EX = {
  tep: { label: "Đối chiếu hai tệp thật", files: true,
    code: ['import csv','','','def doc_ma(ten):','    ma = set()','    with open(ten,','              encoding="utf-8") as f:','        for d in csv.DictReader(f):','            ma.add(d["ma_gd"])','    return ma','','','so = doc_ma("so_ban_hang.csv")','sk = doc_ma("sao_ke.csv")','chi_so = sorted(so - sk)','chi_sk = sorted(sk - so)','print("Chỉ có trong sổ:", chi_so)','print("Chỉ có trên sao kê:", chi_sk)','print("Có ở cả hai:", sorted(so & sk))'],
    build(){
      const S = [], st = {so: null, sk: null, ma: [], cls1: {}, cls2: {}, zA: null, zB: null, zC: null, out: [], vars: ""};
      const snap = o => S.push(Object.assign(JSON.parse(JSON.stringify(st)), {r1: -1, r2: -1, f1: -1, f2: -1, chk: null, newChip: null, newOut: 0, side: null}, o));
      const doc = (rows, ten, bien, line, tbl) => {
        st.ma = [];
        snap({lines: [line, 3, 4], side: bien, msg: `Gọi ${M(`doc_ma("${ten}")`)}: Python nhảy vào hàm, tạo ${M("ma = set()")} rỗng để gom mã giao dịch.`});
        rows.forEach((r, i) => {
          const moi = !st.ma.includes(r[1]); if (moi) st.ma.push(r[1]);
          snap({lines: [7, 8], side: bien, [tbl]: i, newChip: r[1], msg: `Dòng ${i+1} của ${M(ten)}: ${M(`d["ma_gd"]`)} = '${r[1]}'. ${M(`ma.add('${r[1]}')`)} thêm mã vào set` + (i === 0 ? `. Chỉ lấy cột mã, bỏ qua ngày và số tiền.` : ".")});
        });
        st[bien] = [...st.ma]; const ma = st.ma; st.ma = [];
        snap({lines: [9, line], msg: `Hết tệp. ${M("return ma")} trả set ${M(pySet(ma))} về, gán cho ${M(bien)}.`});
      };
      doc(SO, "so_ban_hang.csv", "so", 12, "r1");
      doc(SK, "sao_ke.csv", "sk", 13, "r2");
      // so - sk
      st.zA = [];
      st.so.forEach(x => {
        const co = st.sk.includes(x), i1 = SO.findIndex(r => r[1] === x), i2 = SK.findIndex(r => r[1] === x);
        if (!co) { st.zA.push(x); st.cls1[x] = "A"; }
        snap({lines: [14], chk: x, r1: i1, f2: i2, msg: `Tính ${M("so - sk")}: xét '${x}' trong ${M("so")}. ` +
          (co ? `'${x}' ${B("có")} trong ${M("sk")} (ô viền vàng bên sao kê), nên bị loại.` : `'${x}' ${B("không có")} trong ${M("sk")}, nên được giữ lại.`)});
      });
      snap({lines: [14], vars: `chi_so = ${pyList([...st.zA].sort())}`, msg: `${M("so - sk")} = ${M(pySet(st.zA))}. ${M("sorted(...)")} đổi thành danh sách xếp tăng dần: ${M("chi_so = " + pyList([...st.zA].sort()))}.`});
      st.vars = `chi_so = ${pyList([...st.zA].sort())}`;
      st.zC = [];
      st.sk.forEach(x => {
        const co = st.so.includes(x), i1 = SO.findIndex(r => r[1] === x), i2 = SK.findIndex(r => r[1] === x);
        if (!co) { st.zC.push(x); st.cls2[x] = "C"; }
        snap({lines: [15], chk: x, r2: i2, f1: i1, msg: `Đổi chiều: ${M("sk - so")} xét '${x}' trong ${M("sk")}. ` +
          (co ? `'${x}' có trong ${M("so")}, nên bị loại.` : `'${x}' ${B("không có")} trong ${M("so")}: tiền đã vào tài khoản mà sổ chưa ghi.`)});
      });
      st.vars += `<br>chi_sk = ${pyList([...st.zC].sort())}`;
      snap({lines: [15], msg: `${M("sk - so")} = ${M(pySet(st.zC))}, nên ${M("chi_sk = " + pyList([...st.zC].sort()))}. Cùng hai set nhưng trừ theo chiều khác thì ra kết quả khác.`});
      st.out.push("Chỉ có trong sổ: " + pyList([...st.zA].sort()));
      snap({lines: [16], newOut: 1, msg: `In ${M("chi_so")}: giao dịch đã ghi sổ mà ngân hàng chưa nhận.`});
      st.out.push("Chỉ có trên sao kê: " + pyList([...st.zC].sort()));
      snap({lines: [17], newOut: 1, msg: `In ${M("chi_sk")}: tiền về tài khoản mà sổ chưa ghi.`});
      st.zB = st.so.filter(x => st.sk.includes(x));
      st.zB.forEach(x => { st.cls1[x] = "B"; st.cls2[x] = "B"; });
      snap({lines: [18], msg: `${M("so & sk")} giữ các mã có ở ${B("cả hai")} set: ${M(pySet(st.zB))}. Chú ý '${"GD02"}': ngày ở hai tệp khác nhau (02/11 và 03/11) nhưng mã giống nhau nên vẫn khớp.`});
      st.out.push("Có ở cả hai: " + pyList([...st.zB].sort()));
      snap({lines: [18], newOut: 1, msg: `${M("sorted")} rồi in. Ba dòng output khớp với kết quả trong bài.`});
      return S;
    } },
  phep: { label: "Ba phép toán trên set", files: false,
    code: ['so = {"GD01", "GD02", "GD03", "GD04"}','sk = {"GD01", "GD02", "GD04", "GD07"}','so - sk','sk - so','so & sk'],
    build(){
      const S = [], so = ["GD01","GD02","GD03","GD04"], sk = ["GD01","GD02","GD04","GD07"];
      const base = {so: null, sk: null, ma: [], cls1: {}, cls2: {}, zA: null, zB: null, zC: null, out: [], vars: "", r1: -1, r2: -1, f1: -1, f2: -1, chk: null, newChip: null, newOut: 0, side: null};
      const st = JSON.parse(JSON.stringify(base));
      const snap = o => S.push(Object.assign(JSON.parse(JSON.stringify(st)), o));
      st.so = so; snap({lines: [0], msg: `${M("so")}: set mã trong sổ bán hàng. Viết set bằng dấu ngoặc nhọn, mỗi mã một lần.`});
      st.sk = sk; snap({lines: [1], msg: `${M("sk")}: set mã trên sao kê ngân hàng. GD01, GD02, GD04 có ở cả hai set.`});
      st.zA = so.filter(x => !sk.includes(x));
      snap({lines: [2], msg: `${M("so - sk")}: giữ phần tử của ${M("so")} mà ${M("sk")} không có, được ${M('{"GD03"}')}. Nghĩa: có trong sổ, không có trên sao kê.`});
      st.zC = sk.filter(x => !so.includes(x));
      snap({lines: [3], msg: `${M("sk - so")}: đổi chiều thì giữ phần tử của ${M("sk")} mà ${M("so")} không có: ${M('{"GD07"}')}. Phép hiệu có ${B("chiều")}.`});
      st.zB = so.filter(x => sk.includes(x));
      snap({lines: [4], msg: `${M("so & sk")}: phần chung của hai set, ${M('{"GD01", "GD02", "GD04"}')}. Đủ ba ô như bảng trong bài.`});
      return S;
    } }
};
const q = new URLSearchParams(location.search);
let cur = EX[q.get("vd")] ? q.get("vd") : "tep";
let steps = [], k = 0;

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function hl(s){
  return s.replace(/("[^"]*")|([A-Za-z_]\w*)|(\d+)|([^"\w]+)/g, (m, str, w, num, o) =>
    str ? `<span class="str">${esc(str)}</span>`
    : w ? (/^(import|def|with|as|for|in|return|print|set|sorted|open)$/.test(w) ? `<span class="kw">${w}</span>` : w)
    : num ? `<span class="num">${num}</span>` : esc(o));
}
function chips(arr, s, side){
  if (!arr) return `<span style="color:var(--muted)">chưa có</span>`;
  if (!arr.length) return "set()";
  return "{" + arr.map(x => {
    let c = "chip";
    const zone = side === "so" ? (s.zA && s.zA.includes(x) ? "A" : (s.zB && s.zB.includes(x) ? "B" : "")) : (s.zC && s.zC.includes(x) ? "C" : (s.zB && s.zB.includes(x) ? "B" : ""));
    if (zone) c += " " + zone;
    if (s.chk === x) c += " chk";
    if (s.newChip === x) c += " new";
    return `<span class="${c}">'${x}'</span>`;
  }).join(",") + "}";
}
function render(){
  const ex = EX[cur], s = steps[k];
  document.getElementById("status").innerHTML = `<b class="h">Bước ${k+1}/${steps.length}</b>${s.msg}`;
  document.getElementById("code").innerHTML = ex.code.map((c,i)=>`<div class="ln${s.lines.includes(i)?" cur":""}"><span class="no">${i+1}</span><span>${hl(c)||" "}</span></div>`).join("");
  document.getElementById("filecard").style.display = ex.files ? "" : "none";
  if (ex.files) {
    const tb = (rows, r, f, cls) => `<tr><th>ngay</th><th>ma_gd</th><th class="r">so_tien</th></tr>` +
      rows.map((x,i)=>`<tr class="${i===r?"cur":""}${i===f?" found":""} ${cls[x[1]]||""}"><td class="mono">${x[0].slice(0,5)}</td><td class="ma">${x[1]}</td><td class="r mono">${x[2]}</td></tr>`).join("");
    document.getElementById("t1").innerHTML = tb(SO, s.r1, s.f1, s.cls1);
    document.getElementById("t2").innerHTML = tb(SK, s.r2, s.f2, s.cls2);
  }
  const maLine = s.side ? `<div>ma = ${chips(s.ma, s, "")}  <span style="color:var(--muted);font-family:system-ui;font-size:12px">(trong hàm, sẽ thành ${s.side})</span></div>` : "";
  document.getElementById("sets").innerHTML = `<div>so = ${chips(s.so, s, "so")}</div><div>sk = ${chips(s.sk, s, "sk")}</div>` + maLine;
  document.getElementById("vars").innerHTML = s.vars || "&nbsp;";
  const z = (cls, title, expr, arr) => `<div class="zone ${cls}${arr?" on":""}"><div class="zt">${title}</div><div class="ze">${expr}</div>${arr?arr.map(x=>`<span class="chip ${cls}">'${x}'</span>`).join(""):""}</div>`;
  document.getElementById("zones").innerHTML = z("A","Chỉ có trong sổ","so - sk",s.zA) + z("B","Có ở cả hai","so &amp; sk",s.zB) + z("C","Chỉ có trên sao kê","sk - so",s.zC);
  const first = s.out.length - s.newOut;
  document.getElementById("out").innerHTML = ex.files
    ? (s.out.length ? s.out.map((x,i)=>`<span class="${i>=first?"new":""}">${esc(x)}</span>`).join("\n") : '<span class="ph">Kết quả print hiện ở đây</span>')
    : '<span class="ph">Các dòng 3 đến 5 chỉ tính, không in. Kết quả hiện ở ô "Ba nhóm".</span>';
  document.getElementById("back").disabled = k===0;
  document.getElementById("next").disabled = document.getElementById("all").disabled = k===steps.length-1;
}
function select(name){
  cur = name; steps = EX[cur].build(); k = 0;
  document.getElementById("tabs").innerHTML = Object.keys(EX).map(x=>`<button class="tab" role="tab" aria-selected="${x===cur}" data-x="${x}">${EX[x].label}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>select(b.dataset.x));
  const b = parseInt(q.get("buoc")); if (b>0 && b<=steps.length && name===(EX[q.get("vd")]?q.get("vd"):"tep")) k = b-1;
  render();
}
document.getElementById("next").onclick=()=>{if(k<steps.length-1){k++;render();}};
document.getElementById("back").onclick=()=>{if(k>0){k--;render();}};
document.getElementById("all").onclick=()=>{k=steps.length-1;render();};
document.getElementById("reset").onclick=()=>{k=0;render();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")document.getElementById("next").click();if(e.key==="ArrowLeft")document.getElementById("back").click();});
select(cur);
</script>
</body>
</html>
