<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="760">
<title>Lần vết vòng lặp for, từng bước</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
  --accent:#2563eb; --accent-soft:#e7eefc; --green:#15803d; --green-soft:#e3f4e8;
  --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
  --con-bg:#111827; --con-text:#e5e7eb;
  --kw:#7c3aed; --str:#047857; --num:#c2410c;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
    --accent:#6ea0ff; --accent-soft:#1e2a44; --green:#4ade80; --green-soft:#13301f;
    --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
    --con-bg:#05070b; --con-text:#e5e7eb;
    --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:10px 12px 12px}
.hint{color:var(--muted);margin:0 0 8px;font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px 10px;min-width:0}
.controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:5px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btns{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:7px 12px;margin-bottom:8px;min-height:58px;font-size:14px;overflow-wrap:anywhere}
.status b.h{display:block;font-size:12.5px;color:var(--accent)}
.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:8px}
.panel-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.code{background:var(--code-bg);border-radius:8px;padding:5px 0;overflow-x:auto;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ln{display:flex;white-space:pre;padding:0 10px 0 0;border-left:3px solid transparent}
.ln .no{width:26px;flex:none;text-align:right;padding-right:9px;color:var(--muted);opacity:.7;user-select:none}
.ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
.kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{border:1px solid var(--line);padding:2px 7px;text-align:left;white-space:nowrap}
th{background:var(--code-bg);font-weight:600;font-size:12px;color:var(--muted)}
tr.cur td{background:var(--cur)}
tr.done td{color:var(--muted)}
.mono,td.v,td.nm{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
td.v.none{color:var(--muted)}
tr.chg td{background:var(--cur);font-weight:700}
tr.chg td.v{animation:flash 1.1s ease-out}
.console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:6px 10px;min-height:32px;white-space:pre-wrap;font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.console .ph{color:#7b8494;font-family:system-ui,sans-serif}
.console .typed{color:#fbbf24}
.console .new{background:rgba(251,191,36,.18);border-radius:3px}
@keyframes flash{0%{box-shadow:inset 0 0 0 2px var(--cur-bar)}100%{}}
.stack>*+*{margin-top:8px}
.st-in{display:inline;font-weight:700;color:inherit}
@media (max-width:620px){.grid{grid-template-columns:1fr}.btns{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
<p class="hint">Code trong bài đọc dữ liệu bằng <span class="mono">input()</span>. Ở đây dữ liệu đã gõ sẵn trong bảng <b>Dữ liệu nhập</b>: mỗi lần gặp <span class="mono">input()</span>, Python lấy một dòng. Bấm <b>Bước tiếp</b> (hoặc phím →) để chạy từng dòng.</p>
<div class="controls">
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="btns">
    <button class="btn ghost" id="back">◀ Lùi lại</button>
    <button class="btn" id="next">Bước tiếp ▶</button>
    <button class="btn ghost" id="all">Chạy hết</button>
    <button class="btn ghost" id="reset">Làm lại</button>
  </div>
</div>
<div class="status" id="status"></div>
<div class="grid">
  <div class="stack">
    <div class="card"><p class="panel-title">Chương trình</p><div class="code" id="code"></div></div>
    <div class="card"><p class="panel-title">Output</p><div class="console" id="out"></div></div>
  </div>
  <div class="stack">
    <div class="card"><p class="panel-title">Dữ liệu nhập (thay cho bàn phím)</p><table id="data"></table></div>
    <div class="card"><p class="panel-title">Các biến</p><table id="vars"></table></div>
  </div>
</div>
</div>
<script>
const B = s => `<b class="st-in">${s}</b>`, M = s => `<span class="mono">${s}</span>`;
const EX = {
  tong: { label: "Cộng dồn doanh số",
    inputs: ["3","An,120000000","Bình,95500000","Cường,210000000"],
    vars: ["n","tong","i","dong","ten","doanh_so"],
    code: ['n = int(input("Số nhân viên: "))','tong = 0','for i in range(n):','    dong = input("Tên,Doanh số: ")','    ten, doanh_so = dong.split(",")','    tong = tong + int(doanh_so)','    print("Đã cộng", ten)','print("Tổng doanh số:", tong)'],
    run(P){
      const {env, input, st, print} = P;
      let r = P.pos(); env.n = parseInt(input("Số nhân viên: "));
      st(0, ["n"], r, `${M("input()")} lấy dòng đầu "${env.n}" (một chuỗi), ${M("int()")} đổi thành số: ${M("n = " + env.n)}. Sẽ có ${env.n} dòng dữ liệu tiếp theo.`);
      env.tong = 0;
      st(1, ["tong"], -1, `Tạo biến tích luỹ ${M("tong = 0")} <b class="st-in">trước</b> vòng lặp, chỉ chạy một lần.`);
      for (let i = 0; i < env.n; i++) {
        env.i = i;
        st(2, ["i"], -1, i === 0
          ? `${M("range(" + env.n + ")")} cho dãy 0, 1, 2. Vòng 1: ${M("i = 0")}, chạy các dòng thụt vào bên dưới.`
          : `Quay lại đầu vòng lặp. Vòng ${i+1}: ${M("i = " + i)}.`);
        r = P.pos(); env.dong = input("Tên,Doanh số: ");
        st(3, ["dong"], r, `${M("input()")} lấy dòng tiếp theo trong bảng: ${M('dong = "' + env.dong + '"')}.`);
        [env.ten, env.doanh_so] = env.dong.split(",");
        st(4, ["ten","doanh_so"], -1, `${M('split(",")')} cắt tại dấu phẩy: ${M('ten = "' + env.ten + '"')}, ${M('doanh_so = "' + env.doanh_so + '"')} (vẫn là chuỗi).`);
        const old = env.tong; env.tong = old + parseInt(env.doanh_so);
        st(5, ["tong"], -1, `${M("int(doanh_so)")} đổi chuỗi thành số rồi cộng vào tổng cũ: ${M("tong = " + old + " + " + env.doanh_so)} = ${B(env.tong)}.`);
        print(`Đã cộng ${env.ten}`);
        st(6, [], -1, `In ${M("Đã cộng " + env.ten)}. Hết các dòng thụt vào, quay lại dòng ${M("for")}.`);
      }
      st(2, [], -1, `${M("range(" + env.n + ")")} đã hết số (0, 1, 2 đều đã dùng) nên vòng lặp dừng. Python nhảy tới dòng không thụt vào ngay sau vòng lặp.`);
      print(`Tổng doanh số: ${env.tong}`);
      st(7, [], -1, `Dòng in tổng nằm <b class="st-in">sau</b> vòng lặp nên chỉ chạy một lần, khi đã cộng đủ ${env.n} người: ${B(env.tong)}.`);
    } },
  lonnhat: { label: "Đếm và tìm lớn nhất",
    inputs: ["4","DH01,350000","DH02,1200000","DH03,2500000","DH04,1000000"],
    vars: ["n","dem","lon_nhat","ma_lon_nhat","i","dong","ma_don","so_tien"],
    code: ['n = int(input("Số đơn hàng: "))','dem = 0','lon_nhat = -1','ma_lon_nhat = ""','for i in range(n):','    dong = input("Mã đơn,Số tiền: ")','    ma_don, so_tien = dong.split(",")','    so_tien = int(so_tien)','    if so_tien >= 1000000:','        dem = dem + 1','    if so_tien > lon_nhat:','        lon_nhat = so_tien','        ma_lon_nhat = ma_don','print("Số đơn từ 1 triệu:", dem)','print("Đơn lớn nhất:", ma_lon_nhat)','print("Số tiền:", lon_nhat)'],
    run(P){
      const {env, input, st, print} = P;
      let r = P.pos(); env.n = parseInt(input("Số đơn hàng: "));
      st(0, ["n"], r, `Dòng đầu cho biết số đơn: ${M("n = " + env.n)}.`);
      env.dem = 0; st(1, ["dem"], -1, `Biến đếm ${M("dem = 0")}, tạo trước vòng lặp.`);
      env.lon_nhat = -1; st(2, ["lon_nhat"], -1, `${M("lon_nhat = -1")}: nhỏ hơn mọi số tiền, nên đơn đầu tiên chắc chắn lớn hơn nó.`);
      env.ma_lon_nhat = ""; st(3, ["ma_lon_nhat"], -1, `${M('ma_lon_nhat = ""')}: chưa có đơn nào, mã để trống.`);
      for (let i = 0; i < env.n; i++) {
        env.i = i;
        st(4, ["i"], -1, i === 0 ? `${M("range(" + env.n + ")")} cho dãy 0, 1, 2, 3. Vòng 1: ${M("i = 0")}.` : `Quay lại đầu vòng lặp. Vòng ${i+1}: ${M("i = " + i)}.`);
        r = P.pos(); env.dong = input("Mã đơn,Số tiền: ");
        st(5, ["dong"], r, `${M("input()")} lấy dòng tiếp theo: ${M('dong = "' + env.dong + '"')}.`);
        [env.ma_don, env.so_tien] = env.dong.split(",");
        st(6, ["ma_don","so_tien"], -1, `Tách tại dấu phẩy: ${M('ma_don = "' + env.ma_don + '"')}, ${M('so_tien = "' + env.so_tien + '"')} (chuỗi).`);
        env.so_tien = parseInt(env.so_tien);
        st(7, ["so_tien"], -1, `${M("int()")} đổi so_tien thành số ${env.so_tien} để so sánh được.`);
        const c1 = env.so_tien >= 1000000;
        st(8, [], -1, `${M(env.so_tien + " >= 1000000")} là ${B(c1 ? "True" : "False")}` + (c1 ? `, nên chạy dòng bên trong ${M("if")}.` : `, bỏ qua dòng ${M("dem = dem + 1")}.`));
        if (c1) { const o = env.dem; env.dem = o + 1;
          st(9, ["dem"], -1, `Đếm thêm một đơn từ 1 triệu: ${M("dem = " + o + " + 1")} = ${B(env.dem)}.` + (env.so_tien === 1000000 ? ` Đơn đúng 1.000.000 vẫn được đếm vì điều kiện là ${M(">=")}.` : "")); }
        const c2 = env.so_tien > env.lon_nhat;
        st(10, [], -1, `${M(env.so_tien + " > " + env.lon_nhat)} là ${B(c2 ? "True" : "False")}` + (c2 ? `: đơn này lớn hơn mọi đơn đã thấy, cập nhật kỷ lục.` : `: không lớn hơn kỷ lục, giữ nguyên ${env.ma_lon_nhat}.`));
        if (c2) {
          env.lon_nhat = env.so_tien; st(11, ["lon_nhat"], -1, `Ghi đè ${M("lon_nhat = " + env.lon_nhat)}.`);
          env.ma_lon_nhat = env.ma_don; st(12, ["ma_lon_nhat"], -1, `Cập nhật luôn mã đơn đi kèm: ${M('ma_lon_nhat = "' + env.ma_don + '"')}. Hai biến luôn đổi cùng nhau.`);
        }
      }
      st(4, [], -1, `${M("range(" + env.n + ")")} đã hết số nên vòng lặp dừng. Giờ mới in kết quả.`);
      print(`Số đơn từ 1 triệu: ${env.dem}`); st(13, [], -1, `In số đơn từ 1 triệu: ${B(env.dem)}.`);
      print(`Đơn lớn nhất: ${env.ma_lon_nhat}`); st(14, [], -1, `In mã đơn lớn nhất: ${B(env.ma_lon_nhat)}.`);
      print(`Số tiền: ${env.lon_nhat}`); st(15, [], -1, `In số tiền của đơn đó: ${B(env.lon_nhat)}. Chương trình kết thúc.`);
    } }
};
const q = new URLSearchParams(location.search);
let cur = EX[q.get("vd")] ? q.get("vd") : "tong";
let steps = [], k = 0;

function esc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function hl(s){
  return s.replace(/("[^"]*")|([A-Za-z_]\w*)|(-?\d+)|([^"\w]+)/g, (m, str, w, num, o) =>
    str ? `<span class="str">${esc(str)}</span>`
    : w ? (/^(for|in|if|print|int|input|range)$/.test(w) ? `<span class="kw">${w}</span>` : w)
    : num ? `<span class="num">${num}</span>` : esc(o));
}
function repr(v){ return typeof v === "string" ? `"${v}"` : String(v); }
function build(){
  const ex = EX[cur], S = [], env = {}, out = [];
  let p = 0;
  const P = { env,
    pos: () => p,
    input: (prompt) => { const v = ex.inputs[p++]; out.push({p: prompt, v}); return v; },
    print: (t) => out.push({t}),
    st: (line, chg, row, msg) => S.push({line, chg, row, msg, used: p, env: {...env}, out: out.map(x => ({...x}))})
  };
  ex.run(P);
  S.forEach((s, i) => s.nout = i ? s.out.length - S[i-1].out.length : s.out.length);
  return S;
}
function outText(s){ return s.out.map(x => x.t !== undefined ? x.t : x.p + x.v).join("\n"); }
function render(){
  const ex = EX[cur], s = steps[k];
  document.getElementById("status").innerHTML = `<b class="h">Bước ${k+1}/${steps.length}</b>${s.msg}`;
  document.getElementById("code").innerHTML = ex.code.map((c,i)=>`<div class="ln${i===s.line?" cur":""}"><span class="no">${i+1}</span><span>${hl(c)}</span></div>`).join("");
  document.getElementById("data").innerHTML = `<tr><th>#</th><th>Dòng gõ vào</th></tr>` +
    ex.inputs.map((r,i)=>`<tr class="${i===s.row?"cur":(i<s.used?"done":"")}"><td>${i+1}</td><td class="mono">${esc(r)}</td></tr>`).join("");
  document.getElementById("vars").innerHTML = `<tr><th>Biến</th><th>Giá trị</th></tr>` +
    ex.vars.map(v=>{ const has = v in s.env;
      return `<tr class="${s.chg.includes(v)?"chg":""}"><td class="nm">${v}</td><td class="v${has?"":" none"}">${has?esc(repr(s.env[v])):"chưa có"}</td></tr>`; }).join("");
  const first = s.out.length - s.nout;
  document.getElementById("out").innerHTML = s.out.length
    ? s.out.map((x,i)=>`<span class="${i>=first?"new":""}">${x.t!==undefined?esc(x.t):esc(x.p)+'<span class="typed">'+esc(x.v)+'</span>'}</span>`).join("\n")
    : '<span class="ph">Kết quả print hiện ở đây</span>';
  document.getElementById("back").disabled = k===0;
  document.getElementById("next").disabled = document.getElementById("all").disabled = k===steps.length-1;
}
function select(name){
  cur = name; steps = build(); k = 0;
  document.getElementById("tabs").innerHTML = Object.keys(EX).map(x=>`<button class="tab" role="tab" aria-selected="${x===cur}" data-x="${x}">${EX[x].label}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>select(b.dataset.x));
  const b = parseInt(q.get("buoc")); if (b>0 && b<=steps.length && name===(EX[q.get("vd")]?q.get("vd"):"tong")) k = b-1;
  render();
}
document.getElementById("next").onclick=()=>{if(k<steps.length-1){k++;render();}};
document.getElementById("back").onclick=()=>{if(k>0){k--;render();}};
document.getElementById("all").onclick=()=>{k=steps.length-1;render();};
document.getElementById("reset").onclick=()=>{k=0;render();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")document.getElementById("next").click();if(e.key==="ArrowLeft")document.getElementById("back").click();});
select(cur);
</script>
</body>
</html>
