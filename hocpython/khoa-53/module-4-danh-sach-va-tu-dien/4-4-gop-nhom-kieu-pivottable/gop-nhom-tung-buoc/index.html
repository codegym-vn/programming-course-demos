<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="640">
<title>Gộp nhóm bằng từ điển, từng bước</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
  --accent:#2563eb; --accent-soft:#e7eefc; --green:#15803d; --green-soft:#e3f4e8;
  --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
  --con-bg:#111827; --con-text:#e5e7eb;
  --kw:#7c3aed; --str:#047857; --num:#c2410c; --cm:#6b7280; --xl:#1f7a4d; --xl-soft:#e6f4ec;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
    --accent:#6ea0ff; --accent-soft:#1e2a44; --green:#4ade80; --green-soft:#13301f;
    --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
    --con-bg:#05070b; --con-text:#e5e7eb;
    --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74; --cm:#8b93a1; --xl:#5fd39a; --xl-soft:#12291d;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14.5px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:1000px;margin:0 auto;padding:10px 12px 12px}
.hint{color:var(--muted);margin:0 0 8px;font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:5px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px}
.tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.btns{display:flex;gap:6px;margin-left:auto;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:6px 12px;border-radius:8px;cursor:pointer;font:inherit;font-size:14px;font-weight:600}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:7px 12px;margin-bottom:8px;min-height:58px;font-size:14px;overflow-wrap:anywhere}
.status b{display:block;font-size:12.5px;color:var(--accent)}
.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:8px}
.panel-title{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 6px}
.code{background:var(--code-bg);border-radius:8px;padding:6px 0;overflow-x:auto;font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ln{display:flex;white-space:pre;padding:0 10px 0 0;border-left:3px solid transparent}
.ln .no{width:28px;flex:none;text-align:right;padding-right:10px;color:var(--muted);opacity:.7;user-select:none}
.ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
.kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
td,th{border:1px solid var(--line);padding:3px 7px;text-align:left;white-space:nowrap}
th{background:var(--code-bg);font-weight:600;font-size:12.5px;color:var(--muted)}
td.r,th.r{text-align:right}
tr.cur td{background:var(--cur)}
tr.done td{color:var(--muted)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.dict{font:13.5px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--code-bg);border-radius:8px;padding:6px 10px;min-height:40px}
.kv{display:flex;justify-content:space-between;gap:10px;border-radius:5px;padding:0 6px}
.kv.flash{animation:flash 1.1s ease-out}
.vars{font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--muted);margin-top:6px;min-height:21px}
.vars span{color:var(--text)}
.pivot th{background:var(--xl-soft);color:var(--xl)}
.pivot td.tot{font-weight:700}
.console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:6px 10px;min-height:32px;white-space:pre-wrap;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;margin-top:8px}
.console .ph{color:#7b8494;font-family:system-ui,sans-serif}
@keyframes flash{0%{background:var(--cur);box-shadow:0 0 0 2px var(--cur-bar)}100%{}}
.stack>*+*{margin-top:8px}
@media (max-width:620px){.grid{grid-template-columns:1fr}.btns{margin-left:0}}
</style>
</head>
<body>
<div class="wrap">
<p class="hint">Bấm <b>Bước tiếp</b> (hoặc phím →) để xem từ điển được cộng dồn qua từng đơn hàng, giống cách PivotTable gom nhóm.</p>
<div class="controls">
  <div class="tabs" role="tablist" id="tabs"></div>
  <div class="btns">
    <button class="btn ghost" id="back">◀ Lùi lại</button>
    <button class="btn" id="next">Bước tiếp ▶</button>
    <button class="btn ghost" id="all">Chạy hết</button>
    <button class="btn ghost" id="reset">Làm lại</button>
  </div>
</div>
<div class="status" id="status"></div>
<div class="grid">
  <div class="stack">
    <div class="card"><p class="panel-title">Chương trình</p><div class="code" id="code"></div></div>
    <div class="card"><p class="panel-title">Dữ liệu: danh sách don_hang</p><table id="data"></table></div>
  </div>
  <div class="stack">
    <div class="card"><p class="panel-title">Từ điển <span id="dtitle" class="mono" style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--text)"></span></p><div class="dict" id="dict"></div><div class="vars" id="vars"></div></div>
    <div class="card"><p class="panel-title">Cùng kết quả trong Excel (PivotTable)</p><table class="pivot" id="pivot"></table>
      <div class="console" id="out"></div></div>
  </div>
</div>
</div>
<script>
const EX = {
  tong: { label: "Cộng doanh số theo khu vực", dict: "tong", cols: ["Nhân viên","Khu vực","Doanh số"], unit: " triệu",
    rows: [["An","Hà Nội",120],["Bình","Đà Nẵng",80],["Chi","Hà Nội",90],["Dũng","TP.HCM",150]],
    key: r => r[1], add: r => r[2], pivotHead: ["Khu vực","Tổng doanh số"],
    code: ["tong = {}","for dong in don_hang:","    ten, kv, tien = dong.split(\",\")","    tien = int(tien)","    tong[kv] = tong.get(kv, 0) + tien","print(tong)"],
    L: {init:0, loop:1, split:2, conv:3, upd:4, print:5} },
  dem: { label: "Đếm số đơn theo khu vực", dict: "so_don", cols: ["Nhân viên","Khu vực","Doanh số"], unit: "",
    rows: [["An","Hà Nội",120],["Bình","Đà Nẵng",80],["Chi","Hà Nội",90],["Dũng","TP.HCM",150]],
    key: r => r[1], add: r => 1, pivotHead: ["Khu vực","Số đơn"],
    code: ["so_don = {}","for dong in don_hang:","    ten, kv, tien = dong.split(\",\")","    so_don[kv] = so_don.get(kv, 0) + 1","print(so_don)"],
    L: {init:0, loop:1, split:2, conv:null, upd:3, print:4} },
  duan: { label: "Dự án: doanh thu theo nhân viên", dict: "ket_qua", cols: ["nhan_vien","khu_vuc","so_luong","don_gia"], unit: " đ",
    fmt: v => v.toLocaleString("vi-VN"),
    rows: [["An","Hà Nội",10,65000],["Bình","Đà Nẵng",2,350000],["An","Hà Nội",3,350000]],
    pivotHead: ["Nhân viên","Tổng doanh thu"],
    code: ["def tong_hop(don_hang, truong):","    ket_qua = {}","    for don in don_hang:","        khoa = don[truong]","        tien = (don[\"so_luong\"]","                * don[\"don_gia\"])","        cu = ket_qua.get(khoa, 0)","        ket_qua[khoa] = cu + tien","    return ket_qua","# don_hang: 3 đơn ở bảng bên dưới","theo_nv = tong_hop(don_hang,","                   \"nhan_vien\")","xep = sorted(theo_nv.items(),","             key=lambda x: x[1],","             reverse=True)","for ten, tien in xep:","    print(ten, tien)"],
    custom(){
      const S = [], d = {}, out = [], I = s => `<b style="display:inline;color:inherit">${s}</b>`, M = s => `<span class="mono">${s}</span>`;
      const V = o => Object.keys(o).map(x => `${x}=<span>${typeof o[x] === "string" ? `"${o[x]}"` : o[x]}</span>`).join("  ");
      const snap = (o) => S.push(Object.assign({dict: {...d}, row: -1, vars: o.env ? V(o.env) : "", flash: null, out: out.join("\n"), dname: "ket_qua"}, o));
      snap({line: 10, to: 11, env: {truong: "nhan_vien"}, pyskip: true,
        msg: `Gọi hàm ${M('tong_hop(don_hang, "nhan_vien")')}: tham số ${M("truong")} nhận chuỗi "nhan_vien", nghĩa là gộp theo cột nhân viên. Python nhảy vào thân hàm.`});
      snap({line: 1, pyenv: {ket_qua: {}}, msg: `Tạo từ điển rỗng ${M("ket_qua = {}")}. Chưa có nhân viên nào.`});
      this.rows.forEach((r, i) => {
        snap({line: 2, row: i, pyenv: {don: {nhan_vien: r[0], khu_vuc: r[1], so_luong: r[2], don_gia: r[3]}},
          msg: `Vòng lặp lấy đơn thứ ${i+1}: ${M("don")} là một từ điển gồm 4 cột như dòng tô vàng trong bảng.`});
        snap({line: 3, row: i, env: {khoa: r[0]}, msg: `${M("don[truong]")} tức ${M('don["nhan_vien"]')} = "${r[0]}". Đây là khoá để gộp nhóm.`});
        const tien = r[2] * r[3];
        snap({line: 4, to: 5, row: i, env: {khoa: r[0], tien}, msg: `Doanh thu = số lượng × đơn giá: ${M(`tien = ${r[2]} * ${r[3]}`)} = ${I(tien)}. Không nhân số lượng là sai ngay ở đây.`});
        const isNew = d[r[0]] === undefined, cu = isNew ? 0 : d[r[0]];
        snap({line: 6, row: i, env: {khoa: r[0], tien, cu}, msg: isNew
          ? `"${r[0]}" chưa có trong ${M("ket_qua")}, nên ${M(`get("${r[0]}", 0)`)} trả ${I(0)}.`
          : `"${r[0]}" đã có ${cu}, nên ${M("get")} trả ${I(cu)}.`});
        d[r[0]] = cu + tien;
        snap({line: 7, row: i, flash: r[0], env: {khoa: r[0], tien, cu}, msg: `Ghi ${M(`ket_qua["${r[0]}"] = ${cu} + ${tien}`)} = ${I(d[r[0]])}.`});
      });
      snap({line: 8, dname: "theo_nv", pyenv: {ket_qua: {...d}},
        msg: `Hết đơn, vòng lặp dừng. ${M("return ket_qua")} trả từ điển về, gán cho ${M("theo_nv")}.`});
      const xep = Object.entries(d).sort((a, b) => b[1] - a[1]);
      const xs = "[" + xep.map(([t, v]) => `('${t}', ${v})`).join(", ") + "]";
      snap({line: 12, to: 14, dname: "theo_nv", vars: `xep=<span>${xs}</span>`, pyenv: {theo_nv: {...d}, xep},
        msg: `${M("sorted")} xếp các cặp (tên, doanh thu) theo ${M("x[1]")} là doanh thu, ${M("reverse=True")} để lớn đứng trước.`});
      xep.forEach(([t, v], j) => {
        snap({line: 15, dname: "theo_nv", env: {ten: t, tien: v}, msg: `Lấy cặp thứ ${j+1} trong ${M("xep")}: ${M(`ten = "${t}"`)}, ${M(`tien = ${v}`)}.`});
        out.push(`${t} ${v}`);
        snap({line: 16, dname: "theo_nv", env: {ten: t, tien: v}, msg: `In ${M(`${t} ${v}`)}.` + (j === xep.length - 1 ? ` Kết quả khớp PivotTable bên cạnh: An bán nhiều nhất.` : "")});
      });
      return S;
    } }
};
const q = new URLSearchParams(location.search);
let cur = EX[q.get("vd")] ? q.get("vd") : "tong";
let steps = [], k = 0;

function hl(s){
  if (/^\s*#/.test(s)) return `<span style="color:var(--cm)">${s.replace(/&/g,"&amp;").replace(/</g,"&lt;")}</span>`;
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/("[^"]*")/g,'<span class="str">$1</span>')
    .replace(/\b(for|in|print|def|return|lambda|True)\b/g,'<span class="kw">$1</span>')
    .replace(/(?<![\w"])(\d+)(?![\w"])/g,'<span class="num">$1</span>');
}
function pyDict(d, ex){
  const parts = Object.keys(d).map(x => `'${x}': ${d[x]}`);
  return "{" + parts.join(", ") + "}";
}
function build(){
  if (EX[cur].custom) return EX[cur].custom();
  const ex = EX[cur], L = ex.L, d = {}, S = [];
  const snap = (o) => S.push(Object.assign({dict: {...d}, row: -1, vars: "", flash: null, out: ""}, o));
  snap({line: L.init, msg: `Tạo từ điển rỗng <span class="mono">${ex.dict} = {}</span>. Chưa có nhóm nào.`});
  ex.rows.forEach((r, i) => {
    const line = `"${r[0]},${r[1]},${r[2]}"`;
    snap({line: L.loop, row: i, msg: `Vòng lặp lấy đơn thứ ${i+1}: <span class="mono">dong = ${line}</span>.`});
    snap({line: L.split, row: i, vars: `ten=<span>"${r[0]}"</span>  kv=<span>"${r[1]}"</span>  tien=<span>"${r[2]}"</span>`,
      msg: `<span class="mono">split(",")</span> cắt dòng tại dấu phẩy thành 3 phần và gán vào ten, kv, tien (tien vẫn là chuỗi).`});
    if (L.conv !== null) snap({line: L.conv, row: i, vars: `ten=<span>"${r[0]}"</span>  kv=<span>"${r[1]}"</span>  tien=<span>${r[2]}</span>`,
      msg: `<span class="mono">int(tien)</span> đổi chuỗi "${r[2]}" thành số ${r[2]} để cộng được.`});
    const kk = ex.key(r), old = d[kk] === undefined ? 0 : d[kk], isNew = d[kk] === undefined, add = ex.add(r);
    d[kk] = old + add;
    snap({line: L.upd, row: i, flash: kk, vars: `kv=<span>"${kk}"</span>`,
      msg: isNew
        ? `Khu vực <b style="display:inline;color:inherit">${kk}</b> chưa có trong từ điển, nên <span class="mono">get("${kk}", 0)</span> trả 0. Ghi ${ex.dict}["${kk}"] = 0 + ${add} = <b style="display:inline;color:inherit">${d[kk]}</b>.`
        : `Khu vực <b style="display:inline;color:inherit">${kk}</b> đã có ${old}. <span class="mono">get</span> lấy ${old}, cộng thêm ${add}: ${ex.dict}["${kk}"] = ${old} + ${add} = <b style="display:inline;color:inherit">${d[kk]}</b>.`});
  });
  snap({line: L.print, out: pyDict(d), msg: `Hết dữ liệu, vòng lặp dừng. Mỗi khu vực một dòng, theo thứ tự <b style="display:inline;color:inherit">xuất hiện lần đầu</b>, khớp với PivotTable bên cạnh.`});
  return S;
}
function render(){
  const ex = EX[cur], s = steps[k];
  document.getElementById("status").innerHTML = `<b>Bước ${k+1}/${steps.length}</b>${s.msg}`;
  document.getElementById("code").innerHTML = ex.code.map((c,i)=>`<div class="ln${i>=s.line&&i<=(s.to??s.line)?" cur":""}"><span class="no">${i+1}</span><span>${hl(c)}</span></div>`).join("");
  document.getElementById("data").innerHTML = `<tr><th>#</th>${ex.cols.map((c,j)=>`<th${typeof ex.rows[0][j]==="number"?' class="r"':''}>${c}</th>`).join("")}</tr>` +
    ex.rows.map((r,i)=>`<tr class="${i===s.row?"cur":(s.row>i||s.row===-1&&k>0?"done":"")}"><td>${i+1}</td>${r.map(c=>typeof c==="number"?`<td class="r">${c}</td>`:`<td>${c}</td>`).join("")}</tr>`).join("");
  document.getElementById("dtitle").textContent = s.dname || ex.dict;
  const keys = Object.keys(s.dict), f = ex.fmt || (v => v);
  document.getElementById("dict").innerHTML = keys.length
    ? keys.map(x=>`<div class="kv${x===s.flash?" flash":""}"><span>"${x}"</span><span>${s.dict[x]}</span></div>`).join("")
    : '<span style="color:var(--muted)">{ } (rỗng)</span>';
  document.getElementById("vars").innerHTML = s.vars || "&nbsp;";
  const tot = keys.reduce((a,x)=>a+s.dict[x],0);
  document.getElementById("pivot").innerHTML = `<tr><th>${ex.pivotHead[0]}</th><th class="r">${ex.pivotHead[1]}</th></tr>` +
    keys.map(x=>`<tr><td>${x}</td><td class="r">${f(s.dict[x])}${ex.unit}</td></tr>`).join("") +
    (keys.length ? `<tr><td class="tot">Tổng cộng</td><td class="r tot">${f(tot)}${ex.unit}</td></tr>` : `<tr><td colspan="2" style="color:var(--muted)">(chưa có dữ liệu)</td></tr>`);
  document.getElementById("out").innerHTML = s.out ? s.out.replace(/</g,"&lt;") : '<span class="ph">Kết quả print hiện ở đây</span>';
  document.getElementById("back").disabled = k===0;
  document.getElementById("next").disabled = document.getElementById("all").disabled = k===steps.length-1;
}
function select(name){
  cur = name; steps = build(); k = 0;
  document.getElementById("tabs").innerHTML = Object.keys(EX).map(x=>`<button class="tab" role="tab" aria-selected="${x===cur}" data-x="${x}">${EX[x].label}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>select(b.dataset.x));
  const b = parseInt(q.get("buoc")); if (b>0 && b<=steps.length && name===(q.get("vd")||"tong")) k = b-1;
  render();
}
document.getElementById("next").onclick=()=>{if(k<steps.length-1){k++;render();}};
document.getElementById("back").onclick=()=>{if(k>0){k--;render();}};
document.getElementById("all").onclick=()=>{k=steps.length-1;render();};
document.getElementById("reset").onclick=()=>{k=0;render();};
document.addEventListener("keydown",e=>{if(e.key==="ArrowRight")document.getElementById("next").click();if(e.key==="ArrowLeft")document.getElementById("back").click();});
select(cur);
</script>
</body>
</html>
