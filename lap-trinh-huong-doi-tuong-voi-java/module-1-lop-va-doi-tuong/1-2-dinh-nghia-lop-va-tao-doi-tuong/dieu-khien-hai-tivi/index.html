<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="520">
<title>Điều khiển hai tivi</title>
<style>
:root{
  --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
  --accent:#2563eb; --accent-soft:#e7eefc;
  --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
  --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
  --con-bg:#111827; --con-text:#e5e7eb;
  --kw:#7c3aed; --str:#047857; --num:#c2410c; --cmt:#6b7280;
  --node:#ffffff; --node-line:#c9ced8;
  --arrow:#64748b; --this:#7c3aed; --this-soft:#f0e9fe;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
    --accent:#6ea0ff; --accent-soft:#1e2a44;
    --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
    --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
    --con-bg:#05070b; --con-text:#e5e7eb;
    --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74; --cmt:#8b93a1;
    --node:#1d222c; --node-line:#3a4250;
    --arrow:#94a3b8; --this:#c4a1ff; --this-soft:#2a2144;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);
  font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
code{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.wrap{max-width:1000px;margin:0 auto;padding:8px 12px 10px}
.lead{color:var(--muted);margin:0 0 6px;font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px}
.controls{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-bottom:6px}
.btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:5px 12px;border-radius:8px;
  cursor:pointer;font:inherit;font-weight:600;font-size:13.5px}
.btn.ghost{background:transparent;color:var(--accent)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn:focus-visible,.key:focus-visible,input:focus-visible,.chip:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.err{color:var(--false);font-size:12.5px}
.err:empty{display:none}
.status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
  padding:5px 12px;margin-bottom:6px;min-height:68px;font-size:13.5px}
.status>b{display:block;font-size:12.5px;color:var(--accent)}
.panel-title{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
.code{background:var(--code-bg);border-radius:8px;padding:5px 0;overflow:auto;
  font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ln{display:flex;white-space:pre;padding:0 4px 0 0;border-left:3px solid transparent;width:max-content;min-width:100%}
.ln .no{width:22px;flex:none;text-align:right;padding-right:6px;color:var(--muted);opacity:.6;user-select:none}
.ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
.ln mark{background:var(--cur-bar);color:#1d2330;border-radius:3px;padding:0 1px}
.ln mark span{color:inherit}
.kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--cmt);font-style:italic}
.console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:6px 10px;min-height:40px;white-space:pre-wrap;word-break:break-word;tab-size:8;overflow:auto;
  font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.console .ph{color:#7b8494;font-family:system-ui,sans-serif;font-size:12.5px}
kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px}
input[type=text]{padding:4px 7px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);
  font:13.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
input.bad{border-color:var(--false);background:var(--false-soft)}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}
</style>
</head>
<body>
<style>
.tvs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.tvs>*{min-width:0}
.tvh{display:flex;justify-content:space-between;align-items:baseline;font:700 13.5px ui-monospace,Menlo,Consolas,monospace;margin-bottom:4px}
.tvh small{font:600 11.5px system-ui,sans-serif;color:var(--muted)}
.screen{height:66px;border-radius:8px;border:4px solid #374151;background:#0b0f16;color:#7b8494;display:flex;align-items:center;justify-content:center;gap:16px;font:700 13px ui-monospace,Menlo,Consolas,monospace;transition:background .2s}
.screen.on{background:linear-gradient(135deg,#1e3a8a,#0e7490);color:#fff}
.screen .big{font-size:24px}
.bars{display:flex;align-items:flex-end;gap:2px;height:26px}
.bars i{width:5px;background:rgba(255,255,255,.25);border-radius:1px}
.bars i.lit{background:#fde68a}
.state{display:flex;gap:4px;margin:6px 0}
.st{flex:1;min-width:0;background:var(--code-bg);border:1.5px solid transparent;border-radius:6px;text-align:center;padding:1px 2px}
.st small{display:block;color:var(--muted);font:11px ui-monospace,Menlo,Consolas,monospace}
.st b{font:700 15px ui-monospace,Menlo,Consolas,monospace}
.st.chg{border-color:var(--cur-bar);background:var(--cur)}
.st.same{border-color:var(--false);background:var(--false-soft)}
.keys{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.key{border:1px solid var(--node-line);background:var(--node);color:var(--text);padding:3px 2px;border-radius:7px;cursor:pointer;font:600 13px system-ui,sans-serif;line-height:1.25}
.key small{display:block;font:11px ui-monospace,Menlo,Consolas,monospace;color:var(--muted)}
.key:hover{border-color:var(--accent)}
.setrow{display:flex;align-items:center;gap:3px;margin-top:4px;font:12px ui-monospace,Menlo,Consolas,monospace}
.setrow span{flex:1;min-width:0;white-space:nowrap}
.setrow input{width:50px;padding:2px 5px;font-size:12.5px}
.setrow .btn{padding:2px 8px;font-size:12.5px}
.tag{display:inline-block;padding:0 6px;border-radius:5px;font:700 12px ui-monospace,Menlo,Consolas,monospace}
.tag.t{background:var(--true-soft);color:var(--true)}.tag.f{background:var(--false-soft);color:var(--false)}
@media (max-width:600px){.tvs{grid-template-columns:1fr}}
</style>
<div class="wrap">
  <p class="lead">Bấm các nút của từng điều khiển: mỗi nút gọi một phương thức trên đúng chiếc tivi đó.</p>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="tvs" id="tvs"></div>
  <div class="controls">
    <div class="btns"><button class="btn ghost" id="prev">Lùi lại</button><button class="btn ghost" id="reset">Làm lại</button></div>
    <div class="err" id="err" role="alert"></div>
  </div>
</div>
<script>
// Logic lớp TV, không đụng DOM để đối chiếu với Java.
function tvNew(){ return {channel: 1, volumeLevel: 1, on: false}; }
var TV_SPEC = {
  channelUp:   {field: 'channel',     cond: function(t){ return [['on', t.on], ['channel < 120', t.channel < 120]]; },   apply: function(t){ return t.channel + 1; }},
  channelDown: {field: 'channel',     cond: function(t){ return [['on', t.on], ['channel > 1', t.channel > 1]]; },       apply: function(t){ return t.channel - 1; }},
  volumeUp:    {field: 'volumeLevel', cond: function(t){ return [['on', t.on], ['volumeLevel < 7', t.volumeLevel < 7]]; }, apply: function(t){ return t.volumeLevel + 1; }},
  volumeDown:  {field: 'volumeLevel', cond: function(t){ return [['on', t.on], ['volumeLevel > 1', t.volumeLevel > 1]]; }, apply: function(t){ return t.volumeLevel - 1; }},
  setChannel:  {field: 'channel',     cond: function(t, a){ return [['on', t.on], ['newChannel >= 1', a >= 1], ['newChannel <= 120', a <= 120]]; }, apply: function(t, a){ return a; }},
  setVolume:   {field: 'volumeLevel', cond: function(t, a){ return [['on', t.on], ['newLevel >= 1', a >= 1], ['newLevel <= 7', a <= 7]]; },        apply: function(t, a){ return a; }}
};
// Trả về {tv, field, changed, parts, pass}; parts chỉ gồm các vế && thực sự được xét.
function tvCall(tv, method, arg){
  var t = {channel: tv.channel, volumeLevel: tv.volumeLevel, on: tv.on};
  if (method === 'turnOn' || method === 'turnOff') {
    var v = method === 'turnOn';
    return {tv: {channel: t.channel, volumeLevel: t.volumeLevel, on: v}, field: 'on', changed: t.on !== v, parts: null, pass: true};
  }
  var spec = TV_SPEC[method], all = spec.cond(t, arg), parts = [], pass = true;
  for (var i = 0; i < all.length; i++) { parts.push(all[i]); if (!all[i][1]) { pass = false; break; } }
  if (pass) t[spec.field] = spec.apply(t, arg);
  return {tv: t, field: spec.field, changed: pass && t[spec.field] !== tv[spec.field], parts: parts, pass: pass, total: all.length};
}

(function(){
  var $ = function(id){ return document.getElementById(id); };
  function qs(name){ var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }
  var NAMES = ['tv1', 'tv2'], tvs, hist, last;
  var KEYS = [['Bật', 'turnOn'], ['Tắt', 'turnOff'], ['Kênh +', 'channelUp'], ['Kênh −', 'channelDown'], ['Âm lượng +', 'volumeUp'], ['Âm lượng −', 'volumeDown']];
  function init(){ tvs = {tv1: tvNew(), tv2: tvNew()}; hist = []; last = null; }
  function tag(v){ return '<span class="tag ' + (v ? 't' : 'f') + '">' + v + '</span>'; }
  function shell(n){
    return '<div class="card" data-tv="' + n + '"><div class="tvh"><span>' + n + '</span><small>đối tượng TV</small></div>' +
      '<div class="screen" data-p="screen"></div><div class="state" data-p="state"></div><div class="keys">' +
      KEYS.map(function(k){ return '<button class="key" data-m="' + k[1] + '">' + k[0] + '<small>' + k[1] + '()</small></button>'; }).join('') + '</div>' +
      '<div class="setrow"><span>setChannel(</span><input type="text" inputmode="numeric" data-in="setChannel" value="30" aria-label="Số kênh cho ' + n + '"><span style="flex:none">)</span><button class="btn ghost" data-set="setChannel">Gọi</button></div>' +
      '<div class="setrow"><span>setVolume(</span><input type="text" inputmode="numeric" data-in="setVolume" value="3" aria-label="Mức âm lượng cho ' + n + '"><span style="flex:none">)</span><button class="btn ghost" data-set="setVolume">Gọi</button></div></div>';
  }
  function draw(){
    NAMES.forEach(function(n){
      var t = tvs[n], root = document.querySelector('[data-tv="' + n + '"]'), bars = '';
      for (var i = 1; i <= 7; i++) bars += '<i class="' + (t.on && i <= t.volumeLevel ? 'lit' : '') + '" style="height:' + (6 + i * 3) + 'px"></i>';
      var sc = root.querySelector('[data-p=screen]');
      sc.className = 'screen' + (t.on ? ' on' : '');
      sc.innerHTML = t.on ? '<span class="big">' + t.channel + '</span><span class="bars">' + bars + '</span>' : 'Đang tắt';
      root.querySelector('[data-p=state]').innerHTML = ['channel', 'volumeLevel', 'on'].map(function(f){
        var c = last && last.name === n && last.res.field === f ? (last.res.changed ? ' chg' : ' same') : '';
        return '<div class="st' + c + '"><small>' + f + '</small><b>' + t[f] + '</b></div>';
      }).join('');
    });
    $('prev').disabled = hist.length === 0;
    if (!last) {
      $('status').innerHTML = '<b>Hai tivi vừa tạo bằng new TV()</b><span>Cả hai có <code>channel</code> bằng 1, <code>volumeLevel</code> bằng 1 và đang tắt. Thử đổi kênh khi tivi đang tắt, rồi bật lên và thử lại.</span>';
      return;
    }
    var r = last.res, call = last.name + '.' + last.method + '(' + (last.arg === undefined ? '' : last.arg) + ')', body;
    if (!r.parts) {
      body = 'Phương thức này không kiểm tra điều kiện: gán <code>on = ' + r.tv.on + '</code>.' + (r.changed ? '' : ' Tivi đã ở trạng thái đó nên không có gì khác đi.');
    } else {
      var expr = r.parts.map(function(p){ return '<code>' + p[0].replace(/</g, '&lt;').replace(/>/g, '&gt;') + '</code> ' + tag(p[1]); }).join(' &amp;&amp; ');
      var stopEarly = !r.pass && r.parts.length < r.total ? ' Vế sai đầu tiên làm <code>&amp;&amp;</code> dừng ngay.' : '';
      body = 'Điều kiện: ' + expr + '.' + stopEarly + ' ' + (r.pass ? '<code>' + r.field + '</code> thành <b>' + r.tv[r.field] + '</b>.' : 'Điều kiện sai, <code>' + r.field + '</code> đứng yên ở <b>' + r.tv[r.field] + '</b>.');
    }
    var other = last.name === 'tv1' ? 'tv2' : 'tv1';
    $('status').innerHTML = '<b>' + call + '</b><span>' + body + ' <code>' + other + '</code> không bị ảnh hưởng.</span>';
  }
  function call(name, method, arg){
    hist.push({tvs: JSON.parse(JSON.stringify(tvs)), last: last});
    var res = tvCall(tvs[name], method, arg);
    tvs[name] = res.tv;
    last = {name: name, method: method, arg: arg, res: res};
    draw();
  }
  $('tvs').innerHTML = NAMES.map(shell).join('');
  $('tvs').addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    var name = b.closest('[data-tv]').getAttribute('data-tv');
    if (b.dataset.m) { $('err').textContent = ''; call(name, b.dataset.m); return; }
    if (b.dataset.set) {
      var inp = b.parentNode.querySelector('input'), s = inp.value.trim(), ok = /^-?\d{1,3}$/.test(s);
      inp.classList.toggle('bad', !ok);
      if (!ok) { $('err').textContent = 'Hãy nhập số nguyên từ -999 đến 999.'; return; }
      $('err').textContent = ''; call(name, b.dataset.set, parseInt(s, 10));
    }
  });
  $('tvs').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.target.parentNode.querySelector('button').click();
  });
  $('prev').addEventListener('click', function(){ var h = hist.pop(); if (!h) return; tvs = h.tvs; last = h.last; draw(); });
  $('reset').addEventListener('click', function(){ init(); $('err').textContent = ''; draw(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'ArrowLeft' && e.target.tagName !== 'INPUT') { $('prev').click(); e.preventDefault(); }
  });
  init();
  // ?goi=tv1.turnOn,tv1.setChannel:120,tv1.channelUp mở sẵn một chuỗi lời gọi
  qs('goi').split(',').filter(Boolean).forEach(function(c){
    var p = c.split(':'), q = p[0].split('.');
    if (tvs[q[0]] && (q[1] === 'turnOn' || q[1] === 'turnOff' || TV_SPEC[q[1]])) call(q[0], q[1], p[1] === undefined ? undefined : parseInt(p[1], 10));
  });
  draw();
})();
</script>

</body>
</html>
