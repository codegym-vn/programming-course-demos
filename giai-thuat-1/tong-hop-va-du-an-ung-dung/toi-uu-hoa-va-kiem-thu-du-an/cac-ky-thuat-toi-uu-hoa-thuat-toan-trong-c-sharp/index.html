<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mô phỏng tối ưu hóa thuật toán</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c;
    --node:#ffffff; --node-line:#c9ced8; --node-text:#3b4352;
    --p1:#2563eb; --p1s:#dbe7ff; --p2:#9333ea; --p2s:#efdcff; --p3:#c2410c; --p3s:#ffe3d1;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74;
      --node:#1d222c; --node-line:#3a4250; --node-text:#c8cfdb;
      --p1:#6ea0ff; --p1s:#1f3358; --p2:#c9a0ff; --p2s:#35244f; --p3:#fdba74; --p3s:#4a2c16;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 32px}
  h1{font-size:22px;margin:0 0 4px}
  .lead{color:var(--muted);margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:12px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 12px;
    border-radius:8px;cursor:pointer;font:inherit}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .field{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .field label{font-weight:600}
  .field input{width:80px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--text);font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .field input.bad{border-color:var(--false)}
  .chip{border:1px dashed var(--node-line);background:transparent;color:var(--text);padding:4px 10px;
    border-radius:999px;cursor:pointer;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .seg{display:flex;align-items:center;gap:6px}
  .seg b{font-weight:600}
  .seg button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:5px 12px;border-radius:8px;
    cursor:pointer;font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
  .btns{display:flex;gap:8px;margin-left:auto;flex-wrap:wrap}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:8px 14px;border-radius:8px;
    cursor:pointer;font:inherit;font-weight:600}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .err{color:var(--false);font-size:13px;min-height:18px;margin:-4px 0 8px}
  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
    padding:10px 14px;margin-bottom:14px;min-height:64px}
  .status b{display:block;font-size:13px;color:var(--accent);margin-bottom:2px}
  .status .note{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:1.15fr 1fr;gap:14px}
  .grid>*{min-width:0}
  .col{display:flex;flex-direction:column;gap:14px;min-width:0}
  @media (max-width:820px){.grid{grid-template-columns:1fr}.btns{margin-left:0}}
  .panel-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;margin:0 0 8px}
  .legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin:0 0 8px;font-size:12.5px}
  .legend span{padding:1px 8px;border-radius:999px;border:1px solid}
  .l1{color:var(--p1);border-color:var(--p1);background:var(--p1s)}
  .l2{color:var(--p2);border-color:var(--p2);background:var(--p2s)}
  .l3{color:var(--p3);border-color:var(--p3);background:var(--p3s)}
  .code{background:var(--code-bg);border-radius:8px;padding:8px 0;overflow-x:auto;
    font:14px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 12px 0 0;border-left:3px solid transparent}
  .ln .no{width:34px;flex:none;text-align:right;padding-right:12px;color:var(--muted);opacity:.7;user-select:none}
  .ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}
  .p{border-bottom:2px solid;border-radius:3px;padding:0 2px;transition:background .2s}
  .p1{border-color:var(--p1)}.p2{border-color:var(--p2)}.p3{border-color:var(--p3)}
  .p1.act{background:var(--p1s)}.p2.act{background:var(--p2s)}.p3.act{background:var(--p3s)}
  .p.act{font-weight:700}
  .side{display:flex;flex-direction:column;gap:14px;min-width:0}
  svg{width:100%;height:auto;display:block;max-width:360px;margin:0 auto}
  .nd rect,.nd polygon{fill:var(--node);stroke:var(--node-line);stroke-width:1.5;transition:all .25s}
  .nd text{fill:var(--node-text);font:12px system-ui,sans-serif}
  .nd text.mono{font:11.5px ui-monospace,Menlo,Consolas,monospace}
  .nd.on rect,.nd.on polygon{fill:var(--cur);stroke:var(--cur-bar);stroke-width:2.5}
  .nd.done rect,.nd.done polygon{stroke:var(--accent);stroke-width:2}
  .ed{fill:none;stroke:var(--node-line);stroke-width:1.8;transition:all .25s}
  .ed.done{stroke:var(--accent);stroke-width:2.6}
  .elabel{font:600 11px system-ui,sans-serif}
  .elabel.t{fill:var(--true)}.elabel.f{fill:var(--false)}
  .vars{display:flex;gap:10px;flex-wrap:wrap}
  .var{background:var(--code-bg);border-radius:8px;padding:6px 14px;min-width:84px;text-align:center}
  .var small{display:block;color:var(--muted);font:12px ui-monospace,Menlo,Consolas,monospace}
  .var strong{font:700 20px ui-monospace,Menlo,Consolas,monospace}
  .var.na strong{color:var(--muted);font-size:13px;font-family:system-ui,sans-serif;font-weight:500;line-height:30px;display:block}
  .tbl{width:100%;border-collapse:collapse;font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .tbl th{font:600 12px system-ui,sans-serif;color:var(--muted);text-align:left;padding:4px 8px;border-bottom:1px solid var(--line)}
  .tbl td{padding:4px 8px;border-bottom:1px solid var(--line)}
  .tbl tr.cur td{background:var(--cur)}
  .tbl .ph td{color:var(--muted);font-family:system-ui,sans-serif;font-size:13px}
  .tag{display:inline-block;padding:0 7px;border-radius:6px;font-weight:700;font-size:12.5px}
  .tag.t{background:var(--true-soft);color:var(--true)}.tag.f{background:var(--false-soft);color:var(--false)}
  .tblwrap{overflow-x:auto;max-height:340px;overflow-y:auto}
  .console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:10px 12px;min-height:72px;
    font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .console .ph{color:#7b8494;font-family:system-ui,sans-serif;font-size:13px}

  .cm{color:var(--muted);font-style:italic}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .pair>*{min-width:0}
  @media (max-width:820px){.pair{grid-template-columns:1fr}}
  .mini{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:8px 12px;margin:10px 0;min-height:60px;font-size:14px}
  .mini b{display:block;font-size:12px;color:var(--accent)}
  .cnt{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
  .cnt div{background:var(--code-bg);border-radius:8px;padding:4px 12px;font-size:13px}
  .cnt strong{font:700 17px ui-monospace,Menlo,Consolas,monospace;margin-left:4px}
  .sub{margin:0 0 8px;color:var(--muted);font-size:13.5px}
  .done-flag{color:var(--true);font-weight:600}

  .arow{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px;flex-wrap:wrap}
  .aname{font:700 15px ui-monospace,Menlo,Consolas,monospace;padding-top:10px;min-width:44px}
  .cells{display:flex;gap:0;flex-wrap:wrap}
  .cw{display:flex;flex-direction:column;align-items:center}
  .cell2{min-width:52px;height:44px;padding:0 8px;border:2px solid var(--node-line);margin-left:-2px;display:flex;align-items:center;justify-content:center;font:700 16px ui-monospace,Menlo,Consolas,monospace;background:var(--node)}
  .cw:first-child .cell2{margin-left:0;border-radius:8px 0 0 8px}.cw:last-child .cell2{border-radius:0 8px 8px 0}.cw:only-child .cell2{border-radius:8px}
  .cell2.empty{border-style:dashed;background:transparent}
  .cell2.hi{background:var(--cur);border-color:var(--cur-bar);position:relative;z-index:1}
  .ix{font:12px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);margin-top:4px}

  .cell2{min-width:34px;height:38px;padding:0 4px;font-size:14px}
  .g2row .cell2{width:34px;min-width:34px}.ch{width:34px}
  .ix{font-size:11px}
  .cell2.donec{background:var(--true-soft);border-color:var(--true)}
  .cell2.donec.hi{background:var(--cur);border-color:var(--cur-bar)}

  .cell2.dimc{opacity:.3}
  .var strong{font-size:18px}
  .cell2{min-width:36px}

  #full{position:absolute;right:20px;top:18px;background:#f59e0b;color:#1c1300;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:0;cursor:pointer;font-family:inherit}
  #fullnote{position:absolute;right:20px;top:56px;max-width:320px;background:#7f1d1d;color:#fecaca;font-size:13px;padding:8px 10px;border-radius:8px;z-index:20}
  #full:hover{filter:brightness(1.1)}
  header{position:relative}
  @media (max-width:640px){#full{position:static;display:inline-block;margin-top:8px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Các kỹ thuật tối ưu hóa thuật toán</h1>
  <button id="full" type="button">⛶ Phóng to</button>
  <div id="fullnote" hidden>Khung bài học này không cho phóng to. Hãy dùng liên kết &quot;Mở bài tương tác toàn màn hình&quot; đặt ngay trong bài.</div>

  <p class="lead">Hai cách viết cùng một việc chạy song song để so sánh công việc. Bấm <b>Bước tiếp</b> để cả hai cùng chạy một bước.</p>
  <div class="controls">
    <div class="tabs" role="tablist"><button class="tab" role="tab" data-ex="som" aria-selected="true">Dừng sớm</button><button class="tab" role="tab" data-ex="can" aria-selected="false">Chỉ thử đến √n</button><button class="tab" role="tab" data-ex="cache" aria-selected="false">Không tính lại</button><button class="tab" role="tab" data-ex="ct" aria-selected="false">Dùng công thức</button></div>
    <div class="btns">
      <button class="btn" id="next">Bước tiếp</button>
      <button class="btn ghost" id="all">Chạy hết</button>
      <button class="btn ghost" id="reset">Làm lại</button>
    </div>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="pair"><div class="card"><p class="panel-title" id="t0"></p><p class="sub" id="s0"></p><div class="code" id="code0"></div><div class="mini" id="msg0"></div><div id="mem0" style="margin:10px 0"></div><div class="console" id="con0" style="white-space:pre"></div></div><div class="card"><p class="panel-title" id="t1"></p><p class="sub" id="s1"></p><div class="code" id="code1"></div><div class="mini" id="msg1"></div><div id="mem1" style="margin:10px 0"></div><div class="console" id="con1" style="white-space:pre"></div></div></div>
</div>
<script>(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function hl(src){
    var re = /(\$?"(?:[^"\\]|\\.)*")|(\/\/.*$)|\b(int|long|char|bool|double|string|const|new|for|foreach|in|if|else|switch|case|break|default|while|do|return|var|true|false|null)\b|(\b\d+\b)/g, out = '', last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
      else if (m[2]) out += '<span class="cm">' + esc(m[2]) + '</span>';
      else if (m[3]) out += '<span class="kw">' + m[3] + '</span>';
      else out += '<span class="num">' + m[4] + '</span>';
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }
  function mk(){
    var snaps = [], outs = [], n = 0;
    return {out:function(t){ outs.push(t); }, setOut:function(a){ outs = a.slice(); }, snaps:snaps,
      snap:function(o){ o.outs = outs.slice(); o.title = 'Bước ' + (++n) + ' · ' + o.title; snaps.push(o); }};
  }
  function CC(a,hi,dn,dm){hi=hi||[];dn=dn||[];dm=dm||[];return a.map(function(v,i){return {v:v,hi:hi.indexOf(i)>=0,done:dn.indexOf(i)>=0,dim:dm.indexOf(i)>=0};});}
function AR(name,a,hi,dn,dm){return {name:name,cells:a.length?CC(a,hi,dn,dm):[{v:null}],noIdx:!a.length};}
function JN(a){return a.join(' × ');}
/* 1. Khái niệm số học cơ bản */
function KN(){
 return {inputs:[{id:'a',label:'a',def:17,min:1,max:40},{id:'b',label:'b',def:5,min:1,max:40}],chips:[12,17,36],
  intro:'Nhập a và b: xem a / b, a % b, a có chia hết cho b không và danh sách ước của a. Bấm "Bước tiếp".',
  lines:function(P){return ['int a = '+P.a+', b = '+P.b+';','int thuong = a / b;','int du = a % b;','bool chiaHet = (a % b == 0);','for (int i = 1; i <= a; i++)','    if (a % i == 0)','        uoc.Add(i);','Console.WriteLine(string.Join(" ", uoc));'];},
  run:function(c,P){
   var a=P.a,b=P.b,q=Math.floor(a/b),r=a%b,u=[],i;
   c.snap({ln:0,title:'Khai báo a và b',body:'a = '+a+', b = '+b+'.',vars:[['a',a],['b',b]]});
   c.snap({ln:1,title:'Chia lấy thương',body:a+' / '+b+' = '+q+'. Với hai số nguyên, "/" chỉ lấy phần thương và bỏ phần lẻ.',vars:[['a',a],['b',b],['thuong',q]]});
   c.snap({ln:2,title:'Chia lấy dư',body:a+' % '+b+' = '+r+'. Kiểm tra: '+b+' × '+q+' + '+r+' = '+a+'.',vars:[['thuong',q],['du',r]]});
   c.snap({ln:3,title:'Có chia hết không?',body:r===0?'Dư bằng 0 nên '+a+' chia hết cho '+b+' ('+b+' là ước của '+a+').':'Dư là '+r+', khác 0 nên '+a+' không chia hết cho '+b+'.',vars:[['du',r],['chiaHet',r===0?'true':'false']]});
   for(i=1;i<=a;i++){
    if(a%i===0){u.push(i);c.snap({ln:6,title:'i = '+i+': '+a+' % '+i+' = 0',body:'Dư 0 nên '+i+' là ước của '+a+'. Thêm vào danh sách.',arrs:[AR('uoc',u,[u.length-1])],vars:[['i',i],['a % i',0]]});}
    else c.snap({ln:5,title:'i = '+i+': '+a+' % '+i+' = '+(a%i),body:'Dư khác 0 nên '+i+' không là ước của '+a+'.',arrs:[AR('uoc',u)],vars:[['i',i],['a % i',a%i]]});
   }
   c.out(u.join(' '));
   c.snap({ln:7,title:'Xong',body:a+' có '+u.length+' ước: '+u.join(', ')+'.',note:'Ước của a là số chia hết a. Luôn có 1 và chính a. Bội của a là kết quả của a nhân với một số nguyên.',arrs:[AR('uoc',u)],vars:[['thuong',q],['du',r],['chiaHet',r===0?'true':'false']]});
  }};
}
/* 2. Kiểu dữ liệu số */
function KT(kind){
 var D={
 kieu:{intro:'So sánh ba kiểu số hay dùng: int, long, double. Bấm "Bước tiếp".',lines:['int a = 2147483647;','long b = 9223372036854775807;','double c = 3.14;'],
  run:function(c){
   c.snap({ln:0,title:'Kiểu int',body:'int lưu số nguyên 32 bit, từ -2147483648 đến 2147483647.',vars:[['a','2147483647']]});
   c.snap({ln:1,title:'Kiểu long',body:'long lưu số nguyên 64 bit, rộng hơn int rất nhiều.',vars:[['a','2147483647'],['b','9223372036854775807']]});
   c.snap({ln:2,title:'Kiểu double',body:'double lưu số thực (có phần thập phân), nhưng chỉ gần đúng.',note:'Chọn int cho số nguyên thông thường, long khi số rất lớn, double khi cần phần thập phân.',vars:[['a','2147483647'],['b','9223372036854775807'],['c','3.14']]});
  }},
 tran:{intro:'Cộng 1 vào giá trị lớn nhất của int và xem điều gì xảy ra. Bấm "Bước tiếp".',lines:['int x = int.MaxValue;','x = x + 1;','Console.WriteLine(x);','long y = 2147483647;','y = y + 1;','Console.WriteLine(y);'],
  run:function(c){
   c.snap({ln:0,title:'x là số int lớn nhất',body:'int.MaxValue = 2147483647.',vars:[['x','2147483647']]});
   c.snap({ln:1,title:'x + 1 vượt giới hạn',body:'Kết quả vượt quá khả năng lưu của int nên giá trị quay vòng sang số âm nhỏ nhất.',vars:[['x','-2147483648']]});
   c.out('-2147483648');
   c.snap({ln:2,title:'In x',body:'x không phải 2147483648 mà là -2147483648. C# không báo lỗi, đây là tràn số.',vars:[['x','-2147483648']]});
   c.snap({ln:3,title:'y là long',body:'Cùng giá trị 2147483647 nhưng lưu trong long (64 bit).',vars:[['x','-2147483648'],['y','2147483647']]});
   c.snap({ln:4,title:'y + 1',body:'long còn dư chỗ, nên kết quả đúng.',vars:[['x','-2147483648'],['y','2147483648']]});
   c.out('2147483648');
   c.snap({ln:5,title:'In y',body:'y = 2147483648. Cần số lớn hơn khoảng 2 tỷ thì dùng long.',note:'Mặc định C# không báo lỗi khi int tràn số. Muốn bắt lỗi, đặt phép tính trong khối checked.',vars:[['x','-2147483648'],['y','2147483648']]});
  }},
 chia:{intro:'Cùng phép 7 chia 2 nhưng kiểu dữ liệu khác nhau cho kết quả khác nhau. Bấm "Bước tiếp".',lines:['int a = 7, b = 2;','int q1 = a / b;','double q2 = (double)a / b;','double q3 = a / b;','Console.WriteLine(q1 + " " + q2 + " " + q3);'],
  run:function(c){
   c.snap({ln:0,title:'Hai số nguyên',body:'a = 7, b = 2, cả hai là int.',vars:[['a',7],['b',2]]});
   c.snap({ln:1,title:'Chia nguyên',body:'int chia int cho kết quả int: 7 / 2 = 3, phần lẻ bị bỏ.',vars:[['q1',3]]});
   c.snap({ln:2,title:'Ép kiểu rồi chia',body:'(double)a biến a thành số thực trước khi chia, nên 7.0 / 2 = 3.5.',vars:[['q1',3],['q2','3.5']]});

function NTCOL(kind,n){

 return {title:T[0],sub:T[1],lines:NTL[kind],run:function(c){
  var cnt=0,i,ifLn=kind==='c'?3:2,rf=kind==='c'?4:3,rt=kind==='c'?5:4,r;
  var fin=function(res,why){c.out(res?'True':'False');c.snap({ln:res?rt:rf,title:res?'Là số nguyên tố':'Không phải số nguyên tố',body:why+' Tổng cộng '+cnt+' phép chia.',vars:[['số phép chia',cnt]]});};

  if(kind==='c'){

   if(r===0){fin(n===2,'n chia hết cho 2.');return;}
   for(i=3;i*i<=n;i+=2){
    cnt++;r=n%i;
    c.snap({ln:ifLn,title:'i = '+i+': '+n+' % '+i+' = '+r,body:r===0?i+' là ước, dừng.':'Dư khác 0, thử số lẻ tiếp theo.',vars:[['i',i],['n % i',r],['số phép chia',cnt]]});
    if(r===0){fin(false,i+' là ước của n.');return;}
   }
   fin(true,'Không có ước nào đến √n.');return;
  }
  for(i=2;kind==='a'?i<n:i*i<=n;i++){

   if(r===0){fin(false,i+' là ước của n.');return;}
  }
  fin(true,kind==='a'?'Không có ước nào từ 2 đến n − 1.':'Không có ước nào đến √n.');
 }};
}

/* ===== dùng chung ===== */
function CC(a,hi,dn,dm){hi=hi||[];dn=dn||[];dm=dm||[];return a.map(function(v,i){return {v:v,hi:hi.indexOf(i)>=0,done:dn.indexOf(i)>=0,dim:dm.indexOf(i)>=0};});}
function AR(name,a,hi,dn,dm){return {name:name,cells:a.length?CC(a,hi,dn,dm):[{v:null}],noIdx:!a.length};}
function ALL(a){return a.map(function(x,i){return i;});}
function BRES(A,x){var lo=0,hi=A.length-1,cnt=0;while(lo<=hi){var m=Math.floor((lo+hi)/2);cnt++;if(A[m]===x)return {idx:m,cnt:cnt};if(A[m]<x)lo=m+1;else hi=m-1;}return {idx:-1,cnt:cnt};}

function KH(){
 var A0=[42,17,8,23,15,4,31,12];
 return {inputs:[{id:'x',label:'x',def:23,min:0,max:99}],chips:[23,15,99],
  intro:'Bài toán: tìm mã sách x trong danh sách chưa sắp xếp. Kết hợp hai thuật toán: sắp xếp trước, tìm nhị phân sau. Nhập x rồi bấm "Bước tiếp".',
  lines:function(){return ['int[] a = { 42, 17, 8, 23, 15, 4, 31, 12 };','SapXep(a);','int vt = TimNhiPhan(a, x);','Console.WriteLine(vt);'];},
  run:function(c,P){
   var x=P.x,a=A0.slice(),n=a.length,i,j,sc=0;
   c.snap({ln:0,title:'Danh sách chưa sắp xếp',body:'Mảng a có 8 mã sách theo thứ tự lộn xộn. Cần tìm x = '+x+'.',arrs:[AR('a',a)],vars:[['x',x]]});
   for(i=1;i<n;i++){
    var key=a[i];j=i-1;
    while(j>=0){sc++;if(a[j]>key){a[j+1]=a[j];j--;}else break;}
    a[j+1]=key;
    c.snap({ln:1,title:'Bước 1: chèn '+key,body:'Insertion Sort chèn '+key+' vào đúng chỗ trong phần đã sắp xếp (a[0..'+i+']).',arrs:[AR('a',a,[j+1],ALL(a).slice(0,i+1))],vars:[['đã so sánh',sc]]});
   }
   c.snap({ln:1,title:'Sắp xếp xong',body:'Mảng đã tăng dần sau '+sc+' lần so sánh. Giờ mới dùng được tìm nhị phân.',arrs:[AR('a',a,[],ALL(a))],vars:[['đã so sánh',sc]]});
   var lo=0,hi=n-1,bc=0,vt=-1;
   while(lo<=hi){
    var mid=Math.floor((lo+hi)/2);bc++;
    if(a[mid]===x){vt=mid;c.snap({ln:2,title:'Bước 2: ô giữa a['+mid+']',body:a[mid]+' == '+x+'. Tìm thấy ở vị trí '+mid+'.',arrs:[{name:'a',cells:a.map(function(v,k){return {v:v,hi:k===mid,done:k===mid,dim:k<lo||k>hi};})}],vars:[['lo',lo],['hi',hi],['mid',mid],['so sánh',bc]]});break;}
    var lt=a[mid]<x;
    c.snap({ln:2,title:'Bước 2: ô giữa a['+mid+']',body:a[mid]+(lt?' < ':' > ')+x+(lt?', bỏ nửa trái.':', bỏ nửa phải.'),arrs:[{name:'a',cells:a.map(function(v,k){return {v:v,hi:k===mid,done:false,dim:k<lo||k>hi};})}],vars:[['lo',lo],['hi',hi],['mid',mid],['so sánh',bc]]});
    if(lt)lo=mid+1;else hi=mid-1;
   }
   c.out(String(vt));
   var oi=A0.indexOf(x),lc=oi>=0?oi+1:n;
   c.snap({ln:3,title:'Xong',body:vt>=0?'x = '+x+' nằm ở vị trí '+vt+' của mảng đã sắp xếp.':'Không có '+x+' trong danh sách, kết quả −1.',note:'Sắp xếp tốn '+sc+' lần so sánh, một lần duy nhất. Mỗi lần tìm nhị phân sau đó chỉ tốn khoảng '+bc+' lần (tối đa 4). Tìm tuần tự trên mảng gốc cần '+lc+' lần cho mỗi x. Tìm ít thì tìm tuần tự rẻ hơn; tìm nhiều lần thì sắp xếp trước có lợi.',arrs:[AR('a',a,vt>=0?[vt]:[])],vars:[['vt',vt]]});
  }};
}

function UG(a,b){var d;while(b!==0){d=a%b;a=b;b=d;}return a;}
function UGX(a,b){var d;while(b>1){d=a%b;a=b;b=d;}return a;}
function KTH(kind){
 var cfg={
  dung:{unit:true,f:UG,intro:'Kiểm thử đơn vị: chạy hàm UCLN với nhiều bộ dữ liệu và so kết quả với đáp án mong đợi. Bấm "Bước tiếp".',name:'UCLN',tests:[[12,18,6],[7,13,1],[5,0,5],[8,1,1]],note:'Cả 4 test đều đạt: hàm đúng với các trường hợp đã thử.'},
  loi:{unit:true,f:UGX,bug:true,intro:'Cùng bộ test, nhưng hàm UCLN bị viết sai điều kiện vòng lặp (b > 1 thay vì b != 0). Bấm "Bước tiếp".',name:'UCLN',tests:[[12,18,6],[7,13,1],[5,0,5],[8,1,1]],note:'Test thất bại chỉ ra đúng đầu vào gây lỗi: các trường hợp để b đi tới 1 thì vòng lặp dừng quá sớm.'},
  tichhop:{unit:false,f:UG,intro:'Kiểm thử tích hợp: BCNN gọi UCLN. Test chạy cả hai hàm làm việc cùng nhau. Bấm "Bước tiếp".',name:'BCNN',tests:[[4,6,12],[3,5,15],[7,7,7],[12,18,36]],note:'Cả hai hàm cùng đúng nên mọi test tích hợp đều đạt.'},
  tichhoploi:{unit:false,f:UGX,bug:true,intro:'BCNN vẫn đúng công thức nhưng UCLN mà nó gọi có lỗi. Test tích hợp sẽ bắt được. Bấm "Bước tiếp".',name:'BCNN',tests:[[4,6,12],[3,5,15],[7,7,7],[12,18,36]],note:'Lỗi nằm ở UCLN nhưng làm BCNN sai theo. Kiểm thử đơn vị cho từng hàm giúp xác định nhanh hàm nào gây lỗi.'}
 }[kind];
 var ugl=function(bug){return ['int UCLN(int a, int b)','{','    while ('+(bug?'b > 1':'b != 0')+')','    {','        int du = a % b;','        a = b; b = du;','    }','    return a;','}'];};
 var lines=cfg.unit?ugl(cfg.bug).concat(cfg.tests.map(function(t){return 'Assert.AreEqual('+t[2]+', UCLN('+t[0]+', '+t[1]+'));';})):ugl(cfg.bug).concat(['int BCNN(int a, int b)','{','    return a / UCLN(a, b) * b;','}']).concat(cfg.tests.map(function(t){return 'Assert.AreEqual('+t[2]+', BCNN('+t[0]+', '+t[1]+'));';}));
 var base=cfg.unit?9:13;
 return {inputs:[],chips:[],intro:cfg.intro,lines:function(){return lines;},
  run:function(c){
   var res=[],pass=0,i;

   c.snap({ln:cfg.unit?0:9,title:'Chuẩn bị',body:(cfg.unit?'Hàm cần kiểm thử: UCLN.':'Hàm cần kiểm thử: BCNN (gọi UCLN bên trong).')+' Có '+cfg.tests.length+' test, mỗi test gồm đầu vào và đáp án mong đợi.',arrs:mk(-1),vars:[['đạt',0],['tổng',cfg.tests.length]]});

   });

    });
    var T = total(), fin = step >= T, nt = fin ? (ex.cols[1].lines.join('').indexOf('a[i] =') >= 0 ? '' : '') : '';

    if (fin && snapsC[1].length && snapsC[1][snapsC[1].length-1].note) $('status').innerHTML += '<span class="note">' + esc(snapsC[1][snapsC[1].length-1].note) + '</span>';
    var running = timer !== null;
    $('next').disabled = step >= T || running; $('all').disabled = running; $('reset').disabled = running;
  }
  function stop(){ if (timer) { clearInterval(timer); timer = null; } }
  function reset(){ stop(); step = 0; build(); render(); }
  function loadExample(k){

  }
  $('next').addEventListener('click', function(){ if (step < total()) { step++; render(); } });
  $('reset').addEventListener('click', reset);
  $('all').addEventListener('click', function(){

    render();
