<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="620">
<title>Bảng tuổi nợ tại 31/10/2026</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc; --cur:#fff1b8; --cur-bar:#e0a800;
    --b0:#9fc3a8; --b1:#f3d27a; --b2:#eda15b; --b3:#d9653b; --b4:#a3302a;
    --warn:#9a3412; --warn-soft:#fdeee3;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44; --cur:#3d3412; --cur-bar:#e0b400;
      --b0:#4f7d5b; --b1:#b5952f; --b2:#c0743a; --b3:#c4552f; --b4:#e0675f;
      --warn:#fdba74; --warn-soft:#3a2614;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:10px 12px 12px}
  .lead{color:var(--muted);margin:0 0 8px;font-size:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
  .legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--muted);margin-bottom:8px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
  .rows{display:flex;flex-direction:column;gap:4px}
  .row{display:grid;grid-template-columns:96px 1fr;gap:8px;align-items:center;border:1px solid transparent;border-radius:8px;padding:3px 4px;cursor:pointer;background:none;font:inherit;color:inherit;text-align:left;min-height:40px;width:100%}
  .row:hover{background:var(--accent-soft)}
  .row.on{border-color:var(--accent);background:var(--accent-soft)}
  .name{font-size:14.5px;font-weight:600;line-height:1.25}
  .name small{display:block;font-weight:500;color:var(--warn);font-size:12px}
  .track{position:relative;height:24px;border-radius:5px;background:repeating-linear-gradient(90deg,transparent 0,transparent calc(25% - 1px),var(--line) calc(25% - 1px),var(--line) 25%)}
  .bar{display:flex;height:100%;border-radius:5px;overflow:hidden}
  .seg{height:100%;transition:opacity .2s}
  .seg.hl{outline:3px solid var(--text);outline-offset:-3px}
  .axis{display:grid;grid-template-columns:96px 1fr;gap:8px;padding:0 4px;font-size:12.5px;color:var(--muted)}
  .axis .ticks{position:relative;height:18px}
  .axis .ticks span{position:absolute;transform:translateX(-50%)}
  .axis .ticks span:first-child{transform:none}
  .axis .ticks span:last-child{transform:translateX(-100%)}
  .main{display:grid;grid-template-columns:1.15fr 1fr;gap:10px;align-items:start}
  .main>*{min-width:0}
  @media (max-width:640px){.main{grid-template-columns:1fr}}
  .detail{min-height:200px}
  .detail h3{margin:0 0 6px;font-size:16px}
  .chips{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
  .chip{display:flex;justify-content:space-between;gap:8px;border:1px solid var(--line);border-radius:7px;padding:2px 8px;font-size:13.5px;font-variant-numeric:tabular-nums}
  .chip span{display:flex;align-items:center}
  .chip i{display:inline-block;flex:none;width:10px;height:10px;border-radius:2px;margin-right:6px}
  .chip.zero{opacity:.5}
  .chip.hl{border-color:var(--text);border-width:2px}
  .tag{display:inline-block;font-size:12.5px;font-weight:600;padding:1px 8px;border-radius:6px;background:var(--warn-soft);color:var(--warn);margin-right:6px}
  .notebox{border-left:4px solid var(--cur-bar);background:var(--cur);border-radius:8px;padding:7px 12px;font-size:14.5px}
  .ask{margin-top:6px;font-size:14px;color:var(--muted)}
  .empty{color:var(--muted);font-size:14.5px}
  .foot{font-size:12.5px;color:var(--muted);margin-top:6px}

</style>
</head>
<body>
<div class="wrap">
  <p class="lead">Chạm vào tên một khách để xem số dư theo nhóm tuổi nợ và ghi chú kèm theo. Dữ liệu giả lập tại 31/10/2026.</p>
  <div class="main">
  <div class="card">
    <div class="legend" id="legend"></div>
    <div class="rows" id="rows"></div>
    <div class="axis"><span>triệu đồng</span><div class="ticks" id="ticks"></div></div>
  </div>
  <div class="card detail" id="detail" aria-live="polite"></div>
  </div>
  <p class="foot">Trang không cộng hộ bạn. Tổng và tỉ lệ quá hạn bạn tự tính ở mục <b>Tự tính trước</b>.</p>
</div>
<script>
const B = ["Chưa đến hạn","Quá hạn 1-30 ngày","Quá hạn 31-60 ngày","Quá hạn 61-90 ngày","Quá hạn trên 90 ngày"];
const C = [
  {s:"Tân Việt", full:"CP Nội thất Tân Việt", v:[52800000,64900000,0,0,0]},
  {s:"Phú Gia", full:"TNHH Xây dựng Phú Gia", v:[0,57200000,0,0,0]},
  {s:"Minh Khang", full:"CP Đầu tư Minh Khang", v:[74500000,0,96800000,0,0], tag:"Đang khiếu nại", seg:2,
   note:"Ngày 25/09/2026, khách gửi văn bản khiếu nại lô ghế xoay thuộc hoá đơn HD0441 (hạn 18/09/2026), báo 12 chiếc hỏng cơ cấu nâng hạ. Phòng Kinh doanh đang xử lý, chưa có kết luận. Khách đề nghị tạm chưa thanh toán HD0441 đến khi xử lý xong.",
   ask:"Báo cáo chỉ nêu điều có trong ghi chú: khiếu nại đang xử lý, chưa có kết luận."},
  {s:"Ánh Dương", full:"TNHH Giáo dục Ánh Dương", v:[38500000,41250000,63800000,0,0], tag:"Có tiền về 03/11", seg:2,
   note:"Ngày 03/11/2026, ngân hàng báo có 63.800.000 đồng từ khách, nội dung “thanh toan HD0419” (hạn 24/09/2026).",
   ask:"Tự hỏi: bảng lập tại 31/10, tiền về ngày 03/11. Khoản này nên nằm ở đâu trong báo cáo?"},
  {s:"An Bình", full:"CP Dược phẩm An Bình", v:[163900000,22000000,0,0,0]},
  {s:"Sơn Hà", full:"TNHH Kiến trúc Sơn Hà", v:[0,0,0,31900000,18700000], tag:"Chờ đối chiếu", seg:4,
   note:"Khoản 18.700.000 đồng thuộc hoá đơn HD0356 (hạn 10/07/2026). Sổ của khách thấp hơn sổ Hoà Lâm đúng khoản này; khách cho rằng đã trả lại một phần hàng trong tháng 7. Kế toán đang tìm chứng từ hàng trả lại và chờ biên bản đối chiếu công nợ có xác nhận của hai bên.",
   ask:"Ghi chú chưa kết luận khoản này đúng hay sai. Báo cáo không nên tự kết luận thay."}
];
const MAX = 200000000; // trục 0-200 triệu
const fmt = n => n.toLocaleString("de-DE");
const col = i => "var(--b"+i+")";
const $ = id => document.getElementById(id);
$("legend").innerHTML = B.map((b,i)=>'<span><i style="background:'+col(i)+'"></i>'+b+'</span>').join("");
$("ticks").innerHTML = [0,50,100,150,200].map(t=>'<span style="left:'+(t/2)+'%">'+t+'</span>').join("");
let sel = -1;
function render(){
  $("rows").innerHTML = C.map((c,k)=>{
    const segs = c.v.map((v,i)=> v ? '<span class="seg'+(k===sel && c.seg===i?' hl':'')+'" style="width:'+(v/MAX*100)+'%;background:'+col(i)+'" title="'+B[i]+': '+fmt(v)+' đồng"></span>' : '').join("");
    return '<button class="row'+(k===sel?' on':'')+'" data-k="'+k+'" aria-pressed="'+(k===sel)+'"><span class="name">'+c.s+(c.tag?'<small>• có ghi chú</small>':'')+'</span><span class="track"><span class="bar">'+segs+'</span></span></button>';
  }).join("");
  document.querySelectorAll(".row").forEach(r=>r.onclick=()=>{ sel = +r.dataset.k; render(); });
  const d = $("detail");
  if(sel<0){ d.innerHTML = '<p class="empty">Chưa chọn khách nào. Ba khách có ghi chú: Minh Khang, Ánh Dương, Sơn Hà.</p>'; return; }
  const c = C[sel];
  let h = '<h3>'+c.full+(c.tag?' <span class="tag">'+c.tag+'</span>':'')+'</h3>';
  h += '<div class="chips">'+c.v.map((v,i)=>'<span class="chip'+(v?'':' zero')+(c.seg===i?' hl':'')+'"><span><i style="background:'+col(i)+'"></i>'+B[i]+'</span><b>'+fmt(v)+'</b></span>').join("")+'</div>';
  if(c.note){
    h += '<div class="notebox"><b>Ghi chú (cập nhật 04/11/2026):</b> '+c.note+'</div>';
    h += '<p class="ask">Ô viền đậm: nhóm chứa khoản trong ghi chú. '+c.ask+'</p>';
  } else {
    h += '<p class="empty">Không có ghi chú cho khách này.</p>';
  }
  d.innerHTML = h;
}
const q = new URLSearchParams(location.search);
if(q.has("khach")) sel = Math.max(-1, Math.min(C.length-1, parseInt(q.get("khach"),10)||0));
render();
</script>
</body>
</html>
