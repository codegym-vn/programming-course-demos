<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="630">
<title>Deadlock và thứ tự giành khoá</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
    --warn:#b45309; --warn-soft:#fdf0d9;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c; --cmt:#6b7280;
    --node:#ffffff; --node-line:#c9ced8;
    --run:#e3f4e8; --run-bar:#15803d;
    --t1:#2563eb; --t1-soft:#e0eafd; --t2:#c2410c; --t2-soft:#fbe7dc; --t3:#7c3aed; --t3-soft:#efe7fd;
    --t4:#0f766e; --t4-soft:#dcf3f0; --t5:#be185d; --t5-soft:#fbe3ee; --t6:#4d7c0f; --t6-soft:#e9f5d8;
    --c1:#93c5fd; --c2:#fdba74; --c3:#c4b5fd; --c4:#5eead4; --c5:#f9a8d4; --c6:#bef264;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --warn:#fbbf24; --warn-soft:#3a2c0e;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74; --cmt:#8b93a1;
      --node:#1d222c; --node-line:#3a4250;
      --run:#13301f; --run-bar:#4ade80;
      --t1:#6ea0ff; --t1-soft:#1b2740; --t2:#fb923c; --t2-soft:#3a2312; --t3:#b794ff; --t3-soft:#2a2040;
      --t4:#2dd4bf; --t4-soft:#0f2e2a; --t5:#f472b6; --t5-soft:#3a1729; --t6:#a3e635; --t6-soft:#22300f;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:10px 12px 12px}
  .lead{color:var(--muted);margin:0 0 8px;font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:5px 10px;
    border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
  .tab.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .field{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px}
  .field label{font-weight:600}
  .field label.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .field input[type=text]{width:72px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .field input[type=range]{accent-color:var(--accent);width:130px}
  .field input.bad{border-color:var(--false);background:var(--false-soft)}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:6px 12px;border-radius:8px;
    cursor:pointer;font:inherit;font-weight:600;font-size:13.5px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .err{color:var(--false);font-size:12.5px}
  .err:empty{display:none}
  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
    padding:6px 12px;margin-bottom:8px;min-height:52px;font-size:13.5px}
  .status>b{display:block;font-size:12.5px;color:var(--accent)}
  .status code{font-size:12.5px}
  .status.bad{border-left-color:var(--false);background:var(--false-soft)}
  .status.bad>b{color:var(--false)}
  .status.good{border-left-color:var(--true);background:var(--true-soft)}
  .status.good>b{color:var(--true)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid>*{min-width:0}
  .col{display:flex;flex-direction:column;gap:8px;min-width:0}
  @media (max-width:600px){.grid{grid-template-columns:1fr !important}}
  .panel-title{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
  .code{background:var(--code-bg);border-radius:8px;padding:6px 0;overflow:auto;position:relative;
    font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 10px 0 0;border-left:3px solid transparent;transition:background .2s,opacity .2s}
  .ln .no{width:26px;flex:none;text-align:right;padding-right:9px;color:var(--muted);opacity:.6;user-select:none}
  .ln.run{background:var(--run);border-left-color:var(--run-bar)}
  .ln.skip{opacity:.35}
  .ln.cur{background:var(--cur);border-left-color:var(--cur-bar);opacity:1}
  .ln .marks{margin-left:8px;display:inline-flex;gap:3px;align-self:center}
  .mk{display:inline-block;padding:0 5px;border-radius:5px;font:700 10.5px/1.5 system-ui,sans-serif;color:#fff}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--cmt);font-style:italic}
  .tag{display:inline-block;padding:0 7px;border-radius:6px;font-weight:700;font-size:12px;font-family:ui-monospace,Menlo,Consolas,monospace}
  .tag.t{background:var(--true-soft);color:var(--true)}.tag.f{background:var(--false-soft);color:var(--false)}
  .tag.n{background:var(--code-bg);color:var(--muted);font-family:system-ui,sans-serif;font-weight:500}
  .var{background:var(--code-bg);border:2px solid transparent;border-radius:8px;padding:2px 10px;min-width:64px;text-align:center;transition:all .25s;display:inline-block}
  .var small{display:block;color:var(--muted);font:12px ui-monospace,Menlo,Consolas,monospace}
  .var strong{font:700 18px ui-monospace,Menlo,Consolas,monospace;display:block;min-height:26px}
  .var.chg{border-color:var(--cur-bar);background:var(--cur)}
  .var.bad{border-color:var(--false);background:var(--false-soft)}
  .var.good{border-color:var(--true);background:var(--true-soft)}
  .console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:6px 10px;min-height:44px;white-space:pre-wrap;word-break:break-word;overflow:auto;
    font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .console .ph{color:#7b8494;font-family:system-ui,sans-serif;font-size:12.5px}
  .console .new{background:rgba(250,204,21,.22);border-radius:3px}
  kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px}
  .note{color:var(--muted);font-size:12px;margin:6px 0 0}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.93em}

  /* Thẻ luồng */
  .threads{display:grid;gap:6px}
  .th{border:2px solid var(--node-line);border-radius:9px;background:var(--node);padding:4px 8px;transition:border-color .25s,box-shadow .25s,opacity .25s;min-width:0}
  .th .hd{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
  .th .nm{font:700 13px ui-monospace,Menlo,Consolas,monospace;display:flex;align-items:center;gap:5px}
  .th .dot{width:10px;height:10px;border-radius:50%;flex:none}
  .th .sub{font-size:12px;color:var(--muted);margin-top:2px;min-height:18px}
  .th .sub code{font-size:11.5px}
  .th.run{border-color:var(--true);box-shadow:0 0 0 3px var(--true-soft)}
  .th.wait{border-color:var(--warn);border-style:dashed}
  .th.block{border-color:var(--false);border-style:dashed}
  .th.done{opacity:.6}
  .st{display:inline-block;padding:0 7px;border-radius:999px;font:600 11.5px/1.6 system-ui,sans-serif;white-space:nowrap}
  .st.run{background:var(--true-soft);color:var(--true)}
  .st.ready{background:var(--accent-soft);color:var(--accent)}
  .st.wait{background:var(--warn-soft);color:var(--warn)}
  .st.block{background:var(--false-soft);color:var(--false)}
  .st.done,.st.new{background:var(--code-bg);color:var(--muted)}
  .cells{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
  .cell{background:var(--code-bg);border:2px solid transparent;border-radius:6px;padding:0 7px;font:12.5px ui-monospace,Menlo,Consolas,monospace;transition:all .25s}
  .cell b{font-weight:700}
  .cell.chg{border-color:var(--cur-bar);background:var(--cur)}
  .cell.blank b{color:var(--muted);font-weight:400}
  .lock{display:inline-flex;align-items:center;gap:6px;border:2px solid var(--node-line);border-radius:8px;padding:2px 9px;font-size:12.5px;background:var(--node)}
  .lock.held{border-color:var(--cur-bar);background:var(--cur)}
  .lock svg{width:15px;height:15px;flex:none}
  .q{display:flex;gap:4px;flex-wrap:wrap;align-items:center;min-height:26px;padding:3px 6px;border:2px dashed var(--line);border-radius:8px;font-size:12px;color:var(--muted)}
  .chipT{display:inline-block;padding:0 7px;border-radius:6px;font:700 12px/1.7 ui-monospace,Menlo,Consolas,monospace;color:#fff}
  .fresh{animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.8);opacity:0}to{transform:none;opacity:1}}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .lbl{font-size:12px;color:var(--muted)}


  .grid{grid-template-columns:1.12fr 1fr}
  .code{font-size:12px}
  @media (max-width:600px){.grid{grid-template-columns:1fr}}
  .threads{grid-template-columns:1fr 1fr}
  svg.g{width:100%;height:auto;display:block;max-height:150px}
  .g text{font:600 13px ui-monospace,Menlo,Consolas,monospace;fill:var(--text)}
  .g .lb{font:600 10.5px system-ui,sans-serif;fill:var(--muted)}
  .g .dl{font:800 15px system-ui,sans-serif;fill:var(--false)}
  #con{height:100px}

</style>
</head>
<body>
<div class="wrap">
<p class="lead">Chọn thứ tự khoá rồi bấm <b>Bước tiếp</b> (<kbd>→</kbd>). Mũi tên liền: luồng <b>giữ</b> khoá; mũi tên đứt: luồng <b>chờ</b> khoá.</p>
<div class="controls">
  <div class="tabs" id="mode"><button class="tab" data-v="rev">Ngược thứ tự (Luồng 2: b rồi a)</button><button class="tab" data-v="same">Cùng thứ tự (a rồi b)</button></div>
  <div class="btns">
    <button class="btn" id="next">Bước tiếp</button>
    <button class="btn ghost" id="prev">Lùi lại</button>
    <button class="btn ghost" id="all">Chạy hết</button>
    <button class="btn ghost" id="reset">Làm lại</button>
  </div>
</div>
<div class="status" id="status" aria-live="polite"></div>
<div class="grid">
  <div class="card"><p class="panel-title">Worker.run() (hai luồng chạy chung)</p><div class="code" id="code"></div></div>
  <div class="col">
    <div class="card"><p class="panel-title">Ai giữ, ai chờ khoá nào</p><div id="graph"></div></div>
    <div class="threads" id="threads"></div>
    <div class="card"><p class="panel-title">Output</p><div class="console" id="con"></div></div>
  </div>
</div>
</div>
<script>
(function(){
/* PRNG có hạt giống (mulberry32), dùng chung cho trình duyệt và node */
function makeRng(seed){
  var a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0; var t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function pick(rng, arr){ return arr[Math.floor(rng() * arr.length)]; }

/* Engine dùng chung cho các trang minh hoạ đa luồng (Module 5, khoá 112).
   Mô hình: mỗi trang sinh một dãy "ảnh chụp" (snapshot) trạng thái các luồng + tài nguyên dùng chung;
   Stepper hiển thị từng ảnh; trang tương tác có thể nối thêm ảnh (push/more). */
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function hl(src){
  var re = /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\/\/.*$)|(@\w+)|\b(import|public|private|protected|class|static|final|void|int|long|char|boolean|String|Integer|Object|if|else|return|for|while|new|true|false|null|try|catch|finally|throws|throw|synchronized|implements|extends|this)\b|(\b\d+(?:\.\d+)?\b)/g, out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="cm">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="kw">' + m[3] + '</span>';
    else if (m[4]) out += '<span class="kw">' + m[4] + '</span>';
    else out += '<span class="num">' + m[5] + '</span>';
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
/* lines: mảng chuỗi; o.cur: chỉ số | [từ, đến] | mảng chỉ số (o.curList); o.cls: {i: 'run'|'skip'};
   o.marks: {i: [[nhãn, màu CSS]]} – nhãn luồng đang đứng ở dòng i */
function codeHtml(lines, o){
  o = o || {}; var cls = o.cls || {}, marks = o.marks || {}, cur = o.cur, set = {};
  if (Array.isArray(o.curList)) o.curList.forEach(function(i){ set[i] = 1; });
  else if (Array.isArray(cur)) { for (var k = cur[0]; k <= cur[1]; k++) set[k] = 1; }
  else if (cur !== undefined && cur !== null) set[cur] = 1;
  return lines.map(function(l, i){
    var c = 'ln' + (cls[i] ? ' ' + cls[i] : '') + (set[i] ? ' cur' : '');
    var mk = marks[i] ? '<span class="marks">' + marks[i].map(function(m){ return '<span class="mk" style="background:' + m[1] + '">' + esc(m[0]) + '</span>'; }).join('') + '</span>' : '';
    return '<div class="' + c + '"><span class="no">' + (i + 1) + '</span><span>' + hl(l) + '</span>' + mk + '</div>';
  }).join('');
}
function scrollToCur(box){
  var el = box.querySelector('.ln.cur') || box.querySelector('.ln .marks');
  if (!el) return; if (!el.classList.contains('ln')) el = el.parentNode;
  if (box.scrollHeight <= box.clientHeight + 2) return;
  var top = el.offsetTop - box.clientHeight / 2 + el.offsetHeight / 2;
  box.scrollTop = Math.max(0, top);
}
function qs(name){ var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }
function parseIntIn(s, lo, hi){ s = String(s).trim(); if (!/^-?\d+$/.test(s)) return null; var v = parseInt(s, 10); return v < lo || v > hi ? null : v; }
function newSeed(){ return (Math.random() * 4294967296) >>> 0; }
/* Stepper: cfg = {build: () => snaps, render: (snap, i, n) => void,
   more?: (snaps) => snap | null (sinh thêm bước khi đang ở cuối), interval?: (n) => ms} */
function Stepper(cfg){
  var snaps = [], step = 0, timer = null, ended = false;
  function stop(){ if (timer) { clearInterval(timer); timer = null; } }
  function canNext(){
    if (step < snaps.length - 1) return true;
    if (!cfg.more || ended) return false;
    var s = cfg.more(snaps); if (s) { snaps.push(s); return true; }
    ended = true; return false;
  }
  function draw(){
    var sn = snaps[step];
    var st = $('status');
    st.className = 'status' + (sn.tone ? ' ' + sn.tone : '');
    st.innerHTML = '<b>Bước ' + (step + 1) + (cfg.more ? '' : '/' + snaps.length) + ' · ' + esc(sn.title) + '</b><span>' + sn.body + '</span>';
    cfg.render(sn, step, snaps.length);
    var run = timer !== null, hasNext = step < snaps.length - 1 || (cfg.more && !ended);
    $('next').disabled = !hasNext || run;
    $('prev').disabled = step <= 0 || run;
    $('all').disabled = run || !hasNext;
    if (cfg.after) cfg.after(run);
  }
  var jump = parseInt(qs('buoc'), 10);
  function reset(){
    stop(); snaps = cfg.build(); step = 0; ended = false;
    if (jump > 0) { while (step < jump - 1 && canNext()) step++; jump = 0; }
    draw();
  }
  function next(){ if (canNext()) { step++; draw(); } }
  function prev(){ if (step > 0) { step--; draw(); } }
  /* Nối một bước do người dùng chọn (bỏ các bước "tương lai" đã sinh trước đó) */
  function push(sn){ stop(); snaps.length = step + 1; snaps.push(sn); ended = false; step++; draw(); }
  $('next').addEventListener('click', next);
  $('prev').addEventListener('click', prev);
  $('reset').addEventListener('click', reset);
  $('all').addEventListener('click', function(){
    if (timer) return;
    var ms = cfg.interval ? cfg.interval(snaps.length) : 550;
    timer = setInterval(function(){ if (!canNext()) { stop(); draw(); return; } step++; draw(); }, ms);
    draw();
  });
  document.addEventListener('keydown', function(e){
    var t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' || timer) return;
    if (e.key === 'ArrowRight') { next(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { prev(); e.preventDefault(); }
  });
  return {reset: reset, push: push, cur: function(){ return snaps[step]; }, all: function(){ return snaps.slice(0, step + 1); }, running: function(){ return timer !== null; }, stop: function(){ stop(); draw(); }};
}
/* Tabs: nhóm nút .tab trong phần tử id; onChange(value) */
function Tabs(id, init, onChange){
  var box = $(id), btns = box.querySelectorAll('.tab');
  function set(v){ for (var i = 0; i < btns.length; i++) btns[i].setAttribute('aria-selected', btns[i].getAttribute('data-v') === String(v) ? 'true' : 'false'); }
  for (var i = 0; i < btns.length; i++) btns[i].addEventListener('click', function(){ var v = this.getAttribute('data-v'); set(v); onChange(v); });
  set(init);
  return {set: set};
}
var ST_TEXT = {run: 'đang chạy', ready: 'sẵn sàng', wait: 'đang chờ', block: 'chờ khoá', done: 'đã xong', 'new': 'chưa chạy'};
/* t = {name, color, state, stateText?, sub?, vars?: [[k, v]], chg?: [k]} */
function threadHtml(t){
  var cells = t.vars && t.vars.length ? '<div class="cells">' + t.vars.map(function(v){
    var blank = v[1] === null || v[1] === undefined;
    return '<span class="cell' + (blank ? ' blank' : '') + ((t.chg || []).indexOf(v[0]) >= 0 ? ' chg' : '') + '">' + esc(v[0]) + ' = <b>' + (blank ? '?' : esc(v[1])) + '</b></span>';
  }).join('') + '</div>' : '';
  return '<div class="th ' + t.state + '"><div class="hd"><span class="nm"><span class="dot" style="background:' + t.color + '"></span>' + esc(t.name) + '</span>' +
    '<span class="st ' + t.state + '">' + esc(t.stateText || ST_TEXT[t.state]) + '</span></div>' +
    (t.sub !== undefined ? '<div class="sub">' + t.sub + '</div>' : '') + cells + '</div>';
}
var LOCK_SVG = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="7" width="10" height="8" rx="1.5" fill="currentColor"/><path d="M5 7V5a3 3 0 0 1 6 0v2" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
function lockHtml(name, holder, holderColor){
  return '<span class="lock' + (holder ? ' held' : '') + '">' + LOCK_SVG + '<span>' + name + ': ' +
    (holder ? '<b style="color:' + (holderColor || 'inherit') + '">' + esc(holder) + '</b> giữ' : '<span class="lbl">đang rảnh</span>') + '</span></span>';
}
function chipT(label, color){ return '<span class="chipT" style="background:' + color + '">' + esc(label) + '</span>'; }
/* lines: mảng chuỗi; nNew: số dòng cuối mới thêm (tô nhẹ) */
function consoleHtml(lines, nNew, ph){
  if (!lines.length) return '<span class="ph">' + (ph || 'Chưa có output.') + '</span>';
  return lines.map(function(l, i){ return i >= lines.length - (nNew || 0) ? '<span class="new">' + esc(l) + '</span>' : esc(l); }).join('\n');
}
function scrollBottom(el){ el.scrollTop = el.scrollHeight; }

/* A13238: deadlock khi hai luồng khoá a, b theo thứ tự ngược nhau; tránh bằng cùng thứ tự */
var DL_LINES = [
  'public void run() {',
  '  synchronized (first) {',
  '    System.out.println(name',
  '        + " giu khoa thu nhat");',
  '    try {',
  '      Thread.sleep(100);',
  '    }',
  '    catch (InterruptedException ex) {',
  '    }',
  '    System.out.println(name',
  '        + " cho khoa thu hai...");',
  '    synchronized (second) {',
  '      System.out.println(name + " xong");',
  '    }',
  '  }',
  '}'

/* mode: 'rev' (Luong 2 nhận b, a) | 'same' (cả hai a, b) */
function dlBuild(mode){
  var T = [{name: 'Luong 1', first: 'a', second: 'b'}, {name: 'Luong 2', first: mode === 'rev' ? 'b' : 'a', second: mode === 'rev' ? 'a' : 'b'}];

    S.push({title: title, body: body, tone: o.tone, cur: o.cur === undefined ? null : o.cur, out: out.slice(), nNew: o.nNew || 0, dead: !!o.dead,
      owner: {a: owner.a, b: owner.b}, T: T.map(function(t){ return {st: t.st, ln: t.ln, holds: t.holds.slice(), wants: t.wants, first: t.first, second: t.second}; })});
  }
  var L = function(i){ return 'Luồng ' + (i + 1); };
  function grabFirst(i){ var t = T[i]; owner[t.first] = i; t.holds.push(t.first); t.wants = null; t.st = 'run'; t.ln = 2; out.push(t.name + ' giu khoa thu nhat'); }
  function sleep(i){ T[i].st = 'wait'; T[i].ln = 5; }
  function wake(i){ var t = T[i]; t.st = 'run'; t.ln = 9; out.push(t.name + ' cho khoa thu hai...'); }
  function tryFirst(i){ var t = T[i]; t.st = 'block'; t.wants = t.first; t.ln = 1; }
  function trySecond(i){ var t = T[i]; if (owner[t.second] === null) { owner[t.second] = i; t.holds.push(t.second); t.wants = null; t.st = 'run'; t.ln = 12; out.push(t.name + ' xong'); return true; } t.st = 'block'; t.wants = t.second; t.ln = 11; return false; }
  function finish(i){ var t = T[i]; t.holds.forEach(function(k){ owner[k] = null; }); t.holds = []; t.st = 'done'; t.ln = null; }
  snap('Hai luồng đã start()', 'Luồng 1 nhận <code>first = ' + T[0].first + ', second = ' + T[0].second + '</code>; Luồng 2 nhận <code>first = ' + T[1].first + ', second = ' + T[1].second + '</code>.' +
    (mode === 'rev' ? ' Hai luồng giành khoá theo thứ tự <b>ngược nhau</b>.' : ' Cả hai giành khoá theo <b>cùng thứ tự</b>: a rồi b.'));
  grabFirst(0); snap('Luồng 1 khoá ' + T[0].first, 'Khoá <code>' + T[0].first + '</code> đang rảnh, Luồng 1 giữ nó và in dòng đầu.', {cur: [1, 3], nNew: 1});
  sleep(0); snap('Luồng 1 ngủ 100 ms', 'Luồng 1 ngủ nhưng <b>vẫn giữ</b> khoá <code>' + T[0].first + '</code>. CPU chuyển sang Luồng 2.', {cur: 5});
  if (mode === 'rev') {
    grabFirst(1); snap('Luồng 2 khoá b', 'Khoá <code>b</code> đang rảnh, Luồng 2 giữ nó và in dòng đầu.', {cur: [1, 3], nNew: 1});
    sleep(1); snap('Luồng 2 ngủ 100 ms', 'Luồng 2 ngủ, vẫn giữ <code>b</code>. Lúc này mỗi luồng giữ một khoá.', {cur: 5});
    wake(0); snap('Luồng 1 thức dậy', 'Luồng 1 thức dậy, in "cho khoa thu hai...".', {cur: [9, 10], nNew: 1});
    trySecond(0); snap('Luồng 1 chờ b', 'Luồng 1 cần khoá <code>b</code> nhưng Luồng 2 đang giữ: Luồng 1 bị <b>chặn</b>, vẫn ôm khoá <code>a</code>.', {cur: 11});
    wake(1); snap('Luồng 2 thức dậy', 'Luồng 2 thức dậy, in "cho khoa thu hai...".', {cur: [9, 10], nNew: 1});
    trySecond(1); snap('DEADLOCK', 'Luồng 2 cần khoá <code>a</code> nhưng Luồng 1 đang giữ. Hai mũi tên "chờ" khép thành <b>vòng tròn</b>: Luồng 1 chờ Luồng 2, Luồng 2 chờ Luồng 1. Không ai nhả khoá, cả hai đứng im mãi.', {cur: 11, dead: true, tone: 'bad'});
    out.push('t1 con song: true', 't2 con song: true');
    snap('main hết kiên nhẫn', '<code>main</code> chờ mỗi luồng 1 giây bằng <code>join(1000)</code> rồi in <code>isAlive()</code>: cả hai vẫn còn sống vì đang kẹt. Không luồng nào in được "xong", và không có ngoại lệ nào.', {nNew: 2, dead: true, tone: 'bad'});
  } else {
    tryFirst(1); snap('Luồng 2 chờ a', 'Luồng 2 cũng phải khoá <code>a</code> trước, nhưng Luồng 1 đang giữ: Luồng 2 bị chặn ngay từ đầu, <b>không giữ khoá nào</b>.', {cur: 1});
    wake(0); snap('Luồng 1 thức dậy', 'Luồng 1 thức dậy, in "cho khoa thu hai...".', {cur: [9, 10], nNew: 1});
    trySecond(0); snap('Luồng 1 khoá b', 'Khoá <code>b</code> rảnh (Luồng 2 không thể giữ nó), Luồng 1 giữ nốt và in "xong".', {cur: 12, nNew: 1});
    finish(0); snap('Luồng 1 trả cả hai khoá', 'Luồng 1 ra khỏi hai khối <code>synchronized</code>, trả <code>b</code> rồi <code>a</code>, và kết thúc.', {cur: 14});
    grabFirst(1); snap('Luồng 2 khoá a', 'Khoá <code>a</code> đã rảnh. Luồng 2 giữ nó và in dòng đầu.', {cur: [1, 3], nNew: 1});
    sleep(1); snap('Luồng 2 ngủ 100 ms', 'Luồng 2 ngủ, vẫn giữ <code>a</code>.', {cur: 5});
    wake(1); snap('Luồng 2 thức dậy', 'Luồng 2 thức dậy, in "cho khoa thu hai...".', {cur: [9, 10], nNew: 1});
    trySecond(1); snap('Luồng 2 khoá b', 'Khoá <code>b</code> rảnh, Luồng 2 giữ nó và in "xong".', {cur: 12, nNew: 1});
    finish(1); out.push('t1 con song: false', 't2 con song: false');
    snap('Cả hai luồng xong', 'Luồng 2 trả khoá và kết thúc. <code>main</code> in <code>isAlive()</code>: cả hai đều đã xong. Cùng thứ tự khoá thì không thể có vòng chờ.', {nNew: 2, tone: 'good'});
  }
  return S;
}
if (typeof module !== 'undefined') module.exports = {dlBuild: dlBuild};


var TC = ['var(--t1)', 'var(--t2)'];
var mode = qs('vd') === 'same' ? 'same' : 'rev';
var P = {L0: [52, 85], L1: [268, 85], a: [160, 26], b: [160, 144]};
function edge(p, q, color, dashed, label, mk){
  var dx = q[0] - p[0], dy = q[1] - p[1], len = Math.sqrt(dx * dx + dy * dy), ux = dx / len, uy = dy / len;
  var r1 = 30, r2 = 32, x1 = p[0] + ux * r1, y1 = p[1] + uy * r1 * 0.8, x2 = q[0] - ux * r2, y2 = q[1] - uy * r2 * 0.8;
  var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  return '<line x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '" style="stroke:' + color + '" stroke-width="2.5"' + (dashed ? ' stroke-dasharray="6 4"' : '') + ' marker-end="url(#' + mk + ')"/>' +
    '<text class="lb" x="' + (mx + (uy > 0 ? 8 : -8) * (ux > 0 ? 1 : -1)) + '" y="' + (my + 4) + '" text-anchor="middle">' + label + '</text>';
}
function graph(sn){
  var dead = sn.dead, h = '<svg class="g" viewBox="0 0 320 170" role="img" aria-label="Đồ thị giữ và chờ khoá"><defs>' +
    ['t1', 't2', 'false'].map(function(c){ return '<marker id="m' + c + '" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0L10,5L0,10z" style="fill:var(--' + c + ')"/></marker>'; }).join('') + '</defs>';
  sn.T.forEach(function(t, i){
    var tp = P['L' + i];
    t.holds.forEach(function(k){ h += edge(P[k], tp, dead ? 'var(--false)' : TC[i], false, 'giữ', dead ? 'mfalse' : 'mt' + (i + 1)); });
    if (t.wants) h += edge(tp, P[t.wants], 'var(--false)', true, 'chờ', 'mfalse');
  });
  ['a', 'b'].forEach(function(k){
    var o = sn.owner[k], p = P[k];
    h += '<rect x="' + (p[0] - 26) + '" y="' + (p[1] - 16) + '" width="52" height="32" rx="8" style="fill:' + (o === null ? 'var(--node)' : 'var(--cur)') + ';stroke:' + (o === null ? 'var(--node-line)' : 'var(--cur-bar)') + '" stroke-width="2"/>' +
      '<text x="' + p[0] + '" y="' + (p[1] + 5) + '" text-anchor="middle">khoá ' + k + '</text>';
  });
  sn.T.forEach(function(t, i){
    var p = P['L' + i];
    h += '<rect x="' + (p[0] - 44) + '" y="' + (p[1] - 18) + '" width="88" height="36" rx="18" style="fill:var(--node);stroke:' + (t.st === 'block' ? 'var(--false)' : TC[i]) + '" stroke-width="2.5"' + (t.st === 'done' ? ' opacity=".5"' : '') + '/>' +
      '<text x="' + p[0] + '" y="' + (p[1] + 5) + '" text-anchor="middle">Luồng ' + (i + 1) + '</text>';
  });
  if (dead) h += '<text class="dl" x="160" y="90" text-anchor="middle">DEADLOCK</text>';
  return h + '</svg>';
}
function render(sn){
  var marks = {};
  sn.T.forEach(function(t, i){ if (t.ln !== null) (marks[t.ln] = marks[t.ln] || []).push(['L' + (i + 1), TC[i]]); });
  $('code').innerHTML = codeHtml(DL_LINES, {cur: sn.cur, marks: marks});
  $('graph').innerHTML = graph(sn);
  $('threads').innerHTML = sn.T.map(function(t, i){
    var txt = t.st === 'wait' ? 'đang ngủ' : t.st === 'block' ? 'chờ khoá ' + t.wants : undefined;
    return threadHtml({name: 'Luồng ' + (i + 1), color: TC[i], state: t.st, stateText: txt, sub: 'first = ' + t.first + ', second = ' + t.second});

}
