<style>

<body>

      <div class="key"><span class="k1">dữ liệu (nằm trong chuỗi '...')</span><span class="k2">dữ liệu đã thành mã SQL</span><span class="k3">bị biến thành chú thích</span></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  var JAVA_KW = 'import|public|private|class|static|void|int|double|char|boolean|String|if|else|return|for|while|new|true|false|try|catch|throws|throw|final|null|this';
  var SQL_KW = 'SELECT|FROM|WHERE|AND|OR|NOT|ORDER|BY|ASC|DESC|DISTINCT|GROUP|HAVING|COUNT|SUM|AVG|MIN|MAX|INSERT|INTO|VALUES|UPDATE|SET|DELETE|DROP|TABLE|CREATE|AS|LIKE|IS|NULL|true|false';
  function hlWith(src, kws){
    var re = new RegExp('("(?:[^"\\\\]|\\\\.)*"|\'(?:[^\'\\\\]|\\\\.)*\')|(//.*$|--.*$)|\\b(' + kws + ')\\b|(\\b\\d+(?:\\.\\d+)?\\b)', 'g'), out = '', last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
      else if (m[2]) out += '<span class="cm">' + esc(m[2]) + '</span>';
      else if (m[3]) out += '<span class="kw">' + m[3] + '</span>';
      else out += '<span class="num">' + m[4] + '</span>';
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }
  function hl(src){ return hlWith(src, JAVA_KW); }
  function hlSql(src){ return hlWith(src, SQL_KW); }
  function codeHtml(lines, o){
    o = o || {}; var cls = o.cls || {}, cur = o.cur, f = o.sql ? hlSql : hl;
    var a = cur === undefined || cur === null ? -1 : (Array.isArray(cur) ? cur[0] : cur);
    var b = cur === undefined || cur === null ? -1 : (Array.isArray(cur) ? cur[1] : cur);
    return lines.map(function(l, i){
      var c = 'ln' + (cls[i] ? ' ' + cls[i] : '') + (i >= a && i <= b ? ' cur' : '');
      return '<div class="' + c + '"><span class="no">' + (i + 1) + '</span><span>' + f(l) + '</span></div>';
    }).join('');
  }
  function scrollToCur(box){
    var el = box.querySelector('.ln.cur'); if (!el) return;
    if (box.scrollHeight <= box.clientHeight + 2) return;
    box.scrollTop = Math.max(0, el.offsetTop - box.clientHeight / 2 + el.offsetHeight / 2);
  }
  function qs(name){ var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }
  // Stepper: cfg = {build: () => snaps, render: (snap, i, n) => void}; snap.title, snap.body, snap.kind ('bad'|'ok')
  function Stepper(cfg){
    var snaps = [], step = 0, timer = null;
    function stop(){ if (timer) { clearInterval(timer); timer = null; } }
    function draw(){
      var sn = snaps[step];
      var s = $('status');
      s.className = 'status' + (sn.kind ? ' ' + sn.kind : '');
      s.innerHTML = '<b>Bước ' + (step + 1) + '/' + snaps.length + ' · ' + esc(sn.title) + '</b><span>' + sn.body + '</span>';
      cfg.render(sn, step, snaps.length);
      var run = timer !== null;
      $('next').disabled = step >= snaps.length - 1 || run;
      $('prev').disabled = step <= 0 || run;
      $('all').disabled = run || step >= snaps.length - 1;
    }
    var jump = parseInt(qs('buoc'), 10);
    function reset(){ stop(); snaps = cfg.build(); step = 0; if (jump > 0) { step = Math.min(jump - 1, snaps.length - 1); jump = 0; } draw(); }
    function next(){ if (step < snaps.length - 1) { step++; draw(); } }
    function prev(){ if (step > 0) { step--; draw(); } }
    $('next').addEventListener('click', next);
    $('prev').addEventListener('click', prev);
    $('reset').addEventListener('click', reset);
    $('all').addEventListener('click', function(){
      if (timer) return;
      timer = setInterval(function(){ if (step >= snaps.length - 1) { stop(); draw(); return; } step++; draw(); }, cfg.speed || 650);
      draw();
    });
    document.addEventListener('keydown', function(e){
      var t = e.target && e.target.tagName;
      if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' || timer) return;
      if (e.key === 'ArrowRight') { next(); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { prev(); e.preventDefault(); }
    });
    return {reset: reset, step: function(){ return step; }};
  }
  function tabs(box, items, cur, onPick){
    box.innerHTML = items.map(function(it){ return '<button class="tab" role="tab" data-k="' + it[0] + '" aria-selected="' + (it[0] === cur) + '">' + it[1] + '</button>'; }).join('');
    box.addEventListener('click', function(e){
      var b = e.target.closest('.tab'); if (!b) return;
      Array.prototype.forEach.call(box.children, function(x){ x.setAttribute('aria-selected', String(x === b)); });
      onPick(b.getAttribute('data-k'));
    });
  }
  // Double.toString của Java (JDK 19+): chữ số ngắn nhất như JS, khác ở dạng hiển thị
  function jd(x){
    if (x === 0) return 1 / x < 0 ? '-0.0' : '0.0';
    if (isNaN(x)) return 'NaN';
    if (!isFinite(x)) return x > 0 ? 'Infinity' : '-Infinity';
    var a = Math.abs(x), sg = x < 0 ? '-' : '';
    if (a === 5e-324) return sg + '4.9E-324';
    if (a >= 1e-3 && a < 1e7) { var s = String(x); return s.indexOf('.') < 0 ? s + '.0' : s; }
    var m = x.toExponential().split('e'), man = m[0];
    if (man.indexOf('.') < 0) man += '.0';
    return man + 'E' + (+m[1]);
  }
  // rows: [{label, bars: [{s, e, cls, text}]}]; T: độ dài trục; t: thời điểm hiện tại (cắt thanh tại t)
  function ganttHtml(rows, T, t){
    function pc(x){ return (x / T * 100) + '%'; }
    var h = rows.map(function(r){
      var bars = r.bars.filter(function(b){ return b.s < t || (b.s === b.e && b.s <= t); }).map(function(b){
        var e = Math.min(b.e, t), w = b.s === b.e ? 0.12 : e - b.s;
        return '<div class="bar ' + b.cls + '" style="left:' + pc(b.s) + ';width:' + pc(w) + '" title="' + esc(b.text || '') + '">' + (e - b.s >= 1 ? esc(b.text || '') : '') + '</div>';
      }).join('');
      return '<div class="gl" title="' + esc(r.label) + '">' + esc(r.label) + '</div><div class="track">' + bars + '<div class="now" style="left:calc(' + pc(t) + ' - 1px)"></div></div>';
    }).join('');
    var ax = '';
    for (var i = 0; i <= T; i++) ax += '<span style="left:' + pc(i) + '">' + i + (i === T ? 's' : '') + '</span>';
    return h + '<div></div><div class="axis">' + ax + '</div>';
  }

  // Dữ liệu mẫu của Module 7 (chép từ seed của các sql-playground trong bài đọc)
  var COURSE = [
    ['11111','CSCI',1301,'Lap trinh Java 1',4], ['11112','CSCI',1302,'Lap trinh Java 2',3],
    ['11113','CSCI',3720,'Co so du lieu',3], ['11114','CSCI',4750,'Phat trien ung dung Java',3],
    ['11115','MATH',2750,'Giai tich 1',5], ['11116','MATH',3750,'Giai tich 2',5],
    ['11117','EDUC',1111,'Ky nang doc',3], ['11118','ITEC',1344,'Quan tri co so du lieu',3]];
  var STUDENT = [
    ['SV001','An','Van','Nguyen','0912345671','2005-04-09','Ha Noi','BIOL'],
    ['SV002','Binh','Duc','Tran','0912345672',null,'Hai Phong','BIOL'],
    ['SV003','Cuong','Manh','Nguyen','0912345673','2004-10-10','Da Nang','CS'],
    ['SV004','Dung','Thi','Le','0912345674','2003-09-09','Hai Phong','BIOL'],
    ['SV005','Giang','Thu','Nguyen','0912345675','2003-02-09','Hai Phong','CHEM'],
    ['SV006','Hai','Quang','Vu','0987654321','2003-02-09','Hai Phong','CHEM'],
    ['SV007','Hoa','Thi','Nguyen','0912345677','2004-02-09','Hai Phong','BIOL'],
    ['SV008','Khanh','Minh','Pham','0912345678','2004-03-19','Hue','CS'],
    ['SV009','Lan','Ngoc','Hoang','0912345679','2002-04-29','Hue','MATH'],
    ['SV010','Minh','Duc','Dang','0912345680','2002-04-29','Ha Noi','MATH'],
    ['SV011','Nam','Hoang','Bui','0912345681','2006-04-09','Hai Phong','BIOL'],
    ['SV012','Phuong','Thanh','Tran','0912345682','2005-07-15','Ha Noi','CS']];
  var ENROLL = [
    ['SV001','11111','2025-09-05','A'], ['SV001','11112','2025-09-05','B'], ['SV001','11113','2025-09-05','C'],
    ['SV002','11111','2025-09-05','D'], ['SV002','11112','2025-09-05','F'], ['SV002','11113','2025-09-05','A'],
    ['SV003','11114','2025-09-05','B'], ['SV003','11115','2025-09-05','C'], ['SV003','11116','2025-09-05','D'],
    ['SV004','11111','2025-09-05','A'], ['SV004','11113','2025-09-05','A'], ['SV005','11115','2025-09-05','B'],
    ['SV006','11115','2025-09-05','F'], ['SV006','11116','2025-09-05','F'], ['SV007','11111','2025-09-05','D'],
    ['SV008','11111','2025-09-05','D'], ['SV009','11111','2025-09-05','A'], ['SV009','11112','2025-09-05','D'],

//SIM-START
// Ghép đúng như FindGrade: mỗi ký tự nhớ nguồn ('t' = mã chương trình, 'u' = người dùng nhập)
function compose(sid, cid){
  var parts = [['t', 'select firstName, mi, lastName, title, grade from Student, Enrollment, Course where Student.studentId = \''], ['u', sid],
    ['t', '\' and Enrollment.courseId = \''], ['u', cid], ['t', '\' and Enrollment.courseId = Course.courseId and Enrollment.studentId = Student.studentId']];
  var out = [];
  parts.forEach(function(p){ for (var i = 0; i < p[1].length; i++) out.push({c: p[1][i], src: p[0]}); });
  return out;
}
// Phân loại từng ký tự theo trạng thái của bộ đọc SQL: 'str' (trong chuỗi), 'cmt' (sau --), 'code'
function lex(chars){
  var st = 'code', open = false;
  for (var i = 0; i < chars.length; i++) {
    var ch = chars[i].c;
    if (st === 'cmt') { chars[i].role = 'cmt'; continue; }
    if (st === 'str') {
      if (ch === "'" && chars[i + 1] && chars[i + 1].c === "'") { chars[i].role = chars[i + 1].role = 'str'; i++; continue; }
      if (ch === "'") { chars[i].role = 'quote'; st = 'code'; open = false; continue; }
      chars[i].role = 'str'; continue;
    }
    if (ch === "'") { chars[i].role = 'quote'; st = 'str'; open = true; continue; }
    if (ch === '-' && chars[i + 1] && chars[i + 1].c === '-') { chars[i].role = chars[i + 1].role = 'cmt'; st = 'cmt'; i++; continue; }
    chars[i].role = 'code';
  }
  return {chars: chars, unterminated: open};
}
// Kết quả đã chạy thật bằng sqlite3 trên CSDL mẫu của module
var PRESETS = [

  {k: 'drop', label: "x'; DROP TABLE Enrollment; --", sid: "x'; DROP TABLE Enrollment; --", cid: '', drop: true}
];
// Khi dữ liệu nhập chỉ là dữ liệu: tra như câu SQL gốc (so sánh chuỗi phân biệt hoa thường)
function findGrade(sid, cid){
  var rows = [];
  STUDENT.forEach(function(st){ if (st[0] !== sid) return;
    ENROLL.forEach(function(e){ if (e[1] !== cid || e[0] !== st[0]) return;
      COURSE.forEach(function(c){ if (c[0] === e[1]) rows.push(st[1] + ' ' + st[2] + ' ' + st[3] + ': mon ' + c[3] + ', diem ' + e[3]); }); }); });
  return rows;
}

PRESETS.forEach(function(p, i){ var b = document.createElement('button'); b.className = 'chip'; b.textContent = p.label; b.addEventListener('click', function(){ $('sid').value = p.sid; $('cid').value = p.cid; update(); }); $('chips').appendChild(b); });
function update(){
  var sid = $('sid').value, cid = $('cid').value;
  var L = lex(compose(sid, cid)), h = '', prev = null, buf = '';
  function cls(x){ if (x.role === 'cmt') return 'cmt'; if (x.src !== 'u') return ''; return x.role === 'str' ? 'data' : 'code2'; }
  function flush(){ if (buf) h += prev ? '<span class="' + prev + '">' + esc(buf) + '</span>' : esc(buf); buf = ''; }
  L.chars.forEach(function(x){ var c = cls(x); if (c !== prev) { flush(); prev = c; } buf += x.c; }); flush();
  $('q').innerHTML = h;
  var injected = L.chars.some(function(x){ return x.src === 'u' && x.role !== 'str'; });
  var preset = PRESETS.filter(function(p){ return p.sid === sid && p.cid === cid; })[0];
  var s = $('status'), con = $('con');
  if (L.unterminated) {
    s.className = 'status bad'; s.innerHTML = '<b>Câu SQL hỏng</b><span>Dấu nháy đơn trong dữ liệu nhập làm số dấu nháy bị lệch: chuỗi cuối cùng không được đóng. DBMS báo lỗi cú pháp, nhưng điều đó cho kẻ tấn công biết dữ liệu nhập đang được ghép thẳng vào câu SQL.</span>';
    con.innerHTML = '<span class="er">SQLException: lỗi cú pháp (chuỗi chưa được đóng)</span>'; return;
  }
  if (!injected) {
    var r = findGrade(sid, cid);
    s.className = 'status ok'; s.innerHTML = '<b>Dữ liệu vẫn chỉ là dữ liệu</b><span>Toàn bộ chữ người dùng nhập nằm gọn trong cặp dấu nháy đơn, nên câu SQL vẫn đúng như người viết chương trình dự định.</span>';
    con.innerHTML = r.length ? '<span class="ok">' + r.length + ' hàng · chương trình in: ' + esc(r[0]) + '</span>' : '<span class="ok">0 hàng · chương trình in: Not found</span>';
    return;
  }
  s.className = 'status bad';
  if (preset && preset.drop) {
    s.innerHTML = '<b>Chèn thêm một câu lệnh</b><span>Dấu nháy đóng chuỗi sớm, dấu <code>;</code> kết thúc câu <code>SELECT</code> (không tìm thấy ai có mã <code>x</code>), rồi <code>DROP TABLE Enrollment</code> là một câu lệnh thứ hai. <code>--</code> biến phần còn lại thành chú thích nên câu không bị lỗi cú pháp.</span>';
    con.innerHTML = '<span class="er">Nếu driver/DBMS cho phép chạy nhiều câu lệnh trong một lần gọi, bảng Enrollment bị xoá sạch.</span>'; return;
  }
  if (preset) {
    s.innerHTML = '<b>Dữ liệu đã thành mã SQL</b><span>Phần tô đỏ không còn là giá trị để so sánh mà là toán tử SQL. ' + (preset.k === 'or' ? 'Có <code>or true</code>, điều kiện <code>WHERE</code> luôn đúng với mọi tổ hợp hàng của ba bảng.' : 'Vì <code>and</code> được tính trước <code>or</code>, điều kiện thành "(mã SV004 và môn x) <b>hoặc</b> (các điều kiện ghép)": mọi lượt đăng ký đều thoả.') + '</span>';
    con.innerHTML = '<span class="er">' + preset.rows + ' hàng · chương trình in hàng đầu tiên: ' + esc(preset.print) + '</span>'; return;
  }
  s.innerHTML = '<b>Dữ liệu đã thành mã SQL</b><span>Phần tô đỏ đã thoát khỏi dấu nháy và trở thành một phần của câu lệnh. Kết quả phụ thuộc vào đoạn SQL được chèn; khung này chỉ chạy thử các mẫu có sẵn.</span>';
  con.innerHTML = '<span class="ph">(không chạy thử đầu vào tự do có dấu nháy)</span>';
}
$('sid').addEventListener('input', update); $('cid').addEventListener('input', update);
var pv = PRESETS.filter(function(p){ return p.k === qs('vd'); })[0]; if (pv) { $('sid').value = pv.sid; $('cid').value = pv.cid; }
update();
