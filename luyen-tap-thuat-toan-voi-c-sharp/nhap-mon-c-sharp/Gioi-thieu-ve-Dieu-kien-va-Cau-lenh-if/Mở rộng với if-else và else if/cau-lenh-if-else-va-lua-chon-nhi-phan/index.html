<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mô phỏng if-else</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c;
    --node:#ffffff; --node-line:#c9ced8; --node-text:#3b4352;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74;
      --node:#1d222c; --node-line:#3a4250; --node-text:#c8cfdb;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:20px 16px 32px}
  h1{font-size:22px;margin:0 0 4px}
  .lead{color:var(--muted);margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .controls{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;margin-bottom:12px}
  .tabs{display:flex;gap:6px}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:7px 12px;
    border-radius:8px;cursor:pointer;font:inherit}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .field{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .field label{font-weight:600}
  .field input{width:110px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--text);font:15px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .field input.bad{border-color:var(--false)}
  .chip{border:1px dashed var(--node-line);background:transparent;color:var(--text);padding:4px 10px;
    border-radius:999px;cursor:pointer;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .btns{display:flex;gap:8px;margin-left:auto}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:8px 14px;border-radius:8px;
    cursor:pointer;font:inherit;font-weight:600}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .err{color:var(--false);font-size:13px;min-height:18px;margin:-4px 0 8px}
  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
    padding:10px 14px;margin-bottom:14px;min-height:48px}
  .status b{display:block;font-size:13px;color:var(--accent);margin-bottom:2px}
  .status .note{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
  .grid{display:grid;grid-template-columns:1.15fr 1fr;gap:14px}
  @media (max-width:820px){.grid{grid-template-columns:1fr}.btns{margin-left:0}}
  .panel-title{font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;
    letter-spacing:.04em;margin:0 0 8px}
  .code{background:var(--code-bg);border-radius:8px;padding:8px 0;overflow-x:auto;
    font:14px/1.7 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 12px 0 0;border-left:3px solid transparent;transition:opacity .25s,background .25s}
  .ln .no{width:34px;flex:none;text-align:right;padding-right:12px;color:var(--muted);opacity:.7;user-select:none}
  .ln .mark{width:16px;flex:none;color:var(--true);font-size:12px}
  .ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
  .ln.skip{opacity:.3}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}
  .side{display:flex;flex-direction:column;gap:14px}
  svg{width:100%;height:auto;display:block;max-width:380px;margin:0 auto}
  .nd rect,.nd polygon{fill:var(--node);stroke:var(--node-line);stroke-width:1.5;transition:all .25s}
  .nd text{fill:var(--node-text);font:12px system-ui,sans-serif;transition:fill .25s}
  .nd text.mono{font:11.5px ui-monospace,Menlo,Consolas,monospace}
  .nd.on rect,.nd.on polygon{fill:var(--cur);stroke:var(--cur-bar);stroke-width:2.5}
  .nd.done rect,.nd.done polygon{stroke:var(--accent);stroke-width:2}
  .nd.skip{opacity:.3}
  .ed{fill:none;stroke:var(--node-line);stroke-width:1.8;transition:all .25s}
  .ed.done{stroke:var(--accent);stroke-width:2.6}
  .ed.skip{opacity:.3;stroke-dasharray:4 4}
  .elabel{font:600 11px system-ui,sans-serif}
  .elabel.t{fill:var(--true)}.elabel.f{fill:var(--false)}
  .eval{font:14px/1.8 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:var(--code-bg);
    border-radius:8px;padding:8px 12px;min-height:60px}
  .eval .ph{font-family:system-ui,sans-serif;color:var(--muted);font-size:13px}
  .res{display:inline-block;padding:0 8px;border-radius:6px;font-weight:700}
  .res.t{background:var(--true-soft);color:var(--true)}.res.f{background:var(--false-soft);color:var(--false)}
  .console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:10px 12px;min-height:72px;
    font:14px/1.6 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .console .ph{color:#7b8494;font-family:system-ui,sans-serif;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Câu lệnh if-else chạy như thế nào?</h1>
  <p class="lead">Nhập một giá trị rồi bấm <b>Bước tiếp</b> để xem chương trình chạy từng dòng. Đổi giá trị để xem nhánh còn lại.</p>

  <div class="controls">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-ex="chanle" aria-selected="true">Số chẵn / lẻ</button>
      <button class="tab" role="tab" data-ex="tuoi" aria-selected="false">Kiểm tra tuổi</button>
    </div>
    <div class="field">
      <label for="val" id="valLabel">soNguyen =</label>
      <input id="val" type="text" inputmode="numeric" autocomplete="off" value="7">
      <span id="chips"></span>
    </div>
    <div class="btns">
      <button class="btn" id="next">Bước tiếp</button>
      <button class="btn ghost" id="all">Chạy hết</button>
      <button class="btn ghost" id="reset">Làm lại</button>
    </div>
  </div>
  <div class="err" id="err"></div>

  <div class="status" id="status" aria-live="polite"></div>

  <div class="grid">
    <div class="card">
      <p class="panel-title">Mã nguồn C#</p>
      <div class="code" id="code"></div>
    </div>
    <div class="side">
      <div class="card">
        <p class="panel-title">Sơ đồ luồng</p>
        <svg viewBox="0 0 320 292" aria-label="Sơ đồ luồng if-else">
          <defs>
            <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="var(--node-line)"/>
            </marker>
            <marker id="arOn" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
              <path d="M0,0 L10,5 L0,10 z" fill="var(--accent)"/>
            </marker>
          </defs>
          <path class="ed" id="e1" d="M160 44 V61"/>
          <path class="ed" id="eT" d="M72 96 H60 V163"/>
          <path class="ed" id="eF" d="M248 96 H260 V163"/>
          <path class="ed" id="mT" d="M60 205 V228 H160"/>
          <path class="ed" id="mF" d="M260 205 V228 H160"/>
          <path class="ed" id="mE" d="M160 228 V244"/>
          <text class="elabel t" x="40" y="89">true</text>
          <text class="elabel f" x="252" y="89">false</text>

          <g class="nd" id="nStart">
            <rect x="85" y="10" width="150" height="34" rx="8"/>
            <text class="mono" id="tStart" x="160" y="31" text-anchor="middle">soNguyen = 7</text>
          </g>
          <g class="nd" id="nCond">
            <polygon points="160,63 248,96 160,129 72,96"/>
            <text class="mono" id="tCond" x="160" y="100" text-anchor="middle">soNguyen % 2 == 0</text>
          </g>
          <g class="nd" id="nIf">
            <rect x="5" y="165" width="110" height="40" rx="8"/>
            <text x="60" y="181" text-anchor="middle" font-weight="700">Khối if</text>
            <text id="tIf" x="60" y="197" text-anchor="middle">In: số chẵn</text>
          </g>
          <g class="nd" id="nElse">
            <rect x="205" y="165" width="110" height="40" rx="8"/>
            <text x="260" y="181" text-anchor="middle" font-weight="700">Khối else</text>
            <text id="tElse" x="260" y="197" text-anchor="middle">In: số lẻ</text>
          </g>
          <g class="nd" id="nEnd">
            <rect x="62" y="246" width="196" height="36" rx="8"/>
            <text x="160" y="268" text-anchor="middle">Chạy tiếp: in "Chương trình kết thúc."</text>
          </g>
        </svg>
      </div>
      <div class="card">
        <p class="panel-title">Kiểm tra điều kiện</p>
        <div class="eval" id="eval"></div>
      </div>
      <div class="card">
        <p class="panel-title">Console</p>
        <div class="console" id="console"></div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  var END_LINE = 'Console.WriteLine("Chương trình kết thúc.");';
  var EX = {
    chanle: {
      varName: 'soNguyen', def: 7, chips: [4, 7, 0, -3],
      lines: [
        'int soNguyen = @V;',
        'if (soNguyen % 2 == 0)',
        '{',
        '    Console.WriteLine($"Số {soNguyen} là số chẵn.");',
        '}',
        'else',
        '{',
        '    Console.WriteLine($"Số {soNguyen} là số lẻ.");',
        '}',
        END_LINE
      ],
      cond: 'soNguyen % 2 == 0',
      test: function(n){ return n % 2 === 0; },
      evalLines: function(n){
        var r = n % 2;
        return [n + ' % 2 == 0', fmt(r) + ' == 0'];
      },
      condExplain: function(n){
        return 'Lấy ' + n + ' chia 2 được số dư ' + fmt(n % 2) + '. So sánh với 0';
      },
      outT: function(n){ return 'Số ' + n + ' là số chẵn.'; },
      outF: function(n){ return 'Số ' + n + ' là số lẻ.'; },
      boxT: 'In: số chẵn', boxF: 'In: số lẻ',
      note: function(n){
        return (n < 0 && n % 2 !== 0)
          ? 'Lưu ý: trong C#, số dư của số âm mang dấu âm (' + n + ' % 2 = ' + fmt(n % 2) + '). Vì vậy điều kiện kiểm tra "== 0" chứ không kiểm tra "== 1".'
          : '';
      }
    },
    tuoi: {
      varName: 'tuoi', def: 16, chips: [20, 18, 16],
      lines: [
        'int tuoi = @V;',
        'if (tuoi >= 18)',
        '{',
        '    Console.WriteLine("Bạn được phép truy cập.");',
        '}',
        'else',
        '{',
        '    Console.WriteLine("Bạn chưa đủ tuổi.");',
        '}',
        END_LINE
      ],
      cond: 'tuoi >= 18',
      test: function(n){ return n >= 18; },
      evalLines: function(n){ return [n + ' >= 18']; },
      condExplain: function(n){ return 'So sánh ' + n + ' với 18'; },
      outT: function(){ return 'Bạn được phép truy cập.'; },
      outF: function(){ return 'Bạn chưa đủ tuổi.'; },
      boxT: 'In: được truy cập', boxF: 'In: chưa đủ tuổi',
      note: function(n){
        return n === 18 ? 'Lưu ý: 18 >= 18 là true vì ">=" nghĩa là "lớn hơn hoặc bằng".' : '';
      }
    }
  };
  var IF_BLOCK = [2, 3, 4], ELSE_BLOCK = [5, 6, 7, 8];
  var LAST = 5; // 1..4 la cac buoc chay, 5 la hoan tat

  var ex = EX.chanle, n = 7, step = 0, timer = null, valid = true;
  var $ = function(id){ return document.getElementById(id); };

  function fmt(x){ return x < 0 ? '−' + Math.abs(x) : String(x); }
  function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function hl(src){
    var re = /(\$?"(?:[^"\\]|\\.)*")|\b(int|if|else)\b|(-?\b\d+\b)/g, out = '', last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
      else if (m[2]) out += '<span class="kw">' + m[2] + '</span>';
      else out += '<span class="num">' + esc(m[3]) + '</span>';
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }

  function curLine(cond){
    return [null, 0, 1, cond ? 3 : 7, 9, null][step];
  }
  function ranLines(cond){
    var r = [];
    if (step >= 1) r.push(0);
    if (step >= 2) r.push(1);
    if (step >= 3) r.push(cond ? 3 : 7);
    if (step >= 4) r.push(9);
    return r;
  }

  function renderCode(cond){
    var cur = curLine(cond), ran = ranLines(cond);
    var skipped = step >= 3 ? (cond ? ELSE_BLOCK : IF_BLOCK) : [];
    $('code').innerHTML = ex.lines.map(function(l, i){
      var text = l.replace('@V', String(n));
      var cls = 'ln' + (i === cur ? ' cur' : '') + (skipped.indexOf(i) >= 0 ? ' skip' : '');
      var mark = ran.indexOf(i) >= 0 && i !== cur ? '✓' : '';
      return '<div class="' + cls + '"><span class="no">' + (i + 1) + '</span><span class="mark">' + mark + '</span><span>' + hl(text) + '</span></div>';
    }).join('');
  }

  function setNode(id, state){ $(id).setAttribute('class', 'nd' + (state ? ' ' + state : '')); }
  function setEdge(id, state, arrow){
    var el = $(id);
    el.setAttribute('class', 'ed' + (state ? ' ' + state : ''));
    if (arrow) el.setAttribute('marker-end', state === 'done' ? 'url(#arOn)' : 'url(#ar)');
  }

  function renderFlow(cond){
    $('tStart').textContent = ex.varName + ' = ' + n;
    $('tCond').textContent = ex.cond;
    $('tIf').textContent = ex.boxT;
    $('tElse').textContent = ex.boxF;
    var brBox = cond ? 'nIf' : 'nElse', otBox = cond ? 'nElse' : 'nIf';
    var brEd = cond ? 'eT' : 'eF', otEd = cond ? 'eF' : 'eT';
    var brM = cond ? 'mT' : 'mF', otM = cond ? 'mF' : 'mT';

    setNode('nStart', step === 1 ? 'on' : step > 1 ? 'done' : '');
    setEdge('e1', step >= 2 ? 'done' : '', true);
    setNode('nCond', step === 2 ? 'on' : step > 2 ? 'done' : '');
    setEdge(brEd, step >= 3 ? 'done' : '', true);
    setEdge(otEd, step >= 3 ? 'skip' : '', true);
    setNode(brBox, step === 3 ? 'on' : step > 3 ? 'done' : '');
    setNode(otBox, step >= 3 ? 'skip' : '');
    setEdge(brM, step >= 4 ? 'done' : '', false);
    setEdge(otM, step >= 3 ? 'skip' : '', false);
    setEdge('mE', step >= 4 ? 'done' : '', true);
    setNode('nEnd', step === 4 ? 'on' : step > 4 ? 'done' : '');
  }

  function renderEval(cond){
    if (step < 2) {
      $('eval').innerHTML = '<span class="ph">Điều kiện sẽ được kiểm tra ở bước 2.</span>';
      return;
    }
    var rows = [esc(ex.cond)].concat(ex.evalLines(n).map(function(s){ return '→ ' + esc(s); }));
    rows.push('→ <span class="res ' + (cond ? 't' : 'f') + '">' + (cond ? 'true' : 'false') + '</span>');
    $('eval').innerHTML = rows.join('<br>');
  }

  function renderConsole(cond){
    var out = [];
    if (step >= 3) out.push(esc(cond ? ex.outT(n) : ex.outF(n)));
    if (step >= 4) out.push('Chương trình kết thúc.');
    $('console').innerHTML = out.length ? out.join('<br>') : '<span class="ph">Chưa có kết quả.</span>';
  }

  function renderStatus(cond){
    var t = cond ? 'true' : 'false', title, body, note = '';
    if (step === 0) {
      title = 'Sẵn sàng';
      body = 'Bấm "Bước tiếp" để chương trình bắt đầu chạy từ dòng 1.';
    } else if (step === 1) {
      title = 'Bước 1/4 · Gán giá trị';
      body = 'Gán giá trị ' + n + ' cho biến ' + ex.varName + '.';
    } else if (step === 2) {
      title = 'Bước 2/4 · Kiểm tra điều kiện';
      body = ex.condExplain(n) + ', điều kiện là ' + t + '. ' +
        (cond ? 'Chương trình sẽ vào khối if.' : 'Chương trình bỏ qua khối if và vào khối else.');
      note = ex.note(n);
    } else if (step === 3) {
      title = 'Bước 3/4 · Chạy ' + (cond ? 'khối if' : 'khối else');
      body = 'In ra "' + (cond ? ex.outT(n) : ex.outF(n)) + '". ' +
        (cond ? 'Khối else bị bỏ qua.' : 'Khối if bị bỏ qua.');
    } else if (step === 4) {
      title = 'Bước 4/4 · Ra khỏi if-else';
      body = 'Chương trình chạy tiếp dòng ngay sau cấu trúc if-else: in ra "Chương trình kết thúc."';
    } else {
      title = 'Hoàn tất';
      body = 'Chỉ một trong hai khối (if hoặc else) được chạy, tùy vào điều kiện là true hay false. ' +
        'Dòng sau cấu trúc if-else luôn chạy. Đổi giá trị để xem nhánh còn lại.';
    }
    $('status').innerHTML = '<b>' + title + '</b>' + esc(body) + (note ? '<span class="note">' + esc(note) + '</span>' : '');
  }

  function render(){
    var cond = ex.test(n);
    renderCode(cond); renderFlow(cond); renderEval(cond); renderConsole(cond); renderStatus(cond);
    var running = timer !== null;
    $('next').disabled = !valid || step >= LAST || running;
    $('all').disabled = !valid || running;
    $('reset').disabled = running;
  }

  function stop(){ if (timer) { clearInterval(timer); timer = null; } }
  function reset(){ stop(); step = 0; render(); }

  function setValue(v){
    $('val').value = String(v);
    onInput();
  }
  function onInput(){
    var s = $('val').value.trim();
    var ok = /^-?\d{1,10}$/.test(s) && Number(s) >= -2147483648 && Number(s) <= 2147483647;
    valid = ok;
    $('val').classList.toggle('bad', !ok);
    $('err').textContent = ok ? '' : 'Hãy nhập một số nguyên (kiểu int), ví dụ 7 hoặc -3.';
    if (ok) n = Number(s);
    reset();
  }

  function loadExample(key){
    ex = EX[key];
    document.querySelectorAll('.tab').forEach(function(b){
      b.setAttribute('aria-selected', b.dataset.ex === key ? 'true' : 'false');
    });
    $('valLabel').textContent = ex.varName + ' =';
    $('chips').innerHTML = ex.chips.map(function(c){
      return '<button class="chip" type="button" data-v="' + c + '">' + c + '</button>';
    }).join(' ');
    setValue(ex.def);
  }

  $('next').addEventListener('click', function(){ if (valid && step < LAST) { step++; render(); } });
  $('reset').addEventListener('click', reset);
  $('all').addEventListener('click', function(){
    if (!valid) return;
    if (step >= LAST) step = 0;
    step++; render();
    timer = setInterval(function(){
      step++;
      if (step >= LAST) { step = LAST; stop(); }
      render();
    }, 900);
    render();
  });
  $('val').addEventListener('input', onInput);
  $('val').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && valid && step < LAST) { step++; render(); }
  });
  $('chips').addEventListener('click', function(e){
    var b = e.target.closest('.chip');
    if (b) setValue(b.dataset.v);
  });
  document.querySelectorAll('.tab').forEach(function(b){
    b.addEventListener('click', function(){ loadExample(b.dataset.ex); });
  });

  loadExample('chanle');
})();
</script>
</body>
</html>
