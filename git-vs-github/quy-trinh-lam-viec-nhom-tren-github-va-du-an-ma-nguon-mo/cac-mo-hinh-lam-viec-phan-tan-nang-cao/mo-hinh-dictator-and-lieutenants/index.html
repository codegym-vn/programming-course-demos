<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kim tự tháp Dictator</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --ok:#15803d; --ok-soft:#e3f4e8; --warn:#c2410c; --warn-soft:#ffe8d6; --bad:#b42318; --bad-soft:#fbe9e7;
    --cur:#fff1b8; --cur-bar:#e0a800; --node-line:#c9ced8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --ok:#4ade80; --ok-soft:#13301f; --warn:#fdba74; --warn-soft:#4a2c16; --bad:#f87171; --bad-soft:#3a1717;
      --cur:#3d3412; --cur-bar:#e0b400; --node-line:#3a4250;
    }
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:15px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:860px;margin:0 auto;padding:20px 16px 28px;position:relative}
  h1{font-size:21px;margin:0 0 4px;padding-right:130px}
  .lead{color:var(--muted);margin:0 0 12px;font-size:14.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  .seg{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
  .seg b{font-size:13px;color:var(--muted);font-weight:600}
  .seg button{border:1px solid var(--line);background:var(--card);color:var(--text);padding:4px 10px;border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px}
  .seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:600}
  .seg button:disabled{cursor:not-allowed;opacity:.6}
  .btns{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:7px 13px;border-radius:8px;cursor:pointer;font:inherit;font-weight:600}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:10px 14px;margin-bottom:14px;min-height:96px}
  .status b{display:block;font-size:13px;color:var(--accent);margin-bottom:2px}
  .status .note{display:block;margin-top:6px;font-size:13px;color:var(--muted)}
  .status.ok{border-left-color:var(--ok);background:var(--ok-soft)} .status.ok b{color:var(--ok)}
  .status.warn{border-left-color:var(--warn);background:var(--warn-soft)} .status.warn b{color:var(--warn)}

  .gwrap{overflow-x:auto}
  .dg{display:block;width:100%;min-width:560px;height:auto}
  .tier{font:700 11.5px system-ui,sans-serif;fill:var(--muted)}
  .eg{fill:none;stroke:var(--node-line);stroke-width:2.2;transition:stroke .25s}
  .eg.on{stroke:var(--accent);stroke-width:3.5}
  .el{font:600 11.5px system-ui,sans-serif;fill:var(--muted);text-anchor:middle;paint-order:stroke;stroke:var(--card);stroke-width:5px}
  .nd rect{fill:var(--card);stroke:var(--node-line);stroke-width:2;transition:fill .25s,stroke .25s}
  .nd.act rect{stroke:var(--cur-bar);stroke-width:3;fill:var(--cur)}
  .nd.main rect{stroke:var(--accent)}
  .nd.sync rect{stroke:var(--ok)}
  .nd .t{font:700 12px system-ui,sans-serif;fill:var(--text);text-anchor:middle}
  .cm circle{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.8}
  .cm text{font:700 9.5px ui-monospace,Menlo,Consolas,monospace;fill:var(--text);text-anchor:middle}
  .cm.good circle{fill:var(--ok-soft);stroke:var(--ok)}
  .cm.x circle,.tk.x circle{fill:var(--bad-soft);stroke:var(--bad)}
  .tk circle{fill:var(--cur);stroke:var(--cur-bar);stroke-width:2}
  .tk text{font:700 9.5px ui-monospace,Menlo,Consolas,monospace;fill:var(--text);text-anchor:middle}

  #full{position:absolute;right:16px;top:18px;background:#f59e0b;color:#1c1300;font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px;border:0;cursor:pointer;font-family:inherit}
  #fullnote{position:absolute;right:16px;top:56px;max-width:320px;background:#7f1d1d;color:#fecaca;font-size:13px;padding:8px 10px;border-radius:8px;z-index:20}
  #full[hidden]{display:none}
  @media (max-width:640px){h1{padding-right:0}#full{position:static;display:inline-block;margin:4px 0 8px}}
</style>
</head>
<body>
<div class="wrap">
  <h1>Đường đi của patch qua kim tự tháp 3 tầng</h1>
  <button id="full" type="button" hidden>⛶ Phóng to</button>
  <div id="fullnote" hidden>Khung bài học này không cho phóng to. Hãy dùng liên kết &quot;Mở bài tương tác toàn màn hình&quot; đặt ngay trong bài.</div>
  <p class="lead">Mã nguồn đi từ đáy lên đỉnh, qua từng lớp kiểm duyệt. Bấm <b>Bước tiếp</b> để theo dõi một đợt tích hợp.</p>
  <div class="seg" id="opt"></div>
  <div class="btns">
    <button class="btn ghost" id="prev">◀ Bước trước</button>
    <button class="btn" id="next">Bước tiếp ▶</button>
    <button class="btn ghost" id="all">Chạy hết</button>
    <button class="btn ghost" id="reset">Làm lại</button>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="card">
    <div class="gwrap"><svg class="dg" id="dg" viewBox="0 0 660 352" role="img" aria-label="Kim tự tháp Developers, Lieutenants và Dictator"></svg></div>
  </div>
</div>

<script>(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  var Y3 = 56, Y2 = 180, Y1 = 306;
  var N = {
    dict:{x:330, y:Y3, w:160, h:68, t:'Dictator'}, main:{x:550, y:Y3, w:170, h:68, t:'Kho chính thức', cls:'main'},
    lD:{x:170, y:Y2, w:140, h:68, t:'Lieutenant Driver'}, lM:{x:350, y:Y2, w:140, h:68, t:'Lieutenant Bộ nhớ'}, lN:{x:530, y:Y2, w:140, h:68, t:'Lieutenant Mạng'},
    a1:{x:125, y:Y1, w:78, h:62, t:'Dev 1'}, a2:{x:215, y:Y1, w:78, h:62, t:'Dev 2'}, a3:{x:305, y:Y1, w:78, h:62, t:'Dev 3'}, a4:{x:395, y:Y1, w:78, h:62, t:'Dev 4'}, a5:{x:485, y:Y1, w:78, h:62, t:'Dev 5'}, a6:{x:575, y:Y1, w:78, h:62, t:'Dev 6'}
  };
  var LI = {a1:'lD', a2:'lD', a3:'lM', a4:'lM', a5:'lN', a6:'lN'}, DEV = Object.keys(LI), LS = ['lD', 'lM', 'lN'];
  var P = {a1:'d1', a2:'d2', a3:'m1', a4:'m2', a5:'n1', a6:'n2'};
  function build(bad){
    var S = [], dev = {}, n2 = bad ? 'n2!' : 'n2';
    DEV.forEach(function(a){ dev[a] = [a === 'a6' ? n2 : P[a]]; });
    function rep(o){ var r = {dict:[], main:[], lD:[], lM:[], lN:[]}; DEV.forEach(function(a){ r[a] = []; }); Object.keys(o).forEach(function(k){ r[k] = o[k]; }); return r; }
    var devAll = {}; DEV.forEach(function(a){ devAll[a] = dev[a]; });
    S.push({rep:rep(devAll), act:DEV, title:'Tầng 1: các Developers viết mã theo phân hệ',
      body:'Đây là lực lượng đông nhất. Mỗi người thuộc một phân hệ: Driver, Bộ nhớ hoặc Mạng. Mỗi vòng tròn là một đóng góp (patch).',
      note:bad ? 'Patch n2 của Dev 6 có lỗi (màu đỏ), nhưng Dev 6 chưa biết.' : undefined});
    var inL = {lD:['d1', 'd2'], lM:['m1', 'm2'], lN:['n1', n2]};
    S.push({rep:rep(inL), on:['dl'], act:LS, fl:DEV.map(function(a){ return [a, LI[a], a === 'a6' ? n2 : P[a]]; }), title:'Gửi cho Lieutenant phụ trách phân hệ của mình',
      body:'Không ai gửi thẳng lên Dictator. Mỗi patch chỉ đi tới đúng một Lieutenant, người hiểu rõ phân hệ đó nhất.'});
    var good = {lD:['d1+', 'd2+'], lM:['m1+', 'm2+'], lN:bad ? ['n1+'] : ['n1+', 'n2+']};
    var r3 = rep(good);
    if (bad) r3.a6 = ['n2!'];
    S.push({rep:r3, act:LS, warn:bad, fl:bad ? [['lN', 'a6', 'n2!']] : null, on:bad ? ['dl'] : null, title:bad ? 'Lieutenant Mạng phát hiện lỗi, trả patch n2 về' : 'Lieutenants xem xét, kiểm thử và tổng hợp',
      body:bad ? 'Patch n1 đạt nên được giữ lại, còn n2 bị trả về cho Dev 6 sửa. Lỗi dừng ở tầng 2, Dictator không hề phải nhìn thấy nó.'
        : 'Mỗi Lieutenant kiểm tra các patch của phân hệ mình rồi gộp vào kho phân hệ riêng. Màu xanh là patch đã đạt.',
      note:bad ? 'Dev 6 sửa xong có thể gửi lại trong đợt sau.' : undefined});
    var r4 = rep({lD:good.lD, lM:good.lM, lN:good.lN, dict:['D', 'M', 'N']});
    if (bad) r4.a6 = ['n2!'];
    S.push({rep:r4, on:['ld'], act:['dict'], fl:[['lD', 'dict', 'D'], ['lM', 'dict', 'M'], ['lN', 'dict', 'N']], title:'Phân hệ đã ổn định: gửi lên Dictator',
      body:'Mỗi Lieutenant gom các patch thành một gói. Dictator kéo mã nguồn từ ba Lieutenants đáng tin cậy.',
      note:'D, M, N là gói của ba phân hệ. Dictator chỉ làm việc với vài người thay vì hàng trăm nhà phát triển.'});
    var r5 = rep({dict:['D', 'M', 'N']});
    if (bad) r5.a6 = ['n2!'];
    S.push({rep:r5, act:['dict'], title:'Dictator rà soát tổng thể hệ thống',
      body:'Từng patch đã được chuyên gia kiểm tra, nên Dictator tập trung xem các phân hệ có hoạt động tốt cùng nhau không. Linus Torvalds giữ vai trò này trong dự án Linux.'});
    var r6 = rep({dict:['D', 'M', 'N'], main:['D', 'M', 'N']});
    if (bad) r6.a6 = ['n2!'];
    S.push({rep:r6, on:['dm'], act:['main'], fl:[['dict', 'main', 'D'], ['dict', 'main', 'M'], ['dict', 'main', 'N']], title:'Đẩy mã đã duyệt lên kho chính thức duy nhất',
      body:'Chỉ Dictator đẩy mã vào kho này. Đây là nguồn mã chính thức của toàn dự án.'});
    var r7 = rep({main:['D', 'M', 'N']});
    if (bad) r7.a6 = ['n2!'];
    S.push({rep:r7, sync:true, on:['cm'], act:[], ok:true, down:true, title:'Toàn bộ cộng đồng kéo dữ liệu chính thức về',
      body:bad ? 'Mọi người nhận được bản đã duyệt và bắt đầu đợt mới từ đó. Patch n2 vẫn ở lại máy Dev 6 chờ sửa, không ai khác bị ảnh hưởng.'
        : 'Mọi người nhận được bản đã duyệt và bắt đầu đợt đóng góp mới từ đó. Vòng lặp khép kín.',
      note:bad ? undefined : 'Thử chọn "Có patch lỗi" để xem lớp kiểm duyệt ở tầng 2 hoạt động.'});
    return S;
  }

  var bad = false, S = build(bad), step = 0, timer = null;
  var calm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  function chipRow(list, n){
    var r = n.w < 100 ? 9 : 11, gap = r * 2 + 4, x0 = n.x - (list.length - 1) * gap / 2;
    return list.map(function(c, i){
      var cls = c.slice(-1) === '!' ? ' x' : c.slice(-1) === '+' ? ' good' : '', t = c.replace(/[!+]/, ''), x = x0 + i * gap;
      return '<g class="cm' + cls + '"><circle cx="' + x + '" cy="' + (n.y + 13) + '" r="' + r + '"/><text x="' + x + '" y="' + (n.y + 16.5) + '">' + t + '</text></g>';
    }).join('');
  }
  function draw(sn){
    var on = sn && sn.on || [], out = '';
    function eg(g, d){ return '<path class="eg' + (on.indexOf(g) >= 0 ? ' on' : '') + '" d="' + d + '"/>'; }
    DEV.forEach(function(a){ var p = N[a], l = N[LI[a]]; out += eg('dl', 'M' + p.x + ' ' + (p.y - p.h / 2) + 'L' + l.x + ' ' + (l.y + l.h / 2)); });
    LS.forEach(function(k){ var l = N[k]; out += eg('ld', 'M' + l.x + ' ' + (l.y - l.h / 2) + 'L330 ' + (Y3 + 34)); });
    out += eg('dm', 'M410 ' + Y3 + 'H465');
    out += eg('cm', 'M630 ' + (Y3 + 34) + 'V' + (Y1 - 50));
    if (on.indexOf('cm') >= 0) {
      out += eg('cm', 'M630 ' + (Y1 - 50) + 'H125');
      DEV.forEach(function(a){ out += eg('cm', 'M' + N[a].x + ' ' + (Y1 - 50) + 'V' + (Y1 - 31)); });
    }
    out += '<text class="el" x="630" y="166">kéo về</text>';
    [[Y3, 'Tầng 3'], [Y2, 'Tầng 2'], [Y1, 'Tầng 1']].forEach(function(t){ out += '<text class="tier" x="6" y="' + (t[0] + 4) + '">' + t[1] + '</text>'; });
    Object.keys(N).forEach(function(k){
      var n = N[k], list = sn ? sn.rep[k] : [], cls = 'nd' + (n.cls ? ' ' + n.cls : '') + (sn && sn.act.indexOf(k) >= 0 ? ' act' : '') + (sn && sn.sync && LI[k] ? ' sync' : '');
      var sub = sn && sn.sync && LI[k] && !list.length ? '<text class="t" style="fill:var(--ok);font-size:11px" x="' + n.x + '" y="' + (n.y + 17) + '">đã cập nhật</text>' : '';
      out += '<g class="' + cls + '"><rect x="' + (n.x - n.w / 2) + '" y="' + (n.y - n.h / 2) + '" width="' + n.w + '" height="' + n.h + '" rx="8"/><text class="t" x="' + n.x + '" y="' + (n.y - n.h / 2 + 21) + '">' + n.t + '</text>' + sub + chipRow(list, n) + '</g>';
    });
    return out + '<g id="toks"></g>';
  }
  function token(label, kf, dur){
    var x = label.slice(-1) === '!', g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('class', 'tk' + (x ? ' x' : ''));
    g.innerHTML = '<circle r="11"/><text y="3.5">' + label.replace(/[!+]/, '') + '</text>';
    $('toks').appendChild(g);
    g.animate(kf, {duration:dur, easing:'ease-in-out'}).onfinish = function(){ g.remove(); };
  }
  function tr(x, y){ return {transform:'translate(' + x + 'px,' + y + 'px)'}; }
  function animate(sn){
    if (calm || !document.body.animate) return;
    (sn.fl || []).forEach(function(f){ var a = N[f[0]], b = N[f[1]]; token(f[2], [tr(a.x, a.y), tr(b.x, b.y)], 800); });
    if (sn.down) ['D', 'M', 'N'].forEach(function(t, i){ var m = N.main; token(t, [tr(m.x + (i - 1) * 24, m.y), tr(630, 150), tr(630, Y1 - 50), tr(350, Y1 - 50)], 1100); });
  }
  function render(forward){
    var sn = step ? S[step - 1] : null, run = timer !== null, dis = run ? ' disabled' : '';
    $('opt').innerHTML = '<b>Đợt đóng góp:</b><button type="button" data-q="0" aria-pressed="' + !bad + '"' + dis + '>Mọi patch đều đạt</button><button type="button" data-q="1" aria-pressed="' + bad + '"' + dis + '>Có patch lỗi</button>';
    $('status').className = 'status' + (sn ? (sn.warn ? ' warn' : sn.ok ? ' ok' : '') : '');
    $('status').innerHTML = sn ? '<b>Bước ' + step + '/' + S.length + ' · ' + esc(sn.title) + '</b>' + esc(sn.body) + (sn.note ? '<span class="note">' + esc(sn.note) + '</span>' : '')
      : '<b>Sẵn sàng · ' + S.length + ' bước</b>Sơ đồ có 3 tầng: 6 Developers ở đáy, 3 Lieutenants ở giữa, 1 Dictator ở đỉnh. Dự án thật có thể có hàng trăm Developers. Bấm "Bước tiếp".';
    $('dg').innerHTML = draw(sn);
    if (forward && sn) animate(sn);
    $('prev').disabled = run || step === 0;
    $('next').disabled = run || step >= S.length;
    $('all').disabled = run; $('reset').disabled = run;
  }
  function stop(){ if (timer) { clearInterval(timer); timer = null; } }
  $('opt').addEventListener('click', function(e){ var b = e.target.closest('button[data-q]'); if (!b || timer) return; bad = b.dataset.q === '1'; S = build(bad); step = 0; render(); });
  $('next').addEventListener('click', function(){ if (step < S.length) { step++; render(true); } });
  $('prev').addEventListener('click', function(){ if (step > 0) { step--; render(); } });
  $('reset').addEventListener('click', function(){ stop(); step = 0; render(); });
  $('all').addEventListener('click', function(){
    if (step >= S.length) step = 0;
    step++;
    timer = setInterval(function(){ step++; if (step >= S.length) { step = S.length; stop(); } render(true); }, 2200);
    render(true);
  });
  render();
})();
</script>
<script>
  try{ if(window.self!==window.top) document.getElementById('full').hidden=false; }catch(e){ document.getElementById('full').hidden=false; }
  document.getElementById('full').onclick = ()=>{
    const el = document.documentElement, fn = el.requestFullscreen || el.webkitRequestFullscreen;
    const fail = ()=>{ const n=document.getElementById('fullnote'); n.hidden=false; setTimeout(()=>n.hidden=true,6000); };
    if(document.fullscreenElement || document.webkitFullscreenElement){ (document.exitFullscreen||document.webkitExitFullscreen).call(document); return; }
    if(!fn){ fail(); return; }
    try{ const r = fn.call(el); if(r && r.catch) r.catch(fail); }catch(e){ fail(); }
  };
</script>
</body>
</html>
