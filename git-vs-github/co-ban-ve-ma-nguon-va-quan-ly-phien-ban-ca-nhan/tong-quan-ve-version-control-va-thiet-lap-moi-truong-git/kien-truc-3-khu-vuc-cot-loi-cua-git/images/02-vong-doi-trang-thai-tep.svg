<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="aB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
    <marker id="aG" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5d6676"/></marker>
    <marker id="aO" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c2410c"/></marker>
  </defs>
  <rect width="1200" height="600" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" font-size="28" font-weight="700" fill="#1d2330">Vòng đời trạng thái của một tệp</text>
  <text x="600" y="78" text-anchor="middle" font-size="16" fill="#5d6676">Mỗi trạng thái cho biết phiên bản mới nhất của tệp đang nằm tới khu vực nào</text>

  <!-- Sửa tiếp sau khi add (nét đứt phía trên) -->
  <path d="M600 222 C600 140 240 140 236 214" fill="none" stroke="#c2410c" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#aO)"/>
  <rect x="300" y="128" width="260" height="28" rx="14" fill="#fff" stroke="#c2410c" stroke-dasharray="4 3"/>
  <text x="430" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#c2410c">Sửa tiếp sau khi đã add</text>

  <!-- Modified -->
  <rect x="110" y="225" width="250" height="140" rx="20" fill="#fff7f1" stroke="#c2410c" stroke-width="2.5"/>
  <text x="235" y="268" text-anchor="middle" font-size="24" font-weight="700" fill="#c2410c">Modified</text>
  <text x="235" y="296" text-anchor="middle" font-size="14" fill="#1d2330">Đã sửa trong</text>
  <text x="235" y="316" text-anchor="middle" font-size="14" fill="#1d2330">Working Directory,</text>
  <text x="235" y="336" text-anchor="middle" font-size="14" fill="#1d2330">Git chưa ghi nhận</text>

  <!-- Staged -->
  <rect x="475" y="225" width="250" height="140" rx="20" fill="#f2fbf4" stroke="#15803d" stroke-width="2.5"/>
  <text x="600" y="268" text-anchor="middle" font-size="24" font-weight="700" fill="#15803d">Staged</text>
  <text x="600" y="296" text-anchor="middle" font-size="14" fill="#1d2330">Đã chép vào</text>
  <text x="600" y="316" text-anchor="middle" font-size="14" fill="#1d2330">Staging Area,</text>
  <text x="600" y="336" text-anchor="middle" font-size="14" fill="#1d2330">chờ commit</text>

  <!-- Committed -->
  <rect x="840" y="225" width="250" height="140" rx="20" fill="#f8f4ff" stroke="#7c3aed" stroke-width="2.5"/>
  <text x="965" y="268" text-anchor="middle" font-size="24" font-weight="700" fill="#7c3aed">Committed</text>
  <text x="965" y="296" text-anchor="middle" font-size="14" fill="#1d2330">Đã lưu vào Repository;</text>
  <text x="965" y="316" text-anchor="middle" font-size="14" fill="#1d2330">cả ba khu vực</text>
  <text x="965" y="336" text-anchor="middle" font-size="14" fill="#1d2330">đồng bộ nội dung</text>

  <!-- Mũi tên xuôi -->
  <path d="M364 295H466" stroke="#2563eb" stroke-width="3" marker-end="url(#aB)"/>
  <text x="417" y="284" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#2563eb">git add</text>
  <path d="M729 295H831" stroke="#2563eb" stroke-width="3" marker-end="url(#aB)"/>
  <text x="782" y="284" text-anchor="middle" font-family="Menlo, Consolas, monospace" font-size="15" font-weight="700" fill="#2563eb">git commit</text>

  <!-- Vòng lại -->
  <path d="M965 369 C965 470 235 470 235 375" fill="none" stroke="#5d6676" stroke-width="2.5" marker-end="url(#aG)"/>
  <rect x="470" y="430" width="260" height="30" rx="15" fill="#f3f5f8"/>
  <text x="600" y="451" text-anchor="middle" font-size="15" font-weight="700" fill="#3b4352">Sửa tệp lần nữa → vòng mới</text>

  <rect x="130" y="508" width="940" height="56" rx="12" fill="#fff7e0" stroke="#e0a800"/>
  <text x="600" y="531" text-anchor="middle" font-size="14.5" fill="#1d2330"><tspan font-weight="700">Lưu ý:</tspan> nếu sửa tiếp sau khi add, tệp vừa <tspan font-weight="700" fill="#15803d">Staged</tspan> vừa <tspan font-weight="700" fill="#c2410c">Modified</tspan>.</text>
  <text x="600" y="551" text-anchor="middle" font-size="14.5" fill="#1d2330">Commit lúc đó chỉ lưu bản trong Staging Area; phần sửa sau vẫn nằm ở Working Directory.</text>
</svg>
