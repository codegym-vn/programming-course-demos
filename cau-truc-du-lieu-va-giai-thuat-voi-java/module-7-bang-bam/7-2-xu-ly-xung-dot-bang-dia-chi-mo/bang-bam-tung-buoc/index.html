  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:10px 12px 12px}
  .lead{color:var(--muted);margin:0 0 8px;font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .controls{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:4px 10px;
    border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
  .tab[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}

  .field label{font-weight:600;font-size:13px}
  .field input[type=text]{width:70px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .field input.bad{border-color:var(--false);background:var(--false-soft)}
  .chk{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:5px 11px;border-radius:8px;
    cursor:pointer;font:inherit;font-weight:600;font-size:13px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.op{background:var(--accent-soft);color:var(--accent);font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600}
  .btn:disabled{opacity:.4;cursor:not-allowed}

  .brow{display:flex;align-items:center;gap:4px;min-height:25px;min-width:0;overflow:hidden}

/* ===== MyHashMap ===== */
function hmIdx(st, key){ return supp(jhash(key)) & (st.cap - 1); }
function hmHashTxt(st, key){ var h = jhash(key), s = supp(h); return c('"' + key + '".hashCode() = ' + h) + ' → ' + c('supplementalHash = ' + s) + ' → ' + c(s + ' & (' + st.cap + ' - 1) = ' + (s & (st.cap - 1))); }
function hmEntries(st){ var a = []; for (var i = 0; i < st.cap; i++) if (st.b[i]) st.b[i].forEach(function(e, j){ a.push({k: e.k, v: e.v, i: i, j: j}); }); return a; }

  var i = hmIdx(st, key); if (st.b[i] === null) st.b[i] = []; st.b[i].push({k: key, v: val}); st.size++; return val;
}

  if (mode === 'map') return {kind: 'hm', src: 'HM', cap: 8, pre: [['put', 'An', 29], ['put', 'Binh', 22], ['put', 'Linh', 31], ['put', 'Nam', 30], ['put', 'Cuc', 23]], script: [['get', 'Nam'], ['cv', 33]], ops: ['get', 'ck', 'cv', 'put'], defK: 'Cuc', defV: '33'};
  return {kind: 'oa', src: 'LP', n: 11, pre: [['ins', 44], ['ins', 4], ['ins', 16], ['ins', 28], ['ins', 21]], script: [['ins', 26]], ops: ['ins'], def: '49'};
}
var MAXN = 16;

    t.addEventListener('click', function(){
      if (t.hasAttribute('data-mark')) OPT.mark = +t.getAttribute('data-mark'); else { OPT.n = +t.getAttribute('data-n'); $('ik').value = OPT.n === 8 ? '40' : '49'; }
      syncTabs(); setErr(''); reset();
    });
  });
  if ($('cmp')) { $('cmp').checked = OPT.cmp; $('cmp').addEventListener('change', function(){ OPT.cmp = this.checked; draw(); }); }
  syncTabs();
}
var LEAD = {
  oa: 'Nhập khoá rồi bấm thao tác, hoặc bấm <b>Bước tiếp</b> (<kbd>→</kbd>) để xem từng lần dò.',
  sc: 'Nhập khoá rồi bấm thao tác, hoặc bấm <b>Bước tiếp</b> (<kbd>→</kbd>) để xem từng bước.',
  hm: 'Nhập khoá, giá trị rồi bấm phương thức, hoặc bấm <b>Bước tiếp</b> (<kbd>→</kbd>) để xem từng bước.'
};
(function init(){
  if (qs('xoa') === 'empty') OPT.mark = 0;
  if (qs('n') === '8') OPT.n = 8;
  if (qs('cmp') === '1') OPT.cmp = true;
  var c0 = makeCfg(MODE, VD, OPT);
  $('lead').innerHTML = LEAD[c0.kind === 'rh' ? 'sc' : c0.kind];
  $('codet').innerHTML = 'Code của bài<span>' + (c0.src === 'HM' ? 'MyHashMap.java' : {LP: 'LinearProbing', PS: 'ProbeSearch', QP: 'QuadraticProbing', SC: 'SeparateChaining', RH: 'Rehash'}[c0.src] + '.java') + '</span>';
  $('cont').innerHTML = c0.kind === 'sc' ? 'Vòng for cuối sẽ in<span>bảng hiện tại</span>' : c0.kind === 'oa' && c0.src === 'PS' ? 'Kết quả các lời gọi' : c0.kind === 'hm' && !c0.demo ? 'Kết quả các lời gọi' : 'Output';
  buildControls();
  $('next').addEventListener('click', function(){ if (pos < TL.length - 1) { pos++; draw(); } });
  $('prev').addEventListener('click', function(){ if (pos > 0) { pos--; draw(); } });
  $('reset').addEventListener('click', function(){ setErr(''); reset(); });
  $('all').addEventListener('click', function(){
    if (timer) return;
    timer = setInterval(function(){ if (pos >= TL.length - 1) { stop(); draw(); return; } pos++; draw(); }, 500);
    draw();
  });
  document.addEventListener('keydown', function(e){
    var t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || timer) return;
    if (e.key === 'ArrowRight') { if (pos < TL.length - 1) { pos++; draw(); } e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { if (pos > 0) { pos--; draw(); } e.preventDefault(); }
  });
  $('ik').addEventListener('keydown', function(e){ if (e.key === 'Enter') { var b = document.querySelector('.btn.op'); if (b) b.click(); } });
  reset();
})();
})();
</script>
</body>
</html>
