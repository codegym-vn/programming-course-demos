<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="520">
<title>Mã băm của chuỗi</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --kw:#7c3aed; --str:#047857; --num:#c2410c; --cmt:#6b7280;
    --node-line:#c9ced8;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74; --cmt:#8b93a1;
      --node-line:#3a4250;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:10px 12px 12px}
  .lead{color:var(--muted);margin:0 0 8px;font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .controls{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
  .field{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .field label{font-weight:600;font-size:13px}
  .field input[type=text]{width:150px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .field input.bad{border-color:var(--false);background:var(--false-soft)}
  .chip{border:1px dashed var(--node-line);background:transparent;color:var(--text);padding:2px 9px;
    border-radius:999px;cursor:pointer;font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:5px 11px;border-radius:8px;
    cursor:pointer;font:inherit;font-weight:600;font-size:13px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .err{color:var(--false);font-size:12.5px}
  .err:empty{display:none}
  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
    padding:5px 12px;margin-bottom:8px;min-height:50px;font-size:13.5px}
  .status>b{display:block;font-size:12.5px;color:var(--accent)}
  .status code{font-size:12.5px}
  .grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px}
  .grid>*{min-width:0}
  @media (max-width:600px){.grid{grid-template-columns:1fr}}
  .panel-title{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
  .code{background:var(--code-bg);border-radius:8px;padding:6px 0;overflow:auto;
    font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 10px 0 0;border-left:3px solid transparent}
  .ln .no{width:26px;flex:none;text-align:right;padding-right:10px;color:var(--muted);opacity:.6;user-select:none}
  .ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}
  kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px}
  .chars{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:8px}
  .ch{min-width:34px;border:2px solid var(--node-line);border-radius:7px;text-align:center;padding:1px 4px;background:var(--card)}
  .ch b{display:block;font:700 15px ui-monospace,Menlo,Consolas,monospace}
  .ch small{display:block;font:11px ui-monospace,Menlo,monospace;color:var(--muted)}
  .ch.done{background:var(--true-soft);border-color:var(--true)}
  .ch.cur{background:var(--cur);border-color:var(--cur-bar)}
  .tblw{max-height:262px;overflow:auto}
  .tbl{width:100%;border-collapse:collapse;font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .tbl th{font:600 11.5px system-ui,sans-serif;color:var(--muted);text-align:right;padding:3px 5px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--card)}
  .tbl td{padding:3px 5px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
  .tbl th:first-child,.tbl td:first-child{text-align:left}
  .tbl tr.cur td{background:var(--cur)}
  .tbl tr.fut td{color:transparent}
  .ov{color:var(--false);font-weight:700}
  .tag{display:inline-block;padding:0 6px;border-radius:6px;font:600 11px system-ui,sans-serif;background:var(--false-soft);color:var(--false);margin-left:4px}
  .res{margin-top:8px;font:13px ui-monospace,Menlo,Consolas,monospace}
  .note{font-size:11.5px;color:var(--muted);margin-top:4px}
  .note b{color:var(--false)}
  .res b{font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <p class="lead">Nhập một chuỗi rồi bấm <b>Bước tiếp</b> (<kbd>→</kbd>) để tính <code>h = h * 31 + c</code> qua từng ký tự, đúng như <code>String.hashCode()</code>.</p>
  <div class="controls">
    <div class="field"><label for="s">Chuỗi</label><input type="text" id="s" value="dot" maxlength="16" autocomplete="off" spellcheck="false"></div>
    <div class="btns" id="chips"></div>
    <div class="btns">
      <button class="btn" id="next">Bước tiếp</button>
      <button class="btn ghost" id="prev">Lùi lại</button>
      <button class="btn ghost" id="all">Chạy hết</button>
      <button class="btn ghost" id="reset">Làm lại</button>
    </div>
  </div>
  <div class="err" id="err" role="alert"></div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="chars" id="chars"></div>
  <div class="grid">
    <div class="card"><p class="panel-title">Code của bài</p><div class="code" id="code"></div>
      <div class="res" id="res"></div></div>
    <div class="card"><p class="panel-title">Từng bước (phép int 32 bit)</p><div class="tblw"><table class="tbl" id="tbl"></table></div><div class="note">Số <b>đỏ</b>: phép tính đã tràn khỏi <code>int</code>, Java chỉ giữ 32 bit thấp.</div></div>
  </div>
</div>
<script>
(function(){
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function qs(name){ var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }
//SIM-START
// Mỗi bước: h_moi = h * 31 + c tính đúng (BigInt), rồi cắt về int 32 bit như Java
function toInt32(big){ return Number(BigInt.asIntN(32, big)); }
function steps(s){
  var out = [], h = 0;
  for (var i = 0; i < s.length; i++) {
    var c = s.charCodeAt(i), exact = BigInt(h) * 31n + BigInt(c), nh = toInt32(exact);
    out.push({i: i, ch: s[i], c: c, h0: h, exact: exact.toString(), h: nh, ov: exact !== BigInt(nh)});
    h = nh;
  }
  return {rows: out, hash: h};
}
function javaHash(s){ var h = 0; for (var i = 0; i < s.length; i++) h = (Math.imul(h, 31) + s.charCodeAt(i)) | 0; return h; }
//SIM-END
var LINES = [
'static int poly(String s) {',
'  int h = 0;',
'  for (char c : s.toCharArray())',
'    h = h * 31 + c;',
'  return h;',
'}'];
function hl(l){ return esc(l).replace(/\b(static|int|for|char|return|String)\b/g, '<span class="kw">$1</span>').replace(/\b(\d+)\b/g, '<span class="num">$1</span>'); }
function fmt(n){ return String(n); }
var S = 'dot', R = steps(S), step = 0, timer = null;
var jump = parseInt(qs('buoc'), 10);
if (qs('s')) { var q = qs('s'); if (/^[\x20-\x7e]{1,16}$/.test(q)) { S = q; $('s').value = q; R = steps(S); } }
function total(){ return R.rows.length + 2; }  // bước 0: h = 0; các ký tự; bước cuối: return
function draw(){
  var n = R.rows.length, k = step - 1;   // k: chỉ số ký tự vừa xử lý (bước 1..n)
  var ln, title, body;
  if (step === 0) { ln = 1; title = 'int h = 0'; body = 'Bắt đầu với <code>h = 0</code>. Chuỗi "' + esc(S) + '" có ' + n + ' ký tự.'; }
  else if (step <= n) {
    var r = R.rows[k];
    ln = 3; title = 'Ký tự ' + (k + 1) + '/' + n + ": '" + r.ch + "' (mã " + r.c + ')';
    body = '<code>h = ' + r.h0 + ' * 31 + ' + r.c + ' = ' + r.exact + '</code>' + (r.ov ? '. Số này vượt khỏi phạm vi <code>int</code> (từ −2147483648 đến 2147483647), Java <b>bỏ phần tràn</b> và giữ 32 bit thấp: <code>h = ' + r.h + '</code>.' : '.');
  } else { ln = 4; title = 'return ' + R.hash; body = 'Kết quả cuối cùng là <b>' + R.hash + '</b>, đúng bằng <code>"' + esc(S) + '".hashCode()</code>' + (R.rows.some(function(x){ return x.ov; }) ? ' dù giữa chừng đã tràn số.' : '.'); }
  $('status').innerHTML = '<b>Bước ' + (step + 1) + '/' + total() + ' · ' + esc(title) + '</b><span>' + body + '</span>';
  $('code').innerHTML = LINES.map(function(l, i){ return '<div class="ln' + (i === ln ? ' cur' : '') + '"><span class="no">' + (i + 1) + '</span><span>' + hl(l) + '</span></div>'; }).join('');
  $('chars').innerHTML = R.rows.map(function(r, i){ var cl = 'ch' + (i < k ? ' done' : i === k ? ' cur' : '') + (step > n ? ' done' : ''); return '<div class="' + cl + '"><b>' + (r.ch === ' ' ? '␣' : esc(r.ch)) + '</b><small>' + r.c + '</small></div>'; }).join('');
  var h = '<tr><th>ký tự</th><th>h cũ</th><th>h * 31 + c</th><th>h (int)</th></tr>';
  R.rows.forEach(function(r, i){
    var vis = i < step;
    h += '<tr class="' + (i === k && step <= n ? 'cur' : '') + (vis ? '' : ' fut') + '"><td>\'' + esc(r.ch) + '\' ' + r.c + '</td><td>' + r.h0 + '</td><td>' + r.exact + '</td><td' + (r.ov ? ' class="ov"' : '') + '>' + r.h + '</td></tr>';
  });
  $('tbl').innerHTML = h;
  var cur = step === 0 ? 0 : step <= n ? R.rows[k].h : R.hash;
  $('res').innerHTML = 'h = <b>' + cur + '</b>' + (step > n ? '<br><span style="color:var(--muted)">"' + esc(S) + '".hashCode() = ' + javaHash(S) + '</span>' : '');
  var run = timer !== null;
  $('next').disabled = step >= total() - 1 || run; $('prev').disabled = step <= 0 || run; $('all').disabled = run || step >= total() - 1;
}
function stop(){ if (timer) { clearInterval(timer); timer = null; } }
function reset(){ stop(); R = steps(S); step = 0; if (jump > 0) { step = Math.min(jump - 1, total() - 1); jump = 0; } draw(); }
function apply(v){
  var ok = /^[\x20-\x7e]{1,16}$/.test(v);
  $('s').classList.toggle('bad', !ok);
  if (!ok) { $('err').textContent = 'Nhập 1 đến 16 ký tự ASCII (chữ không dấu, chữ số, dấu câu).'; return; }
  $('err').textContent = ''; S = v; reset();
}
['dot', 'tod', 'hashing', 'codegym'].forEach(function(w){
  var b = document.createElement('button'); b.className = 'chip'; b.textContent = '"' + w + '"';
  b.addEventListener('click', function(){ $('s').value = w; apply(w); }); $('chips').appendChild(b);
});
$('s').addEventListener('input', function(){ apply(this.value); });
$('next').addEventListener('click', function(){ if (step < total() - 1) { step++; draw(); } });
$('prev').addEventListener('click', function(){ if (step > 0) { step--; draw(); } });
$('reset').addEventListener('click', reset);
$('all').addEventListener('click', function(){ if (timer) return; timer = setInterval(function(){ if (step >= total() - 1) { stop(); draw(); return; } step++; draw(); }, 450); draw(); });
document.addEventListener('keydown', function(e){
  var t = e.target && e.target.tagName; if (t === 'INPUT' || timer) return;
  if (e.key === 'ArrowRight') { if (step < total() - 1) { step++; draw(); } e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { if (step > 0) { step--; draw(); } e.preventDefault(); }
});
reset();
})();
</script>
</body>
</html>
