<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="620">
<title>Heap: cây và mảng</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c; --cmt:#6b7280;
    --node:#ffffff; --node-line:#c9ced8;
    --max:#ffe4cc; --max-line:#c2410c;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74; --cmt:#8b93a1;
      --node:#1d222c; --node-line:#3a4250;
      --max:#3a2614; --max-line:#fdba74;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:8px 12px 10px}
  .lead{color:var(--muted);margin:0 0 6px;font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .controls{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;margin-bottom:6px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:4px 10px;
    border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .field{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .field label{font-weight:600;font-size:13px}
  .field input{width:64px;padding:4px 8px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--text);font:13.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .field input.wide{width:190px}
  .field input.bad{border-color:var(--false);background:var(--false-soft)}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:5px 11px;border-radius:8px;
    cursor:pointer;font:inherit;font-weight:600;font-size:13px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn.op{background:var(--true-soft);border-color:var(--true);color:var(--true)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .err{color:var(--false);font-size:12.5px}
  .err:empty{display:none}
  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
    padding:5px 12px;margin-bottom:6px;min-height:50px;font-size:13.5px}
  .status>b{display:block;font-size:12.5px;color:var(--accent)}
  .status code{font-size:12.5px}
  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:start}
  .col{display:flex;flex-direction:column;gap:8px;min-width:0}
  @media (max-width:600px){.grid{grid-template-columns:1fr}}
  .panel-title{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 3px}
  .code{background:var(--code-bg);border-radius:8px;padding:5px 0;overflow:auto;max-height:400px;
    font:11px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 10px 0 0;border-left:3px solid transparent}
  .ln .no{width:26px;flex:none;text-align:right;padding-right:8px;color:var(--muted);opacity:.6;user-select:none}
  .ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--cmt);font-style:italic}
  .console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:6px 10px;min-height:40px;max-height:76px;overflow:auto;white-space:pre-wrap;word-break:break-word;
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .console .ph{color:#7b8494;font-family:system-ui,sans-serif}
  .vars+.sublbl{margin-top:6px}
  .console .er{color:#fca5a5}
  kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px}

  .tree svg{display:block;width:100%;height:auto}
  .tree line{stroke:var(--node-line);stroke-width:1.6}
  .tree line.hi{stroke:var(--cur-bar);stroke-width:3.5}
  .tree g.nd{transition:transform .45s ease}
  .tree g.nd circle,.tree g.nd rect{fill:var(--node);stroke:var(--node-line);stroke-width:1.6;transition:fill .25s,stroke .25s}
  .tree g.nd text{font:600 13px ui-monospace,Menlo,Consolas,monospace;fill:var(--text);text-anchor:middle;dominant-baseline:central}
  .tree g.nd text.nm{font:600 11.5px system-ui,sans-serif}
  .tree g.nd text.ix{font:9.5px ui-monospace,Menlo,monospace;fill:var(--muted)}
  .tree g.cmp circle,.tree g.cmp rect{fill:var(--cur);stroke:var(--cur-bar);stroke-width:2.5}
  .tree g.new circle,.tree g.new rect{fill:var(--true-soft);stroke:var(--true);stroke-width:2.5}
  .tree g.moved circle,.tree g.moved rect{stroke:var(--true);stroke-dasharray:4 3}
  .tree g.del circle,.tree g.del rect{fill:var(--false-soft);stroke:var(--false);stroke-width:2.5}
  .tree g.max circle,.tree g.max rect{fill:var(--max);stroke:var(--max-line);stroke-width:2.5}
  .tree g.kid circle,.tree g.kid rect{stroke:var(--max-line);stroke-dasharray:3 3}
  .tree g.done circle,.tree g.done rect{stroke:var(--accent);stroke-width:2.5}
  .tree g.float{opacity:.75}
  .tree g.float circle,.tree g.float rect{stroke-dasharray:4 3;fill:var(--code-bg)}
  .tree g.stale{opacity:.45}
  .tree g.stale circle,.tree g.stale rect{stroke-dasharray:4 3}
  .tree .emptytxt{font:13px system-ui,sans-serif;fill:var(--muted);text-anchor:middle}

  .strip{display:flex;gap:2px;margin-top:2px}
  .slot{flex:1 1 0;min-width:0;max-width:52px;text-align:center}
  .slot .bx{height:28px;display:flex;align-items:center;justify-content:center;border:1.5px solid var(--node-line);border-radius:5px;
    background:var(--node);font:600 12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden;white-space:nowrap;transition:background .25s,border-color .25s}
  .slot .ix{display:block;font:10px/1.3 ui-monospace,Menlo,Consolas,monospace;color:var(--muted)}
  .slot .bx.cmp{border-color:var(--cur-bar);background:var(--cur)}
  .slot .bx.new{border-color:var(--true);background:var(--true-soft);color:var(--true)}
  .slot .bx.moved{border-color:var(--true);border-style:dashed}
  .slot .bx.del{border-color:var(--false);background:var(--false-soft);color:var(--false)}
  .slot .bx.max{border-color:var(--max-line);background:var(--max)}
  .slot .bx.kid{border-color:var(--max-line);border-style:dashed}
  .slot .bx.done{border-color:var(--accent)}
  .slot .bx.stale{opacity:.45;border-style:dashed}
  .slot .bx.used{color:var(--muted);background:var(--code-bg);font-weight:400}
  .slot .bx.fin{border-color:var(--true);background:var(--true-soft);color:var(--true)}
  .slot .bx.emp{border-style:dashed;color:var(--muted);font-weight:400;background:transparent}
  .strip.bn .slot{max-width:72px}
  .strip.bn .bx{font-size:11px}
  .sublbl{font:600 11px system-ui,sans-serif;color:var(--muted);margin-top:4px}
  .vars{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;min-height:26px}
  .var{background:var(--code-bg);border:2px solid transparent;border-radius:7px;padding:1px 9px;font:12.5px ui-monospace,Menlo,Consolas,monospace;transition:all .25s}
  .var b{font-weight:700}
  .var.chg{border-color:var(--cur-bar);background:var(--cur)}
  .hidden{display:none !important}
  @media (prefers-reduced-motion: reduce){.tree g.nd{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <p class="lead" id="lead">Bấm <b>Bước tiếp</b> (<kbd>→</kbd>) để xem từng bước; nhập số rồi bấm <b>Thêm</b> hoặc <b>Xoá gốc</b> để tự thử.</p>
  <div class="controls">
    <div class="tabs" id="tabs" role="tablist" aria-label="Chọn ví dụ">
      <button class="tab" role="tab" data-vd="add">Thêm nút</button>
      <button class="tab" role="tab" data-vd="remove">Xoá gốc</button>
      <button class="tab" role="tab" data-vd="sort">Sắp xếp</button>
    </div>
    <div class="field" id="fOps">
      <label for="iv" id="ivl">Số</label><input type="text" id="iv" value="50" inputmode="numeric" autocomplete="off">
      <label for="ip" id="ipl" class="hidden">Ưu tiên</label><input type="text" id="ip" value="4" class="hidden" inputmode="numeric" autocomplete="off">
      <button class="btn op" id="opAdd">Thêm</button>
      <button class="btn op" id="opRem">Xoá gốc</button>
    </div>
    <div class="field hidden" id="fSort">
      <label for="isort">Mảng</label><input type="text" id="isort" class="wide" value="7 3 9 1 6 2 8 4" autocomplete="off">
      <button class="btn op" id="opSort">Sắp xếp</button>
    </div>
  </div>
  <div class="controls">
    <div class="btns">
      <button class="btn" id="next">Bước tiếp</button>
      <button class="btn ghost" id="prev">Lùi lại</button>
      <button class="btn ghost" id="all">Chạy hết</button>
      <button class="btn ghost" id="reset">Làm lại</button>
    </div>
    <div class="err" id="err" role="alert"></div>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="grid">
    <div class="card">
      <p class="panel-title" id="treeTitle">Heap dạng cây</p>
      <div class="tree" id="tree"></div>
      <div id="listWrap" class="hidden"><div class="sublbl">Mảng list (kết quả điền từ phải sang trái)</div><div class="strip" id="lstrip"></div></div>
      <div class="sublbl" id="arrTitle">Mảng list bên trong heap</div>
      <div class="strip" id="strip"></div>
      <div class="vars" id="vars"></div>
      <div class="sublbl">Kết quả</div>
      <div class="console" id="con"></div>
    </div>
    <div class="card"><p class="panel-title" id="codeTitle">Code</p><div class="code" id="code"></div></div>
  </div>
</div>
<script>
(function(){
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function qs(name){ var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }

//SIM-START
var CODES = {
  stAdd: { title: 'HeapAdd: phương thức add', lines: [
'static void add(int x) {',
'  list.add(x);',
'  int cur = list.size() - 1;',
'  while (cur > 0) {',
'    int parent = (cur - 1) / 2;',
'    if (list.get(cur) > list.get(parent)) {',
'      int t = list.get(cur);',
'      list.set(cur, list.get(parent));',
'      list.set(parent, t);',
'      cur = parent;',
'    } else {',
'      break;',
'    }',
'  }',
'}'], keys: {add:[1], cur:[2], cmp:[3,4,5], swap:[6,7,8,9], brk:[10,11], top:[3]} },
  stRem: { title: 'HeapRemove: phương thức remove', lines: [
'static int remove() {',
'  int root = list.get(0);',
'  int last = list.remove(list.size() - 1);',
'  if (list.isEmpty()) return root;',
'  list.set(0, last);',
'  int cur = 0;',
'  while (2 * cur + 1 < list.size()) {',
'    int max = 2 * cur + 1;',
'    int right = 2 * cur + 2;',
'    if (right < list.size()',
'        && list.get(right) > list.get(max))',
'      max = right;',
'    if (list.get(cur) >= list.get(max))',
'      break;',
'    int t = list.get(cur);',
'    list.set(cur, list.get(max));',
'    list.set(max, t);',
'    cur = max;',
'  }',
'  return root;',
'}'], keys: {root:[1], err:[1], last:[2], empty:[3], set:[4], cur:[5], pick:[6,7,8,9,10,11], stop:[6], brk:[12,13], swap:[12,14,15,16,17], ret:[19]} },
  bnAdd: { title: 'Heap.java: add (enqueue gọi)', lines: [
'public void add(E newObject) {',
'  list.add(newObject);',
'  int cur = list.size() - 1;',
'  while (cur > 0) {',
'    int parent = (cur - 1) / 2;',
'    if (list.get(cur).compareTo(',
'        list.get(parent)) > 0) {',
'      swap(cur, parent);',
'    } else {',
'      break;',
'    }',
'    cur = parent;',
'  }',
'}'], keys: {add:[1], cur:[2], cmp:[3,4,5,6], swap:[7,11], brk:[8,9], top:[3]} },
  bnRem: { title: 'Heap.java: remove (dequeue gọi)', lines: [
'public E remove() {',
'  if (list.size() == 0) return null;',
'  E removed = list.get(0);',
'  list.set(0,',
'      list.get(list.size() - 1));',
'  list.remove(list.size() - 1);',
'  int cur = 0;',
'  while (cur < list.size()) {',
'    int left = 2 * cur + 1;',
'    int right = 2 * cur + 2;',
'    if (left >= list.size()) break;',
'    int max = left;',
'    if (right < list.size()',
'        && list.get(max).compareTo(',
'        list.get(right)) < 0) {',
'      max = right;',
'    }',
'    if (list.get(cur).compareTo(',
'        list.get(max)) < 0) {',
'      swap(cur, max);',
'      cur = max;',
'    } else {',
'      break;',
'    }',
'  }',
'  return removed;',
'}'], keys: {empty:[1], root:[2], set:[3,4], pop:[5], cur:[6], pick:[7,8,9,10,11,12,13,14,15], leaf:[7,8,9,10], brk:[17,18,21,22], swap:[17,18,19,20], stop:[7], ret:[25]} },
  sort: { title: 'HeapSort: phương thức heapSort', lines: [
'public static <E extends Comparable<E>>',
'    void heapSort(E[] list) {',
'  Heap<E> heap = new Heap<>();',
'',
'  for (int i = 0; i < list.length; i++)',
'    heap.add(list[i]);',
'',
'  for (int i = list.length - 1; i >= 0; i--)',
'    list[i] = heap.remove();',
'}'], keys: {init:[2], add:[4,5], up:[5], rem:[7,8], down:[8], end:[9]} }
};

function lab(e){ return e.name ? e.name + ' ' + e.v : String(e.v); }
function jstr(e){ return e.name ? e.name + '(priority:' + e.v + ')' : String(e.v); }
function cmp(a, b){ return a.v - b.v; }   // compareTo: theo giá trị / mức ưu tiên
function listStr(A){ return '[' + A.map(jstr).join(', ') + ']'; }

// cfg: {variant: 'st' | 'bn', init: [{v, name?}], ops: [{t: 'add', e} | {t: 'rem'}]}
function simHeap(cfg){
  var bn = cfg.variant === 'bn', uid = 0;
  function mk(o){ return {id: 'e' + (uid++), v: o.v, name: o.name}; }
  var A = cfg.init.map(mk), S = [], out = [], opStart = [];
  function S_(code, key, title, body, o){
    o = o || {};
    var s = {code: code, key: key, title: title, body: body, arr: A.slice(), hl: o.hl || {}, edge: o.edge || null,
      flt: o.flt || null, extra: o.extra || null, vars: o.vars || [], chg: o.chg || [], out: out.slice()};
    S.push(s); return s;
  }
  var nmCur = 'cur';
  S_(bn ? 'bnAdd' : 'stAdd', null, bn ? 'Hàng đợi ưu tiên rỗng' : (A.length ? 'Heap ban đầu' : 'Heap rỗng'),
     A.length ? 'Heap có ' + A.length + ' phần tử, lưu trong mảng theo thứ tự từng tầng: con của vị trí i ở 2i + 1 và 2i + 2.' : 'Chưa có phần tử nào. Bấm <b>Bước tiếp</b> để bắt đầu.', {});
  cfg.ops.forEach(function(op){
    opStart.push(S.length);
    if (op.t === 'add') genAdd(mk(op.e)); else if (bn) genRemBn(); else genRemSt();
  });
  function H(pairs){ var h = {}; for (var i = 0; i < pairs.length; i += 2) if (pairs[i] !== null && pairs[i] >= 0) h[pairs[i]] = pairs[i + 1]; return h; }
  function word(e){ return bn ? '<b>' + esc(e.name) + '</b> (ưu tiên ' + e.v + ')' : '<b>' + e.v + '</b>'; }
  function genAdd(e){
    var K = bn ? 'bnAdd' : 'stAdd';
    A.push(e); var n = A.length - 1;
    S_(K, 'add', (bn ? 'enqueue: ' : '') + 'list.add(' + lab(e) + ')', 'Đặt ' + word(e) + ' vào cuối mảng, ở vị trí ' + n + '. Cây vẫn hoàn chỉnh vì nút mới là lá ngay sau lá cuối cùng.', {hl: H([n, 'new'])});
    var cur = n;
    S_(K, 'cur', 'cur = ' + n, 'Biến <code>cur</code> giữ vị trí của nút mới. Giờ cho nó "leo" lên khi còn lớn hơn cha.', {hl: H([n, 'new']), vars: [['cur', cur]], chg: ['cur']});
    while (true) {
      if (cur <= 0) {
        S_(K, 'top', 'cur = 0: dừng', 'Nút mới đã lên tới gốc, điều kiện <code>cur &gt; 0</code> sai nên vòng lặp kết thúc.', {hl: H([0, 'done']), vars: [['cur', 0]]});
        break;
      }
      var p = (cur - 1) >> 1, gt = cmp(A[cur], A[p]) > 0;
      S_(K, 'cmp', 'So sánh với cha', '<code>parent = (' + cur + ' - 1) / 2 = ' + p + '</code>. ' + word(A[cur]) + (gt ? ' lớn hơn ' : ' không lớn hơn ') + 'cha ' + word(A[p]) + (bn ? (gt ? ' (compareTo &gt; 0).' : ' (compareTo ≤ 0).') : '.'),
        {hl: H([cur, 'cmp', p, 'cmp']), edge: [p, cur], vars: [['cur', cur], ['parent', p]], chg: ['parent']});
      if (!gt) {
        S_(K, 'brk', 'break', word(A[cur]) + ' không lớn hơn cha nên dừng lại. Tính chất heap đã được khôi phục.', {hl: H([cur, 'done']), vars: [['cur', cur], ['parent', p]]});
        break;
      }
      var t = A[cur]; A[cur] = A[p]; A[p] = t;
      S_(K, 'swap', 'Đổi chỗ với cha', 'Đổi chỗ vị trí ' + cur + ' và ' + p + ', rồi <code>cur = ' + p + '</code>: nút mới lên một tầng.', {hl: H([p, 'new', cur, 'moved']), edge: [p, cur], vars: [['cur', p], ['parent', p]], chg: ['cur']});
      cur = p;
    }
  }
  function siftDown(K, vname){
    var cur = 0;
    while (true) {
      var l = 2 * cur + 1, r = l + 1;
      if (l >= A.length) {
        if (bn) S_(K, 'leaf', 'Không còn con', '<code>left = ' + l + '</code> không nhỏ hơn số phần tử (' + A.length + '): nút ở vị trí ' + cur + ' là lá, <code>break</code>.', {hl: H([cur, 'done']), vars: [[vname, cur], ['left', l]]});
        else S_(K, 'stop', 'Không còn con', '<code>2 * cur + 1 = ' + l + '</code> không nhỏ hơn số phần tử (' + A.length + '): nút ở vị trí ' + cur + ' là lá, vòng lặp dừng.', {hl: H([cur, 'done']), vars: [[vname, cur]]});
        return;
      }
      var mx = l;
      if (r < A.length && cmp(A[r], A[mx]) > 0) mx = r;
      var txt = r < A.length ? 'Hai con của ' + word(A[cur]) + ' là ' + word(A[l]) + ' (vị trí ' + l + ') và ' + word(A[r]) + ' (vị trí ' + r + '). Con lớn hơn: ' + word(A[mx]) + (cmp(A[l], A[r]) === 0 ? ' (bằng nhau thì giữ con trái)' : '') + '.'
        : word(A[cur]) + ' chỉ có con trái ' + word(A[l]) + ' (vị trí ' + l + ').';
      S_(K, 'pick', 'Chọn con lớn hơn', txt, {hl: H([cur, 'cmp', mx, 'max', (mx === l && r < A.length) ? r : (r < A.length ? l : -1), 'kid']), edge: [cur, mx], vars: [[vname, cur], ['max', mx]], chg: ['max']});
      if (cmp(A[cur], A[mx]) >= 0) {

  $('fSort').classList.toggle('hidden', !isSort);
  $('listWrap').classList.toggle('hidden', !isSort);
  $('arrTitle').textContent = isSort ? 'Mảng list bên trong heap' : (BN ? 'Mảng list bên trong heap (tên và mức ưu tiên)' : 'Mảng list bên trong heap');
  if (BN) {
    $('tabs').classList.add('hidden');
    $('ivl').textContent = 'Tên'; $('iv').value = 'Em'; $('iv').setAttribute('inputmode', 'text');
    $('ipl').classList.remove('hidden'); $('ip').classList.remove('hidden');
    $('opAdd').textContent = 'enqueue'; $('opRem').textContent = 'dequeue';
    $('treeTitle').textContent = 'Hàng đợi ưu tiên: heap dạng cây';
    $('strip').classList.add('bn');
    $('lead').innerHTML = 'Bấm <b>Bước tiếp</b> (<kbd>→</kbd>) để xem enqueue vun lên và dequeue vun xuống; nhập tên, mức ưu tiên rồi bấm <b>enqueue</b> để tự thử.';
  } else if (isSort) {
    $('lead').innerHTML = 'Bấm <b>Bước tiếp</b> (<kbd>→</kbd>): giai đoạn 1 thêm từng phần tử vào heap, giai đoạn 2 lấy gốc ra điền vào mảng từ phải sang trái.';
  } else {
    $('lead').innerHTML = 'Bấm <b>Bước tiếp</b> (<kbd>→</kbd>) để xem từng bước; nhập số rồi bấm <b>Thêm</b> hoặc <b>Xoá gốc</b> để tự thử.';
  }
}
initTree();
setup();
reset();
})();
</script>
</body>
</html>
