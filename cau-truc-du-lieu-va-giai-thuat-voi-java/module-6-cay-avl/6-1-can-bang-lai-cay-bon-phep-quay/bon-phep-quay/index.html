<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="580">
<title>Bốn phép quay AVL</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c; --cmt:#6b7280;
    --node:#ffffff; --node-line:#9aa3b2; --edge:#9aa3b2;
    --run:#e3f4e8; --run-bar:#15803d;
    --path:#dbe7ff; --path-line:#2563eb;
    --orange:#c2410c; --orange-soft:#ffedd5;
    --g1:#e0f2fe; --g2:#fef3c7; --g3:#ede9fe; --g4:#dcfce7;
    --g1l:#0369a1; --g2l:#a16207; --g3l:#6d28d9; --g4l:#15803d;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74; --cmt:#8b93a1;
      --node:#1d222c; --node-line:#5b6474; --edge:#5b6474;
      --run:#13301f; --run-bar:#4ade80;
      --path:#1e2a44; --path-line:#6ea0ff;
      --orange:#fdba74; --orange-soft:#3b2412;
      --g1:#0c2a3d; --g2:#3a2e0b; --g3:#2a1f45; --g4:#123321;
      --g1l:#7dd3fc; --g2l:#fcd34d; --g3l:#c4b5fd; --g4l:#86efac;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:10px 12px 12px}
  .lead{color:var(--muted);margin:0 0 8px;font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .controls{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;margin-bottom:8px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  .tab{border:1px solid var(--line);background:var(--card);color:var(--text);padding:5px 10px;
    border-radius:8px;cursor:pointer;font:inherit;font-size:13.5px}
  .tab[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .field{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .field label{font-weight:600;font-size:13.5px}
  .field input[type=text]{width:72px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;
    background:var(--card);color:var(--text);font:14px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .field input.wide{width:190px}
  .field input.bad{border-color:var(--false);background:var(--false-soft)}
  .chips{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
  .chip{border:1px dashed var(--node-line);background:transparent;color:var(--text);padding:2px 9px;
    border-radius:999px;cursor:pointer;font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .chip:hover,.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
  .chip[aria-pressed="true"]{border-style:solid;background:var(--accent-soft)}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:5px 11px;border-radius:8px;
    cursor:pointer;font:inherit;font-weight:600;font-size:13.5px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .err{color:var(--false);font-size:12.5px}
  .err:empty{display:none}
  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
    padding:5px 12px;margin-bottom:8px;min-height:50px;font-size:13.5px}
  .status>b{display:block;font-size:12.5px;color:var(--accent)}
  .status code,.status .m{font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .grid>*{min-width:0}
  .col{display:flex;flex-direction:column;gap:8px;min-width:0}
  @media (max-width:600px){.grid{grid-template-columns:1fr}}
  #codeTitle{text-transform:none;letter-spacing:0;font-family:ui-monospace,Menlo,Consolas,monospace}
  .panel-title{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
  .code{background:var(--code-bg);border-radius:8px;padding:6px 0;overflow:auto;position:relative;
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 10px 0 0;border-left:3px solid transparent;transition:background .2s}
  .ln .no{width:28px;flex:none;text-align:right;padding-right:10px;color:var(--muted);opacity:.6;user-select:none}
  .ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
  .ln.skip{opacity:.35}
  .card.codecard{display:flex;flex-direction:column}
  .card.codecard .code{flex:1 1 0;height:0;min-height:230px}
  @media (max-width:600px){.card.codecard .code{flex:none;height:auto;max-height:270px}}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--cmt);font-style:italic}
  .console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:6px 10px;min-height:44px;white-space:pre-wrap;word-break:break-word;
    font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:auto}
  .console .ph{color:#7b8494;font-family:system-ui,sans-serif}
  .console .new{color:#fde68a}
  .vars{display:flex;gap:6px;flex-wrap:wrap}
  .var{background:var(--code-bg);border:2px solid transparent;border-radius:8px;padding:1px 10px;min-width:62px;text-align:center}
  .var small{display:block;color:var(--muted);font:11.5px ui-monospace,Menlo,Consolas,monospace}
  .var strong{font:700 15px ui-monospace,Menlo,Consolas,monospace;display:block;min-height:21px}
  .var.chg{border-color:var(--cur-bar);background:var(--cur)}
  kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px}
  .tree svg{display:block;width:100%;height:auto;overflow:visible}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:2px}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid var(--node-line);vertical-align:-1px;margin-right:4px}
  .legend i.cur{background:var(--cur);border-color:var(--cur-bar)}
  .legend i.path{background:var(--path);border-color:var(--path-line)}
  .legend i.bad{background:var(--false-soft);border-color:var(--false)}
  .legend i.ok{background:var(--true-soft);border-color:var(--true)}
  .legend i.rm{background:var(--orange-soft);border-color:var(--orange)}
  /* tree svg */
  .tv .e{stroke:var(--edge);stroke-width:1.6;fill:none}
  .tv .e.chg{stroke:var(--cur-bar);stroke-width:2.6}
  .tv .e.on{stroke:var(--path-line);stroke-width:2.4}
  .tv .e.bad{stroke:var(--false);stroke-width:2.4;stroke-dasharray:5 3}
  .tv .ah{fill:var(--edge)}
  .tv .el{font:600 10px ui-monospace,Menlo,Consolas,monospace;fill:var(--muted)}
  .tv .nd circle{fill:var(--node);stroke:var(--node-line);stroke-width:1.8}
  .tv .nd text.v{fill:var(--text);font-weight:700;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;text-anchor:middle;dominant-baseline:central}
  .tv .nd.cur circle{fill:var(--cur);stroke:var(--cur-bar);stroke-width:2.6}
  .tv .nd.path circle{fill:var(--path);stroke:var(--path-line)}
  .tv .nd.ok circle{fill:var(--true-soft);stroke:var(--true);stroke-width:2.4}
  .tv .nd.bad circle{fill:var(--false-soft);stroke:var(--false);stroke-width:2.6}
  .tv .nd.rm circle{fill:var(--orange-soft);stroke:var(--orange);stroke-width:2.4}
  .tv .nd.par circle{stroke:var(--accent);stroke-width:2.6;stroke-dasharray:4 2}
  .tv .nd.gone{opacity:.38}
  .tv .nd.gone circle{stroke-dasharray:3 3}
  .tv .nd.g1 circle{fill:var(--g1);stroke:var(--g1l)} .tv .nd.g2 circle{fill:var(--g2);stroke:var(--g2l)}
  .tv .nd.g3 circle{fill:var(--g3);stroke:var(--g3l)} .tv .nd.g4 circle{fill:var(--g4);stroke:var(--g4l)}
  .tv .tag rect{fill:var(--accent)} .tv .tag text{fill:#fff;font:600 10.5px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
  .tv .tag.alt rect{fill:var(--orange)}
  .tv .tl{font:700 11px system-ui,sans-serif;text-anchor:end;dominant-baseline:central}
  .tv .tl.g1{fill:var(--g1l)} .tv .tl.g2{fill:var(--g2l)} .tv .tl.g3{fill:var(--g3l)} .tv .tl.g4{fill:var(--g4l)}
  .tv .bd{font:600 10px ui-monospace,Menlo,Consolas,monospace;fill:var(--muted)}
  .tv .bd.bf{fill:var(--accent)} .tv .bd.bf.bad{fill:var(--false);font-weight:800}
  .tv .bd.chg{fill:var(--orange);font-weight:800}
  .tv .ghost circle{fill:none;stroke:var(--node-line);stroke-dasharray:3 3;stroke-width:1.5}
  .tv .ghost text{fill:var(--muted);font:600 10px ui-monospace,Menlo,monospace;text-anchor:middle;dominant-baseline:central}
  .tv .rootlbl{font:600 11px ui-monospace,Menlo,Consolas,monospace;fill:var(--muted)}
  .tv .empty{fill:var(--muted);font:16px system-ui,sans-serif;text-anchor:middle}
  .tbl{width:100%;border-collapse:collapse;font:12.5px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .tbl th{font:600 11px system-ui,sans-serif;color:var(--muted);text-align:left;padding:2px 6px;border-bottom:1px solid var(--line)}
  .tbl td{padding:1px 6px;border-bottom:1px solid var(--line)}

  .grid{grid-template-columns:1.1fr 1fr}
  @media (max-width:600px){.grid{grid-template-columns:1fr}}
  #con{max-height:80px}

</style>
</head>
<body>
<div class="wrap">
  <p class="lead" id="lead"></p>
  <div class="controls" id="ctl"></div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
</div>
<script>
(function(){
// ===== core.js: tiện ích giao diện dùng chung =====
var $ = function(id){ return document.getElementById(id); };
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function qs(name){ var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }
function hl(src){
  var re = /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\/\/.*$|\/\*\*.*\*\/)|(@Override)|\b(import|public|private|protected|class|static|void|int|char|boolean|String|if|else|switch|case|break|default|return|for|while|new|true|false|null|extends|implements|throws|this)\b|(\b\d+\b)/g, out = '', last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
    else if (m[2]) out += '<span class="cm">' + esc(m[2]) + '</span>';
    else if (m[3]) out += '<span class="cm">' + m[3] + '</span>';
    else if (m[4]) out += '<span class="kw">' + m[4] + '</span>';
    else out += '<span class="num">' + m[5] + '</span>';
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function codeHtml(lines, cur){
  var a = cur == null ? -1 : (Array.isArray(cur) ? cur[0] : cur);
  var b = cur == null ? -1 : (Array.isArray(cur) ? cur[1] : cur);
  return lines.map(function(l, i){
    return '<div class="ln' + (i >= a && i <= b ? ' cur' : '') + '"><span class="no">' + (i + 1) + '</span><span>' + hl(l) + '</span></div>';
  }).join('');
}
function scrollToCur(box){
  var el = box.querySelector('.ln.cur'); if (!el) return;
  if (box.scrollHeight <= box.clientHeight + 2) return;
  var top = el.offsetTop - box.clientHeight / 2 + el.offsetHeight / 2;
  box.scrollTop = Math.max(0, top);
}
// Tìm chỉ số dòng chứa chuỗi s (lần xuất hiện thứ nth, mặc định 1)
function lineOf(lines, s, nth){
  nth = nth || 1;
  for (var i = 0; i < lines.length; i++) if (lines[i].indexOf(s) >= 0 && --nth === 0) return i;
  throw new Error('Không thấy dòng: ' + s);
}
function parseIntIn(s, lo, hi){ s = String(s).trim(); if (!/^-?\d+$/.test(s)) return null; var v = parseInt(s, 10); return v < lo || v > hi ? null : v; }
// Dãy số nguyên cách nhau bởi dấu cách/phẩy; trả null nếu sai
function parseList(s, lo, hi, maxLen){
  var parts = String(s).trim().split(/[\s,;]+/).filter(function(x){ return x !== ''; });
  if (!parts.length || parts.length > maxLen) return null;
  var out = [];
  for (var i = 0; i < parts.length; i++) { var v = parseIntIn(parts[i], lo, hi); if (v === null) return null; out.push(v); }
  return out;
}
var reduceMotion = typeof window !== 'undefined' && window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

// Stepper: cfg = {build: () => steps, render: (step, i, n) => void, speed}
function Stepper(cfg){
  var snaps = [], step = 0, timer = null;
  function stop(){ if (timer) { clearInterval(timer); timer = null; } }
  function draw(){
    var sn = snaps[step];
    $('status').innerHTML = '<b>Bước ' + (step + 1) + '/' + snaps.length + ' · ' + esc(sn.title) + '</b><span>' + (sn.body || '') + '</span>';
    cfg.render(sn, step, snaps.length);
    var run = timer !== null;
    $('next').disabled = step >= snaps.length - 1 || run;
    $('prev').disabled = step <= 0 || run;
    $('all').disabled = run || step >= snaps.length - 1;
  }
  var jump = parseInt(qs('buoc'), 10);
  function load(list, keepEnd){
    stop(); snaps = list; step = keepEnd ? Math.min(keepEnd, snaps.length - 1) : 0;
    if (jump > 0) {
      step = Math.min(jump - 1, snaps.length - 1); jump = 0;
      // dựng lần lượt các bước trước (không hoạt cảnh) để vị trí nút giống như khi bấm từng bước
      if (typeof TreeView !== 'undefined') { TreeView.instant = true; for (var i = 0; i < step; i++) cfg.render(snaps[i], i, snaps.length); TreeView.instant = false; }
    }
    draw();
  }
  function reset(){ load(cfg.build()); }
  function next(){ if (step < snaps.length - 1) { step++; draw(); } }
  function prev(){ if (step > 0) { step--; draw(); } }
  $('next').addEventListener('click', next);
  $('prev').addEventListener('click', prev);
  $('reset').addEventListener('click', function(){ if (cfg.onReset) cfg.onReset(); reset(); });
  $('all').addEventListener('click', function(){
    if (timer) return;
    timer = setInterval(function(){ if (step >= snaps.length - 1) { stop(); draw(); return; } step++; draw(); }, cfg.speed || 650);
    draw();
  });
  document.addEventListener('keydown', function(e){
    var t = e.target && e.target.tagName;
    if (t === 'INPUT' || t === 'TEXTAREA' || timer) return;
    if (e.key === 'ArrowRight') { next(); e.preventDefault(); }
    else if (e.key === 'ArrowLeft') { prev(); e.preventDefault(); }
  });
  return {reset: reset, load: load, cur: function(){ return snaps[step]; }, index: function(){ return step; }, count: function(){ return snaps.length; }};
}
function varsHtml(list){
  return list.map(function(v){
    return '<div class="var' + (v[2] ? ' chg' : '') + '"><small>' + esc(v[0]) + '</small><strong>' + esc(v[1] == null ? 'null' : v[1]) + '</strong></div>';
  }).join('');
}
function consoleHtml(out, prevLen, ph){
  if (!out) return '<span class="ph">' + esc(ph || 'Chưa có gì được in ra.') + '</span>';
  prevLen = Math.min(prevLen || 0, out.length);
  return esc(out.slice(0, prevLen)) + '<span class="new">' + esc(out.slice(prevLen)) + '</span>';
}

// ===== tree.js: mô hình nút liên kết + bố cục + bộ vẽ cây SVG =====
// Mỗi nút: {el, l, r, h}; l/r là id nút con (hoặc null). Cây: {root, n: {id: nút}}.
function TreeM(){ this.n = {}; this.root = null; this.seq = 0; }
TreeM.prototype.mk = function(el){ var id = ++this.seq; this.n[id] = {el: el, l: null, r: null, h: 0}; return id; };
TreeM.prototype.snap = function(){
  var c = {};
  for (var k in this.n) { var o = this.n[k], d = {}; for (var f in o) d[f] = o[f]; c[k] = d; }
  return {root: this.root, n: c};
};
TreeM.prototype.clone = function(){ var t = new TreeM(), s = this.snap(); t.n = s.n; t.root = s.root; t.seq = this.seq; return t; };
TreeM.prototype.el = function(id){ return id == null ? null : this.n[id].el; };
TreeM.prototype.drop = function(id){ delete this.n[id]; };
TreeM.prototype.pre = function(){ var out = [], n = this.n; (function go(id){ if (id == null) return; out.push(n[id].el); go(n[id].l); go(n[id].r); })(this.root); return out; };
TreeM.prototype.ino = function(){ var out = [], n = this.n; (function go(id){ if (id == null) return; go(n[id].l); out.push(n[id].el); go(n[id].r); })(this.root); return out; };
TreeM.prototype.size = function(){ return Object.keys(this.n).length; };
// Chiều cao tính lại từ cấu trúc (lá = 0, cây rỗng = -1)
function heightOfSub(n, id){ return id == null ? -1 : 1 + Math.max(heightOfSub(n, n[id].l), heightOfSub(n, n[id].r)); }

// Bố cục theo thứ tự trung tố; trả null nếu đồ thị con trỏ không phải một rừng hợp lệ chứa mọi nút
function layoutForest(snap, roots, W, H, L){
  var n = snap.n, ids = Object.keys(n), seen = {}, rank = {}, depth = {}, r = 0, maxD = 0, ok = true;
  roots.forEach(function(root, ti){
    if (root == null) return;
    if (ti > 0) r += L.gap == null ? 0.7 : L.gap;
    (function go(id, d){
      if (!ok) return;
      if (seen[id]) { ok = false; return; }
      seen[id] = 1;
      var o = n[id];
      if (o.l != null) go(o.l, d + 1);
      rank[id] = r++; depth[id] = d; if (d > maxD) maxD = d;
      if (o.r != null) go(o.r, d + 1);
    })(root, 0);
  });
  if (!ok || Object.keys(seen).length !== ids.length) return null;
  var span = Math.max(r - 1, 1);
  var slot = Math.min(L.maxSlot || 56, (W - 2 * L.padX) / span);
  var dy = maxD ? Math.min(L.maxDy || 62, (H - L.top - L.bottom) / maxD) : 0;
  var x0 = (W - (r - 1) * slot) / 2, pos = {};
  ids.forEach(function(id){ pos[id] = {x: x0 + rank[id] * slot, y: L.top + depth[id] * dy}; });
  pos._slot = slot; pos._dy = dy || (L.maxDy || 62);
  return pos;
}

var SVGNS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, parent){
  var e = document.createElementNS(SVGNS, tag);
  for (var k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
// TreeView(container, {W, H, padX, top, bottom, maxSlot, maxDy, maxR, arrows, badges})
function TreeView(box, opt){
  this.o = opt; this.W = opt.W; this.H = opt.H;
  this.svg = svgEl('svg', {viewBox: '0 0 ' + opt.W + ' ' + opt.H, 'class': 'tv', role: 'img', 'aria-label': opt.label || 'Hình cây'}, null);
  box.appendChild(this.svg);
  var defs = svgEl('defs', {}, this.svg);
  var mk = svgEl('marker', {id: 'ah' + (TreeView.k = (TreeView.k || 0) + 1), viewBox: '0 0 10 10', refX: 9, refY: 5, markerWidth: 6, markerHeight: 6, orient: 'auto-start-reverse'}, defs);
  svgEl('path', {d: 'M0,0 L10,5 L0,10 z', 'class': 'ah'}, mk);
  this.mid = mk.getAttribute('id');
  this.gE = svgEl('g', {}, this.svg); this.gX = svgEl('g', {}, this.svg); this.gN = svgEl('g', {}, this.svg);
  this.cur = {}; this.valid = null; this.r = opt.maxR || 17; this.slot = 50; this.dy = 56; this.anim = null;
}
TreeView.prototype.draw = function(snap, o){
  o = o || {};
  var self = this, n = snap.n, ids = Object.keys(n), opt = this.o;
  var roots = o.roots || [snap.root];
  var target = o.pos || layoutForest(snap, roots, this.W, this.H, opt);
  if (target) {
    this.valid = target; this.slot = target._slot; this.dy = target._dy;
    this.r = Math.max(9, Math.min(opt.maxR || 17, this.slot * (opt.rk || 0.4), this.dy * 0.42));

        run: function(t, v){ var A = v.A, B = v.B, C = v.C; if (lr) { t.n[B].r = t.n[C].l; t.n[C].l = B; t.n[A].l = C; } else { t.n[B].l = t.n[C].r; t.n[C].r = B; t.n[A].r = C; } return {hl: mapOf([C], 'cur'), edge: lr ? merge(E(A, 'l'), E(C, 'l'), E(B, 'r')) : merge(E(A, 'r'), E(C, 'r'), E(B, 'l'))}; }},
      {ln: lr ? [0, 5] : [7, 12], title: 'Lần quay 2: ' + (lr ? 'quay phải tại A' : 'quay trái tại A'), badges: true,
        body: lr ? 'Gọi <code>rotateRight</code> với A: C lên làm gốc, A thành con phải của C. T3 chuyển sang làm con trái của A.' : 'Gọi <code>rotateLeft</code> với A: C lên làm gốc, A thành con trái của C. T2 chuyển sang làm con phải của A.',
        run: function(t, v){ var A = v.A, C = v.C; if (lr) { t.n[A].l = t.n[C].r; t.n[C].r = A; } else { t.n[A].r = t.n[C].l; t.n[C].l = A; } t.root = C; return {hl: mapOf([C], 'ok'), edge: lr ? merge(E(A, 'l'), E(C, 'r')) : merge(E(A, 'r'), E(C, 'l'))}; }},
      {ln: null, title: 'Kết quả', badges: true, body: 'C là gốc mới, A và B là hai con của C. Duyệt trung thứ tự không đổi; mọi nút đều cân bằng.', run: function(){ return {}; }}
    ]};
}
SC.lr = dbl('LR', [50, 20, 60, 10, 30, 25, 40], 50, [[10, 1], [25, 2], [40, 3], [60, 4]], 'A = 50 có hệ số -2, con trái B = 20 có hệ số +1: lệch trái rồi lệch phải. C = 30 là con phải của B. Bốn cây con T1 (10), T2 (25), T3 (40), T4 (60).');
SC.lrsmall = dbl('LR', [25, 5, 20], 25, [], 'A = 25 có hệ số -2, con trái B = 5 có hệ số +1, C = 20 là con phải của B (cây của chương trình).');
SC.rl = dbl('RL', [10, 5, 40, 20, 50, 15, 30], 10, [[5, 1], [15, 2], [30, 3], [50, 4]], 'A = 10 có hệ số +2, con phải B = 40 có hệ số -1: lệch phải rồi lệch trái. C = 20 là con trái của B. Bốn cây con T1 (5), T2 (15), T3 (30), T4 (50).');
// ---------- [6-15] balanceLL với chiều cao ----------
function llDemo(atRoot){
  return {code: LLDEMO, title: 'balanceLL (BalanceLLDemo)', rootLabel: 'root',
    tree: function(){
      var t = atRoot ? buildBST([30, 20, 10]) : buildBST([50, 30, 70, 20, 10]);
      var hs = atRoot ? {30: 2, 20: 1, 10: 0} : {50: 3, 30: 2, 20: 1, 10: 0, 70: 0};
      for (var k in t.n) t.n[k].h = hs[t.n[k].el];
      return t;
    },
    vars: function(t){ return {A: idOf(t, 30), B: null, parentOfA: atRoot ? null : idOf(t, 50)}; }, tagVars: ['A', 'B', 'parentOfA'],
    out0: function(t){ return atRoot ? '' : pre(t) + '\n'; },
    startTitle: atRoot ? 'A là gốc' : 'Trước khi quay', startBody: atRoot ? 'Cây 30, 20, 10: A = 30 là gốc, <code>parentOfA</code> là <code>null</code>.' : 'A = 30 là con trái của gốc 50, mất cân bằng LL. Chiều cao ghi cạnh mỗi nút (giá trị đang lưu trong trường <code>height</code>).',
    steps: [
      {ln: 2, title: 'Gọi B là con trái của A', body: '<code>B = A.left</code>: B là nút 20.', run: function(t, v){ v.B = t.n[v.A].l; return {hl: mapOf([v.B], 'cur')}; }},
      {ln: 3, title: 'A có phải gốc không?', body: function(t, v){ return '<code>A == root</code> ' + (atRoot ? 'đúng.' : 'sai: gốc là 50.'); }, run: function(){ return {}; }},
      atRoot ? {ln: 4, title: 'B thành gốc', body: '<code>root = B</code>: B lên thay A. A tạm thời nằm ngoài cây nhưng vẫn trỏ tới B.', run: function(t, v){ t.root = v.B; return {gone: mapOf([v.A], true)}; }}
             : {ln: 5, title: 'A là con trái của parentOfA?', body: '<code>parentOfA.left == A</code> đúng: 30 là con trái của 50.', run: function(){ return {}; }},
      atRoot ? null : {ln: 6, title: 'Nối B vào chỗ của A', body: '<code>parentOfA.left = B</code>: 50 trỏ thẳng tới 20. A chưa xuống: nó tạm thời nằm ngoài cây, vẫn trỏ tới B.', run: function(t, v){ t.n[v.parentOfA].l = v.B; return {edge: E(v.parentOfA, 'l'), gone: mapOf([v.A], true)}; }},
      {ln: 10, title: 'T2 sang A', body: '<code>A.left = B.right</code>: B không có con phải nên A.left thành <code>null</code>.', run: function(t, v){ t.n[v.A].l = t.n[v.B].r; return {gone: mapOf([v.A], true)}; }},
      {ln: 11, title: 'Đưa A xuống', body: '<code>B.right = A</code>: A thành con phải của B. Cây lại liền một khối. Chú ý chiều cao đang lưu của A và B vẫn là giá trị cũ.', run: function(t, v){ t.n[v.B].r = v.A; return {edge: E(v.B, 'r')}; }},
      {ln: 12, title: 'Cập nhật chiều cao của A', body: function(t, v){ return '<code>updateHeight(A)</code>: A giờ là lá, h = ' + t.n[v.A].h + '.'; }, run: function(t, v){ updH(t, v.A); return {hchg: H(v.A), hl: mapOf([v.A], 'cur')}; }},
      {ln: 13, title: 'Cập nhật chiều cao của B', body: function(t, v){ return '<code>updateHeight(B)</code>: B tính từ hai con 10 và 30 (đã đúng), h = ' + t.n[v.B].h + '.'; }, run: function(t, v){ updH(t, v.B); return {hchg: H(v.B), hl: mapOf([v.B], 'cur')}; }},
      atRoot ? null : {ln: 18, title: 'Cập nhật gốc trong main', body: '<code>updateHeight(root)</code>: gốc 50 thấp đi, h = 2. Chương trình in dòng thứ hai.', run: function(t, v){ var r = t.root; updH(t, r); return {hchg: H(r), hl: mapOf([r], 'ok'), out: pre(t) + '\n'}; }}
    ].filter(Boolean)};
}
function pre(t){ var o = []; (function go(id){ if (id == null) return; o.push(t.n[id].el + '(h=' + t.n[id].h + ') '); go(t.n[id].l); go(t.n[id].r); })(t.root); return o.join(''); }
SC['code-ll'] = llDemo(false);
SC['code-ll-goc'] = llDemo(true);
// ---------- [6-17] balanceLR (BalanceLRDemo) ----------
function lrDemo(wrong){
  var steps = [
    {k: 'B', ln: 2, title: 'Gọi B = A.left', body: 'B là nút 20.', run: function(t, v){ v.B = t.n[v.A].l; return {hl: mapOf([v.B], 'cur')}; }},
    {k: 'C', ln: 3, title: 'Gọi C = B.right', body: 'C là nút 30.', run: function(t, v){ v.C = t.n[v.B].r; return {hl: mapOf([v.C], 'cur')}; }},
    {k: 'root', ln: [4, 5], title: 'A là gốc: C thành gốc', body: '<code>A == root</code> đúng nên <code>root = C</code>. A tạm thời nằm ngoài cây.', run: function(t, v){ t.root = v.C; return {gone: mapOf([v.A], true), hl: mapOf([v.C], 'cur')}; }},
    {k: 'Aleft', title: 'T3 sang A', run: function(t, v){ t.n[v.A].l = t.n[v.C].r; return {edge: E(v.A, 'l'), gone: wrong ? null : mapOf([v.A], true)}; }},
    {k: 'Bright', title: 'T2 sang B', run: function(t, v){ var x = t.n[v.C].l; t.n[v.B].r = x; return {edge: x === v.B ? {} : E(v.B, 'r'), hl: x === v.B ? mapOf([v.B], 'bad') : null, gone: wrong ? mapOf([idOf(t, 25)], true) : mapOf([v.A], true)}; }},
    {k: 'Cleft', title: 'B thành con trái của C', run: function(t, v){ t.n[v.C].l = v.B; return {edge: E(v.C, 'l'), gone: wrong ? mapOf([v.A, idOf(t, 25)], true) : mapOf([v.A], true)}; }},
    {k: 'Cright', title: 'A thành con phải của C', run: function(t, v){ t.n[v.C].r = v.A; return {edge: E(v.C, 'r'), hl: wrong ? mapOf([v.B], 'bad') : mapOf([v.C], 'ok'), gone: wrong ? mapOf([idOf(t, 25)], true) : null}; }}
  ];
  var by = {}; steps.forEach(function(s){ by[s.k] = s; });
  var code = wrong ? LRWRONG : LRDEMO;
  by.Aleft.ln = lineOf(code, 'A.left = C.right'); by.Bright.ln = lineOf(code, 'B.right = C.left'); by.Cleft.ln = lineOf(code, 'C.left = B'); by.Cright.ln = lineOf(code, 'C.right = A');
  by.Aleft.body = '<code>A.left = C.right</code>: C không có con phải (T3 rỗng) nên A.left thành <code>null</code>.';
  if (!wrong) {
    by.Bright.body = '<code>B.right = C.left</code>: cây con T2 (25) chuyển sang làm con phải của B.';
    by.Cleft.body = '<code>C.left = B</code>: B thành con trái của C. Lệnh này chạy sau hai lệnh trên, khi <code>C.left</code> cũ đã được dùng xong.';
    by.Cright.body = '<code>C.right = A</code>: A thành con phải của C. Cây đã cân bằng: tiền thứ tự 30 20 10 25 50 60, khớp output của chương trình.';
  } else {
    by.Cleft.body = '<code>C.left = B</code> chạy <b>trước</b>: giá trị cũ của <code>C.left</code> (nút 25, tức T2) bị ghi đè. Không còn biến nào trỏ tới 25.';
    by.Aleft.body = '<code>A.left = C.right</code>: C chưa có con phải nên A.left thành <code>null</code>.';
    by.Bright.body = '<code>B.right = C.left</code>: nhưng <code>C.left</code> giờ là B, nên B.right trỏ vào <b>chính B</b>: một vòng lặp! Còn 25 đã bị mất.';
    by.Cright.body = '<code>C.right = A</code>. Kết quả sai: nút 25 biến mất khỏi cây và B tự trỏ vào mình, duyệt cây sẽ lặp vô hạn. Vì vậy hai lệnh chuyển T2, T3 phải chạy trước.';
  }
  var order = wrong ? ['B', 'C', 'root', 'Cleft', 'Aleft', 'Bright', 'Cright'] : ['B', 'C', 'root', 'Aleft', 'Bright', 'Cleft', 'Cright'];
  return {code: code, title: 'balanceLR (BalanceLRDemo)', rootLabel: 'root',
    tree: function(){ return buildBST([50, 20, 60, 10, 30, 25]); }, T: [[10, 1], [25, 2], [60, 4]],
    vars: function(t){ return {A: idOf(t, 50), B: null, C: null}; }, tagVars: ['A', 'B', 'C'],
    out0: function(t){ return 'Truoc: ' + t.pre().join(' ') + ' \n'; },
    startTitle: wrong ? 'Thứ tự lệnh bị đổi' : 'Trước khi quay', startBody: wrong ? 'Thử chạy <code>C.left = B</code> trước hai lệnh chuyển T2, T3 để xem điều gì xảy ra.' : 'Mất cân bằng LR tại gốc 50: B = 20 lệch phải, C = 30. T1 (10), T2 (25), T4 (60); T3 rỗng.',
    steps: order.map(function(k){ return by[k]; }).concat(wrong ? [] : [{ln: null, title: 'In kết quả', body: 'Chương trình in cây sau khi quay theo tiền thứ tự.', run: function(t){ return {out: 'Sau:   ' + t.pre().join(' ') + ' \n'}; }}])};
}
SC['code-lr'] = lrDemo(false);
SC['code-lr-sai'] = lrDemo(true);

// ---------- giao diện ----------
var GROUPS = {
  don: {tabs: [['ll', 'LL'], ['rr', 'RR']], lead: 'Chọn LL hoặc RR rồi bấm <b>Bước tiếp</b> (<kbd>→</kbd>): mỗi lệnh gán đổi một liên kết; T1, T2, T3 là các cây con thật.'},
  kep: {tabs: [['lr', 'LR'], ['lrsmall', 'LR: cây 25, 5, 20'], ['rl', 'RL']], lead: 'Bấm <b>Bước tiếp</b> (<kbd>→</kbd>): cây gấp khúc → sau lần quay đơn thứ nhất (thẳng hàng) → sau lần quay thứ hai.'},
  codell: {tabs: [['code-ll', 'A là con trái của 50'], ['code-ll-goc', 'A là gốc']], lead: 'Bấm <b>Bước tiếp</b> (<kbd>→</kbd>) để chạy từng lệnh của <code>balanceLL</code>; chiều cao đang lưu ghi cạnh mỗi nút.'},
  codelr: {tabs: [['code-lr', 'Đúng thứ tự'], ['code-lr-sai', 'Gán C.left trước']], lead: 'Bấm <b>Bước tiếp</b> (<kbd>→</kbd>) để chạy từng lệnh gán của <code>balanceLR</code>; thử đổi thứ tự lệnh để thấy hậu quả.'}
};
var groupOf = {ll: 'don', rr: 'don', lr: 'kep', lrsmall: 'kep', rl: 'kep', 'code-ll': 'codell', 'code-ll-goc': 'codell', 'code-lr': 'codelr', 'code-lr-sai': 'codelr'};
var cur = SC[VD] ? VD : 'll', grp = GROUPS[groupOf[cur]];
$('lead').innerHTML = grp.lead;
$('ctl').innerHTML = '<div class="tabs" role="tablist">' + grp.tabs.map(function(k){ return '<button class="tab" role="tab" data-k="' + k[0] + '">' + esc(k[1]) + '</button>'; }).join('') + '</div>' + BTN;
var hasOut = cur.indexOf('code-') === 0;
$('grid').innerHTML = '<div class="col"><div class="card"><p class="panel-title">Cây</p><div class="tree" id="tree"></div><div class="legend" id="leg"></div></div>' +
  '<div class="card"><p class="panel-title">Biến</p><div class="vars" id="vars"></div></div>' + (hasOut ? '<div class="card"><p class="panel-title">Output</p><div class="console" id="con"></div></div>' : '') + '</div>' +
  '<div class="card codecard"><p class="panel-title" id="codeTitle"></p><div class="code" id="code"></div></div>';
var tv = new TreeView($('tree'), {W: 440, H: hasOut ? 200 : 240, padX: 30, top: 32, bottom: 22, maxSlot: 58, maxDy: 56, maxR: 17, arrows: true, label: 'Cây trước và sau phép quay'});
var stepper = Stepper({build: function(){ return runScenario(SC[cur]); }, render: function(st){
  var sc = SC[cur];
  var showB = sc.code === LLDEMO || (st.badgesOn && sc.hStruct);
  tv.draw(st.snap, {hl: st.hl, tags: st.tags, edgeHl: st.edgeHl, gone: st.gone, groups: st.groups, tlabels: st.tlabels, rootLabel: st.rootLabel,
    badges: showB ? function(nd, id){
      if (sc.code === LLDEMO) return [{t: 'h' + nd.h, cls: st.hchg && st.hchg[id] ? 'chg' : ''}];
      var n = st.snap.n, h = function(x){ return x == null ? -1 : n[x].h; }, b = h(nd.r) - h(nd.l);
      return [{t: 'h' + nd.h}, {t: (b > 0 ? '+' : '') + b, cls: 'bf' + (Math.abs(b) >= 2 ? ' bad' : '')}];
    } : null});
  $('codeTitle').textContent = sc.title;
  $('code').innerHTML = codeHtml(sc.code, st.ln); scrollToCur($('code'));
  $('vars').innerHTML = varsHtml(st.vars);
  if ($('con')) $('con').innerHTML = consoleHtml(st.out, st.prevOut);
  var hasT = st.tlabels && Object.keys(st.tlabels).length;
  $('leg').innerHTML = '<span>' + (hasT ? 'Màu nền: cây con T1–T4 · ' : '') + 'mũi tên: left / right · ' + (sc.code === LLDEMO ? 'h: chiều cao đang lưu' : 'h: chiều cao, số xanh: hệ số') + '</span>';
}, speed: 900});
function setTab(k){ cur = k; Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){ b.setAttribute('aria-selected', b.getAttribute('data-k') === k ? 'true' : 'false'); }); tv.cur = {}; tv.valid = null; stepper.reset(); }
Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(b){ b.addEventListener('click', function(){ setTab(b.getAttribute('data-k')); }); });
setTab(cur);

})();
</script>
