<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="500">
<title>Chín đồng xu</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c; --cmt:#6b7280;
    --node:#ffffff; --node-line:#c9ced8;
    --run:#e3f4e8; --run-bar:#15803d;
    --edge:#c3c9d4; --orange:#ea7a0c; --orange-soft:#fdecd9; --purple:#9333ea;
    --l0:#2563eb; --l1:#0d9488; --l2:#ca8a04; --l3:#db2777; --l4:#7c3aed; --l5:#64748b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74; --cmt:#8b93a1;
      --node:#1d222c; --node-line:#3a4250;
      --run:#13301f; --run-bar:#4ade80;
      --edge:#3d4554; --orange:#fb923c; --orange-soft:#3a2614; --purple:#c084fc;
      --l0:#6ea0ff; --l1:#2dd4bf; --l2:#facc15; --l3:#f472b6; --l4:#a78bfa; --l5:#94a3b8;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:10px 12px 12px}
  .lead{color:var(--muted);margin:0 0 8px;font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
  .field{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px}
  .field label{font-weight:600}
  select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:13.5px}
  .chk{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:6px 12px;border-radius:8px;
    cursor:pointer;font:inherit;font-weight:600;font-size:13.5px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .err{color:var(--false);font-size:12.5px}
  .err:empty{display:none}
  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
    padding:6px 12px;margin-bottom:8px;min-height:56px;font-size:13.5px}
  .status>b{display:block;font-size:12.5px;color:var(--accent)}
  .status code{font-size:12.5px}
  .col{display:flex;flex-direction:column;gap:8px;min-width:0}
  .panel-title{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
  .code{background:var(--code-bg);border-radius:8px;padding:5px 0;overflow:auto;position:relative;
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 10px 0 0;border-left:3px solid transparent;transition:background .2s}
  .ln .no{width:26px;flex:none;text-align:right;padding-right:9px;color:var(--muted);opacity:.6;user-select:none}
  .ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--cmt);font-style:italic}
  .console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:6px 10px;min-height:44px;white-space:pre-wrap;word-break:break-word;
    font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .console .ph{color:#7b8494;font-family:system-ui,sans-serif}
  kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  [hidden]{display:none !important}
  .grid{display:grid;grid-template-columns:250px 1fr;gap:10px;align-items:start}
  .grid>*{min-width:0}
  @media (max-width:600px){.grid{grid-template-columns:1fr}}
  .board{display:grid;grid-template-columns:repeat(3,64px);gap:8px;justify-content:center;margin:4px auto 8px}
  .coin{width:64px;height:64px;border-radius:50%;border:3px solid var(--node-line);background:var(--node);color:var(--text);
    font:800 24px ui-monospace,Menlo,Consolas,monospace;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative;transition:background .25s,border-color .25s}
  .coin.H{background:#fde68a;border-color:#d4a106;color:#7a5600}
  .coin.T{background:var(--code-bg);border-color:var(--node-line);color:var(--muted)}
  .coin.flip{box-shadow:0 0 0 3px var(--false);border-color:var(--false)}
  .coin.press{outline:3px dashed var(--accent);outline-offset:4px}
  .coin small{position:absolute;bottom:-1px;right:6px;font:600 10px system-ui,sans-serif;color:var(--muted)}
  .coin:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  @media (prefers-color-scheme: dark){.coin.H{background:#5c4708;border-color:#e0b400;color:#fde68a}}
  .bstr{text-align:center;font:700 18px ui-monospace,Menlo,Consolas,monospace;letter-spacing:.12em}
  .bidx{text-align:center;font-size:13px;color:var(--muted)}
  .bits{display:grid;grid-template-columns:repeat(9,1fr);gap:3px;margin:6px 0}
  .bit{background:var(--code-bg);border-radius:6px;text-align:center;padding:2px 0;font:12px ui-monospace,Menlo,Consolas,monospace}
  .bit b{display:block;font-size:17px}
  .bit small{color:var(--muted);font-size:10.5px}
  .bit.one{background:var(--accent-soft);color:var(--accent)}
  .calc{font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;word-break:break-word;margin:6px 0}
  .big{font:800 30px ui-monospace,Menlo,Consolas,monospace;color:var(--accent)}
  .field input[type=text]{width:72px;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:14px ui-monospace,Menlo,Consolas,monospace}
  .field input.bad{border-color:var(--false);background:var(--false-soft)}
  .strip{display:flex;flex-wrap:wrap;gap:8px 6px;align-items:center}
  .mini{border:2px solid transparent;border-radius:8px;padding:3px;cursor:pointer;background:transparent;color:var(--text);font:inherit}
  .mini.on{border-color:var(--accent);background:var(--accent-soft)}
  .mini .mg{display:grid;grid-template-columns:repeat(3,13px);gap:2px}
  .mini .mg span{width:13px;height:13px;border-radius:50%;background:var(--code-bg);border:1px solid var(--node-line)}
  .mini .mg span.H{background:#fbbf24;border-color:#d4a106}
  .mini .mg span.f{box-shadow:0 0 0 2px var(--false)}
  .mini small{display:block;text-align:center;font:600 10.5px ui-monospace,Menlo,Consolas,monospace;color:var(--muted);margin-top:2px}
  .arrow{color:var(--muted);font-size:13px}
  .stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .stat{background:var(--code-bg);border-radius:8px;padding:4px 12px;min-width:96px}
  .stat small{display:block;color:var(--muted);font-size:11.5px}
  .stat strong{font:700 18px ui-monospace,Menlo,Consolas,monospace}
  .cmp{font-size:13px;margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
  .cmp table{border-collapse:collapse;width:100%}
  .cmp th,.cmp td{text-align:left;padding:2px 6px;border-bottom:1px solid var(--line);font-size:12.5px}
  .cmp th{color:var(--muted);font-weight:600;font-size:11.5px}
  .note{font-size:12px;color:var(--muted);margin:4px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <p class="lead" id="lead"></p>
  <div class="controls" id="ctl">
    <div class="field" id="fIdx" hidden><label for="idx">Chỉ số</label><input type="text" id="idx" inputmode="numeric" maxlength="3"></div>
    <div class="btns" id="setBtns">
      <button class="btn ghost" id="allH">Tất cả H</button>
      <button class="btn ghost" id="allT">Tất cả T</button>
    </div>
    <div class="btns" id="stepBtns" hidden>
      <button class="btn" id="next">Bước tiếp</button>
      <button class="btn ghost" id="prev">Lùi lại</button>
      <button class="btn ghost" id="all">Chạy hết</button>
      <button class="btn ghost" id="reset">Làm lại</button>
    </div>
    <div class="err" id="err" role="alert"></div>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="grid">
    <div class="card">
      <p class="panel-title" id="boardTitle">Bàn 3 x 3</p>
      <div class="board" id="board" role="group" aria-label="Chín đồng xu"></div>
      <div class="bstr" id="bstr"></div>
      <div class="bidx" id="bidx"></div>
    </div>
    <div class="card" id="right"></div>
  </div>
</div>
<script>
// Engine E9: mô hình chín đồng xu, khớp NineTailModel (BFS từ 511) và WeightedNineTailModel (Dijkstra từ 511).
(function (root) {
  var N = 512;
  function getNode(index) {
    var r = [];
    for (var i = 0; i < 9; i++) { r[8 - i] = index % 2 === 0 ? 'H' : 'T'; index = Math.floor(index / 2); }
    return r;
  }
  function getIndex(node) { var r = 0; for (var i = 0; i < 9; i++) r = r * 2 + (node[i] === 'T' ? 1 : 0); return r; }
  function flipACell(node, row, col) {
    if (row >= 0 && row <= 2 && col >= 0 && col <= 2) { var i = row * 3 + col; node[i] = node[i] === 'H' ? 'T' : 'H'; }
  }
  function getFlippedNode(node, k) {
    var row = Math.floor(k / 3), col = k % 3;
    flipACell(node, row, col); flipACell(node, row - 1, col); flipACell(node, row + 1, col);
    flipACell(node, row, col - 1); flipACell(node, row, col + 1);
    return getIndex(node);
  }
  function diffCount(u, v) { var a = getNode(u), b = getNode(v), c = 0; for (var i = 0; i < 9; i++) if (a[i] !== b[i]) c++; return c; }
  // Danh sách kề theo đúng thứ tự getEdges(): với u = 0..511, k = 0..8, ô k ngửa -> cạnh (v, u)
  function buildAdj(weighted) {
    var adj = [], w = [], i;
    for (i = 0; i < N; i++) { adj.push([]); w.push([]); }
    for (var u = 0; u < N; u++) for (var k = 0; k < 9; k++) {
      var node = getNode(u);
      if (node[k] === 'H') {
        var v = getFlippedNode(node, k);
        // UnweightedGraph bỏ cạnh trùng (addEdge kiểm contains); WeightedGraph thêm cả cạnh trùng
        if (!weighted && adj[v].indexOf(u) >= 0) continue;
        adj[v].push(u); w[v].push(diffCount(u, v));
      }
    }
    return {adj: adj, w: w};
  }
  function bfsTree() {
    var g = buildAdj(false), parent = [], vis = [], q = [511], i;
    for (i = 0; i < N; i++) { parent.push(-1); vis.push(false); }
    vis[511] = true;
    while (q.length) {
      var u = q.shift();
      g.adj[u].forEach(function (v) { if (!vis[v]) { q.push(v); parent[v] = u; vis[v] = true; } });
    }
    return {parent: parent};
  }
  function dijkstraTree() {
    var g = buildAdj(true), cost = [], parent = [], inT = [], i, cnt = 0;
    for (i = 0; i < N; i++) { cost.push(Infinity); parent.push(-1); inT.push(false); }
    cost[511] = 0;
    while (cnt < N) {
      var u = -1, min = Infinity;
      for (i = 0; i < N; i++) if (!inT[i] && cost[i] < min) { min = cost[i]; u = i; }
      if (u < 0) break;
      inT[u] = true; cnt++;
      for (var k = 0; k < g.adj[u].length; k++) {
        var v = g.adj[u][k], wt = g.w[u][k];
        if (!inT[v] && cost[v] > cost[u] + wt) { cost[v] = cost[u] + wt; parent[v] = u; }
      }
    }
    return {parent: parent, cost: cost};
  }
  function getPath(tree, index) { var p = []; do { p.push(index); index = tree.parent[index]; } while (index !== -1); return p; }
  // Ô được bấm để đi từ u sang v (u có ô k ngửa, lật k cho ra v)
  function moveCell(u, v) {
    for (var k = 0; k < 9; k++) { var node = getNode(u); if (node[k] === 'H' && getFlippedNode(node, k) === v) return k; }
    return -1;
  }
  var api = {getNode: getNode, getIndex: getIndex, getFlippedNode: getFlippedNode, diffCount: diffCount,
    bfsTree: bfsTree, dijkstraTree: dijkstraTree, getPath: getPath, moveCell: moveCell};
  if (typeof module !== 'undefined' && module.exports) module.exports = api; else root.CoinsSim = api;
})(this);
(function(){
  var $ = function(id){ return document.getElementById(id); };
  function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function qs(name){ var m = new RegExp('[?&]' + name + '=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : ''; }
  function hl(src){
    var re = /("(?:[^"\\]|\\.)*"|'(?:[^'\\]|\\.)*')|(\/\/.*$)|\b(import|public|private|protected|class|static|void|int|double|char|boolean|String|if|else|return|for|while|new|true|false)\b|(\b\d+(?:\.\d+)?\b)/g, out = '', last = 0, m;
    while ((m = re.exec(src))) {
      out += esc(src.slice(last, m.index));
      if (m[1]) out += '<span class="str">' + esc(m[1]) + '</span>';
      else if (m[2]) out += '<span class="cm">' + esc(m[2]) + '</span>';
      else if (m[3]) out += '<span class="kw">' + m[3] + '</span>';
      else out += '<span class="num">' + m[4] + '</span>';
      last = re.lastIndex;
    }
    return out + esc(src.slice(last));
  }
  // cur: chỉ số dòng (0-based) hoặc [từ, đến]
  function codeHtml(lines, cur){
    var a = cur === undefined || cur === null ? -1 : (Array.isArray(cur) ? cur[0] : cur);
    var b = cur === undefined || cur === null ? -1 : (Array.isArray(cur) ? cur[1] : cur);
    return lines.map(function(l, i){
      return '<div class="ln' + (i >= a && i <= b ? ' cur' : '') + '"><span class="no">' + (i + 1) + '</span><span>' + hl(l) + '</span></div>';
    }).join('');
  }
  function scrollToCur(box){
    var el = box.querySelector('.ln.cur'); if (!el) return;
    if (box.scrollHeight <= box.clientHeight + 2) return;
    var top = el.offsetTop - box.clientHeight / 2 + el.offsetHeight / 2;
    box.scrollTop = Math.max(0, top);
  }
  // Stepper: cfg = {build: () => snaps, render: (snap, i, n) => void, speed: ms}
  function Stepper(cfg){
    var snaps = [], step = 0, timer = null;
    function stop(){ if (timer) { clearInterval(timer); timer = null; } }
    function draw(){
      var sn = snaps[step];
      $('status').innerHTML = '<b>Bước ' + (step + 1) + '/' + snaps.length + ' · ' + esc(sn.title) + '</b><span>' + sn.body + '</span>';
      cfg.render(sn, step, snaps.length);
      var run = timer !== null;
      $('next').disabled = step >= snaps.length - 1 || run;
      $('prev').disabled = step <= 0 || run;
      $('all').disabled = run || step >= snaps.length - 1;
    }
    var jump = parseInt(qs('buoc'), 10);
    function reset(){ stop(); snaps = cfg.build(); step = 0; if (jump > 0) { step = Math.min(jump - 1, snaps.length - 1); jump = 0; } draw(); }
    function next(){ if (step < snaps.length - 1) { step++; draw(); } }
    function prev(){ if (step > 0) { step--; draw(); } }
    $('next').addEventListener('click', next);
    $('prev').addEventListener('click', prev);
    $('reset').addEventListener('click', reset);
    $('all').addEventListener('click', function(){
      if (timer) return;
      timer = setInterval(function(){ if (step >= snaps.length - 1) { stop(); draw(); return; } step++; draw(); }, cfg.speed || 550);
      draw();
    });
    document.addEventListener('keydown', function(e){
      var t = e.target && e.target.tagName;
      if (t === 'INPUT' || t === 'TEXTAREA' || t === 'SELECT' || timer) return;
      if (e.key === 'ArrowRight') { next(); e.preventDefault(); }
      else if (e.key === 'ArrowLeft') { prev(); e.preventDefault(); }
    });
    return {reset: reset, redraw: function(){ if (snaps.length) draw(); }};
  }
var C = window.CoinsSim;
var MODE = qs('mode'); if (['bieudien', 'bfs', 'trongso'].indexOf(MODE) < 0) MODE = 'bieudien';
var SOLVE = MODE !== 'bieudien';
var WEIGHTED = MODE === 'trongso';
function parseState(s){ s = String(s || '').toUpperCase(); return /^[HT]{9}$/.test(s) ? s.split('') : null; }
var init = parseState(qs('s')) || (SOLVE ? 'HHHTTTHHH'.split('') : 'HHHHHHHTT'.split(''));
var bfsT = null, dijT = null;
function trees(){ if (!bfsT) { bfsT = C.bfsTree(); if (WEIGHTED) dijT = C.dijkstraTree(); } }
function pos(k){ return 'hàng ' + (Math.floor(k / 3) + 1) + ', cột ' + (k % 3 + 1); }

var LEADS = {
  bieudien: 'Bấm vào đồng xu để lật H/T; chuỗi 9 ký tự, dãy bit và chỉ số 0–511 cập nhật ngay.',
  bfs: 'Bấm đồng xu để đặt trạng thái ban đầu, rồi bấm <b>Bước tiếp</b> (<kbd>→</kbd>) để xem lời giải ít nước nhất (BFS từ 511).',
  trongso: 'Bấm đồng xu để đặt trạng thái ban đầu, rồi bấm <b>Bước tiếp</b> (<kbd>→</kbd>) để xem lời giải ít lần lật nhất.'
};
$('lead').innerHTML = LEADS[MODE];
if (SOLVE) { $('setBtns').hidden = true; $('stepBtns').hidden = false; }
else $('fIdx').hidden = false;

// ---------- bàn cờ ----------
var cells = [];
for (var k = 0; k < 9; k++) {
  var b = document.createElement('button');
  b.className = 'coin'; b.type = 'button'; b.dataset.k = k;
  b.addEventListener('click', onCoin);
  $('board').appendChild(b); cells.push(b);
}
function drawBoard(node, flips, press){
  for (var k = 0; k < 9; k++) {
    var c = cells[k];
    c.className = 'coin ' + node[k] + (flips && flips[k] ? ' flip' : '') + (press === k ? ' press' : '');
    c.innerHTML = node[k] + (SOLVE ? '' : '<small>' + k + '</small>');
    c.setAttribute('aria-label', 'Ô ' + k + ' (' + pos(k) + '): ' + (node[k] === 'H' ? 'ngửa' : 'sấp'));
  }
  $('bstr').textContent = node.join('');
  $('bidx').innerHTML = 'chỉ số <b>' + C.getIndex(node) + '</b>';
}
function onCoin(){
  var k = +this.dataset.k;
  init[k] = init[k] === 'H' ? 'T' : 'H';
  if (SOLVE) st.reset(); else showRep();
}

// ---------- chế độ biểu diễn ----------
function showRep(){
  drawBoard(init);
  var idx = C.getIndex(init), bits = init.map(function(c){ return c === 'T' ? 1 : 0; });
  var terms = [];
  bits.forEach(function(b, i){ if (b) terms.push(Math.pow(2, 8 - i)); });
  $('right').innerHTML = '<p class="panel-title">Từ trạng thái tới chỉ số</p>' +
    '<div class="bits">' + bits.map(function(b, i){ return '<div class="bit' + (b ? ' one' : '') + '"><small>ô ' + i + '</small><b>' + b + '</b><small>' + Math.pow(2, 8 - i) + '</small></div>'; }).join('') + '</div>' +
    '<p class="note">H là 0, T là 1; đọc 9 ô từ trái sang phải, từ trên xuống như số nhị phân. Hàng dưới là giá trị của từng vị trí.</p>' +
    '<div class="calc">' + bits.join('') + '<sub>2</sub> = ' + (terms.length ? terms.join(' + ') : '0') + '</div>' +
    '<div>Chỉ số: <span class="big">' + idx + '</span></div>' +
    '<p class="note">Ô <code>k</code> nằm ở hàng <code>k / 3</code>, cột <code>k % 3</code> (đếm từ 0).</p>';
  $('status').innerHTML = '<b>Trạng thái ' + init.join('') + '</b><span>' + (idx === 511 ? 'Đây là đỉnh đích: mọi đồng đều sấp.' : idx === 0 ? 'Mọi đồng đều ngửa: chỉ số nhỏ nhất.' : 'Có ' + bits.filter(Boolean).length + ' đồng sấp (bit 1) và ' + bits.filter(function(b){ return !b; }).length + ' đồng ngửa (bit 0).') + '</span>';
  if (document.activeElement !== $('idx')) { $('idx').value = idx; $('idx').classList.remove('bad'); $('err').textContent = ''; }
}
if (!SOLVE) {
  $('allH').addEventListener('click', function(){ init = 'HHHHHHHHH'.split(''); showRep(); });
  $('allT').addEventListener('click', function(){ init = 'TTTTTTTTT'.split(''); showRep(); });
  $('idx').addEventListener('input', function(){
    var s = this.value.trim(), ok = /^\d{1,3}$/.test(s) && +s <= 511;
    this.classList.toggle('bad', !ok);
    if (!ok) { $('err').textContent = 'Nhập số nguyên từ 0 đến 511.'; return; }
    $('err').textContent = ''; init = C.getNode(+s); showRep();
  });
  $('idx').addEventListener('blur', showRep);
  showRep();
  return;
}

// ---------- chế độ giải ----------
function solve(tree, start){
  var path = tree.parent ? C.getPath(tree, start) : [];
  var moves = [], flips = 0;
  for (var i = 0; i + 1 < path.length; i++) {
    var k = C.moveCell(path[i], path[i + 1]), d = C.diffCount(path[i], path[i + 1]);
    flips += d; moves.push({k: k, d: d});
  }
  return {path: path, moves: moves, flips: flips};
}
var SOL = null, ALT = null;
function build(){
  trees();
  var s = C.getIndex(init);
  SOL = solve(WEIGHTED ? dijT : bfsT, s);
  ALT = WEIGHTED ? solve(bfsT, s) : null;
  var S = [], acc = 0, n = SOL.moves.length;
  S.push({i: 0, title: 'Trạng thái ban đầu', body: s === 511 ? 'Mọi đồng đã sấp: đây là đỉnh đích 511, không cần nước nào.' :
    'Trạng thái ' + init.join('') + ' là đỉnh ' + s + '. Đi theo <code>parent</code> trong cây ' + (WEIGHTED ? 'đường đi ngắn nhất' : 'BFS') + ' từ đỉnh này lên gốc 511 được lời giải ' + n + ' nước' + (WEIGHTED ? ', ' + SOL.flips + ' lần lật' : '') + '. Bấm <b>Bước tiếp</b> để xem từng nước.'});
  SOL.moves.forEach(function(m, i){
    acc += m.d;
    S.push({i: i + 1, title: 'Nước ' + (i + 1) + '/' + n, body: 'Bấm đồng ngửa ở ' + pos(m.k) + ' (ô ' + m.k + '): nó cùng các đồng kề ngang, dọc bị lật, tổng ' + m.d + ' đồng (viền đỏ). Trạng thái mới là đỉnh ' + SOL.path[i + 1] + '.' +
      (WEIGHTED ? ' Cộng dồn: ' + SOL.moves.slice(0, i + 1).map(function(x){ return x.d; }).join(' + ') + ' = ' + acc + ' lần lật.' : '') +
      (i === n - 1 ? ' Mọi đồng đều sấp: xong.' : ''), acc: acc});
  });
  return S;
}
function miniHtml(idx, flips, on, i){
  var node = C.getNode(idx);
  return '<button type="button" class="mini' + (on ? ' on' : '') + '" data-i="' + i + '" aria-label="Trạng thái ' + node.join('') + '"><div class="mg">' + node.map(function(c, k){ return '<span class="' + (c === 'H' ? 'H' : '') + (flips && flips[k] ? ' f' : '') + '"></span>'; }).join('') + '</div><small>' + idx + '</small></button>';
}
function flipMask(a, b){ var x = C.getNode(a), y = C.getNode(b); return x.map(function(c, k){ return c !== y[k]; }); }
var cur = 0;
function render(sn){
  cur = sn.i;
  var idx = SOL.path[sn.i], fl = sn.i > 0 ? flipMask(SOL.path[sn.i - 1], idx) : null;
  drawBoard(C.getNode(idx), fl, sn.i > 0 ? SOL.moves[sn.i - 1].k : -1);
  $('boardTitle').textContent = sn.i === 0 ? 'Trạng thái ban đầu (bấm để đổi)' : 'Sau nước ' + sn.i;
  var strip = SOL.path.map(function(p, i){ return miniHtml(p, i > 0 ? flipMask(SOL.path[i - 1], p) : null, i === sn.i, i); }).join('<span class="arrow">→</span>');
  var h = '<p class="panel-title">Đường đi từ trạng thái ban đầu về 511</p><div class="strip">' + strip + '</div>' +
    '<div class="stats"><div class="stat"><small>Số nước</small><strong>' + sn.i + ' / ' + SOL.moves.length + '</strong></div>' +
    (WEIGHTED ? '<div class="stat"><small>Số lần lật cộng dồn</small><strong>' + (sn.acc || 0) + ' / ' + SOL.flips + '</strong></div>' : '') + '</div>';
  if (WEIGHTED) {
    var same = ALT.path.join() === SOL.path.join();
    h += '<div class="cmp"><table><tr><th>Cách tìm</th><th>Số nước</th><th>Số lần lật</th></tr>' +
      '<tr><td>Có trọng số (ít lần lật nhất)</td><td>' + SOL.moves.length + '</td><td><b>' + SOL.flips + '</b></td></tr>' +
      '<tr><td>BFS (ít nước nhất)</td><td><b>' + ALT.moves.length + '</b></td><td>' + ALT.flips + '</td></tr></table>' +
      '<p class="note">' + (same ? 'Hai cách cho cùng một lời giải với trạng thái này.' : 'Hai cách cho lời giải khác nhau với trạng thái này.') + '</p></div>';
  } else {
    h += '<p class="note">Viền đỏ: các đồng vừa bị lật. Viền đứt: đồng được bấm.</p>';
  }
  $('right').innerHTML = h;
}
var st = Stepper({build: build, render: render, speed: 900});
$('right').addEventListener('click', function(e){
  var m = e.target.closest && e.target.closest('.mini'); if (!m) return;
  var want = +m.dataset.i;
  for (var g = 0; g < 20 && cur < want && !$('next').disabled; g++) $('next').click();
  for (g = 0; g < 20 && cur > want && !$('prev').disabled; g++) $('prev').click();
});
st.reset();
})();
</script>
</body>
