<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="embed-height" content="640">
<title>Duyệt đồ thị từng bước</title>
<style>
  :root{
    --bg:#f6f7f9; --card:#ffffff; --text:#1d2330; --muted:#5d6676; --line:#e2e5eb;
    --accent:#2563eb; --accent-soft:#e7eefc;
    --true:#15803d; --true-soft:#e3f4e8; --false:#b42318; --false-soft:#fbe9e7;
    --code-bg:#f3f5f8; --cur:#fff1b8; --cur-bar:#e0a800;
    --con-bg:#111827; --con-text:#e5e7eb;
    --kw:#7c3aed; --str:#047857; --num:#c2410c; --cmt:#6b7280;
    --node:#ffffff; --node-line:#c9ced8;
    --run:#e3f4e8; --run-bar:#15803d;
    --edge:#c3c9d4; --orange:#ea7a0c; --orange-soft:#fdecd9; --purple:#9333ea;
    --l0:#2563eb; --l1:#0d9488; --l2:#ca8a04; --l3:#db2777; --l4:#7c3aed; --l5:#64748b;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0f1218; --card:#181c24; --text:#e6e9ef; --muted:#9aa3b2; --line:#2a303b;
      --accent:#6ea0ff; --accent-soft:#1e2a44;
      --true:#4ade80; --true-soft:#13301f; --false:#f87171; --false-soft:#3a1717;
      --code-bg:#11151c; --cur:#3d3412; --cur-bar:#e0b400;
      --con-bg:#05070b; --con-text:#e5e7eb;
      --kw:#c4a1ff; --str:#6ee7b7; --num:#fdba74; --cmt:#8b93a1;
      --node:#1d222c; --node-line:#3a4250;
      --run:#13301f; --run-bar:#4ade80;
      --edge:#3d4554; --orange:#fb923c; --orange-soft:#3a2614; --purple:#c084fc;
      --l0:#6ea0ff; --l1:#2dd4bf; --l2:#facc15; --l3:#f472b6; --l4:#a78bfa; --l5:#94a3b8;
    }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);
    font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:10px 12px 12px}
  .lead{color:var(--muted);margin:0 0 8px;font-size:13.5px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
  .controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:8px}
  .field{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13.5px}
  .field label{font-weight:600}
  select{padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text);font:inherit;font-size:13.5px}
  .chk{display:flex;align-items:center;gap:5px;font-size:13px;cursor:pointer}
  .btns{display:flex;gap:6px;flex-wrap:wrap}
  .btn{border:1px solid var(--accent);background:var(--accent);color:#fff;padding:6px 12px;border-radius:8px;
    cursor:pointer;font:inherit;font-weight:600;font-size:13.5px}
  .btn.ghost{background:transparent;color:var(--accent)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .err{color:var(--false);font-size:12.5px}
  .err:empty{display:none}
  .status{border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:8px;
    padding:6px 12px;margin-bottom:8px;min-height:56px;font-size:13.5px}
  .status>b{display:block;font-size:12.5px;color:var(--accent)}
  .status code{font-size:12.5px}
  .col{display:flex;flex-direction:column;gap:8px;min-width:0}
  .panel-title{font-size:11.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 4px}
  .code{background:var(--code-bg);border-radius:8px;padding:5px 0;overflow:auto;position:relative;
    font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .ln{display:flex;white-space:pre;padding:0 10px 0 0;border-left:3px solid transparent;transition:background .2s}
  .ln .no{width:26px;flex:none;text-align:right;padding-right:9px;color:var(--muted);opacity:.6;user-select:none}
  .ln.cur{background:var(--cur);border-left-color:var(--cur-bar)}
  .kw{color:var(--kw);font-weight:600}.str{color:var(--str)}.num{color:var(--num)}.cm{color:var(--cmt);font-style:italic}
  .console{background:var(--con-bg);color:var(--con-text);border-radius:8px;padding:6px 10px;min-height:44px;white-space:pre-wrap;word-break:break-word;
    font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .console .ph{color:#7b8494;font-family:system-ui,sans-serif}
  kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line);border-radius:4px;padding:0 4px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  [hidden]{display:none !important}
  .grid{display:grid;grid-template-columns:250px 1fr;gap:10px;align-items:start}
  .grid .status{margin-bottom:0}
  @media (max-width:600px){.status{margin-bottom:8px}}
  .grid.small{grid-template-columns:1fr 1.15fr}
  .grid>*{min-width:0}
  @media (max-width:600px){.grid,.grid.small{grid-template-columns:1fr}}
  svg.g{display:block;width:100%;height:auto}
  svg .e{stroke:var(--edge);stroke-width:2;fill:none}
  svg .e.tree{stroke:var(--true);stroke-width:4.5}
  svg .e.go{stroke:var(--accent);stroke-width:4.5;stroke-dasharray:7 4}
  svg .e.skip{stroke:var(--false);stroke-width:2.5;stroke-dasharray:3 4}
  svg .e.cut{stroke:var(--orange);stroke-width:3}
  svg .e.pick{stroke:var(--accent);stroke-width:6}
  svg .e.tent{stroke:var(--orange);stroke-width:2.5;stroke-dasharray:6 4}
  svg .e.dfs{stroke:var(--purple);stroke-width:3}
  svg .v{fill:var(--node);stroke:var(--node-line);stroke-width:2}
  svg .v.active{fill:var(--accent-soft);stroke:var(--accent)}
  svg .v.done,svg .v.T{fill:var(--true-soft);stroke:var(--true)}
  svg .v.tent{fill:var(--orange-soft);stroke:var(--orange)}
  svg .v.cur{fill:var(--cur);stroke:var(--cur-bar);stroke-width:4}
  svg .v.inq{stroke-dasharray:4 3}
  svg .halo{fill:none;stroke:var(--cur-bar);stroke-width:2;opacity:.55}
  svg text{fill:var(--text);font:600 12px system-ui,sans-serif}
  svg text.vn{font:700 15px ui-monospace,Menlo,Consolas,monospace;text-anchor:middle;dominant-baseline:central}
  svg text.lv{font:700 10.5px system-ui,sans-serif;fill:var(--muted)}
  svg text.w{font:600 10.5px ui-monospace,Menlo,Consolas,monospace;fill:var(--muted);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:var(--card);stroke-width:3px}
  .legend{display:flex;flex-wrap:wrap;gap:3px 10px;font-size:11.5px;color:var(--muted);margin-top:4px}
  .legend i{display:inline-block;width:16px;height:0;border-top:4px solid;vertical-align:middle;margin-right:4px}
  .legend i.dot{width:11px;height:11px;border:2px solid;border-radius:50%;margin-right:4px}
  .stack{display:flex;flex-direction:column-reverse;gap:4px;padding:4px;border:2px dashed var(--line);border-top:none;border-radius:0 0 8px 8px;min-height:40px}
  .frame{border:2px solid var(--node-line);border-radius:7px;background:var(--node);padding:1px 8px;font:12.5px ui-monospace,Menlo,Consolas,monospace;display:flex;justify-content:space-between;gap:6px}
  .frame span{white-space:pre}
  .frame small{font:600 11px system-ui,sans-serif;color:var(--muted)}
  .frame.top{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .frame.top small{color:var(--accent)}
  .frame.popping{opacity:.45;border-style:dashed}
  .frame.fresh{animation:push .3s ease-out}
  @keyframes push{from{transform:translateY(-10px);opacity:0}to{transform:none;opacity:1}}
  .chips{display:flex;flex-wrap:wrap;gap:3px}
  .chip{background:var(--code-bg);border:2px solid transparent;border-radius:6px;padding:0 5px;font:11.5px/1.4 ui-monospace,Menlo,Consolas,monospace;white-space:nowrap}
  .chip small{color:var(--muted);font-size:10.5px}
  .chip.top{border-color:var(--accent);background:var(--accent-soft)}
  .chip.new{border-color:var(--cur-bar);background:var(--cur)}
  .chip.pop{opacity:.45;border-style:dashed;border-color:var(--node-line)}
  .chip .arrow{color:var(--muted)}
  .queue{display:flex;gap:4px;flex-wrap:wrap;min-height:30px;align-items:center}
  .queue .cell{border:2px solid var(--node-line);border-radius:6px;padding:1px 8px;font:12.5px ui-monospace,Menlo,Consolas,monospace;background:var(--node)}
  .queue .cell.new{border-color:var(--cur-bar);background:var(--cur)}
  .queue .end{font-size:11px;color:var(--muted)}
  .queue .empty{color:var(--muted);font-size:12.5px}
  .kv{font-size:12px;color:var(--muted);margin:0 0 3px}
  .kv+.chips{margin-bottom:6px}
  table.t{width:100%;border-collapse:collapse;font:12.5px ui-monospace,Menlo,Consolas,monospace}
  table.t th{font:600 11.5px system-ui,sans-serif;color:var(--muted);text-align:left;padding:2px 6px;border-bottom:1px solid var(--line)}
  table.t td{padding:2px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.t td:first-child{font-family:system-ui,sans-serif}
  table.t tr.inT td:first-child{color:var(--true);font-weight:700}
  table.t tr.cur td{background:var(--cur)}
  table.t td.chg{background:var(--cur);box-shadow:inset 0 0 0 2px var(--cur-bar);animation:blink .9s ease-out 1}
  @keyframes blink{0%{background:var(--cur-bar)}100%{background:var(--cur)}}
  table.t td s{color:var(--muted)}
  .tot{font-size:13px;margin-top:6px}
  #code{max-height:164px}
  .grid.small #code{max-height:206px}
  .grid.small .console{line-height:1.35}
  @media (max-width:600px){#code{max-height:230px}}
</style>
</head>
<body>
<div class="wrap">
  <p class="lead" id="lead"></p>
  <div class="controls">
    <div class="field"><label for="start" id="startLbl">Xuất phát</label><select id="start"></select></div>
    <label class="chk" id="cmpWrap" hidden><input type="checkbox" id="cmp"> So với cây DFS</label>
    <div class="btns">
      <button class="btn" id="next">Bước tiếp</button>
      <button class="btn ghost" id="prev">Lùi lại</button>
      <button class="btn ghost" id="all">Chạy hết</button>
      <button class="btn ghost" id="reset">Làm lại</button>
    </div>
  </div>
  <div class="status" id="status" aria-live="polite"></div>
  <div class="grid" id="grid"></div>
</div>
<script>
// Engine E8: sinh các bước DFS / BFS / Prim / Dijkstra, khớp đúng code Java của khoá
// (thứ tự cạnh theo mảng edges; chọn min bằng phép so sánh < nghiêm ngặt; cập nhật bằng >).
// Chạy được trong trình duyệt (gắn vào window.GraphSim) và trong node (module.exports).
(function (root) {
  var CITIES = ['Ha Noi', 'Hai Phong', 'Vinh', 'Hue', 'Da Nang', 'Quy Nhon', 'Nha Trang',
    'Da Lat', 'Buon Ma Thuot', 'TP HCM', 'Can Tho', 'Ca Mau'];
  // Toạ độ chung (DECISIONS D10): kinh độ, vĩ độ
  var LONLAT = [[105.85, 21.03], [106.68, 20.86], [105.69, 18.68], [107.59, 16.46], [108.21, 16.05],
    [109.22, 13.78], [109.19, 12.24], [108.44, 11.94], [108.04, 12.67], [106.66, 10.76],
    [105.78, 10.03], [105.15, 9.18]];
  // Mảng edges của TestDFS / TestBFS / TestMinimumSpanningTree / TestShortestPath (đúng thứ tự)
  var WEDGES = [[0, 1, 120], [0, 2, 295], [1, 0, 120], [1, 2, 340], [2, 0, 295], [2, 1, 340], [2, 3, 370],
    [3, 2, 370], [3, 4, 100], [4, 3, 100], [4, 5, 320], [4, 8, 540], [5, 4, 320], [5, 6, 215], [5, 8, 200],
    [6, 5, 215], [6, 7, 135], [6, 8, 190], [6, 9, 430], [7, 6, 135], [7, 8, 200], [7, 9, 300],
    [8, 4, 540], [8, 5, 200], [8, 6, 190], [8, 7, 200], [8, 9, 350], [9, 6, 430], [9, 7, 300],
    [9, 8, 350], [9, 10, 170], [9, 11, 350], [10, 9, 170], [10, 11, 180], [11, 9, 350], [11, 10, 180]];
  var SMALL_DFS = [[1, 2], [0, 2, 4], [0, 1, 3], [2], [1]];
  var SMALL_BFS = [[1, 2, 3], [0, 2, 4], [0, 1, 3], [0, 2, 4], [1, 3]];

  function mapAdj() {
    var adj = [], w = [];
    for (var i = 0; i < 12; i++) { adj.push([]); w.push([]); }
    WEDGES.forEach(function (e) { adj[e[0]].push(e[1]); w[e[0]].push(e[2]); });
    return {adj: adj, w: w};
  }
  function ekey(a, b) { return a < b ? a + '-' + b : b + '-' + a; }
  function fill(n, v) { var a = []; for (var i = 0; i < n; i++) a.push(v); return a; }
  function treeEdges(parent, only) {
    var o = {};
    parent.forEach(function (p, v) { if (p >= 0 && (!only || only[v])) o[ekey(p, v)] = 'tree'; });
    return o;
  }

  // ---------- DFS ----------
  // small: true = DfsDemo (in "tham/xong"), false = AbstractGraph.dfs (searchOrder, parent)
  function dfsSteps(adj, s, small, name) {
    var n = adj.length, vis = fill(n, false), parent = fill(n, -1), order = [], stack = [], out = [], done = fill(n, false);
    var S = [];
    function vst(cur) {
      return adj.map(function (_, v) {
        if (v === cur) return 'cur';
        if (stack.indexOf(v) >= 0) return 'active';
        if (done[v]) return 'done';
        return vis[v] ? 'active' : '';
      });
    }
    function snap(ln, title, body, cur, check, extra) {
      var edges = treeEdges(parent);
      if (check) edges[ekey(check[0], check[1])] = check[2];
      var o = {ln: ln, title: title, body: body, v: vst(cur), edges: edges, stack: stack.slice(), order: order.slice(),
        parent: parent.slice(), out: out.slice(), vis: vis.slice()};
      if (extra) for (var k in extra) o[k] = extra[k];
      S.push(o);
    }
    var nm = function (v) { return name(v); };
    if (small) snap(17, 'main gọi dfs(' + s + ', "")', '<code>main</code> gọi <code>dfs(' + s + ', "")</code>. Chưa đỉnh nào được thăm.', -1);
    else snap(null, 'Bắt đầu dfs(' + nm(s) + ')', 'Phương thức công khai đã tạo <code>searchOrder</code> rỗng, <code>parent</code> toàn -1, <code>isVisited</code> toàn false, rồi gọi phương thức trợ giúp với <code>u = ' + nm(s) + '</code>.', -1);
    function rec(u, indent) {
      stack.push(u);
      vis[u] = true; order.push(u);
      if (small) {
        out.push(indent + 'tham ' + u);
        snap([7, 8], 'Thăm ' + u, 'In <code>' + (indent ? '"' + indent + '" + ' : '') + '"tham ' + u + '"</code> rồi đánh dấu <code>isVisited[' + u + '] = true</code>. Khung <code>dfs(' + u + ')</code> nằm trên đỉnh ngăn xếp lời gọi.', u, null, {fresh: true});
      } else {
        snap([3, 4], 'Thăm ' + nm(u), '<code>searchOrder.add(' + nm(u) + ')</code> và <code>isVisited[' + nm(u) + '] = true</code>. Đây là đỉnh thứ ' + order.length + ' được thăm.', u, null, {fresh: true});
      }
      adj[u].forEach(function (w) {
        if (vis[w]) {
          snap(small ? 10 : 6, 'Xét ' + nm(u) + ' → ' + nm(w), (small ? 'Hàng xóm <code>w = ' + w + '</code>' : 'Cạnh tới <code>e.v = ' + nm(w) + '</code>') + ': đỉnh này đã thăm, bỏ qua.', u, [u, w, 'skip']);
        } else {
          if (small) snap([10, 11], 'Xét ' + u + ' → ' + w, 'Hàng xóm <code>w = ' + w + '</code> chưa thăm, nên gọi đệ quy <code>dfs(' + w + ', ...)</code>. <code>dfs(' + u + ')</code> tạm dừng ở dòng này.', u, [u, w, 'go']);
          else {
            parent[w] = u;
            snap([6, 8], 'Xét ' + nm(u) + ' → ' + nm(w), '<code>' + nm(w) + '</code> chưa thăm: ghi <code>parent[' + nm(w) + '] = ' + nm(u) + '</code> rồi gọi đệ quy <code>dfs(' + nm(w) + ', ...)</code>. <code>dfs(' + nm(u) + ')</code> tạm dừng.', u, [u, w, 'go']);
          }
          if (small) parent[w] = u;
          rec(w, indent + '  ');
        }
      });
      if (small) out.push(indent + 'xong ' + u);
      done[u] = true;
      var back = stack.length > 1 ? stack[stack.length - 2] : -1;
      snap(small ? 13 : 12, 'dfs(' + nm(u) + ') kết thúc',
        (small ? 'In <code>"xong ' + u + '"</code>. ' : 'Đã xét hết các cạnh của ' + nm(u) + '. ') +
        (back >= 0 ? 'Khung <code>dfs(' + nm(u) + ')</code> bị gỡ, quay lui về <code>dfs(' + nm(back) + ')</code>.' : 'Khung cuối cùng bị gỡ, ngăn xếp lời gọi trống.'), u, null, {popping: true});
      stack.pop();
    }
    rec(s, '');
    snap(null, 'Hoàn tất', (small ? 'Thứ tự thăm: ' + order.join(', ') + '. ' : 'Đã thăm đủ ' + order.length + ' đỉnh. ') + 'Các cạnh tô đậm là cây DFS (mỗi đỉnh nối với <code>parent</code> của nó).', -1, null, {end: true});
    return S;
  }

  // ---------- BFS ----------
  function bfsSteps(adj, s, small, name) {
    var n = adj.length, vis = fill(n, false), parent = fill(n, -1), level = fill(n, -1), order = [], q = [], out = [], line = '';
    var S = [], polled = fill(n, false);
    var nm = function (v) { return name(v); };
    function vst(cur) {
      return adj.map(function (_, v) {
        if (v === cur) return 'cur';
        if (polled[v]) return 'done';
        if (q.indexOf(v) >= 0) return 'inq';
        return '';
      });
    }
    function snap(ln, title, body, cur, check, extra) {
      var edges = treeEdges(parent);
      if (check) edges[ekey(check[0], check[1])] = check[2];
      var o = {ln: ln, title: title, body: body, v: vst(cur), edges: edges, queue: q.slice(), order: order.slice(),
        parent: parent.slice(), level: level.slice(), out: out.concat(line ? [line] : []), vis: vis.slice()};
      if (extra) for (var k in extra) o[k] = extra[k];
      S.push(o);
    }
    q.push(s); vis[s] = true; level[s] = 0;
    snap(small ? [11, 12] : [2, 3], 'Đưa ' + nm(s) + ' vào hàng đợi', '<code>queue.offer(' + nm(s) + ')</code> và đánh dấu <code>isVisited[' + nm(s) + '] = true</code> ngay lúc đưa vào. ' + nm(s) + ' là mức 0.', -1, null, {added: [s]});
    while (q.length) {
      var u = q.shift();
      polled[u] = true;
      if (small) { order.push(u); line = 'Lay ' + u; snap([14, 15], 'Lấy ' + u + ' ra', '<code>queue.poll()</code> trả về ' + u + ' (đầu hàng đợi), in <code>"Lay ' + u + '"</code>. Giờ xét các hàng xóm của ' + u + '.', u); }
      else { order.push(u); snap([5, 6], 'Lấy ' + nm(u) + ' ra', '<code>queue.poll()</code> trả về ' + nm(u) + ' (mức ' + level[u] + '), <code>searchOrder.add(' + nm(u) + ')</code>. Giờ xét các cạnh của ' + nm(u) + '.', u); }
      adj[u].forEach(function (w) {
        if (vis[w]) {
          snap(small ? 17 : 8, 'Xét ' + nm(u) + ' → ' + nm(w), nm(w) + ' đã được đánh dấu (đã hoặc đang ở trong hàng đợi), bỏ qua.', u, [u, w, 'skip']);
        } else {
          q.push(w); vis[w] = true; parent[w] = u; level[w] = level[u] + 1;
          snap(small ? [17, 19] : [8, 11], 'Xét ' + nm(u) + ' → ' + nm(w), nm(w) + ' chưa đánh dấu: đưa vào cuối hàng đợi, ' + (small ? '' : 'ghi <code>parent[' + nm(w) + '] = ' + nm(u) + '</code>, ') + 'đánh dấu đã thăm. ' + nm(w) + ' thuộc mức ' + level[w] + '.', u, [u, w, 'go'], {added: [w]});
        }
      });
      if (small) {
        line += ', hang doi: [' + q.join(', ') + ']';
        out.push(line); line = '';
        snap([22, 23], 'In hàng đợi', 'Xét xong hàng xóm của ' + u + '. In nội dung hàng đợi: <code>[' + q.join(', ') + ']</code>.', u);
      }
    }

else if (ALGO === 'bfs') legendHtml = '<span><i class="dot" style="border-color:var(--l0)"></i>mức 0</span><span><i class="dot" style="border-color:var(--l1)"></i>mức 1</span><span><i class="dot" style="border-color:var(--l2)"></i>mức 2</span><span><i class="dot" style="border-color:var(--l3)"></i>mức 3</span><span>viền đứt: trong hàng đợi</span><span><i style="border-color:var(--true)"></i>cạnh cây</span><span id="lgdfs" hidden><i style="border-color:var(--purple)"></i>cây DFS (cùng điểm xuất phát)</span>';
else legendHtml = '<span><i class="dot" style="border-color:var(--true);background:var(--true-soft)"></i>trong T</span><span><i style="border-color:var(--true)"></i>cạnh cây</span>' + (ALGO === 'prim' && !COSTMODE ? '<span><i style="border-color:var(--orange)"></i>cạnh nối T với V − T</span>' : '<span><i style="border-color:var(--orange);border-top-style:dashed"></i>parent tạm</span>') + '<span><i style="border-color:var(--accent)"></i>cạnh vừa chọn</span>';
var mapCard = '<div class="card"><div id="svg"></div><div class="legend">' + legendHtml + '</div></div>';
if (SMALL) {
  grid.className = 'grid small';
  grid.innerHTML = '<div class="col">' + mapCard + '<div class="card"><p class="panel-title">' + (ALGO === 'dfs' ? 'Ngăn xếp lời gọi' : 'Hàng đợi (đầu bên trái)') + '</p><div id="aux"></div></div></div>' +
    '<div class="col"><div class="card"><p class="panel-title">' + (ALGO === 'dfs' ? 'DfsDemo' : 'BfsDemo') + '</p><div class="code" id="code"></div></div><div class="card"><p class="panel-title">Output</p><div class="console" id="con"></div></div></div>';
} else if (!WEIGHTED) {
  grid.innerHTML = mapCard + '<div class="col"><div class="card"><p class="panel-title">' + (ALGO === 'dfs' ? 'Phương thức trợ giúp dfs' : 'Thân phương thức bfs') + '</p><div class="code" id="code"></div></div>' +
    '<div class="card"><p class="panel-title">' + (ALGO === 'dfs' ? 'Ngăn xếp lời gọi (đáy bên trái)' : 'Hàng đợi (đầu bên trái)') + '</p><div id="aux"></div></div>' +
    '<div class="card"><p class="kv"><code>searchOrder</code> (kèm <code>parent</code> của mỗi đỉnh)</p><div class="chips" id="order"></div></div></div>';
} else {
  grid.innerHTML = mapCard + '<div class="col"><div class="card"><p class="panel-title">Mảng cost và parent</p><table class="t"><thead><tr><th>Đỉnh</th><th>cost</th><th>parent</th></tr></thead><tbody id="tb"></tbody></table><div class="tot" id="tot"></div></div></div>';
}

// Màn rộng: dòng giải thích nằm đầu cột phải (cạnh bản đồ); màn hẹp: nằm trên bản đồ
if (!SMALL) {
  var mq = window.matchMedia('(max-width:600px)');
  var placeStatus = function(){
    var rc = grid.children[1];
    if (mq.matches) grid.parentNode.insertBefore($('status'), grid); else rc.insertBefore($('status'), rc.firstChild);
  };
  placeStatus();
  if (mq.addEventListener) mq.addEventListener('change', placeStatus); else if (mq.addListener) mq.addListener(placeStatus);
}
var dfsCmp = null;
function compareTree(){
  if (dfsCmp && dfsCmp.s === START) return dfsCmp.e;
  var d = G.dfsSteps(ADJ, START, false, name), last = d[d.length - 1], e = {};
  last.parent.forEach(function(p, v){ if (p >= 0) e[G.ekey(p, v)] = 1; });
  dfsCmp = {s: START, e: e};
  return e;
}

function render(sn){
  var cmpOn = ALGO === 'bfs' && !SMALL && $('cmp').checked;
  $('svg').innerHTML = svgHtml(sn, cmpOn ? compareTree() : null);
  if ($('lgdfs')) $('lgdfs').hidden = !cmpOn;
  if ($('code')) { $('code').innerHTML = codeHtml(codeLines(), sn.ln); scrollToCur($('code')); }
  if ($('con')) $('con').innerHTML = sn.out.length ? sn.out.map(esc).join('\n') : '<span class="ph">Chưa có kết quả.</span>';
  if (ALGO === 'dfs' && $('aux')) {
    if (SMALL) {
      var fr = ['<div class="frame"><span>main</span><small>' + (sn.stack.length ? 'tạm dừng' : 'đang chạy') + '</small></div>'];
      var indent = '';
      sn.stack.forEach(function(u, k){
        var top = k === sn.stack.length - 1;
        fr.push('<div class="frame' + (top ? ' top' : '') + (top && sn.popping ? ' popping' : '') + (top && sn.fresh ? ' fresh' : '') + '"><span>dfs(' + u + ', "' + indent + '")</span><small>' + (top ? (sn.popping ? 'đang bị gỡ' : 'đang chạy') : 'tạm dừng') + '</small></div>');
        indent += '  ';
      });
      $('aux').innerHTML = '<div class="stack">' + fr.join('') + '</div>';
    } else {
      $('aux').innerHTML = sn.stack.length ? '<div class="chips">' + sn.stack.map(function(u, k){
        var top = k === sn.stack.length - 1;
        return '<span class="chip' + (top ? (sn.popping ? ' pop' : ' top') : '') + '">' + esc(name(u)) + '</span>';
      }).join('<span class="arrow">›</span>') + '</div>' : '<span class="kv">' + (sn.end ? 'Ngăn xếp lời gọi trống.' : 'Chưa có lời gọi đệ quy.') + '</span>';
    }
  }
  if (ALGO === 'bfs' && $('aux')) {
    $('aux').innerHTML = '<div class="queue">' + (sn.queue.length ? sn.queue.map(function(u){
      return '<span class="cell' + (sn.added && sn.added.indexOf(u) >= 0 ? ' new' : '') + '">' + esc(name(u)) + '</span>';
    }).join('') : '<span class="empty">Hàng đợi rỗng</span>') + '</div>';
  }
  if ($('order')) {
    var lastV = sn.order[sn.order.length - 1];
    $('order').innerHTML = sn.order.length ? sn.order.map(function(u){ return '<span class="chip' + (u === lastV && /Thăm|Lấy/.test(sn.title) ? ' new' : '') + '">' + esc(name(u)) + (sn.parent[u] >= 0 ? ' <small>← ' + esc(name(sn.parent[u])) + '</small>' : '') + '</span>'; }).join('') : '<span class="kv">trống</span>';
  }
  if ($('tb')) {
    var rows = '';
    for (var v = 0; v < N; v++) {
      var inT = sn.T.indexOf(v) >= 0, ch = sn.chg && sn.chg.indexOf(v) >= 0, old = sn.old && sn.old[v];
      var c = sn.cost[v] === Infinity ? '∞' : sn.cost[v];
      var p = sn.parent[v] >= 0 ? name(sn.parent[v]) : '-1';
      var cc = ch && old ? '<s>' + (old.c === Infinity ? '∞' : old.c) + '</s> ' + c : c;
      var pc = ch && old && old.p !== sn.parent[v] ? '<s>' + (old.p >= 0 ? esc(name(old.p)) : '-1') + '</s> ' + esc(p) : esc(p);
      rows += '<tr class="' + (inT ? 'inT' : '') + (v === sn.pick && sn.kind === 'pick' ? ' cur' : '') + '"><td>' + (inT ? '✓ ' : '') + esc(name(v)) + '</td><td' + (ch ? ' class="chg"' : '') + '>' + cc + '</td><td' + (ch && old && old.p !== sn.parent[v] ? ' class="chg"' : '') + '>' + pc + '</td></tr>';
    }
    $('tb').innerHTML = rows;
    $('tot').innerHTML = 'T = {' + sn.T.map(name).join(', ') + '}' + (ALGO === 'prim' ? '<br>Tổng trọng số: <b>' + sn.total + '</b>' : '');
  }
}

var st = Stepper({
  speed: SMALL ? 600 : 320,
  build: function(){
    if (ALGO === 'dfs') return G.dfsSteps(ADJ, START, SMALL, name);
    if (ALGO === 'bfs') return G.bfsSteps(ADJ, START, SMALL, name);
    return G.weightedSteps(MAP, START, ALGO === 'dijkstra', name);
  },
  render: render
});
$('start').addEventListener('change', function(){ START = parseInt(this.value, 10); st.reset(); });
$('cmp').addEventListener('change', function(){ st.redraw(); });
st.reset();
})();
</script>
</body>
</html>
